pose genuinely new, valuable tests."},{"id":"practice-Q25","scenario":"Claude Code for Continuous Integration","stem":"After an initial automated review identifies 12 findings, a developer pushes new commits to address issues. Re-running review produces 8 findings, but developers report that 5 duplicate previous comments on code that was already fixed in the new commits. What is the most effective way to eliminate this redundant feedback while maintaining thoroughness?","domain":"CONTEXT-REL","difficulty":2,"choices":[{"label":"A","text":"Run the review only when the PR is first created and again in its final pre-merge state, skipping all the intermediate commits where fixes land."},{"label":"B","text":"Add a post-processing filter that removes any finding matching a previous one by file path and issue description before the comments get posted."},{"label":"C","text":"Restrict the review scope to just the files touched in the most recent push, excluding files that were only changed in earlier commits."},{"label":"D","text":"Include previous review findings in context and instruct Claude to report only new or still-unresolved issues."}],"correct":"D","explanation":"Including prior review findings in context lets Claude distinguish new problems from those already addressed in recent commits. This preserves review thoroughness while using Claude’s reasoning to avoid redundant feedback on fixed code."},{"id":"practice-Q28","scenario":"Claude Code for Continuous Integration","stem":"Your automated code review averages 15 findings per pull request, and developers report a 40% false-positive rate. The bottleneck is investigation time: developers must click into each finding to read Claude’s rationale before deciding whether to fix or dismiss it. Your CLAUDE.md already contains comprehensive rules for acceptable patterns, and stakeholders rejected any approach that filters findings before developers see them. What change best addresses investigation time?","domain":"CONTEXT-REL","difficulty":2,"choices":[{"label":"A","text":"Require Claude to include its rationale and confidence estimate directly in each finding."},{"label":"B","text":"Add a post-processor that learns finding patterns and automatically suppresses any that match historical false-positive signatures before posting."},{"label":"C","text":"Categorize findings as 'blocking issues' versus 'suggestions' and apply different review requirements depending on the assigned level."},{"label":"D","text":"Configure Claude to surface only its high-confidence findings, filtering the uncertain flags out before developers ever see them."}],"correct":"A","explanation":"Including rationale and confidence directly in each finding reduces investigation time by letting developers quickly triage without opening each finding. It satisfies the “no filtering” constraint because all findings remain visible while accelerating developer decision-making."},{"id":"practice-Q29","scenario":"Claude Code for Continuous Integration","stem":"Analysis of your automated code review shows large differences in false-positive rates by finding category: security/correctness findings have 8% false positives, performance findings 18%, style/naming findings 52%, and documentation findings 48%. Developer surveys show growing distrust—many start dismissing findings without reading because “half are wrong.” High-false-positive categories erode trust in accurate categories. Which approach best restores developer trust while improving the system?","domain":"CONTEXT-REL","difficulty":3,"choices":[{"label":"A","text":"Temporarily disable high-false-positive categories (style, naming, documentation) and keep only high-precision categories while improving prompts."},{"label":"B","text":"Keep all four categories enabled but show a confidence score alongside each finding so developers can judge for themselves which ones are worth investigating."},{"label":"C","text":"Keep all categories enabled as they are and add few-shot examples to gradually improve accuracy for each category over the coming few weeks of use."},{"label":"D","text":"Apply a single uniform strictness reduction across every category at once to pull the overall false-positive rate down to a more tolerable level."}],"correct":"A","explanation":"Temporarily disabling high-false-positive categories immediately stops trust erosion by removing noisy findings that cause developers to dismiss everything, while preserving value from high-precision categories like security and correctness. It also creates space to improve prompts for problematic categories before re-enabling them."},{"id":"practice-Q30","scenario":"Claude Code for Continuous Integration","stem":"Your team wants to reduce API costs for automated analysis. Currently, synchronous Claude calls support two workflows: (1) a blocking pre-merge check that must complete before developers can merge, and (2) a technical debt report generated overnight for review the next morning. Your manager proposes moving both to the Message Batches API to save 50%. How should you evaluate this proposal?","domain":"CONTEXT-REL","difficulty":2,"choices":[{"label":"A","text":"Move both workflows to batch processing, but build in a fallback to synchronous calls whenever a batch starts taking too long to return."},{"label":"B","text":"Move both the pre-merge check and the debt report to batch processing, adding status polling to confirm completion before proceeding."},{"label":"C","text":"Use batch processing only for technical debt reports; keep synchronous calls for pre-merge checks."},{"label":"D","text":"Keep synchronous calls for both workflows to sidestep any problems with batch result ordering, forgoing the potential cost savings."}],"correct":"C","explanation":"Message Batches API processing can take up to 24 hours with no latency SLA, which is acceptable for overnight technical debt reports but unacceptable for blocking pre-merge checks where developers wait. This matches each workflow to the right API based on latency requirements."},{"id":"practice-Q54","scenario":"Customer Support Agent","stem":"Production logs show a pattern: customers reference specific amounts (e.g., “the 15% discount I mentioned”), but the agent responds with incorrect values. Investigation shows these details were mentioned 20+ turns ago and condensed into vague summaries like “promotional pricing was discussed.” What fix is most effective?","domain":"CONTEXT-REL","difficulty":3,"choices":[{"label":"A","text":"Raise the summarization trigger threshold from 70% to 85% so conversations run longer before any summarization kicks in and condenses the details."},{"label":"B","text":"Store the full conversation history in external storage and retrieve from it whenever the agent detects back-references like 'as I mentioned' in a message."},{"label":"C","text":"Extract transactional facts (amounts, dates, order numbers) into a persistent “case facts” block included in every prompt outside the summarized history."},{"label":"D","text":"Revise the summarization prompt to explicitly preserve every number, percentage, date, and customer-stated expectation verbatim when it condenses history."}],"correct":"C","explanation":"Summarization inherently loses precise details. Extracting transactional facts into a structured “case facts” block outside the summarized history preserves critical information so it’s reliably available in every prompt regardless of how many turns have been summarized."},{"id":"practice-Q55","scenario":"Customer Support Agent","stem":"Your `get_customer` tool returns all matches when searching by name. Currently, when there are multiple results, Claude picks the customer with the most recent order, but production data shows this selects the wrong account 15% of the time for ambiguous matches. How should you address this?","domain":"CONTEXT-REL","difficulty":2,"choices":[{"label":"A","text":"Implement a confidence scoring system that lets the agent act autonomously whenever its confidence sits above 85% and only request clarification when it falls below that line."},{"label":"B","text":"Instruct Claude to request an additional identifier (email, phone, or order number) when `get_customer` returns multiple matches before taking any customer-specific action."},{"label":"C","text":"Modify `get_customer` so that it returns just a single most-likely match chosen by a ranking algorithm, removing the ambiguity from the agent's view entirely."},{"label":"D","text":"Add few-shot examples to the prompt that demonstrate the correct reasoning and tool sequencing for handling ambiguous multiple-match cases."}],"correct":"B","explanation":"Asking the user for an additional identifier is the most reliable way to resolve ambiguity because the user has definitive knowledge of their identity. One extra conversational turn is a small price to pay to eliminate a 15% error rate caused by choosing the wrong account."},{"id":"authored-CONTEXT-1","scenario":"Verbose tool result trimming","stem":"A returns-processing agent calls a `get_shipment` tool that returns roughly 45 fields per shipment (carrier metadata, internal routing codes, warehouse timestamps), but the agent only needs tracking_id, status, delivery_date, return_eligible, and refund_window to decide each case. After several turns the context window is bloated with raw shipment payloads and the agent's decisions get noisier. What is the most appropriate fix?","domain":"CONTEXT-REL","difficulty":2,"choices":[{"label":"A","text":"Add a PostToolUse hook on `get_shipment` that returns only the 5 fields the task needs, dropping the rest before they enter the context"},{"label":"B","text":"Switch to a larger-context model so that all 45 shipment fields fit comfortably in the window and no field trimming is required on the tool output."},{"label":"C","text":"Lower `max_tokens` on the agent's own responses so it is forced to write shorter replies and therefore consumes less of the context window overall."},{"label":"D","text":"Instruct the agent in its system prompt to read the full 45-field payload but mentally ignore the irrelevant fields each time it makes a decision."}],"correct":"A","explanation":"The guide (Ch.11.2) shows a PostToolUse hook that keeps only the relevant fields from a 40+ field tool result, conserving context and reducing noise — exactly answer A. A bigger model (B) raises cost and still floods the window with noise rather than removing it. Lowering max_tokens (C) limits the agent's output, not the bloated tool input. Telling the agent to ignore fields (D) still loads all 45 fields into context, so the noise and token cost remain."},{"id":"authored-CONTEXT-2","scenario":"Scratchpad files in long investigation","stem":"A security-audit agent spends a long session tracing how a `BillingService` is wired: it discovers the class extends `BaseService`, that `chargeCard()` is invoked from three call sites, and that an external gateway has a 100 req/min limit. As the session grows, summarization kicks in and the agent later re-reads the same 12 files to re-derive facts it already found, burning time and tokens. What practice would best prevent this rediscovery?","domain":"CONTEXT-REL","difficulty":2,"choices":[{"label":"A","text":"Disable summarization entirely for the session so the full transcript, including all 12 files and their contents, stays resident in context the whole time."},{"label":"B","text":"Write the key findings to a scratchpad file during the investigation and consult it when context degrades instead of re-running discovery"},{"label":"C","text":"Increase the model's context window so the entire transcript with every file's full contents never has to be summarized away during the long session."},{"label":"D","text":"Ask the agent to repeat its key findings verbatim in every single message so that they survive intact through any future summarization pass that runs."}],"correct":"B","explanation":"Ch.11.4 describes writing key findings to a scratchpad file (e.g., investigation-scratchpad.md) so that when context degrades or a new session starts, the agent consults the scratchpad instead of re-running discovery — answer B. Disabling summarization (A) and enlarging the window (C) just delay the same overflow and still keep raw file dumps in context, which the guide warns against. Repeating findings verbatim every message (D) wastes tokens and is itself the kind of noise summarization removes."},{"id":"authored-CONTEXT-3","scenario":"Structured state persistence for crash recovery","stem":"A research coordinator orchestrates three subagents (web-search, doc-analysis, synthesis) over a multi-hour job. The process crashes partway through, after web-search finished and while doc-analysis was still running. The team wants to resume from the last completed step rather than re-running everything. Which design best enables this?","domain":"CONTEXT-REL","difficulty":3,"choices":[{"label":"A","text":"Have each agent export its state (status, queries executed, key findings, coverage, gaps) to a known JSON location, and have the coordinator load a manifest of per-agent statuses on resume"},{"label":"B","text":"Configure the coordinator to restart the entire workflow from the very beginning whenever a crash is detected, on the basis that partial subagent state cannot be trusted."},{"label":"C","text":"Keep all intermediate results only in the live conversation history so that a resumed session can reconstruct the progress purely by re-reading the transcript."},{"label":"D","text":"Raise the coordinator's retry count so that transient crashes are simply absorbed and retried before any per-agent state ever needs to be persisted to disk."}],"correct":"A","explanation":"Ch.11.6 prescribes exactly this: each agent exports structured state to a known location (e.g., agent-state/web-search-agent.json) and the coordinator loads a manifest.json of statuses (completed / in_progress / not_started) on resume — answer A. Restarting the whole workflow (B) discards completed work, defeating crash recovery. Relying on conversation history (C) loses everything on a crash and is what state persistence exists to replace. A higher retry count (D) addresses transient failures, not resuming after a hard crash from the last completed step."},{"id":"authored-CONTEXT-4","scenario":"Attribution loss in multi-source synthesis","stem":"A market-research pipeline fans out to several subagents that read different reports, then a synthesis step merges everything into a briefing. Stakeholders complain that the final briefing states figures like \"the edge-AI market is worth $7.4B\" with no way to tell which report each number came from, so they cannot fact-check it. What should the pipeline do to keep conclusions traceable?","domain":"CONTEXT-REL","difficulty":3,"choices":[{"label":"A","text":"Append a single combined bibliography of every consulted URL at the end of the briefing so that readers can go search the listed sources for themselves."},{"label":"B","text":"Preserve a claim-to-source mapping for each figure — the claim text plus source_url, source_name, and publication_date — through the pipeline into the synthesis"},{"label":"C","text":"Have the synthesis agent select the single most authoritative source per topic and report only that source's figures, keeping the final briefing clean and uncluttered."},{"label":"D","text":"Raise each subagent's confidence threshold so that only high-confidence figures survive into the briefing, which the team assumes makes per-figure citation unnecessary."}],"correct":"B","explanation":"Ch.12.1 frames this as the attribution-loss problem: a claim must carry its source — the guide's 'Good' example attaches claim, source_url, source_name, and publication_date to each figure (answer B) so the claim-to-source link survives synthesis. A dump bibliography (A) doesn't map which claim came from which source. Picking one 'authoritative' source (C) discards attribution for the rest and resembles arbitrarily choosing a value, which Ch.12.2 warns against. A higher confidence threshold (D) filters claims but does nothing to record where surviving claims came from."},{"id":"authored-CONTEXT-5","scenario":"Publication dates prevent false contradictions","stem":"A competitive-intelligence agent aggregates adoption statistics from multiple vendor reports. It flags a \"contradiction\": one source says cloud adoption is 60% and another says 72%. On inspection, the first report is from 2022 and the second from 2024. The agent had stripped publication dates during aggregation. What is the correct remedy?","domain":"CONTEXT-REL","difficulty":2,"choices":[{"label":"A","text":"Retain each value's publication date through aggregation so a temporal difference (60% in 2022 vs 72% in 2024) is read as growth over time, not a contradiction"},{"label":"B","text":"Average the two adoption figures into a single reconciled 66% and present that one number, so downstream consumers never have to grapple with a visible conflict."},{"label":"C","text":"Always trust the higher of the two figures, since adoption only ever increases over time and the larger number therefore best reflects the most current reality."},{"label":"D","text":"Discard both figures as unreliable, since the two sources openly disagree and there is no principled basis for trusting one report over the other on this metric."}],"correct":"A","explanation":"Ch.12.3 states that without dates, temporal differences get misread as contradictions; including dates turns 'A says 10%, B says 15%, contradiction' into 'A (2023) 10%, B (2024) 15%, likely +5% growth' — answer A. Averaging (B) fabricates a number with no real-world meaning and hides the temporal signal. Always trusting the higher value (C) assumes monotonic growth and arbitrarily picks one value, which the guide forbids. Discarding both (D) throws away valid, datable data and over-corrects a non-contradiction."},{"id":"authored-CONTEXT-6","scenario":"Confidence thresholds and human review routing","stem":"An invoice-extraction system outputs a per-field confidence score for each extracted value. The team wants to automate processing safely without auto-accepting questionable extractions or silently dropping them. How should they set up confidence handling?","domain":"CONTEXT-REL","difficulty":3,"choices":[{"label":"A","text":"Use the model's own self-rated 1-10 confidence score and auto-accept anything it rates 7 or higher, on the reasoning that the model knows best when it is genuinely unsure."},{"label":"B","text":"Tune thresholds on a labeled validation set, route high-confidence stable-accuracy extractions to automated processing, and send low-confidence or ambiguous ones to human review"},{"label":"C","text":"Set one global confidence threshold and simply trust the aggregate accuracy number, since a 97% overall score means every individual document type is already safe to automate."},{"label":"D","text":"Discard any field that falls below the threshold entirely, on the principle that a low-confidence extraction is always more harmful downstream than a missing value would be."}],"correct":"B","explanation":"Ch.9.4 prescribes field-level confidence, calibrating thresholds on labeled validation sets, and routing high-confidence+stable-accuracy to automation while low-confidence/ambiguous go to human review — answer B. Model self-rated confidence (A) is explicitly called unreliable in Ch.9.1 because the model can be confidently wrong. Trusting one aggregate number (C) is rejected: 97% overall can hide 40% errors for a specific document type, so accuracy must be analyzed by type and field. Silently discarding low-confidence fields (D) drops data that should instead go to a human."},{"id":"authored-CONTEXT-7","scenario":"Transient vs permanent failure and bounded retries","stem":"A subagent that queries an external pricing API intermittently gets HTTP 503 and timeout errors under load. The current code retries the call in a tight loop until it succeeds, which spikes latency and occasionally never returns. What retry strategy aligns with the guide?","domain":"CONTEXT-REL","difficulty":3,"choices":[{"label":"A","text":"Keep retrying the call indefinitely but insert a fixed one-second delay between attempts, giving the overloaded pricing API a little time to recover between tries."},{"label":"B","text":"Treat 503/timeout as transient and retry with exponential backoff up to a bounded count (about 3-5), then escalate to the coordinator or a fallback instead of retrying forever"},{"label":"C","text":"Treat the 503 and timeout responses as permanent failures and abort the whole workflow immediately, so that no partial or possibly-stale results are ever produced."},{"label":"D","text":"Suppress the 503 and timeout errors and return an empty result instead, so the coordinator can continue running smoothly without ever seeing that the call failed."}],"correct":"B","explanation":"Ch.10.1 classifies timeout/503/network as transient and retryable with exponential backoff, while Ch.10.2 names 'infinite retries inside a subagent' an anti-pattern — the fix is local recovery (a bounded 1-2 / few retries) then propagate to the coordinator (answer B). Indefinite fixed-delay retries (A) is still the infinite-retry anti-pattern. Treating transient errors as permanent and aborting (C) loses partial results, which the guide says to keep and annotate. Returning an empty result (D) is the silent-suppression anti-pattern that makes the coordinator mistake a failure for 'no results'."},{"id":"authored-CONTEXT-8","scenario":"Progressive summarization degrades precise data","stem":"A long-running compliance agent tracks a specific case: order date 2025-01-15, refund amount $89.99, status pending manager approval. After many turns of progressive summarization, the agent starts answering with vague phrasing like \"the order was placed earlier this year for around ninety dollars\" and begins citing \"typical refund timelines\" instead of the actual case data. What is the correct mitigation?","domain":"CONTEXT-REL","difficulty":2,"choices":[{"label":"A","text":"Maintain a structured CASE FACTS block with the exact IDs, dates, and amounts, and include it in every prompt regardless of how history is summarized"},{"label":"B","text":"Instruct the agent to summarize the case history more aggressively so the precise order date and refund amount get compressed into a shorter, cleaner form it can recall."},{"label":"C","text":"Tell the agent to fall back on its general knowledge of typical refund patterns and timelines whenever the exact figures are no longer present in its context window."},{"label":"D","text":"Increase max_tokens so that the agent's progressive summaries come out longer and therefore automatically retain the precise dates and dollar amounts over time."}],"correct":"A","explanation":"This is the context-degradation symptom from Ch.11.1: relying on conversation history means facts blur during summarization, so the fix is to extract key facts into a structured CASE FACTS block and include it in every prompt regardless of summarization — answer A, preserving the facts outside the summary. Summarizing harder (B) accelerates the very degradation that vagues out numbers and dates. Falling back to 'typical patterns' (C) is the failure mode itself, not a mitigation. Longer summaries via max_tokens (D) don't guarantee precise values survive and don't address that history-based facts degrade."}],"exams":[{"id":"mock-a","title":"Mock Exam A","code":"CLAUDE-ARCH-FULL","certification":"Claude Certified Architect - Foundations","tag":"Full mock · sampled","sheet":"SHEET A","description":"A full-length 60-question mock drawn from the 100-question practice pool, weighted to the real domain blueprint (16/11/12/12/9). A fresh mix every attempt.","durationMinutes":120,"passingScore":72,"totalQuestions":60,"sampling":{"AGENT-ARCH":16,"TOOL-MCP":11,"CODE-CONFIG":12,"PROMPT-ENG":12,"CONTEXT-REL":9},"domains":{"AGENT-ARCH":{"name":"Agentic Architecture & Orchestration","color":"#3B5FC0"},"TOOL-MCP":{"name":"Tool Design & MCP Integration","color":"#0F7A6C"},"CODE-CONFIG":{"name":"Claude Code Configuration & Workflows","color":"#7B52C9"},"PROMPT-ENG":{"name":"Prompt Engineering & Structured Output","color":"#9E5509"},"CONTEXT-REL":{"name":"Context Management & Reliability","color":"#B4426B"}},"poolRef":true},{"id":"quick-practice","title":"Quick Practice","code":"CLAUDE-ARCH-QUICK","certification":"Claude Certified Architect - Foundations","tag":"Warm-up · 25 items","sheet":"SHEET Q","description":"A short 25-question sampler across all five domains — a quick daily rep. Sampled fresh from the practice pool each time you sit it.","durationMinutes":45,"passingScore":70,"totalQuestions":25,"sampling":{"AGENT-ARCH":7,"TOOL-MCP":4,"CODE-CONFIG":5,"PROMPT-ENG":5,"CONTEXT-REL":4},"domains":{"AGENT-ARCH":{"name":"Agentic Architecture & Orchestration","color":"#3B5FC0"},"TOOL-MCP":{"name":"Tool Design & MCP Integration","color":"#0F7A6C"},"CODE-CONFIG":{"name":"Claude Code Configuration & Workflows","color":"#7B52C9"},"PROMPT-ENG":{"name":"Prompt Engineering & Structured Output","color":"#9E5509"},"CONTEXT-REL":{"name":"Context Management & Reliability","color":"#B4426B"}},"poolRef":true},{"id":"mock-b","title":"Mock Exam B","code":"CLAUDE-ARCH-MOCK-B","certification":"Claude Certified Architect - Foundations","tag":"Fixed mock · Set B","sheet":"SHEET B","description":"A fixed, curated 60-question paper. The same questions every attempt, so you can measure real improvement over time.","durationMinutes":120,"passingScore":72,"totalQuestions":60,"sampling":null,"domains":{"AGENT-ARCH":{"name":"Agentic Architecture & Orchestration","color":"#3B5FC0"},"TOOL-MCP":{"name":"Tool Design & MCP Integration","color":"#0F7A6C"},"CODE-CONFIG":{"name":"Claude Code Configuration & Workflows","color":"#7B52C9"},"PROMPT-ENG":{"name":"Prompt Engineering & Structured Output","color":"#9E5509"},"CONTEXT-REL":{"name":"Context Management & Reliability","color":"#B4426B"}},"questions":[{"id":"mockB-1","scenario":"Payments refund loop","stem":"You are building a payments agent that issues partial refunds. After each Claude API response your loop must decide whether to keep going. A refund just completed and the latest response has stop_reason == \"end_turn\" with a final text summary. What should your agentic loop do?","domain":"AGENT-ARCH","difficulty":1,"choices":[{"label":"A","text":"Treat the task as complete and return the summary to the user, because end_turn is the only reliable completion signal."},{"label":"B","text":"Scan the assistant text for the phrase \"refund complete\" and stop only if it is present, since the wording confirms the action ran."},{"label":"C","text":"Send one more request with tool_choice any to be sure no further tools are needed before you trust the end_turn summary."},{"label":"D","text":"Stop only when the loop reaches max_iterations, otherwise continue regardless of stop_reason so no follow-up step is skipped."}],"correct":"A","explanation":"Correct: end_turn means the model finished; that is the reliable completion signal for the agentic loop. B parses assistant text for a phrase, an explicit anti-pattern. C forces an unnecessary tool call and can corrupt a finished task. D uses an arbitrary iteration limit as the primary stop condition, also an anti-pattern."},{"id":"mockB-2","scenario":"Insurance loop completion signal","stem":"A junior engineer's claims-triage agent decides a task is done when the assistant text contains the phrase 'Triage complete' or after 5 iterations, whichever comes first. The agent sometimes stops before finishing and sometimes loops needlessly. What is the correct, reliable completion signal for the agentic loop?","domain":"AGENT-ARCH","difficulty":1,"choices":[{"label":"A","text":"Parse the assistant text for an agreed completion phrase"},{"label":"B","text":"Stop the loop after a fixed max_iterations limit is hit"},{"label":"C","text":"Check whether the assistant produced any textual content"},{"label":"D","text":"Continue until stop_reason == \"end_turn\""}],"correct":"D","explanation":"The only reliable completion signal is stop_reason == \"end_turn\". Parsing text for phrases, relying on an arbitrary iteration cap, and treating presence of text as completion are all named anti-patterns that cause premature or unnecessary looping."},{"id":"mockB-3","scenario":"Clinical note truncation","stem":"A healthcare summarization agent calls Claude to produce a discharge summary. The response comes back with stop_reason == \"max_tokens\" and the summary cuts off mid-sentence. What is the appropriate handling?","domain":"AGENT-ARCH","difficulty":2,"choices":[{"label":"A","text":"Treat the partial text as final and display it, since stop_reason shows the model deliberately chose to stop generating at that point, the same way a clean end_turn completion would."},{"label":"B","text":"Recognize the response is truncated and re-issue the request with a higher max_tokens (or continue generation), rather than using the cut-off text."},{"label":"C","text":"Switch tool_choice to forced so the model is required to invoke a tool that finishes writing out the truncated discharge summary."},{"label":"D","text":"Append the phrase \"please continue\" as a stop_sequence so the next call is forced to resume and complete the cut-off sentence."}],"correct":"B","explanation":"Correct: max_tokens means the token limit was reached and the output is truncated; you increase the limit or continue generation. A treats truncated output as final. C confuses tool selection with output length. D misunderstands stop_sequence, which ends generation rather than extending it."},{"id":"mockB-4","scenario":"Fintech refund hard limit","stem":"Compliance requires that no refund over $1,000 is ever issued automatically; such cases must be routed to a human. The team currently relies on a system-prompt instruction \"do not refund more than $1,000.\" Auditors flag occasional violations. What is the correct fix?","domain":"AGENT-ARCH","difficulty":2,"choices":[{"label":"A","text":"Add a PreToolUse hook that intercepts process_refund and redirects to escalation when amount > 1000."},{"label":"B","text":"Strengthen the system-prompt wording with capitalized warnings and repeat the $1,000 rule three times so the model cannot miss it."},{"label":"C","text":"Add a few-shot example showing a $1,200 refund being declined so the model learns to route large amounts to escalation itself."},{"label":"D","text":"Lower the model temperature toward 0 so it follows the $1,000 instruction deterministically and stops issuing large refunds."}],"correct":"A","explanation":"Correct: financial/compliance limits need deterministic enforcement; a PreToolUse hook guarantees the rule 100% of the time. B, C, and D are all probabilistic prompt-level approaches (>90%, not 100%), which is unacceptable when failure has financial and legal consequences."},{"id":"mockB-5","scenario":"Overloaded retail agent","stem":"A retail support agent has been given 38 tools spanning orders, inventory, marketing, analytics, and HR. It increasingly picks the wrong tool and produces inconsistent behavior. What architectural change best addresses the root cause?","domain":"AGENT-ARCH","difficulty":2,"choices":[{"label":"A","text":"Decompose into a coordinator plus focused subagents, each with a small, relevant allowed_tools set, so any single agent reasons over few tools."},{"label":"B","text":"Keep all 38 tools but reorder them alphabetically and group them by domain so the model scans the list faster and selects correctly, while every capability stays available in one agent."},{"label":"C","text":"Set tool_choice to any so the model is always forced to pick a tool, which removes the indecision causing the wrong choices."},{"label":"D","text":"Raise max_tokens substantially so the model has enough room to reason over every one of the 38 tools before choosing one."}],"correct":"A","explanation":"Correct: too many tools degrades selection reliability; partitioning into focused subagents with least-privilege tool sets is the structural fix. B ordering does not reduce the choice burden. C forcing a tool worsens misrouting. D token budget is unrelated to tool-count reliability."},{"id":"mockB-6","scenario":"Central-hub observability","stem":"In a multi-agent claims-processing system, leadership wants a single place to observe what every subagent did and to control error handling. Which topology and routing rule supports this?","domain":"AGENT-ARCH","difficulty":2,"choices":[{"label":"A","text":"Hub-and-spoke where all subagent communication flows through the coordinator, which aggregates results and handles errors."},{"label":"B","text":"A peer mesh where subagents call each other directly to minimize coordinator load, logging each hop locally for later observability."},{"label":"C","text":"Independent agents that each report directly to the end user, who then becomes the single place where all results are observed."},{"label":"D","text":"A single monolithic agent holding every tool, so there is nothing to observe between agents and error handling stays in one place."}],"correct":"A","explanation":"Correct: the hub-and-spoke design routes all communication through the coordinator, giving central observability and error control. B peer mesh removes the central control point. C direct-to-user reporting bypasses aggregation and validation. D a monolith reintroduces the too-many-tools reliability problem and loses delegation benefits."},{"id":"mockB-7","scenario":"Insurance claim parallel intake","stem":"An insurance-claims coordinator must, for one new claim, simultaneously (a) pull the policy document, (b) fetch the claimant's prior claim history, and (c) retrieve the adjuster roster — three independent lookups with no data dependency. How should the coordinator dispatch this work for best latency?","domain":"AGENT-ARCH","difficulty":2,"choices":[{"label":"A","text":"Issue three sequential Task calls, one per turn, waiting for each result so ordering stays deterministic and easy to trace"},{"label":"B","text":"Emit all three Task calls in a single coordinator response so the subagents run in parallel"},{"label":"C","text":"Combine all three lookups into one subagent prompt and let that agent decide the most efficient internal order to run them"},{"label":"D","text":"Use a fixed iteration limit of 3 and parse the assistant text after each turn to learn when every lookup has completed"}],"correct":"B","explanation":"A coordinator can call multiple Tasks in one response and the subagents run concurrently — ideal for independent lookups. Sequential dispatch wastes latency, collapsing into one subagent removes the isolation/parallelism benefit, and iteration limits plus text parsing are completion anti-patterns."},{"id":"mockB-8","scenario":"Game live-ops session resume staleness","stem":"A live-ops engineer used `claude --resume balance-investigation` to continue yesterday's session investigating a damage-scaling bug. Overnight, three of the source files were heavily refactored by another team. The resumed session immediately suggests edits based on line numbers that no longer exist. What is the best course of action?","domain":"AGENT-ARCH","difficulty":2,"choices":[{"label":"A","text":"Keep resuming the session; the saved context is authoritative over the current files, which the other team's refactor merely desynced"},{"label":"B","text":"Start a fresh session and seed it with a short summary of prior findings, since the old tool results are now stale"},{"label":"C","text":"Use fork_session to branch the stale session into two copies and reconcile the line numbers between the branches afterward"},{"label":"D","text":"Run /compact on the resumed session so the stale line numbers are compressed out and the model re-reads the refactored files"}],"correct":"B","explanation":"When files changed since the prior session, resumed tool results are stale; it is better to start a new session and provide a brief summary than to resume with outdated tool data. Saved context never overrides current files, fork_session only branches the same stale context, and /compact summarizes — it cannot refresh stale file data."},{"id":"mockB-9","scenario":"Gaming subagent retry budget","stem":"A game-economy fraud subagent calls an external risk-scoring API that occasionally returns 503. The current implementation retries indefinitely inside the subagent until it succeeds, causing some triage jobs to hang for minutes. What is the recommended pattern?","domain":"AGENT-ARCH","difficulty":2,"choices":[{"label":"A","text":"Keep retrying forever inside the subagent so the coordinator never sees a failure and the triage job always returns a result"},{"label":"B","text":"Do local recovery with 1-2 bounded retries, then propagate a structured error to the coordinator"},{"label":"C","text":"Abort the entire fraud workflow on the first 503, since a failed risk score means the triage decision can no longer be trusted"},{"label":"D","text":"Switch the 503 to a generic 'service unavailable' message and return success so the coordinator can keep the pipeline moving"}],"correct":"B","explanation":"The pattern is bounded local recovery (1-2 retries) followed by propagating a structured error upward; infinite retries waste resources and add latency. Aborting the whole workflow loses partial results, and masking the error as success is silent suppression."},{"id":"mockB-10","scenario":"Manufacturing long-running migration checkpoint","stem":"An industrial firm runs an overnight agent that migrates 8,000 machine-config records across many steps. A power blip kills the process at record 5,200, and the team must restart from zero, wasting hours. Which design would have prevented the total loss?","domain":"AGENT-ARCH","difficulty":2,"choices":[{"label":"A","text":"Rely on a much longer max_tokens budget so the entire 8,000-record migration fits inside a single uninterrupted response"},{"label":"B","text":"Persist structured state (progress, completed records) to a known location so work can resume from the last checkpoint"},{"label":"C","text":"Parse the assistant's text after the crash to learn how far it got, then hand-edit a resume point from that reported number"},{"label":"D","text":"Run all 8,000 records in a single subagent turn so there is one atomic operation that either fully succeeds or fully fails"}],"correct":"B","explanation":"Structured state persistence lets each agent export progress to a known location so a crash can resume from the last checkpoint instead of restarting. max_tokens doesn't help a multi-step job, text parsing is unreliable, and a single giant turn makes the loss worse, not better."},{"id":"mockB-11","scenario":"Fintech reconciliation subagent","stem":"You operate a multi-agent ledger-reconciliation system for a payments processor. A search subagent that queries a bank's statement API hits a 503 once, succeeds on an immediate retry, then later that day a second 503 persists through three rapid retries the subagent fires off internally before the coordinator ever sees anything. Latency spikes and the coordinator's queue backs up. What is the correct error-handling boundary for the subagent?","domain":"AGENT-ARCH","difficulty":3,"choices":[{"label":"A","text":"Keep retrying inside the subagent until the bank's statement API recovers, since a 503 is by definition transient and therefore always safe to retry without ever surfacing it to the coordinator"},{"label":"B","text":"Treat the 503 as a permission error equivalent to a 403 and immediately escalate it to a human operator without attempting any local retry, since the API is refusing the request"},{"label":"C","text":"Attempt 1-2 local retries with backoff for the transient 503, then propagate a structured error to the coordinator so it can decide whether to wait, use partial results, or reroute"},{"label":"D","text":"Return an empty statement result set on the persistent 503 so the coordinator can proceed with whatever the other subagents produced and treat the bank data as simply unavailable"}],"correct":"C","explanation":"Correct (C): a 503 is transient, so 1-2 local retries with backoff are appropriate, but unbounded local retries cause exactly the latency/queue problem observed; the guide's rule is local recovery (1-2 retries) then propagate a structured error to the coordinator. A is the named anti-pattern 'infinite retries inside a subagent' that produces the latency described. B miscategorizes a transient error as a permission error and skips the cheap retry. D is the 'silent suppression' anti-pattern: an empty result is indistinguishable from a genuine no-match, so the coordinator would wrongly believe reconciliation found nothing."},{"id":"mockB-12","scenario":"Healthcare prior-authorization coordinator","stem":"A coordinator agent processes prior-authorization requests by spawning subagents: one fetches the patient's coverage policy, one fetches the prescribed treatment's clinical criteria, and one evaluates whether the criteria are met given the policy. The evaluation step keeps producing wrong determinations. Investigation shows the evaluation subagent's prompt only contains the patient ID and treatment code. What is the root cause?","domain":"AGENT-ARCH","difficulty":3,"choices":[{"label":"A","text":"The subagents should have been spawned in parallel rather than sequentially, because the evaluation step is racing the two fetch subagents"},{"label":"B","text":"The evaluation subagent has isolated context and did not automatically inherit the policy and criteria results; they must be explicitly passed in its prompt"},{"label":"C","text":"The coordinator should use fork_session so the evaluation branch automatically inherits the coordinator's full conversation history and results, removing any need to re-pass the policy and criteria."},{"label":"D","text":"The evaluation subagent simply needs a higher max_tokens budget so it has room to reason fully over the clinical criteria it was given"}],"correct":"B","explanation":"Correct: subagents have isolated context and do not inherit the coordinator's history; the policy text and clinical criteria the evaluation depends on must be explicitly placed in its prompt. The symptom (only ID + code present) is exactly missing-context. A is wrong and harmful here because evaluation depends on the other two outputs, so it cannot run in parallel with them. C misuses fork_session, which branches a session for comparing approaches, not for passing one subagent's output to another; the SDK pattern is explicit prompt passing through the coordinator. D treats a context-omission bug as a token-budget problem."},{"id":"mockB-13","scenario":"Legal e-discovery refund-style limit","stem":"A legal-ops agent can issue litigation-hold release fees from a budget, but releases above $10,000 require partner sign-off by firm policy and regulators audit every release. The team wrote a clear system-prompt instruction: 'Never release more than $10,000 without partner approval.' In testing, the agent complied 96% of the time but occasionally released $14,000 unilaterally. What is the correct fix?","domain":"AGENT-ARCH","difficulty":3,"choices":[{"label":"A","text":"Strengthen the system-prompt wording about the $10,000 cap and add few-shot examples of the agent refusing large releases"},{"label":"B","text":"Add a PreToolUse hook that intercepts the release tool call and redirects to the approval path whenever the amount exceeds $10,000"},{"label":"C","text":"Lower the model temperature toward 0 so it follows the $10,000 threshold instruction far more consistently across runs"},{"label":"D","text":"Have the agent self-rate its confidence on each release and escalate to a partner only when that confidence falls below 8 out of 10 on a per-transaction basis."}],"correct":"B","explanation":"Correct: a financial/compliance limit with audit consequences requires a deterministic guarantee. A PreToolUse hook intercepts the call and enforces the threshold 100% of the time. The guide's rule: when failure has financial, legal, or safety consequences, use hooks not prompts. A and C only improve a probabilistic instruction (>90%, never 100%), which is exactly why 4% slipped through. D relies on model self-rated confidence, which the guide flags as poorly calibrated and unreliable as a trigger; the model can be confidently wrong."},{"id":"mockB-14","scenario":"Energy-grid incident coordinator observability","stem":"An energy utility runs a hub-and-spoke incident-response system. To speed things up an engineer wires the telemetry subagent to send anomaly data directly to the remediation subagent, bypassing the coordinator. Soon, when a bad remediation fires, on-call engineers cannot reconstruct who told remediation to act or retry the failed step. What principle was violated?","domain":"AGENT-ARCH","difficulty":3,"choices":[{"label":"A","text":"Subagents should share a common memory store across calls so remediation state is preserved and the missing action can be traced"},{"label":"B","text":"All inter-subagent communication should flow through the coordinator, which provides observability and centralized error/retry control"},{"label":"C","text":"The remediation subagent simply needed a larger allowed_tools list so it could act autonomously without waiting on the coordinator for each individual step."},{"label":"D","text":"The system should have used a fixed prompt-chaining pipeline instead of dynamic decomposition so every step is logged in advance"}],"correct":"B","explanation":"Correct: in hub-and-spoke, all communication flows through the coordinator precisely so it can observe, validate, and control errors/retries; direct spoke-to-spoke links destroy that observability and centralized recovery, which is why the on-call team cannot reconstruct or retry. A contradicts the design principle that subagents do not share memory and the coordinator aggregates state. C is irrelevant: the problem is topology, not tool permissions. D conflates the decomposition strategy with the communication topology; chaining wouldn't restore central observability if spokes still talked directly."},{"id":"mockB-15","scenario":"Logistics multi-warehouse research","stem":"A logistics planning coordinator must compile a sourcing report covering three independent regions (EMEA, APAC, Americas), each requiring a web search and a data analysis that depend only on that region's own search. The current implementation runs all six steps strictly one after another and the report takes far too long to assemble. What change best fits the dependency structure?","domain":"AGENT-ARCH","difficulty":4,"choices":[{"label":"A","text":"Spawn all six steps as parallel Task calls in a single response so nothing waits on anything else and the whole report finishes in the shortest possible wall-clock time."},{"label":"B","text":"Keep the six steps strictly sequential but raise each subagent's max_tokens so every step completes faster and the total time drops"},{"label":"C","text":"Use a single subagent running a fixed prompt-chaining pipeline across all three regions in order, which guarantees reproducible output"},{"label":"D","text":"Spawn three Task calls in one coordinator response, one per region, each performing that region's search-then-analysis; the three regions run concurrently"}],"correct":"D","explanation":"Correct (D): regions are independent of each other but within a region analysis depends on that region's search. So parallelize across regions (3 concurrent Tasks) while keeping search->analysis sequential inside each region. A coordinator can issue multiple Tasks in one response to run them concurrently. A is wrong: making all six parallel breaks the real dependency (an analysis would run before its own search completes). B confuses token budget with latency from serialization. C collapses genuinely parallelizable independent work into one slow serial pipeline, sacrificing the available concurrency for reproducibility that isn't the bottleneck."},{"id":"mockB-16","scenario":"DevTools long-running migration agent","stem":"A code-migration agent is converting a 400-file repository to a new framework in a single agentic loop. Around file 250 the run starts failing with stop_reason=max_tokens on responses, and earlier conversation detail has become vague. The team wants the agent to reliably finish all 400 files. What is the most robust design fix?","domain":"AGENT-ARCH","difficulty":4,"choices":[{"label":"A","text":"Set a much larger max_tokens on every request so responses never truncate, which keeps the entire 400-file transcript intact and available to the model throughout the run."},{"label":"B","text":"Add an iteration cap of exactly 400 so the loop runs once per file and stops cleanly the moment the last file has been converted"},{"label":"C","text":"Periodically checkpoint progress and summarize completed work, then continue from a compact summary rather than carrying the entire transcript"},{"label":"D","text":"Detect the phrase 'migration complete' in the assistant text and end the loop when it appears, since that marks all files as done"}],"correct":"C","explanation":"Correct (C): the symptom is context-window exhaustion across a long-running task; the durable fix is checkpoint/summarize so the loop continues from a compact state instead of an ever-growing transcript. A only raises the per-response output budget; it doesn't stop the accumulating history from filling the context window, so the run still degrades. B uses an arbitrary iteration limit as a stop condition, an explicit anti-pattern, and does nothing about token exhaustion. D parses assistant text for completion, another named anti-pattern; the only reliable completion signal is stop_reason==end_turn."},{"id":"mockB-17","scenario":"isError semantics","stem":"An MCP shipping tool returns a response with isError: true. How should the agent interpret this flag?","domain":"TOOL-MCP","difficulty":1,"choices":[{"label":"A","text":"It signals the tool call failed; the agent should read the structured error content to decide whether to retry, change the query, or escalate."},{"label":"B","text":"It means the tool returned a non-fatal warning, but the data payload is still valid and the agent may use it as-is."},{"label":"C","text":"It indicates the agent passed an invalid input schema, so the agent must redefine the tool before it can call it again."},{"label":"D","text":"It is purely informational metadata and can be safely ignored whenever the response still contains usable content fields the agent is able to parse."}],"correct":"A","explanation":"Correct: isError: true signals the call failed; the agent uses the structured error fields to choose a recovery path. B a failure is not a benign warning. C the flag is about the call result, not the tool's own definition. D ignoring a failure flag risks treating failed output as valid data."},{"id":"mockB-18","scenario":"Insurance forced first step","stem":"An insurance intake agent must ALWAYS run extract_claim_metadata as its very first action before any enrichment tools, to guarantee a consistent pipeline start. Which tool_choice setting enforces that specific first call?","domain":"TOOL-MCP","difficulty":1,"choices":[{"label":"A","text":"{\"type\": \"auto\"} plus a system-prompt line asking it first"},{"label":"B","text":"{\"type\": \"any\"} so it must call some tool to start"},{"label":"C","text":"{\"type\": \"tool\", \"name\": \"extract_claim_metadata\"}"},{"label":"D","text":"{\"type\": \"tool\", \"name\": \"auto\"} to auto-pick the first"}],"correct":"C","explanation":"Forced selection {\"type\": \"tool\", \"name\": \"extract_claim_metadata\"} guarantees a specific first action. \"auto\" lets the model decide, \"any\" forces some tool but not that one, and \"auto\" is not a valid tool name."},{"id":"mockB-19","scenario":"isError signaling","stem":"You are building an MCP server that fetches county property records. When the upstream registry is briefly down, what is the correct way for your tool to signal the failure to the agent?","domain":"TOOL-MCP","difficulty":1,"choices":[{"label":"A","text":"Return a normal-looking success response with an empty records array so the agent can treat the lookup as complete."},{"label":"B","text":"Set isError: true and return content describing the failure so the agent knows the call failed."},{"label":"C","text":"Throw an unhandled exception so the MCP transport closes and the agent retries the whole connection from scratch."},{"label":"D","text":"Return isError: false with text \"records may be incomplete\" so the agent keeps going but knows results are partial."}],"correct":"B","explanation":"Correct: an MCP tool signals failure with isError: true so the agent knows the call failed (Ch4.4). B is right. A is silent suppression (failure disguised as empty success), C crashes the channel instead of reporting, and D contradicts itself by flagging no error while implying one."},{"id":"mockB-20","scenario":"Overlapping tool descriptions","stem":"A CI agent has two tools, analyze_diff and analyze_patch, whose descriptions are nearly identical (\"Analyzes code changes\"). The model keeps calling the wrong one. What is the correct remedy?","domain":"TOOL-MCP","difficulty":2,"choices":[{"label":"A","text":"Rewrite each description to be distinct, stating what each returns, input formats, and when to use it versus the other."},{"label":"B","text":"Set tool_choice to any so the model is forced to choose between them, which removes the ambiguity that causes wrong picks."},{"label":"C","text":"Delete one of the two tools and route both analyze_diff and analyze_patch intents through the survivor regardless of fit."},{"label":"D","text":"Lower temperature toward 0 so the model becomes more deterministic and stops varying which of the two tools it selects."}],"correct":"A","explanation":"Correct: the description is the primary selection mechanism; differentiating them (purpose, inputs, when-to-use) fixes misrouting. B forcing a choice does not clarify which is right. C deleting a needed tool loses real capability. D temperature does not resolve ambiguity caused by identical descriptions."},{"id":"mockB-21","scenario":"Enum with other plus detail","stem":"A support-ticket classifier uses an enum [billing, shipping, technical]. Real tickets occasionally fall outside these, and forcing one of the three loses information. What is the recommended schema pattern?","domain":"TOOL-MCP","difficulty":2,"choices":[{"label":"A","text":"Add \"other\" to the enum plus a nullable detail field to capture the out-of-taxonomy specifics."},{"label":"B","text":"Force the model to always pick the closest of the three enum categories even when the ticket clearly falls outside them."},{"label":"C","text":"Remove the enum entirely and let the category be any free-text string so out-of-taxonomy tickets are never lost."},{"label":"D","text":"Add about 30 more enum values up front to anticipate every possibility so nothing ever falls outside the taxonomy."}],"correct":"A","explanation":"Correct: an \"other\" value plus a detail string preserves data that falls outside predefined categories. B forcing the closest category loses the real signal. C a free string abandons the controlled vocabulary. D exhaustively enumerating is impractical and still misses novel cases."},{"id":"mockB-22","scenario":"Team-shared MCP config","stem":"Your team wants every contributor who clones the fintech repo to automatically get the same GitHub and Jira MCP servers, with tokens supplied per-developer and never committed. Where and how should this be configured?","domain":"TOOL-MCP","difficulty":2,"choices":[{"label":"A","text":"In .mcp.json at the project root (committed to VCS), referencing secrets via env-var substitution like ${GITHUB_TOKEN}."},{"label":"B","text":"In each developer's personal ~/.claude.json so the server config stays scoped to them and tokens never reach the repo."},{"label":"C","text":"In .mcp.json committed to VCS with the literal GitHub and Jira tokens inline so cloning gives everyone zero-config setup."},{"label":"D","text":"In the project CLAUDE.md as prose instructions telling each developer how to install and configure the servers manually."}],"correct":"A","explanation":"Correct: .mcp.json at the project root is the team/VCS-shared config, and ${VAR} substitution keeps tokens out of source. B ~/.claude.json is per-user and not shared. C committing literal tokens leaks secrets. D CLAUDE.md prose does not actually configure servers."},{"id":"mockB-23","scenario":"Travel nullable fields","stem":"A travel-extraction tool pulls fields from booking confirmations. Some confirmations lack a loyalty number. Currently loyalty_number is a required string, and the model invents fake numbers when it's missing. What schema change prevents the hallucination?","domain":"TOOL-MCP","difficulty":2,"choices":[{"label":"A","text":"Keep loyalty_number required but add a longer description instructing the model to be accurate and never guess a value when the field is missing from the source."},{"label":"B","text":"Make loyalty_number nullable (\"type\": [\"string\", \"null\"]) and remove it from required so the model can return null when absent"},{"label":"C","text":"Change loyalty_number to an integer type so malformed or invented string values are rejected at validation time"},{"label":"D","text":"Add loyalty_number to an enum of common loyalty-number formats so the model can only emit a recognized pattern"}],"correct":"B","explanation":"Required fields push the model to fabricate values when data is missing; making the field nullable and optional lets it return null instead of hallucinating. A wordier description is still probabilistic, changing the type doesn't address absence, and an enum can't enumerate arbitrary loyalty numbers."},{"id":"mockB-24","scenario":"An invoice-processing pipeline uses tool_use with a strict JSON schema. Every response is now syntactically valid JSON with all required fields present, yet finance reports that line-item subtotals frequently do not sum to the stated invoice total.","stem":"What is the correct mitigation for the remaining defect?","domain":"TOOL-MCP","difficulty":3,"choices":[{"label":"A","text":"Tighten the JSON schema further by adding stricter type constraints and minimum/maximum bounds on each numeric field so totals stay valid"},{"label":"B","text":"Switch from tool_use to plain text output and parse the totals with a regular expression so you can recompute the sum outside the schema"},{"label":"C","text":"Add a semantic validation check that recomputes the sum and, on mismatch, retries the call with feedback describing the discrepancy"},{"label":"D","text":"Mark every numeric field as required so the model can no longer omit any value, which forces each line item into the computed total"}],"correct":"C","explanation":"Correct: C. A strict schema guarantees syntax (valid JSON, present fields, right types) but never semantics; a subtotal that does not add up is a semantic error, mitigated by external validation plus retry-with-feedback or self-correction. A is wrong because tighter type/range constraints still cannot enforce a cross-field arithmetic relationship. B is wrong because abandoning the schema reintroduces syntax errors and still does not check the math. D is wrong because required-ness addresses missing fields, not incorrect values, and required fields actually push the model to fabricate when data is absent."},{"id":"mockB-25","scenario":"A real-estate listing extractor pulls structured data from free-form property descriptions. The schema marks year_built and hoa_fee as required. Many descriptions omit these, and analysts notice the model now emits invented plausible years and round-number fees rather than admitting the data is absent.","stem":"What schema change best stops the fabrication?","domain":"TOOL-MCP","difficulty":3,"choices":[{"label":"A","text":"Keep year_built and hoa_fee required but lower the model temperature toward 0 to reduce the run-to-run variability in the values it returns for them."},{"label":"B","text":"Make year_built and hoa_fee nullable ([\"integer\",\"null\"]) and remove them from the required list so the model can return null when absent"},{"label":"C","text":"Add an enum of common construction decades to year_built so the model is constrained to a realistic value instead of fabricating"},{"label":"D","text":"Add a free-text notes field and instruct the model to mention there whenever the year or HOA fee is missing from the source"}],"correct":"B","explanation":"Correct: B. Required fields push the model to fabricate values when the information is not present; making the fields nullable and optional lets the model honestly return null instead of hallucinating. A is wrong because temperature changes variance, not the structural pressure created by required-ness, the model is still obligated to produce a value. C is wrong because an enum constrains the FORMAT of an invented value but still forces a (now bucketed) guess. D is a weak side-channel that leaves the primary fields required, so they will still be fabricated."},{"id":"mockB-26","scenario":"A support-ticket classifier has an enum category with [billing, shipping, returns]. The business keeps inventing new ticket types (warranty, fraud, data-deletion...), and engineers are paged weekly to add another enum value before the model can label those tickets.","stem":"What is the most sustainable schema design to handle the long tail of new categories?","domain":"TOOL-MCP","difficulty":3,"choices":[{"label":"A","text":"Drop the enum entirely and let category be a free-text string so any new category is captured without further schema work"},{"label":"B","text":"Add an \"other\" enum value plus a nullable category_detail string for the model to describe the out-of-set case"},{"label":"C","text":"Keep adding each new value to the enum the moment the business defines it, so the taxonomy always covers every known case"},{"label":"D","text":"Replace the enum with a confidence number and route any low-confidence ticket to a human queue for manual categorization"}],"correct":"B","explanation":"Correct: B. Adding \"other\" plus a detail string captures data that falls outside the predefined categories without losing it and without a code change per new type, exactly the recommended pattern. A is wrong because free text discards the reliability and routability of an enum for the common known categories. C is the painful status quo described in the scenario, an endless treadmill of enum edits. D measures uncertainty but does not give the model anywhere to place a genuinely new, confidently-recognized category, so known out-of-set tickets are still mishandled."},{"id":"mockB-27","scenario":"A clinical-trials intake agent has three extraction tools: parse_demographics, parse_eligibility, and parse_consent. Regulatory rules require demographics to be extracted FIRST so downstream tools can reference the patient ID it produces. With tool_choice:any the model sometimes starts with parse_eligibility, breaking the chain.","stem":"Which tool_choice configuration on the first turn reliably enforces the required ordering?","domain":"TOOL-MCP","difficulty":4,"choices":[{"label":"A","text":"tool_choice:{\"type\":\"any\"} so the model is forced to call some tool, after which it will naturally pick demographics first"},{"label":"B","text":"tool_choice:{\"type\":\"tool\",\"name\":\"parse_demographics\"} on the first turn to force that exact tool, then switch to auto"},{"label":"C","text":"tool_choice:{\"type\":\"auto\"} plus a system-prompt sentence strongly instructing the model to begin with parse_demographics"},{"label":"D","text":"Remove parse_eligibility and parse_consent from the tool list entirely until parse_demographics has returned its result"}],"correct":"B","explanation":"Correct: B. Forcing a specific tool with {\"type\":\"tool\",\"name\":...} is the only setting that guarantees the exact first action, which is precisely what a required execution order needs; you then revert to auto. A is wrong because \"any\" only guarantees that SOME tool is called, not which one, so the model can still start with parse_eligibility. C is wrong because auto plus a prompt hint is a soft nudge, not a guarantee, and the observed symptom is that the model already disobeys ordering. D works mechanically but is a heavy hack that mutates the toolset each turn and harms selection reliability; forced selection is the designed mechanism for guaranteeing a first step."},{"id":"mockB-28","scenario":"Argument hint","stem":"A skill named /analyze-area expects a directory path. When users invoke it with no argument, the team wants Claude to ask for the path rather than guess. Which frontmatter parameter provides that?","domain":"CODE-CONFIG","difficulty":1,"choices":[{"label":"A","text":"argument-hint, which prompts for the expected argument when the skill is invoked without one."},{"label":"B","text":"allowed-tools, which lists the path-reading tools the skill may use to resolve the directory."},{"label":"C","text":"context: fork, which isolates the run so a missing path argument does not pollute the session."},{"label":"D","text":"A required: true flag on the command, which blocks the skill until the path argument is supplied."}],"correct":"A","explanation":"Correct: argument-hint asks for an argument when the skill is invoked without parameters. B allowed-tools governs tools, not argument prompting. C context: fork is about isolation. D required: true is not the documented frontmatter parameter for this behavior."},{"id":"mockB-29","scenario":"Streaming argument hint","stem":"A streaming team's '/transcode-check' skill needs the path to a media directory as input. When teammates run it bare, they want Claude to ask for that path rather than guessing. Which frontmatter parameter provides that prompt?","domain":"CODE-CONFIG","difficulty":1,"choices":[{"label":"A","text":"allowed-tools"},{"label":"B","text":"context: fork"},{"label":"C","text":"argument-hint"},{"label":"D","text":"paths"}],"correct":"C","explanation":"argument-hint is the hint that asks for an argument when the skill is invoked without parameters. allowed-tools restricts tools, context: fork isolates execution, and paths is a .claude/rules conditional-loading mechanism."},{"id":"mockB-30","scenario":"context fork for noisy analysis","stem":"A legal skill scans an entire contracts directory and emits very verbose intermediate output that pollutes the main session, making later steps lose track. Which SKILL.md frontmatter setting isolates that verbose output?","domain":"CODE-CONFIG","difficulty":1,"choices":[{"label":"A","text":"argument-hint"},{"label":"B","text":"context: fork"},{"label":"C","text":"allowed-tools"},{"label":"D","text":"paths"}],"correct":"B","explanation":"Correct: context: fork runs the skill in an isolated subagent so verbose output does not pollute the main session (Ch5.5). B matches. argument-hint prompts for an argument, allowed-tools restricts the toolset, and paths is a .claude/rules feature for conditional loading."},{"id":"mockB-31","scenario":"New hire missing standards","stem":"A new engineer on a payments team reports that Claude Code ignores the team's coding and testing standards on their machine, while everyone else's setup honors them. The standards were saved under ~/.claude/CLAUDE.md by the engineer who wrote them. What is the fix?","domain":"CODE-CONFIG","difficulty":2,"choices":[{"label":"A","text":"Move the standards to project-level (.claude/CLAUDE.md or root CLAUDE.md) committed to VCS so all contributors load them."},{"label":"B","text":"Have every teammate manually copy the standards file into their own ~/.claude/CLAUDE.md so each machine loads them locally."},{"label":"C","text":"Put the coding and testing standards into a skill so they load on demand whenever a contributor explicitly invokes it."},{"label":"D","text":"Add the standards to a directory-level CLAUDE.md inside node_modules so every package build picks them up automatically."}],"correct":"A","explanation":"Correct: user-level CLAUDE.md is personal and not shared; project-level CLAUDE.md in VCS reaches all contributors. B manual copying is error-prone and drifts. C always-on standards belong in CLAUDE.md, not an on-demand skill. D node_modules is not where project standards live and is not committed source."},{"id":"mockB-32","scenario":"Skill vs CLAUDE.md","stem":"A team wants a thorough security-review workflow that runs only when explicitly invoked, not loaded into every interaction. They also have general naming conventions that should always apply. How should these be organized?","domain":"CODE-CONFIG","difficulty":2,"choices":[{"label":"A","text":"Put the on-demand security review in a skill (invoked as /command) and keep the always-on naming conventions in CLAUDE.md."},{"label":"B","text":"Put both the security-review workflow and the naming conventions in CLAUDE.md so the team always has them loaded together."},{"label":"C","text":"Put both the review workflow and the naming conventions in a single skill so they stay available whenever it is invoked."},{"label":"D","text":"Put the always-on naming conventions in a skill and the on-demand security review workflow in CLAUDE.md for visibility."}],"correct":"A","explanation":"Correct: skills are for on-demand, task-specific invocation; CLAUDE.md is for always-loaded standards. B loading a heavy review workflow always wastes context. C skills are not always-on, so conventions would not consistently apply. D inverts the correct mapping."},{"id":"mockB-33","scenario":"Plan vs direct execution","stem":"An engineer must migrate a payments library across 47 files with several plausible approaches and unclear blast radius. Which Claude Code workflow is most appropriate to start?","domain":"CODE-CONFIG","difficulty":2,"choices":[{"label":"A","text":"Planning mode first to investigate and produce an approved plan, then direct execution to implement it."},{"label":"B","text":"Direct execution immediately, since a 47-file migration is mechanical and a plan would only slow the work down."},{"label":"C","text":"Run the whole migration headless with -p and skip review, since the approaches are interchangeable anyway."},{"label":"D","text":"Use /compact repeatedly while editing all 47 files in one pass so context stays small throughout the change."}],"correct":"A","explanation":"Correct: large changes across many files with multiple approaches call for planning mode (safe, no side effects) then direct execution of the approved plan. B direct execution is for small, unambiguous changes. C headless without review is risky for a 47-file migration. D /compact manages context but is not a migration strategy."},{"id":"mockB-34","scenario":"Persisting project context","stem":"An engineer keeps re-explaining the same project conventions and current work context at the start of every Claude Code session. Which built-in command is designed to persist these notes across sessions?","domain":"CODE-CONFIG","difficulty":2,"choices":[{"label":"A","text":"/memory, which opens CLAUDE.md for editing so notes and context persist and auto-load on startup."},{"label":"B","text":"/compact, which compresses the current session's history so the conventions survive into the next session."},{"label":"C","text":"--resume, which reloads one specific named session and replays the project notes you saved into it earlier."},{"label":"D","text":"An MCP Prompt template, which stores the conventions centrally but must be invoked manually each session."}],"correct":"A","explanation":"Correct: /memory edits CLAUDE.md so conventions and context persist across sessions and load automatically. B /compact is within-session compression, not cross-session persistence. C --resume reattaches to a single session, not durable project memory. D a manually invoked template does not auto-load conventions every session."},{"id":"mockB-35","scenario":"Travel skill vs CLAUDE.md","stem":"A travel-tech team has a complex 'generate-integration-test' workflow they invoke occasionally for specific modules, plus a set of always-relevant coding standards. How should each be configured?","domain":"CODE-CONFIG","difficulty":2,"choices":[{"label":"A","text":"Put both the workflow and the standards in CLAUDE.md so they are always loaded for every session automatically"},{"label":"B","text":"Make the on-demand workflow a skill/slash command and keep the always-relevant standards in CLAUDE.md"},{"label":"C","text":"Make the always-relevant coding standards a skill and put the occasional integration-test workflow in CLAUDE.md"},{"label":"D","text":"Put both the on-demand workflow and the always-relevant standards in .mcp.json so they load through the server"}],"correct":"B","explanation":"Skills are for on-demand invocation of a specific task, while CLAUDE.md holds always-loaded general standards. Putting an occasional workflow in CLAUDE.md wastes context, swapping the two inverts their purposes, and .mcp.json is for MCP servers."},{"id":"mockB-36","scenario":"A fintech platform team has Terraform under infra/, Kubernetes manifests under deploy/, and Helm charts under charts/. All three need the same hardening convention: 'every resource must declare an explicit owner tag.' The convention applies only when editing those infra files, not the app code.","stem":"Which configuration mechanism applies this convention with the least context overhead while still covering all three locations?","domain":"CODE-CONFIG","difficulty":3,"choices":[{"label":"A","text":"A single `.claude/rules/` file with frontmatter `paths: [\"infra/**/*\", \"deploy/**/*\", \"charts/**/*\"]`, loaded only when matching files are edited"},{"label":"B","text":"Three directory-level CLAUDE.md files, one each in infra/, deploy/, and charts/, so every location carries its own copy"},{"label":"C","text":"A single rule placed in the root project CLAUDE.md so it is always loaded for every contributor across all three paths"},{"label":"D","text":"A skill with context: fork and an argument-hint pointing at whichever of the three directories the engineer wants to harden before each individual run."}],"correct":"A","explanation":"Correct: A. The convention is file-pattern-scoped and spread across multiple directories — exactly the `.claude/rules/` with glob `paths` case. It loads only when a matching file is edited (saving context) and one file covers all three trees. B works but duplicates the same rule three times and is harder to maintain. C is always-on, wasting context on every app-code edit even though the rule is task-specific to infra. D is for on-demand invocation of a verbose task, not for passively enforcing a convention while editing."},{"id":"mockB-37","scenario":"A game studio built a `/asset-audit` skill that crawls thousands of texture and mesh files, prints every path it inspects, and emits a summary. Developers complain that after running it, the main session's context is flooded with file listings and Claude starts losing track of the feature they were actually building.","stem":"What is the most precise fix?","domain":"CODE-CONFIG","difficulty":3,"choices":[{"label":"A","text":"Add `context: fork` to the skill's SKILL.md frontmatter so it runs in an isolated subagent and only its summary returns to the main session"},{"label":"B","text":"Move the skill from .claude/skills/ to ~/.claude/skills/ so it runs as a personal skill and therefore no longer affects the project context for anyone on the team."},{"label":"C","text":"Run /compact immediately after the skill finishes so the verbose asset listings are compressed out of the main session context"},{"label":"D","text":"Restrict the skill with allowed-tools: [\"Read\", \"Glob\"] so it inspects far fewer files and produces much less intermediate output"}],"correct":"A","explanation":"Correct: A. `context: fork` runs the skill in an isolated subagent so its verbose output does not pollute the main session; only the summary comes back. B changes scope/sharing (user vs project), not context isolation — the verbose output would still flood the session. C reacts after the damage and risks losing precise details elsewhere via summarization. D limits which tools are available for security, not how much output reaches the main context — restricting tools does not isolate the verbose listings."},{"id":"mockB-38","scenario":"A healthcare company wants a `/db-migrate` skill teammates can invoke. It must: (1) keep its lengthy schema-diff output out of the main session, (2) prompt the developer for the migration directory when invoked bare, and (3) be physically incapable of running shell commands or deleting files — it may only read and search.","stem":"Which SKILL.md frontmatter satisfies all three requirements together?","domain":"CODE-CONFIG","difficulty":4,"choices":[{"label":"A","text":"`context: fork` + `argument-hint: \"Path to the migration directory\"` + `allowed-tools: [\"Read\", \"Grep\", \"Glob\"]`"},{"label":"B","text":"`context: fork` + `argument-hint: \"Path to the migration directory\"` + `allowed-tools: [\"Read\", \"Grep\", \"Glob\", \"Bash\"]`"},{"label":"C","text":"`paths: [\"migrations/**/*\"]` + `argument-hint: \"Path to the migration directory\"` + `allowed-tools: [\"Read\", \"Grep\"]`"},{"label":"D","text":"`context: fork` + `allowed-tools: [\"Read\", \"Grep\", \"Glob\"]`, with the path required as a positional argument in the prompt body"}],"correct":"A","explanation":"Correct: A. `context: fork` isolates the verbose diff (requirement 1); `argument-hint` prompts for the directory when invoked without a parameter (requirement 2); `allowed-tools` limited to Read/Grep/Glob makes shell and deletion impossible (requirement 3). B includes Bash, which would allow shell commands and violate requirement 3. C uses `paths`, a `.claude/rules/` conditional-loading feature, not a skill parameter — it neither forks context nor restricts tools, and Glob is missing. D drops `argument-hint`, so a bare invocation gives no prompt for the required directory."},{"id":"mockB-39","scenario":"An engineer has a personal `/review` skill in `~/.claude/skills/review/` tuned to their own nitpicky style. The team also ships a project `/review` skill in `.claude/skills/review/` with the agreed company review checklist. Both define the same `/review` command name. The engineer notices their personal style keeps overriding the team checklist.","stem":"What is the correct way to reason about and resolve this conflict?","domain":"CODE-CONFIG","difficulty":4,"choices":[{"label":"A","text":"Same-name skills collide; to use the shared team checklist, the engineer should rename their personal variant (e.g., `/review-mine`) per the guidance that personal variants live under different names"},{"label":"B","text":"Project skills always take precedence over user skills, so this collision cannot actually happen; the engineer is simply mis-reading which of the two same-named skills ran, since the project one silently wins every time."},{"label":"C","text":"Move the shared team checklist into the root CLAUDE.md so it is always loaded directly and therefore can never be shadowed by a personal skill of the same name"},{"label":"D","text":"Add `context: fork` to the project skill so it runs isolated and is given priority over the user skill that shares its name, resolving the collision automatically"}],"correct":"A","explanation":"Correct: A. The guide explicitly advises creating personal skil
