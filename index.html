gainst outcomes delivered, with budgets and alerts owned by each team."},{"label":"C","text":"A monthly chargeback allocated by each team's share of total tokens, so costs land in the budgets of the teams that generate them and finance gets the accountability it asked for."},{"label":"D","text":"A central approval gate for any new workload above a spend threshold, so growth is controlled at the point of introduction rather than after the invoice arrives."}],"correct":"B","explanation":"You cannot manage what you cannot attribute, and the unit that matters is spend per outcome - a team consuming the most may be delivering the most value. Attribution plus per-team ownership makes that visible before anyone throttles anything. A punishes volume rather than waste and can cap the highest-value workload. C allocates on a basis that is not cost - output, cache-write and cache-read tokens are priced up to an order of magnitude apart, so token share misstates each team's actual spend - and it still never relates spend to value, producing an invoice split teams argue about rather than act on. D controls new workloads while leaving the existing $180k unexamined."},{"id":"pro3-42","scenario":"Inside the boundary, mostly","stem":"A federal agency system runs Claude inside a FedRAMP-authorized environment. The RAG pipeline calls a commercial embedding API that has no FedRAMP authorization; traffic is TLS-encrypted and the vendor is SOC 2 Type II. The team argues that since only short text fragments leave, and they are encrypted, the boundary is intact. Assess.","domain":"GOV-RISK","difficulty":5,"choices":[{"label":"A","text":"The reasoning holds if the fragments are limited to non-sensitive metadata; document the flow in the SSP as an approved external interface and proceed with continuous monitoring."},{"label":"B","text":"Encryption addresses confidentiality in transit, not authorization: agency data processed by an unauthorized service places that service inside the boundary, so it must be authorized, replaced with an in-boundary model, or the data flow removed."},{"label":"C","text":"SOC 2 Type II is a recognized equivalent for low-impact data flows, so the control gap can be closed with a documented risk acceptance signed by the agency's authorizing official. The authorizing official is the accountable party for residual risk, so a signed acceptance is the mechanism the framework itself provides for gaps like this one."},{"label":"D","text":"The exposure is acceptable because embeddings are numeric vectors rather than readable text, and inverting a vector back to its source passage is not feasible in practice."}],"correct":"B","explanation":"The authorization boundary follows the data: any service that processes agency information is in scope and must be authorized or removed, regardless of transport encryption. A mislabels a processing dependency as an interface and assumes away the sensitivity question. C treats SOC 2 Type II as a substitute for FedRAMP authorization, which it is not - and while an authorizing official can accept residual risk on documented controls, a risk acceptance does not convert an unauthorized processor into an authorized one or move federal data back inside the boundary. D is factually shaky - embeddings leak substantial information about their source text - and beside the point, since the plaintext fragment is what gets sent out to be embedded."},{"id":"pro3-43","scenario":"The observability tool that ate the PHI","stem":"A HIPAA-covered clinical assistant has a signed BAA with its model provider and encrypts everything at rest. A review finds full prompt and response bodies - including patient narratives - streamed to a third-party observability SaaS with a 400-day retention default and no BAA, because the team wanted good traces for debugging. What is the correct assessment?","domain":"GOV-RISK","difficulty":5,"choices":[{"label":"A","text":"The gap is retention: reduce it to 30 days and restrict trace access to the on-call rotation, which brings the exposure to a defensible minimum for debugging purposes."},{"label":"B","text":"Telemetry is a PHI disclosure path like any other: it needs a BAA or de-identified payloads, redaction before egress, minimum-necessary field selection, and retention set by policy rather than by vendor default."},{"label":"C","text":"Because the observability vendor is a mere conduit transmitting data on the covered entity's instructions, the existing model-provider BAA extends to it and the arrangement is already compliant. The covered entity also chose the vendor and directs its processing, which is the relationship the conduit exception was written to describe."},{"label":"D","text":"Traces are operational metadata rather than a clinical record, so they fall outside the designated record set and the HIPAA disclosure rules do not attach to them."}],"correct":"B","explanation":"Observability is a data pipeline with the same obligations as any other: a vendor receiving PHI needs a BAA, and the payload should be redacted to the minimum necessary before it ever leaves. Retention (A) is one of several problems and does not address the missing agreement. C misuses the conduit exception, which covers transient transmission rather than a vendor storing full patient narratives for 400 days, and invents a transitivity that BAAs do not have. D is simply wrong - PHI in a log is PHI, and where it sits does not change its character."},{"id":"pro3-44","scenario":"Equally accurate, unequally wrong","stem":"A benefits-eligibility assistant is audited for fairness. Overall accuracy is 91.2% for group A and 91.0% for group B. But false negatives - wrongly denying eligibility - run 3.1% for group A and 8.4% for group B, offset by a mirrored difference in false positives. The team reports accuracy parity and considers the audit passed. What is the architect's position?","domain":"GOV-RISK","difficulty":5,"choices":[{"label":"A","text":"Accuracy parity is the accepted industry standard and is satisfied here; the error-type asymmetry should be logged as a monitoring item rather than a finding."},{"label":"B","text":"The fairness metric must match the harm: a wrongful denial is the injury here, so equal false-negative rates - equal opportunity - is the criterion, and the audit fails at nearly 3x disparity."},{"label":"C","text":"The correct remedy is to equalize outcomes by adjusting the decision threshold per group until approval rates match across groups, which removes the disparity directly. Threshold adjustment is also the only intervention that acts directly on the disparity rather than on the model's inputs or its training data."},{"label":"D","text":"Because the differences offset each other in the aggregate, this is a calibration artifact of unbalanced group sizes rather than a fairness defect in the system's behaviour."}],"correct":"B","explanation":"Fairness is not one number: choosing the metric is a normative decision about which error hurts, and for eligibility denial that is the false-negative rate, where a 3.1% vs 8.4% gap is a serious finding. A hides behind an aggregate that averages away the harm. C jumps to a remedy - per-group thresholds - that is explicit classification on a protected attribute, carries its own legal exposure, and equalizes approval rates, which is a different criterion from the one the harm implies. D reaches for a statistical excuse; offsetting errors in the average is exactly how disparate error rates stay invisible. Note also that the remedy is to bring group B's false-negative rate down to group A's, not to equalize by making group A worse."},{"id":"pro3-45","scenario":"The reviewer is on holiday","stem":"Regulation requires a qualified human to approve any AI-generated adverse decision. The queue is staffed 09:00-18:00 on weekdays; the system runs continuously. Last Saturday, 1,900 decisions accumulated and the on-call engineer approved them in bulk on Monday morning to clear the SLA. What must the design specify?","domain":"GOV-RISK","difficulty":5,"choices":[{"label":"A","text":"Extended reviewer coverage to match system hours, since a control that only operates a third of the week is not a control and the staffing gap is the root cause."},{"label":"B","text":"Named review authority with the competence the regulation requires, plus explicit behaviour when authority is unavailable - queue and hold, not proceed - and a hard cap on unreviewed backlog that pauses the pipeline."},{"label":"C","text":"An automated pre-approval tier for high-confidence decisions so weekend volume never accumulates, with human review reserved for the low-confidence remainder. Confidence-gated pre-approval also concentrates the qualified reviewer's weekday hours on the decisions where their judgement actually changes the outcome."},{"label":"D","text":"A rule that the SLA clock pauses outside review hours, which removes the pressure that led the engineer to bulk-approve and keeps the queue honest."}],"correct":"B","explanation":"Two things failed: who may approve (an on-call engineer is not the qualified reviewer the regulation names) and what happens when nobody may. The design must name the authority, fail closed when it is absent, and stop generating work once the backlog exceeds what review can absorb. A is a useful mitigation that leaves both failures unaddressed - the next holiday reproduces it. C automates away the human approval the regulation requires. D fixes the incentive while leaving the pipeline free to accumulate 1,900 unreviewed adverse decisions."},{"id":"pro3-46","scenario":"Instructions arriving in the data","stem":"An agent reads customer emails and can issue refunds. An attacker emails text instructing the agent to refund a specified order. Which TWO controls actually reduce the blast radius, as opposed to reducing the probability of the model being fooled? (Select TWO.)","domain":"GOV-RISK","difficulty":5,"choices":[{"label":"A","text":"Deterministic policy checks on the action itself - refund amount ceilings, order-ownership verification, velocity limits - evaluated outside the model before execution."},{"label":"B","text":"Privilege separation so the context that reads untrusted content holds no refund capability, and refunds are issued only from a separate call with a validated order reference."},{"label":"C","text":"A system prompt instruction that content inside email bodies is data and any instructions found there must be ignored regardless of how they are phrased."},{"label":"D","text":"An input classifier that scores incoming emails for injection patterns and routes anything above the threshold to a human queue for manual handling."},{"label":"E","text":"Structural delimiting of untrusted content with tagged boundaries and an explicit reminder of where the trusted instruction block ends."}],"correct":["A","B"],"explanation":"Blast radius is governed by what the system can do once fooled, so the controls that matter are outside the model: policy enforcement on the action (A) and separating read-untrusted from act-privileged (B). C, D and E all try to make the model less likely to be persuaded - worth doing, and all probabilistic. The exam distinction is that a probability reduction never bounds an outcome; only a deterministic gate does."},{"id":"pro3-47","scenario":"Explain the denial","stem":"A credit product must give applicants the specific principal reasons for an adverse decision. Eligibility is decided by a separate scoring engine; the pipeline then retrieves comparable cases and Claude writes a paragraph explaining the outcome. Compliance asks whether that paragraph satisfies the requirement. What is the correct answer?","domain":"GOV-RISK","difficulty":5,"choices":[{"label":"A","text":"Yes, provided the paragraph is reviewed by an adjudicator before it is sent and the review is recorded in the case file alongside the applicant's data."},{"label":"B","text":"No: a generated narrative is a plausible account, not a record of the decision. The reasons must be derived from the factors that actually drove the outcome - the scoring engine's logged reason codes and attributions - with the evidence chain recorded and reproducible; the model may at most render those factors in prose."},{"label":"C","text":"Yes, as long as the prompt requires the explanation to cite the specific retrieved comparable cases that informed the assessment, making the reasoning auditable after the fact. Citing the retrieved comparables also lets an adjudicator reconstruct what the model considered, which is the transparency the applicant is entitled to; and because the comparables are logged, the explanation stays reproducible months later during an examination."},{"label":"D","text":"No, and the resolution is to add a second model that critiques the first model's explanation for consistency with the applicant's data before the letter is issued."}],"correct":"B","explanation":"An explanation must correspond to the actual cause of the decision. A fluent post-hoc narrative can be entirely convincing and unrelated to what drove the outcome, which is both a compliance failure and a misinformation risk. The decision factors live in the scoring engine and must be logged and reproducible, with the model at most rendering them readably. A adds review of an artifact that may not describe the real reasons. C cites inputs, not causes. D checks one narrative against another."},{"id":"pro3-48","scenario":"Delete me everywhere","stem":"A GDPR erasure request arrives for a customer whose data appears in the source CRM, the vector index, a 5-minute prompt cache, 90 days of request logs, the eval dataset copied to a dev environment, and an LLM-judge scoring archive. The team plans to delete from the CRM and let the nightly re-index propagate. Is that sufficient?","domain":"GOV-RISK","difficulty":5,"choices":[{"label":"A","text":"Yes for the index and logs, which age out naturally within the retention window, but the dev eval copy needs a manual deletion pass because it sits outside the production lifecycle."},{"label":"B","text":"No: erasure must reach every derived store, so the design needs a data inventory, propagation to index and derived artifacts, and documented handling for caches, logs and eval copies."},{"label":"C","text":"Yes, because embeddings, cached prefixes and judge scores are derived artifacts rather than personal data, and only the identifiable source record falls within the scope of the request."},{"label":"D","text":"No, and the practical remedy is to shorten every retention period to 24 hours so that any future erasure request is satisfied automatically by expiry."}],"correct":"B","explanation":"Erasure obligations follow the personal data into every derived store, and AI systems create more of those than teams expect - indexes, caches, logs, eval sets, judge archives, and copies in non-production environments. The answer is an inventory of derived stores plus a documented propagation path with defensible treatment for each. A dismisses log and index copies as self-resolving. C asserts as a blanket rule what is a per-artifact assessment: here every artifact - embedding, cached prefix, judge score - remains linkable to an identified customer, so each is personal data. D destroys the evaluation and debugging capability the system depends on; a 24-hour eval set cannot support regression testing at all."},{"id":"pro3-49","scenario":"Optimizing the collections message","stem":"A collections team wants Claude to personalize repayment messages and A/B optimize for payment rate. Early tests show the highest-converting variants emphasize urgency and consequences, and perform best on customers whose payment history suggests financial distress. Leadership sees a 14% lift. What should the architect do?","domain":"GOV-RISK","difficulty":5,"choices":[{"label":"A","text":"Approve it with a disclosure that the message was AI-generated and a documented opt-out, since transparency and consent are the applicable safeguards for automated communications."},{"label":"B","text":"Raise it as a design problem, not a tuning problem: an objective that rewards pressure on vulnerable customers needs a constrained objective, prohibited-tactic guardrails, per-segment harm review, and named sign-off outside the commercial owner."},{"label":"C","text":"Approve the personalization but exclude the financially distressed segment from optimization, keeping a neutral template for those customers while the rest continue to be optimized. Excluding the distressed segment also preserves the lift on customers for whom urgency messaging is a useful reminder rather than a pressure tactic."},{"label":"D","text":"Require human review of each generated message before sending, which puts a person in the loop on every communication and satisfies the oversight requirement."}],"correct":"B","explanation":"An optimizer maximizes what you give it; here the metric rewards exploiting distress, so the objective and its guardrails are the artifact under review, and the sign-off cannot belong to the party incentivized by the lift. A treats a fairness and conduct issue as a disclosure issue. C is a real mitigation but relies on a distress classifier that will be incomplete, and leaves the harmful objective running elsewhere. D scales badly and, more importantly, human reviewers approving pressure tactics does not make them acceptable."},{"id":"pro3-50","scenario":"Inherent or fixable","stem":"A risk register lists four items: (1) identical inputs can yield different outputs, (2) the model does not know about events after training, (3) the model tends to agree with a confidently stated user premise, (4) it miscounts characters in long strings. An auditor asks which of these can be engineered away. What is the correct characterization?","domain":"GOV-RISK","difficulty":4,"choices":[{"label":"A","text":"All four are inherent properties of language models and must be handled by process controls and human oversight rather than by system design."},{"label":"B","text":"Items 2 and 4 are addressable in the system - retrieval supplies current facts, code performs exact string work - while 1 and 3 are properties of the model and its serving stack whose effects must be bounded by design."},{"label":"C","text":"Items 1, 2 and 4 are addressable through configuration - deterministic sampling settings, a current retrieval corpus, and a code tool - leaving only sycophancy as an inherent behavioural risk to monitor. Sampling settings, a retrieval corpus and a code tool are all configuration rather than architecture, which is why each can be turned on without redesigning the system."},{"label":"D","text":"None of the four belongs in a risk register: they are well-documented model characteristics rather than risks, and the register should record the business impacts they could cause instead."}],"correct":"B","explanation":"Two of these are architectural: a knowledge cutoff is fixed by retrieval, and exact character-level work belongs in code. Two are properties you bound rather than remove - greedy decoding makes output near-deterministic but not guaranteed, since batching, routing and hardware still change results, so a system that requires identical answers cannot rely on configuration; and sycophancy is mitigated by prompt design, independent verification, and not stating your conclusion inside the question, yet never guaranteed absent. A gives up on two solvable problems. C overclaims determinism from configuration. D has a fair point about impact framing but answers a different question."},{"id":"pro3-51","scenario":"Putting 95% accuracy in a contract","stem":"A customer's procurement team demands two SLA terms: 99.9% availability and 95% accuracy, with service credits attached to both. The system classifies inbound documents, and roughly 4% of real traffic is document types never seen in testing. What should the architect commit to?","domain":"STAKE-COMM","difficulty":5,"choices":[{"label":"A","text":"Commit to availability and decline the accuracy term entirely, explaining that no vendor can contractually guarantee the output quality of a probabilistic system on unseen inputs."},{"label":"B","text":"Accept both as written and manage the risk internally with a conservative confidence threshold that abstains often enough to keep measured accuracy above 95%."},{"label":"C","text":"Commit to accuracy defined by a named measurement method on a defined in-scope population, with out-of-distribution inputs handled by a separate abstention commitment, plus a review cadence and error budget."},{"label":"D","text":"Propose a shared-risk structure where credits apply only if accuracy falls below 95% for two consecutive months, which absorbs normal variance while still giving the customer real recourse. A two-month window also matches the cadence at which the customer reviews service performance, so credits attach to a trend rather than to a single bad week."}],"correct":"C","explanation":"An accuracy SLA is signable once it says what is measured, how, on which population, and what happens to inputs outside it - otherwise both sides are agreeing to different numbers. A gives up a term the customer needs and that is achievable when properly scoped. B games the metric by abstaining, which meets the number while degrading the service the customer is buying. D is a reasonable commercial refinement layered on an undefined metric, so it settles the dispute mechanism without settling what is being measured."},{"id":"pro3-52","scenario":"We want an AI agent for procurement","stem":"A VP opens the engagement with 'we want an AI agent for procurement, our competitor has one'. Budget is approved and a date is set. What is the architect's most valuable first move?","domain":"STAKE-COMM","difficulty":5,"choices":[{"label":"A","text":"Convene a requirements workshop with all procurement stakeholders to enumerate desired capabilities, then prioritize them into a phased roadmap against the approved budget."},{"label":"B","text":"Build a two-week prototype against the most obvious procurement use case, since a working artifact will surface real requirements faster than any amount of upfront discussion."},{"label":"C","text":"Identify which decisions procurement makes, what going wrong costs today, and get access to historical cases - the evidence that determines whether an agent is even the right shape."},{"label":"D","text":"Research the competitor's implementation and its published outcomes to establish a capability baseline the VP's stated ambition can be measured against."}],"correct":"C","explanation":"Discovery works backwards from decisions and the cost of getting them wrong, and it needs real historical cases - which double as the first eval set. That evidence tells you whether the answer is an agent, a workflow, or a fixed report. A collects wishes without grounding them in value or feasibility, and workshops reliably over-scope. B commits to a shape before knowing the problem. D anchors the design on a competitor's constraints rather than this organization's."},{"id":"pro3-53","scenario":"Explaining the trade-off to the COO","stem":"The COO must choose between two configurations: one resolves 71% of tickets unaided at $0.11 per resolved ticket, of which 2.4% are resolved incorrectly; the other resolves 62% at $0.04 per resolved ticket with 0.9% resolved incorrectly. Monthly volume is 60,000 tickets. How should the architect present this?","domain":"STAKE-COMM","difficulty":4,"choices":[{"label":"A","text":"Present both options in the COO's terms - deflected tickets, cost per resolved ticket, and expected wrong resolutions per month at current volume - and state which one you recommend and why."},{"label":"B","text":"Explain the underlying mechanics - model tiers, token economics, confidence thresholds - so the COO can weigh the technical trade-offs directly and make an informed choice."},{"label":"C","text":"Recommend the higher-deflection option, since deflection is the metric the automation programme was funded to move and the incremental error rate is small in absolute terms."},{"label":"D","text":"Present a third blended option that routes by predicted difficulty, capturing most of the deflection at most of the cost saving and avoiding the need for the COO to make a trade-off at all. Presenting a router also demonstrates that the architect explored the space rather than reducing a nuanced decision to two pre-built options."}],"correct":"A","explanation":"Translate into the decision-maker's units - deflected tickets, cost per resolved ticket, and the count of wrong resolutions someone will have to absorb each month - then make a recommendation, because an architect who only lists options has not done the work. B is the classic failure of explaining your problem instead of theirs. C picks for them on a single metric and buries the error consequence. D can be the right design, but inventing a third option at the decision meeting dodges a trade-off the COO is entitled to own - and its claimed blend, most of the deflection at most of the saving, is an unmeasured assertion: a difficulty router has its own error rate and no pilot data behind it, so it is work to scope next, not an option to table now."},{"id":"pro3-54","scenario":"Their upstream change, your regression","stem":"Extraction quality fell from 94% to 81% over a weekend. Cause: the client's document vendor silently changed its OCR settings, degrading input quality. The client's operations director escalates to your executive sponsor claiming the system is unreliable. How should the architect handle this?","domain":"STAKE-COMM","difficulty":5,"choices":[{"label":"A","text":"Present the evidence to your sponsor and the operations director together and propose that the document vendor be brought into a three-party review before any further change is made on either side."},{"label":"B","text":"Own the outcome and the gap: state the cause with evidence, acknowledge that the system should have detected the input shift itself, commit to input-quality monitoring, and propose a joint change-notification protocol."},{"label":"C","text":"Restore quality first by tuning the extraction prompts to the degraded OCR output, then hold the causal discussion once the numbers have recovered and the escalation has cooled. Recovering the numbers first also removes the operations director's immediate complaint, which makes the causal conversation easier to hold calmly."},{"label":"D","text":"Propose an SLA amendment that excludes input-quality-driven degradation from the accuracy commitment, which prevents the same dispute from recurring on the next upstream change."}],"correct":"B","explanation":"The strongest position combines the facts with your own gap: the cause was upstream, and a production system consuming third-party input should have alarmed on a distribution shift instead of learning about it from an escalation. Owning that is what earns the credibility to then ask for a change-notification protocol. A is a reasonable governance move that still treats the regression as entirely someone else's to explain, and it leaves your detection gap unaddressed. C fixes symptoms and hides the cause. D is legally tidy and relationally expensive at exactly the wrong moment."},{"id":"pro3-55","scenario":"Handing it to operations","stem":"An AI-assisted underwriting workflow goes live in three weeks. The delivery team disbands afterwards; an operations group with no AI experience takes over. What defines a complete handoff?","domain":"STAKE-COMM","difficulty":5,"choices":[{"label":"A","text":"A training programme plus complete architecture and prompt documentation, delivered before the delivery team rolls off, with a recorded walkthrough of the system for future reference. A recorded walkthrough also survives staff turnover in operations, which a live drill attended by today's team does not."},{"label":"B","text":"A ninety-day hypercare period during which the delivery team stays on call for escalations, after which operations owns the system outright."},{"label":"C","text":"Operations can detect degradation, respond to defined failure modes, change prompts through a gated process, and knows what to escalate to whom - demonstrated by a rehearsed incident, not by a document."},{"label":"D","text":"Monitoring dashboards, alert thresholds and a runbook covering the known failure modes, reviewed and signed off by the operations lead as fit for purpose."}],"correct":"C","explanation":"Handoff completeness is a capability test on the receiving team: can they see a problem, act on it, change the system safely, and route what they cannot handle - proved by running a drill. A and D deliver artifacts, which are necessary and routinely mistaken for readiness. B contradicts the stated constraint - the delivery team is gone - and even where hypercare is possible, on-call cover that does not transfer capability ends in the same gap ninety days later."},{"id":"pro3-56","scenario":"Why is it built this way","stem":"Nine months after launch, a new team owns the system. They cannot tell why retrieval is chunk-based rather than agentic search, why the judge is pinned to an older model, or why one document type bypasses automation. Two of these choices are later reversed and both reversals cause incidents. What documentation practice would have prevented this?","domain":"STAKE-COMM","difficulty":4,"choices":[{"label":"A","text":"A maintained architecture document describing the current design in full detail, kept in the team wiki and reviewed quarterly for accuracy against the running system."},{"label":"B","text":"Decision records capturing the constraint, the alternatives rejected and why, versioned next to the code so a future reader meets the reasoning before changing it."},{"label":"C","text":"Inline code comments at each non-obvious implementation point, since documentation kept anywhere other than the code itself inevitably drifts from what the system does."},{"label":"D","text":"A recorded design review and handover session per major subsystem, giving the incoming team the discussion and the reasoning in the participants' own words."}],"correct":"B","explanation":"What was lost is rationale - the constraint that made the rejected alternative wrong - which is exactly what a decision record preserves and what a description of the current state omits. A tells the new team what the system does, which they can already read. C helps at the line level and cannot hold a rejected-alternatives argument. D captures reasoning in the least searchable, least maintainable medium available."},{"id":"pro3-57","scenario":"Six percent unhappy, cause unknown","stem":"6% of sessions end in a thumbs-down. The team has already read a sample of negative transcripts and has a working list of failure classes, but the ratings themselves carry no reason, and users who complained six weeks ago have seen no change and have stopped rating altogether. What durable mechanism should the architect put in place?","domain":"STAKE-COMM","difficulty":5,"choices":[{"label":"A","text":"Capture a structured reason at the moment of failure using a short taxonomy drawn from real failure classes, and publish what changed as a result back to the people who reported it."},{"label":"B","text":"Add a free-text follow-up prompt after any negative rating and cluster the responses monthly with Claude, which yields far richer diagnostic detail than any fixed category list. Free text also lets users describe failures the team has not thought of yet, which a fixed taxonomy by construction cannot capture."},{"label":"C","text":"Sample negative sessions weekly for manual transcript review by the delivery team, building an internal defect taxonomy from what the reviewers actually observe in the logs."},{"label":"D","text":"Interview a dozen dissatisfied users to understand the failure themes qualitatively, then instrument the specific signals those interviews identify as the leading causes."}],"correct":"A","explanation":"Two things are broken: the signal has no diagnostic content, and the loop never closes, which is why rating volume is collapsing. A structured reason captured at the point of failure yields an actionable class, and telling reporters what changed is what keeps the signal alive. B improves richness but not closure, and monthly clustering is slow. C is the work that produced the failure classes and has already been done here; as a standing process it still returns nothing to the users whose ratings are collapsing. D is a reasonable one-time study, not a durable feedback mechanism."},{"id":"pro3-58","scenario":"Just add one more document type","stem":"Mid-pilot, a stakeholder asks to 'just add' handwritten field reports to a system currently validated on typed forms. They frame it as a small addition since 'it's the same extraction task'. The pilot exit review is in four weeks. How should the architect respond?","domain":"STAKE-COMM","difficulty":5,"choices":[{"label":"A","text":"Accept it as an in-scope variation and monitor accuracy for the new type separately during the pilot, flagging it at the exit review if the numbers come in materially worse."},{"label":"B","text":"Decline until after the exit review, since changing the input distribution during a pilot invalidates the results the review depends on and the timeline has no slack."},{"label":"C","text":"Reframe it as a new input distribution needing its own labelled set, baseline and threshold, and price that work explicitly - then let the stakeholder choose between it and the exit date."},{"label":"D","text":"Accept it and run it as a shadow path whose outputs are recorded but not used, so the pilot metrics stay clean while evidence for handwritten documents accumulates in parallel."}],"correct":"C","explanation":"The architect's job is to make the hidden cost visible and hand the trade-off back: handwriting is a different input distribution requiring its own labels, baseline and threshold, and that work has a price in time or scope. A silently blends an unvalidated distribution into the pilot's headline number. B is defensible but simply refuses, without giving the stakeholder the information to decide. D preserves pilot integrity and is a genuinely good technique - and it still needs a labelled handwriting set, a baseline and threshold work that nobody has scoped or funded, so on its own it defers the cost conversation instead of holding it."},{"id":"pro3-59","scenario":"What has to be true to scale up","stem":"A pilot ends in three weeks and leadership will decide whether to roll out to 4,000 users. Which TWO criteria belong in the exit gate? (Select TWO.)","domain":"STAKE-COMM","difficulty":5,"choices":[{"label":"A","text":"Enthusiastic sponsorship from the pilot user group, evidenced by usage growth and a strong majority saying they would be disappointed to lose the tool."},{"label":"B","text":"Quality measured on the production input distribution against thresholds registered before the pilot began, including per-segment floors for known-critical cases."},{"label":"C","text":"A successful end-to-end demonstration to the executive steering committee using representative live cases chosen by the committee itself."},{"label":"D","text":"Demonstrated operational readiness: monitoring, alerting, a rehearsed rollback, an owner on call, and a cost ceiling with alerts."},{"label":"E","text":"Unit cost below the internal target, calculated by extrapolating observed pilot token consumption linearly to 4,000 users."}],"correct":["B","D"],"explanation":"A scale-up gate needs evidence that quality holds on real inputs against pre-registered thresholds (B) and that the organization can operate the thing at scale (D). A measures affection, which pilots with attentive support reliably generate. C is theatre with a sampling bias. E is necessary but insufficient on its own - a cost target met while quality fails is not a pass - and a pilot-to-scale extrapolation that assumes constant per-user consumption is unreliable in either direction, since pilot cohorts are self-selected and caching and contract tiering shift unit cost at volume."},{"id":"pro3-60","scenario":"Proving the tooling helped","stem":"After six months of AI-assisted development across 140 engineers, the CTO asks whether it was worth it. The available data: 74% suggestion acceptance rate, 31% more commits per engineer, and a satisfaction survey at 4.2 of 5. What should the architect report?","domain":"DEV-ENABLE","difficulty":5,"choices":[{"label":"A","text":"Report the three metrics as a positive result while noting they are proxies, and propose a controlled study for the next period to establish causality more firmly."},{"label":"B","text":"Report against delivery outcomes - change lead time, review latency, defect escape rate, incident rate - and state plainly that acceptance and commit counts measure activity, not value."},{"label":"C","text":"Report that the evidence is insufficient because no baseline was captured before rollout, and recommend instrumenting properly before making any claim about impact."},{"label":"D","text":"Report acceptance rate and satisfaction as the leading indicators and commit volume as the lagging one, since developer adoption is the precondition for any downstream benefit."}],"correct":"B","explanation":"Acceptance rate and commit count are activity metrics that rise when engineers produce more code, whether or not the organization ships better software faster - more commits with a higher defect escape rate is a loss. The reportable question is delivery outcome, and most of those metrics exist in the version control and incident systems already, historically. A dresses up the wrong metrics with a promise. C is too pessimistic given that historical delivery data is almost always available. D reinforces the confusion by ranking the activity metrics."},{"id":"pro3-61","scenario":"Two hundred engineers, two hundred configurations","stem":"Across 200 engineers, agent configurations have drifted: differing project instructions, ad-hoc hooks, personally installed MCP servers with production credentials, and inconsistent tool permissions. Two incidents were traced to an individual's local automation. What should the enablement team implement?","domain":"DEV-ENABLE","difficulty":5,"choices":[{"label":"A","text":"Publish a recommended configuration guide with a curated MCP server list and a quarterly compliance review of each team's setup against it."},{"label":"B","text":"Treat configuration as code: versioned in the repository, reviewed like any change, with org-level policy over permitted tools and credentials, and a golden baseline that CI verifies."},{"label":"C","text":"Lock configuration centrally and prohibit local customization, since an environment that can be modified per developer is an environment that cannot be audited or supported."},{"label":"D","text":"Require any MCP server touching production systems to be registered with the platform team and rotate its credentials monthly, leaving the rest of the configuration to developers."}],"correct":"B","explanation":"Configuration that shapes what an agent may do is production configuration: version it, review it, enforce the parts that carry risk at the org level, and let CI detect drift from the baseline. A relies on voluntary conformance discovered quarterly, which is how the drift arose. C kills the local adaptation that makes the tooling useful and drives it underground. D covers the highest-risk slice and leaves hooks and tool permissions - the local automation the stem attributes both incidents to - ungoverned."},{"id":"pro3-62","scenario":"03:10, checkout is failing","stem":"Checkout error rates are climbing at 03:10. The on-call engineer wants to use the AI assistant to diagnose and fix it. What configuration makes the assistant genuinely useful in this incident without making it a second incident?","domain":"DEV-ENABLE","difficulty":5,"choices":[{"label":"A","text":"Grant temporary write access to production for the duration of the incident with all actions logged for post-incident review, since a diagnosis it cannot act on wastes the minutes that matter most."},{"label":"B","text":"Read-only access to logs, metrics, traces and recent deploys, with the assistant required to produce ranked hypotheses and the evidence for each; mutating actions stay with the engineer."},{"label":"C","text":"Restrict it to the staging environment and have it reproduce the failure there before proposing anything, so no production access is required during the incident at all."},{"label":"D","text":"Let it propose commands that the engineer approves individually before execution, which keeps a human in the loop on every action while preserving the speed of automated remediation."}],"correct":"B","explanation":"At 03:10 the scarce resource is correct attribution, not typing speed: broad read access plus ranked hypotheses with the evidence for each is exactly what a tired engineer needs, and it keeps the mutation decision with the accountable human. A introduces an autonomous actor into a system already misbehaving. C is safe and too slow - the failure may not reproduce in staging at all. D governs how actions are executed but grants no access to logs, metrics or traces, so it never gives the engineer the attribution evidence the incident actually turns on; per-command approval is a useful control layered on top of B, not a substitute for it."},{"id":"pro3-63","scenario":"The review queue is the new bottleneck","stem":"AI-assisted development tripled pull request volume. Median PR size grew from 120 to 690 changed lines, review latency went from 4 hours to 2.3 days, and post-release defects rose 18%. Delivery throughput is flat. What should the architect change?","domain":"DEV-ENABLE","difficulty":5,"choices":[{"label":"A","text":"Add an AI reviewer that pre-screens every PR and posts findings before a human looks, which absorbs the volume increase using the same capability that created it. An AI reviewer also scales with the volume it is absorbing, needs no additional headcount, and can be tuned to the defect classes the 18% rise is made of."},{"label":"B","text":"Constrain what enters review: changes scoped to one reviewable unit of behaviour, a test that fails before the fix, and deterministic gates that must pass first - then measure review latency and defect escape rate as the tooling's real outcomes."},{"label":"C","text":"Increase review capacity by requiring every engineer to spend a fixed share of their week reviewing, and set a service-level target for first response on open PRs."},{"label":"D","text":"Introduce a change-size limit enforced in CI, with a linked design note required for any exception, forcing large changes to be decomposed before a reviewer ever sees them."}],"correct":"B","explanation":"Generation got cheap, so the constraint moved to verification: make changes cheaper to verify - smaller units, a failing test that proves the change was needed, automated gates ahead of human attention - and measure the outcomes that actually moved. A adds a non-deterministic verification layer without shrinking the 690-line changes or attaching any proof of correctness, so it can cut first-response latency while leaving the 18% defect rise untouched, and it invites reviewers to defer to it. C buys capacity and leaves both the change size and the rising defects intact. D bounds size but says nothing about correctness: split PRs of the same total size, with no failing test behind them, still escape defects at the same rate."}]},{"id":"ccar-p-fmt","title":"Professional Format Mock","code":"CCAR-P-MOCK-FMT","certification":"Claude Certified Architect - Professional","tag":"Professional · exam-day format","sheet":"SHEET P4","description":"The format-faithful paper: 63 items at exam-day difficulty using all three item formats the exam guide describes — multiple choice, multiple response, and scenario matching, where several scenarios are classified against one shared option set and an option may be used more than once.","durationMinutes":120,"passingScore":72,"totalQuestions":63,"sampling":null,"domains":{"SOL-ARCH":{"name":"Solution Design & Architecture","color":"#3B5FC0"},"MODEL-CTX":{"name":"Models, Prompting & Context Engineering","color":"#9E5509"},"INTEG":{"name":"Integration","color":"#0F7A6C"},"EVAL-OPT":{"name":"Evaluation, Testing & Optimization","color":"#7B52C9"},"GOV-RISK":{"name":"Governance, Safety & Risk Management","color":"#B4426B"},"STAKE-COMM":{"name":"Stakeholder Communication & Lifecycle","color":"#4C7A34"},"DEV-ENABLE":{"name":"Developer Productivity & Enablement","color":"#0E7490"}},"questions":[{"id":"pro4-1","scenario":"Invoice approval routing","stem":"A finance team wants Claude to process supplier invoices. Every invoice follows the same path: extract line items from the PDF, match them to a purchase order, check tolerances, and route to the right approver. The steps never vary and the tolerance rules are stable. Which architectural pattern fits best?","domain":"SOL-ARCH","difficulty":3,"choices":[{"label":"A","text":"A prompt-chained workflow with one call per step, validated between steps before the invoice moves on."},{"label":"B","text":"An autonomous agent with access to every finance tool, deciding its own path per invoice so it can handle whatever arrives."},{"label":"C","text":"A multi-agent system with an extraction agent, a matching agent and an approval agent negotiating the outcome between them."},{"label":"D","text":"One large prompt containing the extraction instructions, the tolerance rules and the full approver directory, answered in a single call."}],"correct":"A","explanation":"Known, invariant steps are the textbook case for a workflow: predictable cost, per-step validation, and an auditable trail. B and C pay planning or coordination overhead for a path that never changes. D removes the step boundaries where you would catch an extraction error before it reaches the approver."},{"id":"pro4-2","scenario":"Grant eligibility research","stem":"A research office needs Claude to answer whether a proposed project qualifies for funding. Some questions resolve with one policy lookup; others need eligibility checks across several schemes, a budget calculation, and follow-up lookups whose necessity only becomes clear from what the earlier ones returned. Which pattern fits?","domain":"SOL-ARCH","difficulty":3,"choices":[{"label":"A","text":"A fixed workflow with enough pre-defined steps to cover the paths seen most often, with the rest escalated."},{"label":"B","text":"An agent that plans, calls a tool, observes the result, and decides its next step until it can answer."},{"label":"C","text":"A router that classifies each question into one of six pre-built pipelines chosen at intake."},{"label":"D","text":"A batch process that runs every available eligibility check on every question and discards whatever the answer did not need."}],"correct":"B","explanation":"When the next step depends on what the last one revealed, the path cannot be enumerated in advance — that is what the plan-act-observe loop is for. A and C both require the paths to be known up front. D is wasteful and still cannot follow up on what an intermediate result exposes."},{"id":"pro4-3","scenario":"The 80-page tender in one prompt","stem":"One prompt asks Claude to read an 80-page tender, check it against 35 internal standards, score the opportunity, and draft a bid/no-bid note. Output is uneven: some standards are skipped and the scoring reasoning is thin. The wording has already been revised twice. What is the most effective next step?","domain":"SOL-ARCH","difficulty":3,"choices":[{"label":"A","text":"Move to the largest available model and raise the output token limit so there is room for a fuller answer."},{"label":"B","text":"Add several worked examples of good bid/no-bid notes to the existing prompt so the model can see the standard expected."},{"label":"C","text":"Decompose it into sequenced subtasks — extract, assess per standard group, score, then synthesize — passing structured output between them."},{"label":"D","text":"Require the model to work through the standards in a numbered list before writing the note, so nothing is skipped."}],"correct":"C","explanation":"Skipped items and shallow reasoning on a long multi-part task is a decomposition signal: each subtask needs focused context and a checkable intermediate output. A treats capacity as the problem when structure is. B supplies more guidance where the gap is coverage. D is a prompt tweak of the kind already tried twice."},{"id":"pro4-4","scenario":"Warranty claims with an ordered audit trail","stem":"A warranty solution uses four specialists: intake, parts validation, fraud screening, and settlement calculation. The business requires a complete ordered record of every decision, and no later specialist may run once an earlier one raises an exception. Which orchestration strategy satisfies both requirements?","domain":"SOL-ARCH","difficulty":3,"choices":[{"label":"A","text":"A shared workspace all four specialists watch, each contributing when it sees work it can do."},{"label":"B","text":"An orchestrator that invokes each specialist in sequence, records each outcome, and halts the chain on an exception."},{"label":"C","text":"Peer-to-peer handoffs in which each specialist decides which one to invoke next based on what it found."},{"label":"D","text":"All four in parallel, with a merge step that reconciles their outputs and drops any settlement where an exception was raised."}],"correct":"B","explanation":"Central sequencing gives you one place that owns ordering, one place that writes the audit record, and one place that can stop the chain. A and C make both ordering and halting emergent rather than guaranteed. D violates the requirement outright — the later work has already run by the time the merge sees the exception."},{"id":"pro4-5","scenario":"Nine candidate use cases","stem":"A sponsor wants to \"get AI into the business\" and asks the architect to pick the first project from nine ideas submitted by different departments. What should most strongly drive the choice?","domain":"SOL-ARCH","difficulty":2,"choices":[{"label":"A","text":"Whichever idea can be delivered fastest, so the programme builds momentum before enthusiasm fades."},{"label":"B","text":"The idea from the department with the most engaged stakeholders, since adoption is where most projects fail."},{"label":"C","text":"The idea that best demonstrates agentic capability, so the organization learns the hardest pattern first."},{"label":"D","text":"Measurable business value, weighed against the feasibility of data access and the level of risk."}],"correct":"D","explanation":"A first project has to prove value against a measure someone agreed in advance, and it has to be feasible — which is mostly a question of data access and acceptable risk. A optimizes for speed over evidence, B for politics, C for spectacle. Each can produce a delivered project nobody can show a return on."},{"id":"pro4-6","scenario":"Three months live, no correctness signal","stem":"A dispatch-classification service has run for three months. The team has latency, cost and error-rate dashboards, but no way to tell whether the classifications are actually right in production. Which architectural addition closes that gap most directly?","domain":"SOL-ARCH","difficulty":3,"choices":[{"label":"A","text":"An alert when daily token consumption departs from its trailing norm, which surfaces behaviour changes early."},{"label":"B","text":"A scheduled review of the system prompt to confirm the classification instructions still match current operations."},{"label":"C","text":"A feedback path: capture downstream corrections and route a sample of production output into a labelled eval set."},{"label":"D","text":"A more capable model, since classification accuracy generally rises with capability and the current one is the cheapest tier."}],"correct":"C","explanation":"The missing piece is the feedback stage of the loop — a correctness signal from production that accumulates into something measurable. A monitors spend, B monitors configuration, and D changes the system without ever measuring whether it improved."},{"id":"pro4-7","scenario":"A menu that changes daily","stem":"A restaurant group's menus, prices and allergen data change daily across 300 sites. The team wants Claude to answer customer questions from this data and is deciding how to give the model access. Which approach fits?","domain":"SOL-ARCH","difficulty":2,"choices":[{"label":"A","text":"Retrieve the relevant current records for each question, so answers track the daily updates without a redeploy."},{"label":"B","text":"Include the full menu set in every request's context so the model always has the complete picture to reason over."},{"label":"C","text":"Rely on the base model plus a disclaimer that prices and allergens should be confirmed with the site."},{"label":"D","text":"Bake the current menus into the deployment each morning as part of the release, refreshing them on the next release."}],"correct":"A","explanation":"Daily-changing factual data is the canonical retrieval case: the answer is always drawn from current records with no redeployment. B is expensive and dilutes context at 300 sites' worth of menus. C accepts wrong allergen answers, which is the one thing this domain cannot accept. D is stale within hours and couples content changes to releases."},{"id":"pro4-8","scenario":"One agent, three departments, adding a fourth","stem":"A single \"service desk agent\" answers HR, IT and facilities requests. It carries 30 tools and a 7,000-token prompt covering all three, and its tool-selection accuracy has fallen as capabilities were added. Stakeholders now want payroll added. What is the strongest recommendation?","domain":"SOL-ARCH","difficulty":3,"choices":[{"label":"A","text":"Add the payroll tools now to keep the roadmap, and schedule a prompt consolidation once the quarter's commitments are met."},{"label":"B","text":"Split into domain agents behind a router, each with a focused prompt and toolset, and add payroll as a new agent."},{"label":"C","text":"Keep one agent and expand the prompt so each department's rules are covered in more detail than the current summary allows."},{"label":"D","text":"Keep one agent but force a tool call on every request, so it stops answering department questions from general knowledge."}],"correct":"B","explanation":"Selection accuracy falling as breadth grows is the standard signal that one agent is carrying too wide a surface; domain agents behind a router restore focus and make payroll an addition rather than another increment of confusion. A compounds the problem, C makes the prompt harder to follow, and D misdiagnoses the failure as reluctance to use tools."},{"id":"pro4-9","scenario":"Workflow or agent","stem":"An architect is choosing between a fixed workflow and an autonomous agent for a new solution. Which TWO characteristics of the problem most strongly favour the workflow? (Select TWO.)","domain":"SOL-ARCH","difficulty":3,"choices":[{"label":"A","text":"The processing steps are known in advance and are the same for every request."},{"label":"B","text":"Inputs arrive in unpredictable formats that need to be interpreted case by case before anything else can happen."},{"label":"C","text":"The business needs each step to be individually auditable and reproducible."},{"label":"D","text":"The task rewards exploring several solution paths and comparing what each one turns up."},{"label":"E","text":"The team wants the system to recover by itself when a tool fails in a way nobody anticipated."}],"correct":["A","C"],"explanation":"Workflows win where the sequence is fixed (A) and where each step must be inspectable and repeatable (C). B, D and E are all arguments for autonomy: unpredictable inputs, exploratory work, and self-directed recovery are exactly what a fixed sequence cannot do."},{"id":"pro4-10","scenario":"Earning multi-agent complexity","stem":"A team is assessing whether a property-acquisition review justifies multiple agents rather than one augmented agent. Which TWO characteristics most strongly indicate multiple agents are warranted? (Select TWO.)","domain":"SOL-ARCH","difficulty":4,"choices":[{"label":"A","text":"Volume is forecast to triple, and the team expects agents to scale more economically than a single pipeline."},{"label":"B","text":"Distinct sub-reviews need different tools, sources and specialist context that would overload one agent's prompt."},{"label":"C","text":"Several sub-reviews are independent and can run at the same time to cut end-to-end duration."},{"label":"D","text":"The programme has budget for a more sophisticated architecture and stakeholders have asked to see one."},{"label":"E","text":"The team wants to build multi-agent experience before a larger programme starts next year."}],"correct":["B","C"],"explanation":"Multi-agent designs earn their coordination cost when the sub-tasks genuinely differ in tools and context (B) and when independence allows parallelism (C). A is a scaling concern any pattern can address — and agents cost more per task, not less. D and E are budget and career arguments, not properties of the problem."},{"id":"pro4-11","scenario":"Which value pillar does it serve","stem":"A programme has five approved initiatives. For each one, identify the business value pillar it primarily serves. An option may be used more than once.","domain":"SOL-ARCH","difficulty":3,"format":"match","options":["cost reduction","workforce productivity","business transformation","performance SLA"],"rows":[{"text":"Replacing a 40-person offshore data-entry contract with automated extraction, retiring the contract."},{"text":"Launching a self-serve product that lets customers do work the company previously sold as a consulting engagement."},{"text":"Cutting quote turnaround from four hours to under ninety seconds to meet a contractual response commitment."},{"text":"Giving each analyst a research assistant so the same team covers twice the deal flow without new hires."},{"text":"Moving nightly document enrichment onto batch processing with caching, halving the inference bill for identical output."}],"correct":["r0:o0","r1:o2","r2:o3","r3:o1","r4:o0"],"explanation":"Pillars are distinguished by what changes, not by how much value is claimed. Retiring a contract and halving an inference bill both remove spend (cost reduction). A new self-serve product changes what the business sells (transformation). A contractual turnaround target is a performance SLA. Doubling coverage with the same headcount is productivity — the cost base is unchanged, the output per person is not."},{"id":"pro4-12","scenario":"Six hundred thousand classifications a day","stem":"A moderation service classifies 600,000 short posts a day into nine categories. On the labelled test set, accuracy is within half a point across the model family, and the business is sensitive to both latency and unit cost. Which model strategy is most defensible?","domain":"MODEL-CTX","difficulty":3,"choices":[{"label":"A","text":"The most capable model, since a misclassification costs more in review time than the additional compute ever will."},{"label":"B","text":"The mid-tier model as a balanced default, which avoids having to defend either extreme to stakeholders."},{"label":"C","text":"The smallest model that meets the accuracy bar, with ongoing evaluation to confirm it still does."},{"label":"D","text":"Split traffic across two tiers and compare their outputs continuously, escalating whenever they disagree."}],"correct":"C","explanation":"When accuracy is equivalent, the defensible choice at this volume is the cheapest model that clears the bar — provided you keep measuring, because the input distribution moves. A substitutes assumption for the measurement already in hand. B picks a tier to avoid an argument. D pays for two models on every post to detect a disagreement the test set says is rare."},{"id":"pro4-13","scenario":"Caching that never hits","stem":"An application puts the session ID and a request timestamp at the very top of its system prompt, followed by 9,000 tokens of static policy, then the user's message. Prompt caching is enabled and the hit rate is approximately zero. What is the most likely cause?","domain":"MODEL-CTX","difficulty":3,"choices":[{"label":"A","text":"The volatile values sit at the front, so the prefix differs on every request and nothing can match."},{"label":"B","text":"The policy block exceeds the size at which a prefix remains eligible for caching, so it is skipped."},{"label":"C","text":"Caching applies to the tools and system blocks only, and this application puts its policy in a user message."},{"label":"D","text":"Entries are being evicted before reuse because the application's request rate is too low to keep them warm."}],"correct":"A","explanation":"Caching is a prefix match, so a session ID and timestamp at position zero make every request unique. Moving volatile content after the static block restores it. B inverts the rule — long stable prefixes are what caching is for. C misstates where caching applies. D would reduce the hit rate, not zero it."},{"id":"pro4-14","scenario":"Step-by-step reasoning everywhere","stem":"A team enabled step-by-step reasoning across every endpoint on their platform. A contract-comparison feature improved materially. A postcode-extraction endpoint is now three times slower and more expensive with no measurable accuracy change. What should the architect conclude?","domain":"MODEL-CTX","difficulty":3,"choices":[{"label":"A","text":"The extraction endpoint needs a longer reasoning scaffold before the benefit becomes visible in its metrics."},{"label":"B","text":"Reasoning depth should be set per task on measured benefit, not applied uniformly across endpoints."},{"label":"C","text":"Reasoning should be removed platform-wide, since the token cost is real everywhere and the benefit was found in one feature."},{"label":"D","text":"The extraction endpoint is on too small a model to benefit, and should be moved up a tier to see the same gain."}],"correct":"B","explanation":"Reasoning depth pays on multi-step problems and costs without returning on single-field extraction, so it is a per-task setting. A adds more of what is already not helping. C throws away the gain the contract feature demonstrated. D changes the model to rescue a technique the task does not need."},{"id":"pro4-15","scenario":"The rule in the middle","stem":"A system prompt carries a hard rule — never quote unpublished pricing — in the middle of 12,000 tokens of product reference material. The rule is followed inconsistently, and rewording it has not helped. Which change is most likely to improve adherence?","domain":"MODEL-CTX","difficulty":3,"choices":[{"label":"A","text":"Repeat the rule after each section of reference material so it is never far from whatever the model is reading."},{"label":"B","text":"Put the rule in capitals and mark it as critical, so its priority relative to the surrounding material is unambiguous."},{"label":"C","text":"Move the rule to the start or end of the prompt and separate rules from reference content structurally."},{"label":"D","text":"Split the reference material across two calls so neither one is long enough for the rule to be lost in the middle."}],"correct":"C","explanation":"Position and structure are the levers: instructions buried mid-context in a long payload are attended to least, and mixing directives into reference material blurs which is which. A bloats the prompt and still leaves rules interleaved with data. B is typography. D doubles the cost and leaves the rule inside reference text in both halves."},{"id":"pro4-16","scenario":"House style, described but not shown","stem":"A board-pack generator must produce a precise house format: fixed section order, defined headings, and tables laid out a particular way. Written instructions describing the format produce output that is close but inconsistent. What is the most effective next refinement?","domain":"MODEL-CTX","difficulty":4,"choices":[{"label":"A","text":"Add one or two complete, correctly formatted example outputs to the prompt."},{"label":"B","text":"Raise the output token limit so the model has room to complete the full format without truncating a section."},{"label":"C","text":"Generate each section in its own request and concatenate the results, so no single call has to hold the whole format."},{"label":"D","text":"Constrain the output structure directly with a schema, and use an example to convey the prose conventions a schema cannot express."}],"correct":"D","explanation":"Section order, heading names and table shape are structure, and structure is best enforced rather than described — a schema makes a malformed pack impossible, and an exemplar carries the stylistic conventions that a schema has no way to state. A alone is the standard next step and is a real improvement, but it leaves the format probabilistic when it could be guaranteed. B misreads inconsistency as truncation. C trades one format problem for a stitching problem."},{"id":"pro4-17","scenario":"Two hundred thousand tokens of standards","stem":"An engineering assistant answers questions over a 200,000-token library of internal standards by placing the whole library in context on every request. Answers drawing on material from the middle of the library are noticeably less reliable, and cost per request is high. Which strategy addresses both?","domain":"MODEL-CTX","difficulty":3,"choices":[{"label":"A","text":"Move the user's question above the library so the model reads the task before the material it has to search."},{"label":"B","text":"Retrieve only the sections relevant to each question and place those in context, next to the question."},{"label":"C","text":"Strip headings, whitespace and boilerplate from the library so the same content fits in materially fewer tokens."},{"label":"D","text":"Ask the model to read the library once to index it and again to answer, so mid-library material gets a second pass."}],"correct":"B","explanation":"Retrieval fixes both symptoms at once: less input means lower cost, and the decisive passages end up next to the question rather than buried mid-payload. A helps marginally and leaves 200,000 tokens in every request. C saves tokens without improving relevance. D doubles the cost to work around a limitation rather than removing it."},{"id":"pro4-18","scenario":"Cutting cost without cutting capability","stem":"A high-volume application has a large, mostly static prompt and rising per-request cost. Which TWO techniques most directly reduce cost while preserving capability? (Select TWO.)","domain":"MODEL-CTX","difficulty":3,"choices":[{"label":"A","text":"Structure the prompt so the static portion forms a stable prefix, and cache it."},{"label":"B","text":"Raise the output token limit so fewer requests need a follow-up call to finish their answer."},{"label":"C","text":"Load specialised instructions on demand instead of sending every instruction on every request."},{"label":"D","text":"Add more few-shot examples so the model succeeds first time and the retry rate falls."},{"label":"E","text":"Move the static content out of the system block and into the user message, which is billed at the same rate either way."}],"correct":["A","C"],"explanation":"Caching a stable prefix (A) and loading instructions only when relevant (C) both reduce what you pay for on a typical request without removing capability. B changes where a response ends. D adds tokens to every request in the hope of avoiding some retries. E moves content between blocks without changing what is billed."},{"id":"pro4-19","scenario":"Which technique fits the need","stem":"For each situation, identify the context-engineering technique that addresses it most directly. An option may be used more than once.","domain":"MODEL-CTX","difficulty":4,"format":"match","options":["prompt caching","retrieval","few-shot examples","progressive disclosure"],"rows":[{"text":"A 30k-token instruction block is identical on every request and traffic is continuous, but it is billed in full each time."},{"text":"Output is semantically right but its formatting drifts from the house pattern, which prose instructions describe but do not pin down."},{"text":"Answers must reflect a policy library that Compliance revises weekly, and only a few clauses matter per question."},{"text":"An agent has 240 tools available but any given request needs three or four, and the definitions alone fill 70k tokens."},{"text":"Twelve product playbooks exist; each conversation concerns one product, and loading all twelve degrades answer quality."}],"correct":["r0:o0","r1:o2","r2:o1","r3:o3","r4:o3"],"explanation":"Match the technique to what is actually wrong. Repeated identical content that is being re-billed is a caching problem. Format that drifts needs demonstration, not description. Content that changes weekly and is needed selectively is retrieval. A large catalogue of which each request needs a fraction — tools or playbooks alike — is what progressive disclosure exists for, which is why that option applies twice."},{"id":"pro4-20","scenario":"Fourteen systems, many owners","stem":"An insurer is connecting Claude to fourteen internal systems owned by different teams. Tools will be added and retired often, and four AI applications across the company need the same connections. Which integration approach fits these requirements best?","domain":"INTEG","difficulty":3,"choices":[{"label":"A","text":"Hard-code each system's REST calls into each application's own tool definitions, which keeps every application self-contained and independently deployable."},{"label":"B","text":"Expose each system as an MCP server that any application can connect to and each owning team can update."},{"label":"C","text":"Build one middleware service that wraps all fourteen systems behind a single internal endpoint the applications call."},{"label":"D","text":"Give Claude read access to each system's database directly, avoiding the API layer and the maintenance it carries."}],"correct":"B","explanation":"Many owners, frequent change, and reuse across applications is the case MCP is designed for: the owning team publishes the surface once and every client discovers it. A multiplies the same integration by four and re-does it on every change. C creates a single team as a bottleneck for fourteen systems' changes. D couples the assistant to schemas and discards the access control the APIs enforce."},{"id":"pro4-21","scenario":"Fifty tools, a third never used","stem":"An operations agent has grown to 50 registered tools across six business areas. Tool-selection accuracy has fallen, latency is up, and analysis shows a third of the tools have never been invoked in production. What should the architect do first?","domain":"INTEG","difficulty":3,"choices":[{"label":"A","text":"Write fuller descriptions for all 50 tools so the model can distinguish between them more reliably than the current one-liners allow."},{"label":"B","text":"Move to a more capable model, which handles a larger tool catalogue with better selection accuracy."},{"label":"C","text":"Audit the catalogue: remove unused and overlapping tools, then load definitions on demand."},{"label":"D","text":"Require the agent to enumerate the candidate tools and justify its choice before each call, which makes selection errors visible in the trace."}],"correct":"C","explanation":"A third of the catalogue is dead weight, so removal is free accuracy — then on-demand loading keeps the live surface small per request. A makes the prefix longer while leaving 17 unused tools competing for attention. B buys capability to carry avoidable confusion. D adds tokens and latency to every call and surfaces the error rather than reducing it."},{"id":"pro4-22","scenario":"One service account, a prompt-level rule","stem":"An assistant queries the HR system on behalf of employees. It authenticates with a single service account holding organization-wide read access, and the system prompt instructs the model to return only the requesting employee's data. A security review flags the design. What is the core problem?","domain":"INTEG","difficulty":3,"choices":[{"label":"A","text":"Service accounts are unsuitable for AI systems under most compliance frameworks, which require per-user credentials for any personal-data access."},{"label":"B","text":"The account should also hold write access so that access decisions and their outcomes appear in one complete audit trail."},{"label":"C","text":"Authorization is enforced by prompt instruction rather than by the access-control layer, so any prompt failure or injection exposes every employee's data."},{"label":"D","text":"The model should authenticate as the employee using their own credentials, so the HR system sees the real principal on every request."}],"correct":"C","explanation":"A probabilistic instruction is standing in for an access-control decision, and the blast radius is the whole organization's HR data. A invents a blanket prohibition. B widens the privilege it should be narrowing. D has the right instinct — propagate identity — but collecting employee credentials is the wrong mechanism; delegated tokens are."},{"id":"pro4-23","scenario":"Clauses without their definitions","stem":"A RAG system over commercial leases uses fixed 300-token chunks. Retrieval often returns clause fragments whose meaning depends on defined terms and cross-references elsewhere in the document, and answer quality suffers. Which change addresses this most directly?","domain":"INTEG","difficulty":3,"choices":[{"label":"A","text":"Cut chunk size to 120 tokens so each retrieved unit is more precisely targeted at the clause being asked about."},{"label":"B","text":"Raise the number of retrieved chunks from 5 to 40 so the definitions and cross-referenced text are probably somewhere in the set."},{"label":"C","text":"Chunk on clause and section boundaries, carrying resolved definitions and cross-references as metadata."},{"label":"D","text":"Replace embedding retrieval with a keyword index over clause headings, which is how lawyers navigate a lease in practice."}],"correct":"C","explanation":"The retrieval unit should be the unit of meaning, and for a lease that is the clause plus whatever it depends on — which has to be resolved at index time because it lives pages away. A makes fragments smaller. B floods the context and still has no guarantee. D discards semantic search for a heading index that cannot answer a question phrased in the tenant's words."},{"id":"pro4-24","scenario":"Exact part numbers, fuzzy results","stem":"A spares assistant uses pure vector retrieval. Natural-language queries work well, but searches for exact part numbers such as \"HX-4471-C\" frequently return similar-looking but wrong parts. Which retrieval strategy resolves this best?","domain":"INTEG","difficulty":3,"choices":[{"label":"A","text":"Hybrid retrieval combining exact and lexical matching with semantic search, weighted by query type."},{"label":"B","text":"Replace semantic retrieval with keyword search over the whole catalogue, since identifiers are what the assistant is most often asked about."},{"label":"C","text":"Move to a larger embedding model so that closely related part numbers occupy more distinct positions in the vector space."},{"label":"D","text":"Guide users to describe the part in words rather than by number, and treat identifier lookups as a separate catalogue feature."}],"correct":"A","explanation":"Identifiers need literal matching and prose needs semantics, so the system needs both with the balance set by the query. B fixes identifiers and breaks the natural-language case that already works. C asks embeddings to preserve character-level distinctions they compress by design. D changes user behaviour to suit the index."},{"id":"pro4-25","scenario":"Re-ranking against a 3-second SLA","stem":"Adding a re-ranking stage to a support assistant lifts answer accuracy from 85% to 92% and adds 450ms. The contractual SLA is a 3-second response; current p95 is 1.6 seconds and p99 is 2.1. How should the architect reason about the trade-off?","domain":"INTEG","difficulty":3,"choices":[{"label":"A","text":"Adopt it only for queries outside the SLA's scope, keeping the contracted path at its current latency profile."},{"label":"B","text":"Adopt re-ranking: a 7-point accuracy gain is material and the tail still lands inside the SLA with headroom."},{"label":"C","text":"Reject it, since added latency in a customer-facing path is a regression regardless of what accuracy does."},{"label":"D","text":"Defer until the SLA is renegotiated to a longer window, then adopt re-ranking with more comfortable margin."}],"correct":"B","explanation":"The numbers decide it: p99 moves from 2.1s to roughly 2.55s against a 3-second commitment, and seven points of accuracy is worth 450ms. A splits the product into two quality tiers to protect a budget that was never at risk. C treats latency as lexically prior to correctness. D renegotiates a contract that does not need renegotiating."},{"id":"pro4-26","scenario":"Logging everything, finding nothing","stem":"A platform runs tens of thousands of agent sessions a day. Engineers log every full prompt, response and tool payload; the bill is significant and failures are still hard to locate. Which observability strategy is more appropriate at this scale?","domain":"INTEG","difficulty":3,"choices":[{"label":"A","text":"Log only each session's final response, which is what users actually experience and a fraction of the volume."},{"label":"B","text":"Structured traces with correlation IDs and per-step metrics, with full payloads sampled and captured on error."},{"label":"C","text":"Turn logging off in production and reproduce reported failures in staging, where full capture costs nothing."},{"label":"D","text":"Keep full capture but shorten retention to 48 hours, which cuts the storage bill without losing any detail while it matters."}],"correct":"B","explanation":"Findability comes from structure — a trace you can walk step by step — not from volume; full payloads then matter only where something went wrong. A discards the intermediate steps where the fault actually is. C cannot reproduce a failure whose inputs were never recorded. D reduces the bill and leaves the needle in the same haystack."},{"id":"pro4-27","scenario":"Procurement and haulage, across a boundary","stem":"A manufacturer's procurement agent must agree delivery windows with a haulier's independently operated scheduling agent, several times an hour. Neither company will expose internal tools or systems to the other. Which connection approach fits best?","domain":"INTEG","difficulty":3,"choices":[{"label":"A","text":"Register the haulier's internal scheduling tools in the procurement agent's own catalogue so it can call them when it needs a slot."},{"label":"B","text":"Agent-to-agent exchange over an agreed protocol boundary, each agent mediating access to its own systems."},{"label":"C","text":"Give each agent read access to the other's scheduling database, which removes a negotiation round trip per booking."},{"label":"D","text":"Replace both with one agent operated by a neutral third party that holds credentials for both companies' systems."}],"correct":"B","explanation":"Across an organizational boundary each side keeps its own systems behind its own agent and they interoperate through
