<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Claude Certified Architect — Offline Exam Suite</title>
<style>
/* ============================================================
   CCA Offline Exams — "The Answer Sheet" design system
   The visual world of standardized testing: the machine-scored
   bubble sheet, the No. 2 pencil, the exam booklet, the proctor's
   stamp. Fully offline: system-font stacks only, no external assets.
   Light default + dark via prefers-color-scheme and [data-theme].
   ============================================================ */

:root {
  /* Booklet chrome (deep proctor green) — keeps legacy var names
     used by inline styles in the runtime */
  --blueprint:   #14453A;
  --blueprint-2: #1D5C4C;
  --blueprint-line: rgba(255,255,255,.12);

  /* Reading surfaces */
  --paper:  #EAF1EB;   /* scantron security tint surround */
  --card:   #FDFDF9;   /* the answer sheet */
  --ink:    #26221C;   /* graphite — pencil lead */
  --ink-2:  #5C564C;   /* softer graphite */
  --ink-3:  #928C7F;   /* faint form annotations */
  --hair:   #D8DCD2;   /* hairline rules */
  --hair-2: #EDF0E8;

  /* Single bold accent — the No. 2 pencil */
  --signal:    #D9A400;
  --signal-ink:#201700;

  /* Semantics — proctor green / grader red */
  --ok:   #1E7A52;
  --ok-bg:#E5F2E9;
  --bad:  #C0392B;
  --bad-bg:#F9E9E6;

  /* Domain hues — tuned for AA on white (informational only;
     actual values ship inline from the build script) */
  --d-agent:   #3B5FC0;
  --d-tool:    #0F7A6C;
  --d-code:    #7B52C9;
  --d-prompt:  #9E5509;
  --d-context: #B4426B;

  /* Type */
  --serif: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", ui-serif, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Code", "SF Mono", "JetBrains Mono", Consolas, "Liberation Mono", monospace;

  --grid: 8px;
  --radius: 3px;
  --shadow: 0 1px 2px rgba(38,34,28,.07), 0 10px 26px rgba(38,34,28,.07);
  --maxw: 1100px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --paper:  #0E1613;
    --card:   #16211B;
    --ink:    #E9EFE7;
    --ink-2:  #A8B5AA;
    --ink-3:  #6F7D72;
    --hair:   #2A382F;
    --hair-2: #1D2A23;
    --blueprint:   #0B1F1A;
    --blueprint-2: #14382C;
    --ok:   #4CC08A;
    --ok-bg:#14291E;
    --bad:  #E0705E;
    --bad-bg:#2E1713;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 12px 34px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"] {
  --paper:#0E1613; --card:#16211B; --ink:#E9EFE7; --ink-2:#A8B5AA; --ink-3:#6F7D72;
  --hair:#2A382F; --hair-2:#1D2A23; --blueprint:#0B1F1A; --blueprint-2:#14382C;
  --ok:#4CC08A; --ok-bg:#14291E; --bad:#E0705E; --bad-bg:#2E1713;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 34px rgba(0,0,0,.5);
}
:root[data-theme="light"] {
  --paper:#EAF1EB; --card:#FDFDF9; --ink:#26221C; --ink-2:#5C564C; --ink-3:#928C7F;
  --hair:#D8DCD2; --hair-2:#EDF0E8; --blueprint:#14453A; --blueprint-2:#1D5C4C;
  --ok:#1E7A52; --ok-bg:#E5F2E9; --bad:#C0392B; --bad-bg:#F9E9E6;
  --shadow:0 1px 2px rgba(38,34,28,.07),0 10px 26px rgba(38,34,28,.07);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: var(--sans);
  color: var(--ink);
  background: var(--paper);
  line-height: 1.55;
  /* faint field of unfilled bubbles on the surround */
  background-image: radial-gradient(circle 2.5px, var(--hair) 2px, transparent 2.5px);
  background-size: 26px 26px;
}
h1,h2,h3 { margin: 0; line-height: 1.15; letter-spacing: -.005em; }
p { margin: 0; }
a { color: inherit; }
button { font-family: inherit; }

.wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 20px; }

/* ---- Mono utility annotations ---- */
.mono { font-family: var(--mono); }
.eyebrow {
  font-family: var(--mono);
  font-size: 11px; letter-spacing: .22em; text-transform: uppercase;
  color: var(--ink-3);
}

/* ---- Timing marks — the black dashes on a scantron's edge ---- */
.timing-edge::before {
  content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 5px;
  background: repeating-linear-gradient(180deg,
    var(--ink) 0 7px, transparent 7px 16px);
  opacity: .22; pointer-events: none;
}

/* ============================================================
   TITLE BLOCK — form-header cells (used by index.html hub)
   ============================================================ */
.titleblock {
  border: 1px solid var(--blueprint-line);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  font-family: var(--mono);
  font-size: 11px;
  color: rgba(255,255,255,.72);
}
.titleblock .cell { padding: 8px 10px; border-right: 1px solid var(--blueprint-line); border-top: 1px solid var(--blueprint-line); }
.titleblock .cell:nth-child(3n) { border-right: 0; }
.titleblock .k { letter-spacing: .18em; text-transform: uppercase; font-size: 9.5px; color: rgba(255,255,255,.45); display:block; margin-bottom: 2px; }
.titleblock .v { color: #fff; letter-spacing: .04em; }

/* ============================================================
   TOP BAR — the sealed booklet cover strip
   ============================================================ */
.topbar {
  background: linear-gradient(165deg, var(--blueprint), var(--blueprint-2));
  color: #fff;
  border-bottom: 3px solid var(--signal);
}
.topbar .wrap { display: flex; align-items: center; gap: 16px; min-height: 60px; }
.brandmark {
  font-family: var(--mono); font-weight: 600; letter-spacing: .04em;
  display:flex; align-items:center; gap:10px; text-decoration:none; color:#fff;
}
.brandmark .glyph {
  width: 26px; height: 26px; border: 2px solid var(--signal); border-radius: 50%;
  display:grid; place-items:center; color: var(--signal); font-size: 12px; font-weight:700;
}
.topbar .spacer { flex: 1; }
.themebtn {
  background: rgba(255,255,255,.08); color:#fff; border:1px solid var(--blueprint-line);
  border-radius: var(--radius); padding: 7px 11px; cursor: pointer; font-size: 13px;
  font-family: var(--mono); letter-spacing:.04em;
}
.themebtn:hover { background: rgba(255,255,255,.16); }

/* ============================================================
   HUB — the exam-booklet cover
   ============================================================ */
.hero {
  background: linear-gradient(165deg, var(--blueprint), var(--blueprint-2));
  color:#fff; position: relative; overflow: hidden;
}
/* timing marks running along the cover's bottom edge */
.hero::after {
  content:""; position:absolute; left:0; right:0; bottom:0; height:6px;
  background: repeating-linear-gradient(90deg, rgba(255,255,255,.55) 0 8px, transparent 8px 20px);
  opacity:.35; pointer-events:none;
}
.hero .wrap { position: relative; padding: 56px 20px 48px; }
.hero .kicker { color: var(--signal); font-family: var(--mono); letter-spacing:.26em; text-transform:uppercase; font-size:12px; }
.hero h1 {
  font-family: var(--serif); font-size: clamp(32px, 5vw, 54px); font-weight: 700;
  margin: 14px 0 12px; max-width: 18ch; letter-spacing: 0;
}
.hero .lede { color: rgba(255,255,255,.85); max-width: 58ch; font-size: 17px; }
.hero .titleblock { margin-top: 30px; max-width: 620px; }

.section { padding: 40px 0 60px; }
.section > .wrap > .eyebrow, .section > .eyebrow { margin-bottom: 6px; }
.section h2 { font-family: var(--serif); font-size: 24px; font-weight: 700; margin-bottom: 20px; }

.exam-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }

.exam-card {
  background: var(--card); border: 1px solid var(--hair); border-radius: var(--radius);
  box-shadow: var(--shadow); text-decoration: none; color: inherit;
  display: flex; flex-direction: column; overflow: hidden;
  font: inherit; text-align: left; width: 100%; cursor: pointer;
  border-top: 3px solid var(--blueprint);
  transition: transform .14s ease, box-shadow .14s ease, border-color .14s ease;
}
.exam-card:hover { transform: translateY(-3px); box-shadow: 0 6px 14px rgba(38,34,28,.10), 0 20px 44px rgba(38,34,28,.13); border-color: var(--signal); border-top-color: var(--signal); }
.exam-card:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }
.exam-card .head { padding: 18px 18px 14px; border-bottom: 1px dashed var(--hair); position: relative; }
.exam-card .head .tag { padding-right: 72px; }  /* clear the absolutely-positioned sheet label */
.exam-card .rev { position:absolute; top:14px; right:16px; font-family: var(--mono); font-size:10px; letter-spacing:.14em; color: var(--ink-3); }
.exam-card h3 { font-family: var(--serif); font-size: 21px; font-weight: 700; }
.exam-card .tag { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ok); font-weight:600; }
.exam-card .desc { padding: 14px 18px; color: var(--ink-2); font-size: 14px; flex: 1; }
.exam-card .meta { display:flex; gap: 18px; padding: 0 18px 14px; font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
.exam-card .meta b { color: var(--ink); font-weight: 700; }
.exam-card .foot {
  display:flex; align-items:center; justify-content: space-between;
  padding: 12px 18px; background: var(--hair-2); border-top: 1px solid var(--hair);
  font-family: var(--mono); font-size: 12px;
}
.exam-card .best { color: var(--ink-2); }
.exam-card .best b { font-size: 15px; }
.exam-card .best.pass b { color: var(--ok); }
.exam-card .best.fail b { color: var(--bad); }
.exam-card .go { color: var(--signal-ink); background: var(--signal); padding: 2px 9px; border-radius: 100px; font-weight: 700; letter-spacing:.06em; }

.legend { display:flex; flex-wrap:wrap; gap: 14px 22px; margin-top: 8px; }
.legend .item { display:flex; align-items:center; gap: 8px; font-size: 13px; color: var(--ink-2); }
.legend .swatch { width: 13px; height: 13px; border-radius: 50%; }

/* ============================================================
   EXAM RUNTIME
   ============================================================ */
.stage { padding: 26px 0 90px; }

/* --- Start / mode selection --- */
.startcard {
  background: var(--card); border: 1px solid var(--hair); border-radius: var(--radius);
  box-shadow: var(--shadow); max-width: 760px; margin: 10px auto; overflow: hidden;
}
.startcard .banner { background: linear-gradient(165deg, var(--blueprint), var(--blueprint-2)); color:#fff; padding: 26px 28px; position: relative; }
.startcard .banner::after {
  content:""; position:absolute; left:0; right:0; bottom:0; height:5px;
  background: repeating-linear-gradient(90deg, rgba(255,255,255,.5) 0 7px, transparent 7px 18px);
  opacity:.35; pointer-events:none;
}
.startcard .banner .kicker { color: var(--signal); font-family:var(--mono); letter-spacing:.22em; text-transform:uppercase; font-size:11px; }
.startcard .banner h1 { font-family: var(--serif); font-size: 31px; font-weight: 700; margin-top: 8px; }
.startcard .banner .sub { color: rgba(255,255,255,.82); margin-top:6px; font-size: 15px; }
.startback { background: rgba(255,255,255,.1); border: 1px solid var(--blueprint-line); color:#fff; font-family: var(--mono); font-size: 12px; letter-spacing:.04em; padding: 6px 12px; border-radius: var(--radius); cursor: pointer; margin-bottom: 14px; }
.startback:hover { background: rgba(255,255,255,.2); }
.startcard .body { padding: 24px 28px 28px; }
.startcard .facts { display:flex; flex-wrap:wrap; gap: 20px; font-family:var(--mono); font-size:13px; color: var(--ink-2); margin-bottom: 22px; }
.startcard .facts b { color: var(--ink); }

.modechoice { display:grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 620px){ .modechoice { grid-template-columns: 1fr; } }
.modeopt {
  text-align:left; background: var(--card); border: 1.5px solid var(--hair); border-radius: var(--radius);
  padding: 18px; cursor: pointer; transition: border-color .14s, background .14s, transform .1s;
}
.modeopt:hover { border-color: var(--ink); background: color-mix(in srgb, var(--ink) 3%, var(--card)); }
.modeopt:active { transform: scale(.99); }
.modeopt .mt { font-weight: 750; font-size: 17px; display:flex; align-items:center; gap:9px; }
.modeopt .mt .ic { font-family:var(--mono); color: var(--signal); }
.modeopt .md { color: var(--ink-2); font-size: 13.5px; margin-top: 6px; }
.modeopt:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }

.resume-banner {
  background: var(--ok-bg); border: 1px solid var(--ok); border-radius: var(--radius);
  padding: 14px 16px; margin-bottom: 20px; display:flex; align-items:center; gap: 14px; flex-wrap:wrap;
}
.resume-banner .rt { font-size: 14px; }
.resume-banner .rt b { display:block; }

/* --- Running layout: question booklet + answer sheet --- */
.runner { display: grid; grid-template-columns: 1fr 296px; gap: 22px; align-items: start; }
@media (max-width: 940px){ .runner { grid-template-columns: 1fr; } }

.qcard { background: var(--card); border: 1px solid var(--hair); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.qcard .qhead { display:flex; align-items:center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--hair); flex-wrap: wrap; background: var(--hair-2); }
.qnum { font-family: var(--mono); font-weight: 700; font-size: 15px; }
.qnum .of { color: var(--ink-3); font-weight: 500; }
.chip {
  font-family: var(--mono); font-size: 11px; letter-spacing:.08em; text-transform: uppercase;
  padding: 3px 9px; border-radius: 100px; font-weight: 700; color:#fff; white-space: nowrap;
}
.chip.ghost { background: transparent; color: var(--ink-2); border: 1px solid var(--hair); }
.diff { font-family:var(--mono); font-size:12px; color: var(--ink-3); letter-spacing:.1em; }
.qhead .push { flex: 1; }
.flagbtn { background: var(--card); border: 1px solid var(--hair); border-radius: var(--radius); padding: 6px 11px; cursor:pointer; font-size:12px; font-family: var(--mono); color: var(--ink-2); }
.flagbtn.on { background: var(--signal); border-color: var(--signal); color: var(--signal-ink); font-weight:700; }

.qbody { padding: 22px 24px 26px; }
.scenario { font-family:var(--mono); font-size: 11px; letter-spacing:.16em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 10px; }
.stem { font-family: var(--serif); font-size: 19px; line-height: 1.55; font-weight: 400; margin-bottom: 22px; }

/* multi-response instruction — printed form directive */
.multinote {
  font-family: var(--mono); font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--signal-ink); background: var(--signal);
  display: inline-block; padding: 3px 10px; border-radius: 100px; font-weight: 700;
  margin-bottom: 12px;
}

/* --- The signature: OMR bubble rows.
       Selecting an answer fills the bubble with graphite. --- */
.choices { display: grid; gap: 10px; }
.choice {
  display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: start;
  text-align: left; width: 100%;
  background: var(--card); border: 1.5px solid var(--hair); border-radius: var(--radius);
  padding: 14px 16px; cursor: pointer; color: var(--ink); font-size: 15.5px; line-height: 1.45;
  transition: border-color .12s, background .12s;
}
.choice:hover:not(:disabled) { border-color: var(--ink-2); }
.choice:hover:not(:disabled) .letter { border-color: var(--ink-2); color: var(--ink); }
.choice:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }
.choice .letter {
  width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--ink-3);
  display:grid; place-items:center; font-family: var(--mono); font-weight: 700; font-size: 13px; color: var(--ink-2);
  transition: background .12s, border-color .12s, color .12s;
}
.choice.selected { border-color: var(--ink); background: color-mix(in srgb, var(--ink) 5%, var(--card)); }
.choice.selected .letter {
  border-color: var(--ink); color: var(--card);
  /* graphite shading — slightly uneven, like pencil fill */
  background: radial-gradient(circle at 38% 32%,
    color-mix(in srgb, var(--ink) 78%, var(--card)), var(--ink) 72%);
}
.choice.correct { border-color: var(--ok); background: var(--ok-bg); }
.choice.correct .letter { border-color: var(--ok); background: var(--ok); color: var(--card); }
.choice.incorrect { border-color: var(--bad); background: var(--bad-bg); }
.choice.incorrect .letter { border-color: var(--bad); background: var(--bad); color: var(--card); }
.choice:disabled { cursor: default; }
.choice .verdict { font-family:var(--mono); font-size: 11px; letter-spacing:.1em; text-transform:uppercase; margin-left:auto; align-self:center; font-weight:700; white-space: nowrap; }
.choice.correct .verdict { color: var(--ok); }
.choice.incorrect .verdict { color: var(--bad); }

/* --- Scenario matching: a classification grid, like the ruled boxes on the
       back of an answer sheet. One shared option set, reusable per row. --- */
.matchrows { display: grid; gap: 10px; }
.matchrow {
  display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: center;
  background: var(--card); border: 1.5px solid var(--hair); border-radius: var(--radius);
  padding: 12px 16px; color: var(--ink); font-size: 15px; line-height: 1.45;
}
.matchrow .mtext { min-width: 0; }
.matchrow .matchsel {
  font-family: var(--mono); font-size: 12.5px; color: var(--ink);
  background: var(--hair-2); border: 1.5px solid var(--ink-3); border-radius: 6px;
  padding: 7px 9px; max-width: 240px;
}
.matchrow .matchsel:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }
.matchrow .matchsel:disabled { opacity: .85; cursor: default; }
.matchrow .mans {
  font-family: var(--mono); font-size: 12px; letter-spacing: .04em;
  border: 1.5px dashed var(--ink-3); border-radius: 6px; padding: 6px 9px; color: var(--ink-2);
}
.matchrow .verdict {
  font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
  font-weight: 700; white-space: nowrap;
}
.matchrow.correct { border-color: var(--ok); background: var(--ok-bg); }
.matchrow.correct .verdict { color: var(--ok); }
.matchrow.incorrect { border-color: var(--bad); background: var(--bad-bg); }
.matchrow.incorrect .verdict { color: var(--bad); }
@media (max-width: 640px) {
  .matchrow { grid-template-columns: 1fr; }
  .matchrow .matchsel { max-width: none; }
}

.explain {
  margin-top: 18px; border-left: 3px solid var(--bad); background: var(--hair-2);
  padding: 14px 16px; border-radius: 0 var(--radius) var(--radius) 0; font-size: 14.5px; color: var(--ink);
}
.explain .lab { font-family:var(--mono); font-size: 11px; letter-spacing:.16em; text-transform: uppercase; color: var(--bad); display:block; margin-bottom: 6px; }
.explain.hidden { display: none; }

.qnav-actions { display:flex; align-items:center; gap: 10px; padding: 16px 24px; border-top: 1px solid var(--hair); }
.qnav-actions.top { border-top: 0; border-bottom: 1px solid var(--hair); padding: 12px 20px; }
.qnav-actions .push { flex:1; }

/* --- Buttons --- */
.btn {
  border: 1.5px solid var(--hair); background: var(--card); color: var(--ink);
  border-radius: var(--radius); padding: 11px 18px; font-size: 15px; font-weight: 650; cursor: pointer;
  transition: border-color .12s, background .12s, transform .08s; letter-spacing:.01em;
}
.btn:hover { border-color: var(--ink-2); }
.btn:active { transform: scale(.98); }
.btn:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--signal); border-color: var(--signal); color: var(--signal-ink); font-weight: 750; }
.btn.primary:hover { filter: brightness(1.05); border-color: var(--signal); }
.btn.blueprint { background: var(--blueprint); border-color: var(--blueprint); color: #fff; }
.btn.ghost { background: transparent; }
.btn.small { padding: 8px 13px; font-size: 13px; }

/* --- Navigator: the answer sheet itself --- */
.navigator {
  background: var(--card); border: 1px solid var(--hair); border-radius: var(--radius);
  box-shadow: var(--shadow); position: sticky; top: 16px; overflow: hidden;
}
/* timing marks down the sheet's left edge */
.navigator::before {
  content: ""; position: absolute; left: 4px; top: 12px; bottom: 12px; width: 5px;
  background: repeating-linear-gradient(180deg, var(--ink) 0 7px, transparent 7px 16px);
  opacity: .18; pointer-events: none;
}
.navigator .nhead { padding: 14px 16px 14px 20px; border-bottom: 1px solid var(--hair); }
.navigator .timer { font-family: var(--mono); font-size: 30px; font-weight: 700; letter-spacing: .03em; line-height:1; }
.navigator .timer.warn { color: var(--signal); }
.navigator .timer.danger { color: var(--bad); }
.navigator .timerlab { font-family:var(--mono); font-size:10px; letter-spacing:.2em; text-transform:uppercase; color: var(--ink-3); margin-bottom:6px; }
.navigator .progresslab { font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
.navigator .progresslab b { color: var(--ink); }

.sheet { padding: 14px 16px 14px 20px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 7px; }
.cell {
  aspect-ratio: 1 / 1; border: 2px solid var(--hair); border-radius: 50%; background: var(--card);
  font-family: var(--mono); font-size: 11px; font-weight: 600; color: var(--ink-2);
  display: grid; place-items: center; cursor: pointer; position: relative; padding:0;
  transition: border-color .1s, background .1s;
}
.cell:hover { border-color: var(--ink-2); }
.cell:focus-visible { outline: 2px solid var(--signal); outline-offset: 1px; }
.cell.answered {
  background: radial-gradient(circle at 38% 32%,
    color-mix(in srgb, var(--ink) 78%, var(--card)), var(--ink) 72%);
  border-color: var(--ink); color: var(--card);
}
.cell.current { border-color: var(--signal); box-shadow: 0 0 0 2px color-mix(in srgb, var(--signal) 40%, transparent); }
.cell.flagged::after {
  content:""; position:absolute; top:-2px; right:-2px; width: 9px; height: 9px;
  border-radius: 50%; background: var(--signal); border: 1.5px solid var(--card);
}
.cell.correct { background: var(--ok); border-color: var(--ok); color: var(--card); }
.cell.incorrect { background: var(--bad); border-color: var(--bad); color: var(--card); }
.navigator .nlegend { padding: 8px 16px 16px 20px; display:grid; gap: 6px; font-family:var(--mono); font-size:11px; color: var(--ink-2); }
.navigator .nlegend .row { display:flex; align-items:center; gap:8px; }
.navigator .nlegend .box { width: 13px; height:13px; border-radius:50%; border:1.5px solid var(--hair); flex: none; }
.navigator .nlegend .box.filled { background: var(--ink); border-color: var(--ink); }
.navigator .nlegend .box.flag { position: relative; }
.navigator .nlegend .box.flag::after {
  content:""; position:absolute; top:-3px; right:-3px; width: 7px; height: 7px;
  border-radius: 50%; background: var(--signal);
}
.navigator .submit-wrap { padding: 0 16px 16px 20px; }

/* ============================================================
   RESULTS — the graded sheet comes back
   ============================================================ */
.results { max-width: 860px; margin: 0 auto; display: grid; gap: 18px; }
.scorepanel {
  background: linear-gradient(165deg, var(--blueprint), var(--blueprint-2)); color:#fff;
  border-radius: var(--radius); padding: 30px; position: relative; overflow: hidden;
  display:grid; grid-template-columns: auto 1fr; gap: 30px; align-items: center;
}
@media (max-width:620px){ .scorepanel { grid-template-columns: 1fr; text-align:center; } }
.scorepanel::before {
  content:""; position:absolute; inset:0;
  background-image: radial-gradient(circle 2px, rgba(255,255,255,.14) 1.5px, transparent 2px);
  background-size: 22px 22px;
  pointer-events: none;
}
.bigscore { position: relative; }
.bigscore .pct { font-family: var(--mono); font-size: 72px; font-weight: 800; line-height: 1; }
.bigscore .frac { font-family: var(--mono); color: rgba(255,255,255,.7); font-size: 14px; margin-top: 6px; letter-spacing:.06em; }
/* the proctor's rubber stamp */
.verdict-stamp {
  position: relative; display: inline-block; font-family: var(--mono); font-weight: 800;
  font-size: 26px; letter-spacing: .12em; padding: 10px 20px;
  border: 3px double; outline: 1px dashed; outline-offset: -7px;
  border-radius: 8px; transform: rotate(-5deg);
}
.verdict-stamp.pass { color: #8FE3B0; border-color: #8FE3B0; outline-color: rgba(143,227,176,.5); }
.verdict-stamp.fail { color: #FFA8A0; border-color: #FFA8A0; outline-color: rgba(255,168,160,.5); }
.scorepanel .meta { position:relative; }
.scorepanel .meta .line { font-family:var(--mono); font-size: 13px; color: rgba(255,255,255,.82); margin-bottom: 4px; }
.scorepanel .meta .line b { color:#fff; }

.panel { background: var(--card); border: 1px solid var(--hair); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px 24px; }
.panel h3 { font-family: var(--serif); font-size: 17px; margin-bottom: 16px; display:flex; align-items:center; gap:10px; }
.panel h3 .eyebrow { margin:0; font-family: var(--mono); }

.dombars { display: grid; gap: 14px; }
.dombar .top { display:flex; justify-content: space-between; align-items:baseline; margin-bottom: 6px; }
.dombar .name { font-size: 14px; font-weight: 600; }
.dombar .frac { font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
.dombar .track { position: relative; height: 12px; background: var(--hair-2); border-radius: 100px; overflow: hidden; }
.dombar .fill { height: 100%; border-radius: 100px; transition: width .6s cubic-bezier(.2,.8,.2,1); }
.dombar .track .thresh { position:absolute; top:-3px; bottom:-3px; width: 2px; background: var(--ink-2); opacity:.5; }

.review-list { display: grid; gap: 12px; }
.review-item { border: 1px solid var(--hair); border-radius: var(--radius); overflow: hidden; }
.review-item .rihead { display:flex; align-items:center; gap: 10px; padding: 12px 16px; cursor: pointer; background: var(--card); border:0; width:100%; text-align:left; }
.review-item .rihead:focus-visible { outline: 3px solid var(--signal); outline-offset: -3px; }
.review-item .rihead .rq { font-family: var(--mono); font-weight: 700; font-size: 13px; }
.review-item .rihead .rmark { width: 20px; height:20px; border-radius: 50%; display:grid; place-items:center; color:#fff; font-size:12px; font-weight:700; flex: none; }
.review-item .rihead .rmark.ok { background: var(--ok); }
.review-item .rihead .rmark.bad { background: var(--bad); }
.review-item .rihead .rmark.skip { background: var(--ink-3); }
.review-item .rihead .rstem { flex:1; font-size: 13.5px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.review-item .rihead .caret { font-family:var(--mono); color: var(--ink-3); }
.review-item .ribody { padding: 0 16px 16px; display: none; }
.review-item.open .ribody { display: block; }
.review-item .ribody .rstem-full { font-family: var(--serif); font-size: 16px; font-weight: 400; line-height: 1.5; margin: 6px 0 14px; }
.filterbar { display:flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.filterbar .fbtn { font-family: var(--mono); font-size: 12px; padding: 6px 12px; border: 1px solid var(--hair); border-radius: 100px; background: var(--card); cursor: pointer; color: var(--ink-2); }
.filterbar .fbtn.on { background: var(--ink); color: var(--card); border-color: var(--ink); }
.filterbar .fbtn:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }

.results-actions { display:flex; gap: 12px; flex-wrap: wrap; justify-content: center; padding-top: 4px; }

/* ---- Modal ---- */
.modal-backdrop { position: fixed; inset: 0; background: rgba(14,22,19,.55); display: grid; place-items: center; padding: 20px; z-index: 50; }
.modal-backdrop.hidden { display: none; }
.modal { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); max-width: 440px; width: 100%; padding: 26px; border-top: 3px solid var(--signal); }
.modal h3 { font-family: var(--serif); font-size: 20px; margin-bottom: 10px; }
.modal p { color: var(--ink-2); font-size: 14.5px; margin-bottom: 20px; }
.modal .row { display:flex; gap: 10px; justify-content: flex-end; }

.hidden { display: none !important; }

footer.foot { border-top: 1px solid var(--hair); padding: 22px 0; color: var(--ink-3); font-family: var(--mono); font-size: 12px; letter-spacing:.04em; }
footer.foot .wrap { display:flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}

</style>

<script>window.SUITE = {"certification":"Claude Certified Architect","rev":"2.0","totalQuestions":592,"programs":["CCA-F","CCAR-P"],"domains":{"AGENT-ARCH":{"name":"Agentic Architecture & Orchestration","color":"#3B5FC0"},"TOOL-MCP":{"name":"Tool Design & MCP Integration","color":"#0F7A6C"},"CODE-CONFIG":{"name":"Claude Code Configuration & Workflows","color":"#7B52C9"},"PROMPT-ENG":{"name":"Prompt Engineering & Structured Output","color":"#9E5509"},"CONTEXT-REL":{"name":"Context Management & Reliability","color":"#B4426B"}},"pool":[{"id":"practice-Q1","scenario":"Multi-agent Research System","stem":"A document analysis agent discovers that two credible sources contain directly contradictory statistics for a key metric: a government report states 40% growth, while an industry analysis states 12%. Both sources look credible, and the discrepancy could materially affect the research conclusions. How should the document analysis agent handle this situation most effectively? Which approach is most effective?","domain":"AGENT-ARCH","difficulty":3,"choices":[{"label":"A","text":"Apply source-credibility heuristics to choose the most authoritative figure, finalize the analysis using that single value, and add a brief footnote acknowledging the other source disagreed."},{"label":"B","text":"Include both numbers side by side in the analysis output without flagging them as conflicting, trusting the synthesis agent to infer from broader context which figure is the correct one to keep."},{"label":"C","text":"Halt analysis immediately and escalate to the coordinator, asking it to rule on which source is more authoritative and supply the single correct figure before any further work proceeds."},{"label":"D","text":"Complete analysis with both numbers, explicitly annotate the conflict with source attribution, and let the coordinator decide how to reconcile the data before passing to synthesis."}],"correct":"D","explanation":"This approach preserves separation of responsibilities: the analysis agent completes its core work without blocking, preserves both conflicting values with clear attribution, and correctly passes reconciliation to the coordinator, which has broader context."},{"id":"practice-Q2","scenario":"Multi-agent Research System","stem":"The web-search and document-analysis agents have completed their tasks and returned results to the coordinator. What is the next step for creating an integrated research report? Which next step is most appropriate?","domain":"AGENT-ARCH","difficulty":1,"choices":[{"label":"A","text":"Each subagent forwards its own results straight to the report-writing agent, bypassing the coordinator entirely for speed."},{"label":"B","text":"The document analysis agent pulls the web-search results itself and merges both internally before returning one combined output."},{"label":"C","text":"The coordinator passes both sets of results to the synthesis agent for a unified integration."},{"label":"D","text":"The coordinator concatenates the raw, unprocessed outputs from both subagents and returns that as the finished report."}],"correct":"C","explanation":"In a coordinator–subagent architecture, the coordinator forwards both result sets to the synthesis agent for centralized integration, preserving control and ensuring high-quality merging."},{"id":"practice-Q3","scenario":"Multi-agent Research System","stem":"A document analysis subagent frequently fails when processing PDF files: some have corrupted sections that trigger parsing exceptions, others are password-protected, and sometimes the parsing library hangs on large files. Currently, any exception immediately terminates the subagent and returns an error to the coordinator, which must decide whether to retry, skip, or fail the whole task. This causes excessive coordinator involvement in routine error handling. What architectural improvement is most effective?","domain":"AGENT-ARCH","difficulty":3,"choices":[{"label":"A","text":"Create a dedicated error-handling agent that watches every subagent failure through a shared queue, decides the recovery action centrally, and issues restart or skip commands directly back to the affected subagents."},{"label":"B","text":"Configure the subagent to always return partial results tagged with a success status while burying any error details inside response metadata, so the coordinator can treat every reply as a clean success."},{"label":"C","text":"Have the coordinator pre-validate every document for corruption, encryption, and size before delegation, rejecting any file that looks like it might trigger a parsing failure downstream."},{"label":"D","text":"Implement local recovery in the subagent for transient failures and escalate to the coordinator only errors it cannot resolve, including attempted steps and partial results."}],"correct":"D","explanation":"Handle errors at the lowest level capable of resolving them. Local recovery reduces coordinator workload while still escalating truly unrecoverable issues with full context and partial progress."},{"id":"practice-Q4","scenario":"Multi-agent Research System","stem":"After running the system on “AI impact on creative industries,” you observe that every subagent completes successfully: the web-search agent finds relevant articles, the document analysis agent summarizes them correctly, and the synthesis agent produces coherent text. However, final reports cover only visual art and completely miss music, literature, and film. In the coordinator logs, you see it decomposed the topic into three subtasks: “AI in digital art,” “AI in graphic design,” and “AI in photography.” What is the most likely root cause?","domain":"AGENT-ARCH","difficulty":2,"choices":[{"label":"A","text":"The synthesis agent lacks instructions to detect coverage gaps, so it writes up only whatever narrow material the upstream subagents happened to deliver to it."},{"label":"B","text":"The document analysis agent applies overly strict relevance criteria and silently filters out the music, literature, and film sources before they reach synthesis."},{"label":"C","text":"The coordinator’s task decomposition is too narrow, assigning subagents work that does not cover all relevant areas."},{"label":"D","text":"The web-search agent's queries are too shallow, so broadening them to explicitly name every creative sector would let the missing coverage flow through."}],"correct":"C","explanation":"The coordinator decomposed a broad topic only into visual-art subtasks, missing music, literature, and film entirely. Since subagents executed their assignments correctly, the narrow decomposition is the obvious root cause."},{"id":"practice-Q5","scenario":"Multi-agent Research System","stem":"The web-search subagent returns results for only 3 of 5 requested source categories (competitor sites and industry reports succeed, but news archives and social feeds time out). The document analysis subagent successfully processes all provided documents. The synthesis subagent must produce a summary from mixed-quality upstream inputs. Which error-propagation strategy is most effective?","domain":"AGENT-ARCH","difficulty":3,"choices":[{"label":"A","text":"Continue synthesis using only the successful sources and produce a confident, complete-looking summary that never mentions the news-archive and social-feed data was unavailable."},{"label":"B","text":"Have the synthesis subagent return an error to the coordinator, since incomplete upstream coverage should trigger a full retry or outright task failure rather than a partial answer."},{"label":"C","text":"Have the synthesis subagent ask the coordinator to re-run the timed-out news and social sources with a longer timeout, blocking synthesis until full source coverage is finally restored."},{"label":"D","text":"Structure the synthesis output with coverage annotations that indicate which conclusions are well-supported and where gaps exist due to unavailable sources."}],"correct":"D","explanation":"Coverage annotations implement graceful degradation with transparency, preserving value from completed work while propagating uncertainty to enable informed decisions about confidence."},{"id":"practice-Q6","scenario":"Multi-agent Research System","stem":"The document analysis subagent encounters a corrupted PDF file that it cannot parse. When designing the system’s error handling, what is the most effective way to handle this failure? Which approach is most effective?","domain":"AGENT-ARCH","difficulty":2,"choices":[{"label":"A","text":"Return an error with context to the coordinator agent, allowing it to decide how to proceed."},{"label":"B","text":"Silently skip the corrupted document and keep processing the remaining files, so the broader workflow is never interrupted by one bad input."},{"label":"C","text":"Automatically retry parsing the corrupted file three times with exponential backoff, only reporting failure to the coordinator after every attempt has been exhausted."},{"label":"D","text":"Throw an unhandled exception that propagates up and terminates the entire research workflow on the first unparseable document."}],"correct":"A","explanation":"Returning an error with context to the coordinator is the most effective approach because it lets the coordinator make an informed decision—skip the file, try an alternative parsing method, or notify the user—while maintaining visibility into the failure."},{"id":"practice-Q8","scenario":"Multi-agent Research System","stem":"A colleague proposes that the document analysis agent should send its results directly to the synthesis agent, bypassing the coordinator. What is the main advantage of keeping the coordinator as the central hub for all communication between subagents?","domain":"AGENT-ARCH","difficulty":2,"choices":[{"label":"A","text":"The coordinator can observe all interactions, handle errors uniformly, and decide what information each subagent should receive."},{"label":"B","text":"The coordinator can batch multiple subagent requests into combined calls, cutting the total number of API round trips and reducing overall pipeline latency."},{"label":"C","text":"Routing through the coordinator is the only way to enable automatic retry logic on failures, which direct agent-to-agent calls fundamentally cannot support."},{"label":"D","text":"Subagents run in isolated memory spaces, so direct communication would demand complex cross-process serialization that only the central coordinator is able to perform."}],"correct":"A","explanation":"The coordinator pattern provides centralized visibility into all interactions, uniform error handling across the system, and fine-grained control over what information each subagent receives—these are the primary advantages of a star-shaped communication topology."},{"id":"practice-Q9","scenario":"Multi-agent Research System","stem":"The web-search subagent times out while researching a complex topic. You need to design how information about this failure is returned to the coordinator. Which error-propagation approach best enables intelligent recovery?","domain":"AGENT-ARCH","difficulty":2,"choices":[{"label":"A","text":"Return structured error context to the coordinator including the failure type, the query executed, any partial results, and potential alternative approaches."},{"label":"B","text":"Catch the timeout inside the subagent and return an empty result set marked as a successful search, so the coordinator simply moves on as if the topic yielded nothing."},{"label":"C","text":"Run automatic exponential-backoff retries inside the subagent, and after exhausting them return only a generic 'search unavailable' status with no further detail for the coordinator."},{"label":"D","text":"Let the timeout exception propagate straight up to the top-level handler, terminating the whole research workflow rather than localizing the failure to one query."}],"correct":"A","explanation":"Returning structured error context—including failure type, executed query, partial results, and alternative approaches—gives the coordinator everything needed to make intelligent recovery decisions (e.g., retry with a modified query or continue with partial results). It preserves maximum context for informed coordination-level decision-making."},{"id":"practice-Q11","scenario":"Multi-agent Research System","stem":"While researching a broad topic, you observe that the web-search agent and the document analysis agent investigate the same subtopics, leading to substantial duplication in their outputs. Token usage nearly doubles without a proportional increase in research breadth or depth. What is the most effective way to address this?","domain":"AGENT-ARCH","difficulty":3,"choices":[{"label":"A","text":"Let both agents run fully in parallel as they do now, then have the coordinator deduplicate the overlapping findings after the fact before forwarding them to synthesis."},{"label":"B","text":"The coordinator explicitly partitions the research space before delegating, assigning each agent distinct subtopics or source types."},{"label":"C","text":"Add a shared-state mechanism where each agent logs its current focus area in real time, so the others can dynamically steer away from subtopics already being covered."},{"label":"D","text":"Switch to sequential execution so document analysis runs only after web search finishes, feeding the web-search output in as context the second agent can avoid duplicating."}],"correct":"B","explanation":"Having the coordinator explicitly partition the research space before delegating is most effective because it addresses the root cause—unclear task boundaries—before any work begins. It preserves parallelism while preventing duplicated effort and wasted tokens."},{"id":"practice-Q12","scenario":"Multi-agent Research System","stem":"During research, the web-search subagent queries three source categories with different outcomes: academic databases return 15 relevant papers, industry reports return “0 results,” and patent databases return “Connection timeout.” When designing error propagation to the coordinator, which approach enables the best recovery decisions?","domain":"AGENT-ARCH","difficulty":3,"choices":[{"label":"A","text":"Collapse the three outcomes into a single success-percentage metric such as '67% source coverage' and keep the detailed per-source logs retrievable on demand for later inspection."},{"label":"B","text":"Report both the patent-database 'timeout' and the industry-report '0 results' as failures that require coordinator intervention before research can safely continue."},{"label":"C","text":"Retry the transient failures internally with backoff and report only the persistent ones, presenting timeouts and empty results identically once retries finish."},{"label":"D","text":"Distinguish access failures (timeout) that require a retry decision from valid empty results (“0 results”) that represent successful queries."}],"correct":"D","explanation":"A timeout (access failure) and “0 results” (valid empty result) are semantically different outcomes requiring different responses. Distinguishing them allows the coordinator to retry the patent database while accepting the industry reports “0 results” as a valid, informative finding."},{"id":"practice-Q45","scenario":"Code Generation with Claude Code","stem":"You’re adding error-handling wrappers around external API calls across a 120-file codebase. The work has three phases: (1) discover all call sites and patterns, (2) collaboratively design the error-handling approach, and (3) implement wrappers consistently. In Phase 1, Claude generates large output listing hundreds of call sites with context, quickly filling the context window before discovery finishes. Which approach is most effective to complete the task while maintaining implementation consistency?","domain":"AGENT-ARCH","difficulty":3,"choices":[{"label":"A","text":"Use an Explore subagent for Phase 1 to isolate verbose discovery output and return a summary, then continue Phases 2–3 in the main conversation."},{"label":"B","text":"Run all three phases in the main conversation, periodically invoking `/compact` to summarize and shrink context usage as you move through the 120 files."},{"label":"C","text":"Switch to headless mode with `--continue`, manually passing explicit context summaries between batch calls to preserve discovery continuity across phases."},{"label":"D","text":"Define the error-handling pattern in CLAUDE.md, then process files in batches across multiple separate sessions, relying on that shared memory file to enforce consistency."}],"correct":"A","explanation":"An Explore subagent isolates the verbose discovery output in a separate context and returns only a concise summary to the main conversation. This preserves the main context window for the collaborative design and consistent implementation phases where retained context is most valuable."},{"id":"practice-Q48","scenario":"Customer Support Agent","stem":"Production logs show that for simple requests like “refund for order #1234,” your agent resolves the issue in 3–4 tool calls with 91% success. But for complex requests like “I was billed twice, my discount didn’t apply, and I want to cancel,” the agent averages 12+ tool calls with only 54% success—often investigating issues sequentially and fetching redundant customer data for each. What change most effectively improves handling of complex requests? What change is most effective?","domain":"AGENT-ARCH","difficulty":3,"choices":[{"label":"A","text":"Add explicit verification checkpoints between stages, forcing the agent to record progress after each issue is resolved before it is allowed to begin the next one."},{"label":"B","text":"Reduce the tool count by collapsing `get_customer`, `lookup_order`, and the billing tools into one broad `investigate_issue` tool the agent calls for everything."},{"label":"C","text":"Decompose the request into separate issues, then investigate each in parallel using shared customer context before synthesizing a final resolution."},{"label":"D","text":"Add few-shot examples to the system prompt that demonstrate ideal tool-call sequences across a range of multi-faceted billing scenarios for the model to imitate."}],"correct":"C","explanation":"Decomposing into separate issues and investigating in parallel with shared customer context fixes both key problems: it eliminates redundant data retrieval by reusing shared context across issues and reduces total tool-call loops by parallelizing investigation before synthesizing a single resolution."},{"id":"practice-Q49","scenario":"Customer Support Agent","stem":"Your agent achieves 55% first-contact resolution, well below the 80% target. Logs show it escalates simple cases (standard replacements for damaged goods with photo proof) while trying to handle complex situations requiring policy exceptions autonomously. What is the most effective way to improve escalation calibration?","domain":"AGENT-ARCH","difficulty":2,"choices":[{"label":"A","text":"Require the agent to self-rate its confidence on a 1-10 scale before each reply and automatically route to a human whenever that score drops below a fixed threshold."},{"label":"B","text":"Deploy a separate classifier model trained on historical tickets to predict which incoming requests need escalation before the main agent ever starts processing them."},{"label":"C","text":"Add explicit escalation criteria to the system prompt with few-shot examples showing when to escalate versus resolve autonomously."},{"label":"D","text":"Add sentiment analysis that gauges the customer's frustration level and automatically escalates the case once it crosses a defined negative-sentiment threshold."}],"correct":"C","explanation":"Explicit escalation criteria with few-shot examples directly address the root cause—unclear decision boundaries between simple and complex cases. It’s the most proportional, effective first intervention that teaches the agent when to escalate and when to resolve autonomously without extra infrastructure."},{"id":"practice-Q50","scenario":"Customer Support Agent","stem":"After calling `get_customer` and `lookup_order`, the agent has all available system data but still faces uncertainty. Which situation is the most justified trigger for calling `escalate_to_human`?","domain":"AGENT-ARCH","difficulty":3,"choices":[{"label":"A","text":"A customer wants to cancel an order that shipped yesterday and arrives tomorrow. The agent should escalate because the customer might regret canceling once the package actually arrives at their door, which a human could talk through."},{"label":"B","text":"A customer claims an order never arrived, but tracking shows it was delivered and signed for at their address three days ago. The agent should escalate because confronting them with the contradicting evidence could damage the relationship."},{"label":"C","text":"A customer requests competitor price matching. Your policies allow price adjustments for price drops on your own site within 14 days, but say nothing about competitor prices. The agent should escalate for policy interpretation."},{"label":"D","text":"A customer's message contains both a billing question and a separate product return request. The agent should escalate so that a single human can coordinate resolving both distinct issues together in one interaction."}],"correct":"C","explanation":"This is a genuine policy gap: company rules cover price drops on your own site but do not address competitor price matching. The agent must not invent policy and should escalate for human judgment on how to interpret or extend existing rules."},{"id":"practice-Q51","scenario":"Customer Support Agent","stem":"Production logs show that in 12% of cases your agent skips `get_customer` and calls `lookup_order` directly using only the customer-provided name, sometimes leading to misidentified accounts and incorrect refunds. What change most effectively fixes this reliability problem? What change is most effective?","domain":"AGENT-ARCH","difficulty":2,"choices":[{"label":"A","text":"Add few-shot examples to the prompt showing the agent always calling `get_customer` first, even in cases where the customer has voluntarily supplied their order number up front."},{"label":"B","text":"Implement a routing classifier that inspects each incoming request and dynamically enables only the subset of tools judged appropriate for that particular request type."},{"label":"C","text":"Add a programmatic precondition that blocks `lookup_order` and `process_refund` until `get_customer` returns a verified customer identifier."},{"label":"D","text":"Strengthen the system prompt with firm language stating that customer verification through `get_customer` is mandatory before any order or refund operation may run."}],"correct":"C","explanation":"A programmatic precondition provides a deterministic guarantee that required sequencing is followed. It’s the most effective approach because it eliminates the possibility of skipping verification, regardless of LLM behavior."},{"id":"practice-Q53","scenario":"Customer Support Agent","stem":"Production metrics show your agent averages 4+ API loops per resolution. Analysis reveals Claude often requests `get_customer` and `lookup_order` in separate sequential turns even when both are needed initially. What is the most effective way to reduce the number of loops?","domain":"AGENT-ARCH","difficulty":2,"choices":[{"label":"A","text":"Implement speculative execution that fires the likely-needed tools in parallel alongside whatever Claude requested, then returns every result regardless of what was actually asked for."},{"label":"B","text":"Increase `max_tokens` substantially so Claude has more room to plan ahead and will naturally start combining its tool requests into a single turn on its own."},{"label":"C","text":"Create composite tools such as `get_customer_with_orders` that bundle the most common lookup combinations behind one call so fewer separate requests are needed."},{"label":"D","text":"Instruct Claude in the prompt to bundle tool requests into one turn and return all results together before the next API call."}],"correct":"D","explanation":"Prompting Claude to bundle related tool requests into a single turn leverages its native ability to request multiple tools at once. It directly fixes the sequential-call pattern with minimal architectural change."},{"id":"practice-Q58","scenario":"Customer Support Agent","stem":"You are implementing the agent loop for your support agent. After each Claude API call, you must decide whether to continue the loop (run requested tools and call Claude again) or stop (present the final answer to the customer). What determines this decision?","domain":"AGENT-ARCH","difficulty":1,"choices":[{"label":"A","text":"Check the `stop_reason` field in Claude’s response—continue if it is `tool_use` and stop if it is `end_turn`."},{"label":"B","text":"Parse Claude's text for natural-language completion signals like 'I'm done' or 'Can I help with anything else?', treating those phrases as the cue that the task has finished."},{"label":"C","text":"Set a maximum iteration count such as 10 calls and stop the loop once it is reached, regardless of whether Claude is still signaling that more tool work remains."},{"label":"D","text":"Check whether the response contains any assistant text content, and terminate the loop as soon as Claude has generated explanatory prose alongside its reply."}],"correct":"A","explanation":"`stop_reason` is Claude’s explicit structured signal for loop control: `tool_use` indicates Claude wants to run a tool and receive results back, while `end_turn` indicates Claude has completed its response and the loop should end."},{"id":"practice-Q59","scenario":"Customer Support Agent","stem":"Production logs show the agent misinterprets outputs from your MCP tools: Unix timestamps from `get_customer`, ISO 8601 dates from `lookup_order`, and numeric status codes (1=pending, 2=shipped). Some tools are third-party MCP servers you cannot modify. Which approach to data format normalization is most maintainable?","domain":"AGENT-ARCH","difficulty":3,"choices":[{"label":"A","text":"Use a PostToolUse hook to intercept tool outputs and apply formatting transformations before the agent processes them."},{"label":"B","text":"Modify every tool you control to emit human-readable formats directly, and build individual wrapper layers around each third-party MCP tool to convert their outputs."},{"label":"C","text":"Create a dedicated `normalize_data` tool that the agent is told to invoke after every single data retrieval to transform timestamps, dates, and status codes."},{"label":"D","text":"Add detailed format documentation to the system prompt explaining each tool's timestamp, ISO 8601, and status-code conventions so the agent interprets them correctly."}],"correct":"A","explanation":"A PostToolUse hook provides a centralized, deterministic point to intercept and normalize all tool outputs—including third-party MCP server data—before the agent processes them. It’s more maintainable because transformations live in code and apply uniformly, rather than relying on LLM interpretation."},{"id":"authored-AGENT-1","scenario":"Multi-agent Research System","stem":"Your research coordinator needs three independent pieces of work for a report: a web search on market size, a separate web search on competitors, and an analysis of an uploaded filing. Currently the coordinator issues one Task per turn and waits for each subagent to finish before starting the next, so a report takes three sequential round trips and feels slow. None of the three tasks depends on the others' output. What is the most effective way to reduce total latency?","domain":"AGENT-ARCH","difficulty":2,"choices":[{"label":"A","text":"Increase max_tokens so the coordinator has room to plan and describe all three research tasks within one longer single response."},{"label":"B","text":"Have the coordinator emit all three Task calls in a single response so the subagents run concurrently."},{"label":"C","text":"Add a parallel: true flag to the coordinator's AgentDefinition so the framework automatically runs the delegated subagents concurrently."},{"label":"D","text":"Call fork_session three separate times so that each of the three subagents executes inside its own isolated conversation branch."}],"correct":"B","explanation":"When a coordinator includes multiple Task calls in one response, the spawned subagents execute concurrently—ideal for independent work, eliminating the sequential round trips. A confuses token budget with concurrency. C invents a flag that does not exist; parallelism comes from emitting multiple Tasks at once. D misuses fork_session, which branches a conversation to compare approaches, not to parallelize independent subtasks."},{"id":"authored-AGENT-2","scenario":"Code Generation with Claude Code","stem":"After a long investigation session in which Claude mapped a legacy module's dependencies, you want to prototype two competing implementations—one using Redux and one using the Context API—and compare them. Both should start from the same investigation findings without re-running the costly discovery, and the two explorations must not contaminate each other's context. What is the most effective approach?","domain":"AGENT-ARCH","difficulty":3,"choices":[{"label":"A","text":"Use fork_session to create two independent branches from the shared investigation context, then develop each approach in its own branch."},{"label":"B","text":"Continue inside the single existing session, implementing the Redux version first and then building the Context API version afterward in the same conversation thread."},{"label":"C","text":"Start two brand-new empty sessions and re-run the full dependency discovery in each one before beginning either prototype, so both start from fresh findings."},{"label":"D","text":"Use --resume on the same session name across two terminals so the two prototypes can share one live, continuously updated investigation state between them."}],"correct":"A","explanation":"fork_session branches independent sessions that both inherit context up to the branch point and then diverge, which is exactly the pattern for comparing alternative approaches from shared findings. B lets the two approaches contaminate each other within one context. C wastes the discovery work by re-running it. D resumes the same session rather than branching and would not give two cleanly isolated explorations."},{"id":"example-Q2","scenario":"Customer Support Agent","stem":"The agent often calls `get_customer` instead of `lookup_order` for order-related questions. Tool descriptions are minimal and similar. What is the first step?","domain":"TOOL-MCP","difficulty":2,"choices":[{"label":"A","text":"Add a few-shot example block to the prompt instead of editing the descriptions"},{"label":"B","text":"Expand each tool’s description with input formats, examples, and boundaries"},{"label":"C","text":"Insert a routing layer that preselects the right tool before each request"},{"label":"D","text":"Merge the two tools into one combined order-and-customer lookup tool"}],"correct":"B","explanation":"Tool descriptions are the model’s primary selection mechanism. This is the lowest-effort, highest-impact fix. A adds tokens without addressing the root cause. C is overengineering. D requires more effort than justified."},{"id":"example-Q9","scenario":"Multi-agent Research System","stem":"The synthesis agent often needs to verify specific claims while merging results. Currently, when verification is needed, the synthesis agent hands control back to the coordinator, which calls the web-search agent and then re-runs synthesis with the new results. This adds 2–3 extra round trips per task and increases latency by 40%. Your assessment shows that 85% of these checks are simple fact checks (dates, names, statistics), while 15% require deeper investigation. How do you reduce overhead while maintaining reliability?","domain":"TOOL-MCP","difficulty":3,"choices":[{"label":"A","text":"Give the synthesis agent a limited `verify_fact` tool for simple checks, and continue routing complex verification through the coordinator"},{"label":"B","text":"Accumulate every verification need and hand the whole batch back to the coordinator at the end of synthesis"},{"label":"C","text":"Grant the synthesis agent full access to all of the web-search agent's tools for any check"},{"label":"D","text":"Proactively cache extra surrounding context around each source during the initial research pass"}],"correct":"A","explanation":"This applies the principle of least privilege: the synthesis agent gets exactly what it needs for the 85% common case (simple fact checks) while preserving the coordinator-mediated path for complex investigations. B introduces blocking dependencies (later synthesis steps may depend on earlier verified facts). C breaks separation of responsibilities. D relies on speculative caching that cannot reliably predict needs."},{"id":"practice-Q7","scenario":"Multi-agent Research System","stem":"Production logs show a persistent pattern: requests like “analyze the uploaded quarterly report” are routed to the web-search agent 45% of the time instead of the document analysis agent. Reviewing tool definitions, you find that the web-search agent has a tool `analyze_content` described as “analyzes content and extracts key information,” while the document analysis agent has a tool `analyze_document` described as “analyzes documents and extracts key information.” How should you fix the misrouting problem?","domain":"TOOL-MCP","difficulty":3,"choices":[{"label":"A","text":"Add a pre-routing classifier that detects up front whether the user is referring to an uploaded file or to web content, and lets the coordinator delegate accordingly."},{"label":"B","text":"Rename the web-search tool to `extract_web_results` and update its description to “processes and returns information retrieved from web search and URLs.”"},{"label":"C","text":"Add few-shot examples to the coordinator prompt mapping inputs to agents, such as 'uploaded quarterly report goes to document analysis' and 'web page question goes to web-search'."},{"label":"D","text":"Expand the document analysis tool description with concrete usage examples like 'use for uploaded PDFs, Word docs, and spreadsheets', while leaving the web-search tool's wording untouched."}],"correct":"B","explanation":"Renaming the web-search tool to `extract_web_results` and updating its description to explicitly reference web search and URLs directly removes the root cause by eliminating semantic overlap between the two tool names and descriptions. This makes each tool’s purpose unambiguous, enabling the coordinator to reliably distinguish document analysis from web search."},{"id":"practice-Q10","scenario":"Multi-agent Research System","stem":"In your system design, you gave the document analysis agent access to a general-purpose tool `fetch_url` so it could download documents by URL. Production logs show this agent now frequently downloads search engine results pages to perform ad hoc web search—behavior that should be routed through the web-search agent—causing inconsistent results. Which fix is most effective?","domain":"TOOL-MCP","difficulty":3,"choices":[{"label":"A","text":"Replace `fetch_url` with a `load_document` tool that validates that URLs point to document formats."},{"label":"B","text":"Remove `fetch_url` from the document analysis agent entirely and route every URL fetch through the coordinator over to the dedicated web-search agent instead."},{"label":"C","text":"Implement a domain filter that blocks `fetch_url` calls aimed at known search-engine hosts while still permitting the tool to download from any other URL."},{"label":"D","text":"Add prompt instructions telling the document analysis agent that `fetch_url` must be used only to download document URLs and never to run ad hoc web searches."}],"correct":"A","explanation":"Replacing a general-purpose tool with a document-specific tool that validates URLs against document formats fixes the root cause by constraining capability at the interface level. This follows the principle of least privilege, making undesired search behavior impossible rather than merely discouraged."},{"id":"practice-Q15","scenario":"Multi-agent Research System","stem":"In testing, you observe that the synthesis agent often needs to verify specific claims while merging results. Currently, when verification is needed, the synthesis agent returns control to the coordinator, which calls the web-search agent and then re-invokes synthesis with the results. This adds 2–3 extra loops per task and increases latency by 40%. Your assessment shows 85% of these verifications are simple fact checks (dates, names, stats) and 15% require deeper research. Which approach most effectively reduces overhead while preserving system reliability? Which approach is most effective?","domain":"TOOL-MCP","difficulty":3,"choices":[{"label":"A","text":"Give the synthesis agent direct access to the full web-search toolset so it can handle any verification need itself, eliminating every extra coordinator round trip outright."},{"label":"B","text":"Have the synthesis agent accumulate all of its verification needs and return them in one batch to the coordinator at the end, which then forwards them together to the web-search agent."},{"label":"C","text":"Have the web-search agent proactively cache extra context around each source during initial research, anticipating the specific facts synthesis will later need to verify."},{"label":"D","text":"Give the synthesis agent a limited-scope `verify_fact` tool for simple checks, while routing complex verifications through the coordinator to the web-search agent."}],"correct":"D","explanation":"A limited-scope fact-verification tool lets the synthesis agent handle 85% of simple checks directly, eliminating most loops, while preserving the coordinator delegation path for the 15% of complex verifications. This applies least privilege while significantly reducing latency."},{"id":"practice-Q44","scenario":"Code Generation with Claude Code","stem":"Your team wants to add a GitHub MCP server for searching PRs and checking CI status via Claude Code. Each of six developers has their own personal GitHub access token. You want consistent tooling across the team without committing credentials to version control. Which configuration approach is most effective?","domain":"TOOL-MCP","difficulty":2,"choices":[{"label":"A","text":"Have each of the six developers add the GitHub server in user scope with `claude mcp add --scope user`, keeping their personal tokens out of the project entirely."},{"label":"B","text":"Build an MCP server wrapper that reads each developer's token from a local `.env` file and proxies the GitHub API calls, then register that wrapper in the project `.mcp.json`."},{"label":"C","text":"Add the server to the project `.mcp.json` using environment variable substitution (`${GITHUB_TOKEN}`) for auth and document the required environment variable in the project README."},{"label":"D","text":"Configure the server in project scope with a placeholder token committed to `.mcp.json`, and instruct each developer to override that placeholder in their own local config."}],"correct":"C","explanation":"A project `.mcp.json` with environment variable substitution is idiomatic: it provides a single version-controlled source of truth for MCP configuration while letting each developer supply credentials via environment variables. Documenting the variable makes onboarding easy without committing secrets."},{"id":"practice-Q57","scenario":"Customer Support Agent","stem":"Production logs show the agent often calls `get_customer` when users ask about orders (e.g., “check my order #12345”) instead of calling `lookup_order`. Both tools have minimal descriptions (“Gets customer information” / “Gets order details”) and accept similar-looking identifier formats. What is the most effective first step to improve tool selection reliability?","domain":"TOOL-MCP","difficulty":2,"choices":[{"label":"A","text":"Implement a routing layer that analyzes each user message before the turn and preselects the correct tool based on detected keywords and identifier patterns in the text."},{"label":"B","text":"Combine both tools into a single `lookup_entity` tool that accepts any identifier and internally decides whether to query the customer backend or the order backend."},{"label":"C","text":"Add 5-8 few-shot examples to the system prompt that demonstrate correct tool selection, routing each order-related query in the examples to `lookup_order` rather than `get_customer`."},{"label":"D","text":"Expand each tool’s description to include input formats, example queries, edge cases, and boundaries explaining when to use it versus similar tools."}],"correct":"D","explanation":"Expanding tool descriptions with input formats, example queries, edge cases, and clear boundaries directly fixes the root cause—minimal descriptions that don’t give the LLM enough information to distinguish similar tools. It’s a low-effort, high-impact first step that improves the primary mechanism the LLM uses for tool selection."},{"id":"authored-TOOL-1","scenario":"Support assistant with a lookup tool","stem":"You are building a customer-support assistant that has a single tool, lookup_order, which queries the orders database. Many incoming messages are pure greetings, policy questions, or thank-you notes that the model can answer directly from its instructions without any database access. With the current configuration the model is calling lookup_order on almost every turn, including on a simple 'thanks, that's all'. Which tool_choice setting is the most appropriate fix?","domain":"TOOL-MCP","difficulty":2,"choices":[{"label":"A","text":"Set tool_choice to {\"type\":\"auto\"} so the model decides per turn whether to call lookup_order or answer in plain text."},{"label":"B","text":"Set tool_choice to {\"type\":\"any\"} so the model is forced to emit a structured lookup_order call on every turn, even for plain greetings."},{"label":"C","text":"Set tool_choice to {\"type\":\"tool\",\"name\":\"lookup_order\"} to hard-force the database lookup on every single incoming request regardless of intent."},{"label":"D","text":"Remove the lookup_order tool entirely and instead describe the order data inline in the system prompt so the model answers from text."}],"correct":"A","explanation":"{\"type\":\"auto\"} lets the model choose between a tool call and a text answer, which is exactly what is needed when some turns require the database and others do not. {\"type\":\"any\"} and the forced {\"type\":\"tool\",...} both compel a tool call on every turn, which is the very behavior causing the unwanted lookups. Removing the tool would break the legitimate order lookups the assistant still needs."},{"id":"authored-TOOL-2","scenario":"Multi-schema extraction pipeline","stem":"A document-ingestion pipeline must always return structured JSON. It exposes three extraction tools, each with a different schema: extract_invoice, extract_contract, and extract_receipt. The pipeline keeps failing downstream because the model sometimes replies with a prose summary of the document instead of calling any extraction tool, leaving no structured object to parse. You want the model to keep choosing which schema fits each document, but never to answer in free text. Which configuration achieves this?","domain":"TOOL-MCP","difficulty":3,"choices":[{"label":"A","text":"Set tool_choice to {\"type\":\"tool\",\"name\":\"extract_invoice\"} so a tool is always called, accepting that every document gets the invoice schema."},{"label":"B","text":"Set tool_choice to {\"type\":\"any\"} so the model must call one of the extraction tools while still picking the best-matching schema."},{"label":"C","text":"Set tool_choice to {\"type\":\"auto\"} and add a polite sentence to the prompt asking the model to please always use one of the extraction tools."},{"label":"D","text":"Merge all three schemas into one giant extract_anything tool with every possible field marked optional so any document fits the single shape."}],"correct":"B","explanation":"{\"type\":\"any\"} forces the model to call some tool while still letting it pick the best of the three extraction schemas, guaranteeing structured output. Forcing {\"type\":\"tool\",\"name\":\"extract_invoice\"} would lock every document into the invoice schema regardless of its true type. {\"type\":\"auto\"} with a prompt request is the current setup and provides no deterministic guarantee against a text reply. Merging into one mega-schema discards the typed contracts and reintroduces ambiguity."},{"id":"authored-TOOL-3","scenario":"Ordered enrichment workflow","stem":"A data-enrichment agent has two tools: extract_metadata, which pulls identifiers from a raw record, and enrich_record, which calls a paid third-party API using those identifiers. Business rules require that extract_metadata always runs first so enrichment never fires on un-parsed input. The agent occasionally calls enrich_record first, wasting paid API calls on garbage input. Which tool_choice setting best guarantees the required first step?","domain":"TOOL-MCP","difficulty":2,"choices":[{"label":"A","text":"Set tool_choice to {\"type\":\"any\"} so at least one tool is always invoked, trusting the model to usually reach for extract_metadata first."},{"label":"B","text":"Set tool_choice to {\"type\":\"auto\"} and add a reminder in the enrich_record description telling the model to run extraction before enrichment."},{"label":"C","text":"tool_choice {\"type\":\"tool\",\"name\":\"extract_metadata\"} on the first turn to force extraction before any enrichment can occur."},{"label":"D","text":"Lower the model temperature so its decoding is more deterministic and it follows the stated ordering instructions more reliably on each turn."}],"correct":"C","explanation":"A forced {\"type\":\"tool\",\"name\":\"extract_metadata\"} guarantees the specific first action, which is the documented use of forced tool selection for execution order. {\"type\":\"any\"} only guarantees that some tool runs, so the model could still pick enrich_record first. {\"type\":\"auto\"} with a description reminder is prompt-based guidance, not a deterministic guarantee. Temperature affects randomness, not which tool is permitted on the first turn."},{"id":"authored-TOOL-4","scenario":"Invoice extraction with a strict schema","stem":"An accounts-payable pipeline extracts invoices using a tool with a strict JSON schema: an array of line_items (each with amount) plus a stated total. The schema validates cleanly on every call, yet auditors keep finding invoices where the line items do not add up to the total the model reported. The team is surprised because 'the schema is strict.' What is the most accurate explanation and fix?","domain":"TOOL-MCP","difficulty":3,"choices":[{"label":"A","text":"The schema itself is malformed; tightening the JSON types on amount and total will force the numbers to reconcile automatically on the next call."},{"label":"B","text":"A JSON schema guarantees syntactic validity but not semantic correctness, so add a validation step that re-sums line_items against total and retries on mismatch."},{"label":"C","text":"Switch tool_choice to {\"type\":\"any\"} so that the arithmetic relationship between line items and total is enforced during the tool-selection step."},{"label":"D","text":"Add a maximum constraint to the total field in the schema so that impossible or non-reconciling totals are rejected by the validator before output."}],"correct":"B","explanation":"A JSON schema only guarantees that required fields exist and types are correct (syntactic validity); it cannot enforce that values are mutually consistent, so a semantic validation check plus retry-with-feedback is the documented mitigation. Tightening types or adding a maximum still cannot express the cross-field arithmetic relationship. tool_choice controls whether and which tool is called, not the correctness of returned values."},{"id":"authored-TOOL-5","scenario":"Contact extraction from messy resumes","stem":"A resume-parsing tool extracts candidate fields including phone_number, which is currently defined as {\"type\":\"string\"} and listed under required. Reviewers notice that when a resume contains no phone number, the model invents a plausible-looking number rather than omitting it. You need the model to honestly signal absence. Which schema change is most effective?","domain":"TOOL-MCP","difficulty":2,"choices":[{"label":"A","text":"Define phone_number as {\"type\":[\"string\",\"null\"]} and drop it from required so the model can return null when the source has no number."},{"label":"B","text":"Keep phone_number in required as a string but add 'do not make up a number if absent' to its description so the model omits fabricated values."},{"label":"C","text":"Add a strict regex pattern for valid phone numbers to the schema so any fabricated value the model invents gets rejected during validation."},{"label":"D","text":"Set a default value of 'N/A' on the phone_number field in the schema so missing numbers are filled with a placeholder instead of being faked."}],"correct":"A","explanation":"Making the field nullable with {\"type\":[\"string\",\"null\"]} and removing it from required lets the model return null instead of hallucinating, which is the documented way to handle data that may be absent; required fields actively push the model to fabricate values. A description note is non-deterministic guidance. A regex still accepts any well-formed fabricated number. A schema default does not stop the model from emitting an invented value."},{"id":"authored-TOOL-6","s
