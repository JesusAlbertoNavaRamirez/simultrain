t for local sessions; restrict the policy to shared or cloud-hosted sessions where transcripts leave the machine. Transcripts that never leave the machine are also outside the scope of most data-handling policies, and the engineer's local disk is already trusted with the same credentials in configuration files."},{"label":"C","text":"Publish a clear written policy against pasting secrets and add it to onboarding; policy plus awareness is proportionate to the risk."},{"label":"D","text":"Rotate all credentials on a weekly schedule so any pasted secret has a bounded useful life."}],"correct":"A","explanation":"The 'local and private' premise is false: session content persists in transcript files, may flow into logs, resumed sessions, and shared contexts — pasted credentials become durable artifacts outside secret management. Effective enablement pairs the policy with deterministic enforcement (pattern hooks, deny rules) and treats transcripts as data. B accepts the false premise for the most common case. Policy alone (C) loses to deadline pressure reliably. Weekly rotation (D) shrinks the window while leaving the leak pattern intact — and a week is an eternity."},{"id":"pro2-62","scenario":"\"Just tell it to always lint\"","stem":"A team lead wants formatting and lint checks to run after every file edit the coding assistant makes, and proposes adding 'always run the linter after editing any file' to CLAUDE.md. Weeks later, compliance is inconsistent. Why, and what is the correct mechanism?","domain":"DEV-ENABLE","difficulty":3,"choices":[{"label":"A","text":"Instructions to the model are probabilistic — followed usually, not always. Guaranteed-every-time behavior belongs in deterministic automation: a post-edit hook the harness executes on every edit."},{"label":"B","text":"The instruction was too vague — rewriting it with emphatic language and concrete examples of running the linter will reach full compliance. Emphatic phrasing with worked examples is also the standard remedy for an instruction the model follows inconsistently, and it needs no change to the toolchain."},{"label":"C","text":"The instruction was placed in the wrong file — moving it to the user's global configuration gives it higher authority than project-level rules."},{"label":"D","text":"Compliance is inconsistent because the model can't run linters; the instruction should tell it to remind the engineer to lint instead."}],"correct":"A","explanation":"The distinction being tested is instruction versus automation: 'always X' requirements need a mechanism that doesn't depend on the model choosing to comply — hooks execute deterministically on events. Stronger phrasing (B) raises compliance asymptotically, never to 'always.' File placement (C) changes precedence between instructions, not their probabilistic nature. D is factually wrong — assistants run linters fine; occasionally they don't think to, which is precisely the gap hooks close."},{"id":"pro2-63","scenario":"Three agents, one checkout","stem":"An engineer runs three parallel coding-agent tasks (a refactor, a test-writing task, a dependency upgrade) in the same repository checkout. Agents overwrite each other's edits, tests run against half-refactored code, and one commit mixes all three tasks. What working practice fixes this?","domain":"DEV-ENABLE","difficulty":3,"choices":[{"label":"A","text":"Isolate parallel agents in separate workspaces — one git worktree or clone per task, each on its own branch — then integrate through normal review and merge."},{"label":"B","text":"Run the three tasks sequentially in the one checkout; parallel agent work in a shared repository is inherently unsafe, so throughput must be sacrificed. Sequential execution also removes the merge-conflict class of failure entirely rather than mitigating it, at a cost in wall-clock time nobody is currently measuring."},{"label":"C","text":"Keep one checkout but instruct each agent to only touch files relevant to its own task, partitioning by prompt."},{"label":"D","text":"Let agents share the checkout but require each to git stash others' changes before starting work and restore them after."}],"correct":"A","explanation":"Concurrent writers need isolated workspaces — worktrees give each agent a coherent tree and clean commit boundary, and integration happens where conflicts are visible: at merge. Sequencing (B) surrenders parallelism to avoid a problem isolation solves outright. Prompt-partitioning (C) is probabilistic and fails on genuinely shared files (lockfiles, configs, the code the refactor touches). Stash choreography (D) makes agents mutate each other's in-progress state — a race condition dressed as discipline."}]},{"id":"ccar-p-exp","title":"Professional Expert Mock","code":"CCAR-P-MOCK-EXP","certification":"Claude Certified Architect - Professional","tag":"Professional · expert mode","sheet":"SHEET P3","description":"The expert paper: 63 multi-constraint production cases where the textbook answer is ruled out by something in the scenario. Quantitative trade-offs, first-action prioritization among options that are all defensible, and select-two/three items. Every option is something a competent team has proposed.","durationMinutes":120,"passingScore":72,"totalQuestions":63,"sampling":null,"domains":{"SOL-ARCH":{"name":"Solution Design & Architecture","color":"#3B5FC0"},"MODEL-CTX":{"name":"Models, Prompting & Context Engineering","color":"#9E5509"},"INTEG":{"name":"Integration","color":"#0F7A6C"},"EVAL-OPT":{"name":"Evaluation, Testing & Optimization","color":"#7B52C9"},"GOV-RISK":{"name":"Governance, Safety & Risk Management","color":"#B4426B"},"STAKE-COMM":{"name":"Stakeholder Communication & Lifecycle","color":"#4C7A34"},"DEV-ENABLE":{"name":"Developer Productivity & Enablement","color":"#0E7490"}},"questions":[{"id":"pro3-1","scenario":"Decomposing a 40-step claims process","stem":"An insurer's claims process has roughly 40 steps spanning intake, medical coding, fraud screening, adjudication, and payment. The architect must decompose it into Claude-based components. Fraud screening depends on intake data quality; adjudication depends on both coding and fraud output. Which decomposition principle should drive the component boundaries?","domain":"SOL-ARCH","difficulty":5,"choices":[{"label":"A","text":"Split by the five business departments that own the steps today, so each component has a single accountable owner and change requests route cleanly through the existing org structure."},{"label":"B","text":"Split into 40 single-step components so each is independently testable, then compose them with an orchestrator that decides the order at runtime based on claim type."},{"label":"C","text":"Cut at points where a step's output can be independently validated, keeping tightly coupled steps inside one component."},{"label":"D","text":"Cut wherever latency budgets allow parallelism, since the dominant design constraint on a 40-step pipeline is end-to-end wall-clock time and parallel branches recover the most of it."}],"correct":"C","explanation":"Decomposition should follow verifiability: a boundary is only useful if you can assert the output crossing it is correct, which is what stops errors propagating silently. Org boundaries (A) encode Conway's law into the architecture and typically cut through data dependencies. Maximal fragmentation (B) multiplies handoffs, tokens, and failure points, and adds runtime nondeterminism to a process that is mostly fixed. Latency (D) is a real constraint but a derived one - the dependency graph, not the clock, decides what can run in parallel, and cutting to expose parallelism produces seams you cannot assert correctness across."},{"id":"pro3-2","scenario":"Workers that keep editing each other's notes","stem":"An orchestrator dispatches four parallel Claude workers to analyze different sections of an RFP. To 'share findings', each worker appends to a common scratchpad document that the others read mid-run. Results are inconsistent between runs and hard to reproduce. What is the architectural correction?","domain":"SOL-ARCH","difficulty":5,"choices":[{"label":"A","text":"Serialize the workers so each one sees a complete scratchpad, accepting the 4x latency increase as the cost of consistency in a shared-state design."},{"label":"B","text":"Give each worker an immutable input and have it return a structured artifact; the orchestrator merges."},{"label":"C","text":"Add a locking protocol to the scratchpad so only one worker writes at a time, and instruct each worker to re-read the document before it writes so it never overwrites a peer's finding."},{"label":"D","text":"Raise the orchestrator's model tier and lower temperature on the workers, since the inconsistency between runs is fundamentally sampling variance amplified by a long shared context."}],"correct":"B","explanation":"Concurrent mutable shared state makes each worker's context depend on interleaving order, so runs are not reproducible by construction. The fix is the standard fan-out/fan-in shape: immutable inputs, structured returns, one merge point that owns conflict resolution. Serializing (A) removes the order dependence but throws away the parallelism that motivated the design, and still does not make runs byte-identical. Locking (C) prevents lost writes but not order-dependent context. Sampling settings (D) misdiagnose a concurrency defect as sampling noise - and on current Claude models temperature is not an available parameter at all."},{"id":"pro3-3","scenario":"Where corrections should land","stem":"A drafting assistant lets lawyers edit Claude's output before filing. Six months in, 40,000 human-edited pairs exist. An engineer proposes appending the most recent corrections to the system prompt as few-shot examples, refreshed weekly. What should the architect design instead?","domain":"SOL-ARCH","difficulty":5,"choices":[{"label":"A","text":"Keep the weekly refresh but cap it at the twenty most recent corrections so the prompt stays inside a cacheable budget and the freshest lawyer behaviour is always represented."},{"label":"B","text":"Route corrections into a fine-tuning dataset, since 40,000 pairs is well past the threshold where in-context learning stops being the efficient mechanism for encoding preferences."},{"label":"C","text":"Treat corrections as a labelled data asset feeding three distinct sinks: an eval set that measures whether edits are decreasing, a curated retrieval corpus of exemplars, and a periodic prompt revision reviewed like code."},{"label":"D","text":"Have Claude summarize the week's corrections into a short rules paragraph and prepend that to the system prompt, so the loop closes automatically without human curation effort. Automating the loop also removes the delay between a lawyer's correction and the behaviour change, which is where most of the value of feedback is lost."}],"correct":"C","explanation":"A feedback loop is only a loop if something measures whether the system improved; unreviewed prompt growth is an open-loop drift generator. Corrections have three distinct uses - measurement, retrieval exemplars, and reviewed prompt change - and conflating them into prompt text loses all three. A caps the size but keeps the loop unmeasured. B reaches for a mechanism the platform does not offer - there is no fine-tuning path for Claude - and it would still skip the measurement question, so there would be no way to tell whether the trained artifact helped. D automates unreviewed self-modification of production behaviour, the worst variant."},{"id":"pro3-4","scenario":"Two proposals, one 9-month payback rule","stem":"The CFO will fund AI work only with payback inside 9 months. Proposal One automates report drafting: 12,000 analyst hours a year at $65 fully loaded, $400k to build, $220k a year to run. Proposal Two builds a customer-facing self-serve product with no revenue before year two but a projected $3M ARR in year three. How should the architect frame this?","domain":"SOL-ARCH","difficulty":5,"choices":[{"label":"A","text":"Fund Proposal One on the efficiency case, which clears the gate at roughly 8-9 months, and put Proposal Two forward separately under transformation criteria with its own governance and funding horizon."},{"label":"B","text":"Combine both into a single portfolio business case and present a three-year NPV, which comfortably clears the payback requirement once the year-three revenue is discounted into the total."},{"label":"C","text":"Prioritize Proposal Two: transformation-class value permanently outranks efficiency-class value, and an organization that funds only cost takeout never builds the capability to launch new products at all."},{"label":"D","text":"Build Proposal One first and fund Proposal Two quietly from its run budget, using the realized savings to underwrite the exploratory work without needing a second approval cycle from finance."}],"correct":"A","explanation":"Proposal One returns $780k a year against $220k run cost, so $560k net against a $400k build - payback lands just under nine months and clears the stated gate. Proposal Two is a genuine transformation bet but cannot be judged on a payback rule, so it needs its own criteria rather than being smuggled through. Choice B hides a failing initiative inside a passing one and destroys the credibility of both. C substitutes ideology for the constraint the CFO actually set. D funds unapproved work from an operating budget, which is a governance failure regardless of the outcome."},{"id":"pro3-5","scenario":"Ninety percent boring, ten percent unpredictable","stem":"Analysis of 50,000 historical service requests shows 90% follow one of six known paths that existing code already handles, while 10% are genuinely novel and currently escalate to a specialist queue with a three-day wait. What architecture best fits?","domain":"SOL-ARCH","difficulty":4,"choices":[{"label":"A","text":"One agent for everything, with the six known paths supplied as tools it can call - a single surface is simpler to operate, and the agent will naturally learn to use the fast path for routine work."},{"label":"B","text":"Keep all 50,000 in deterministic code and expand the rule set to cover the novel 10% as new patterns are observed, since anything an agent can do can eventually be specified as rules."},{"label":"C","text":"A deterministic classifier routes the 90% to existing code and sends only unrecognized cases to an agent, with the escalation queue kept as the agent's fallback."},{"label":"D","text":"Run both paths on every request and have Claude reconcile the two answers, so the deterministic result acts as a continuous check on the agent and disagreements surface as a quality signal."}],"correct":"C","explanation":"Match the mechanism to the shape of each slice: deterministic code where the path is known, agentic reasoning only on the residual, and a preserved human fallback because a novel-case agent will not be right every time. A pays agent cost and nondeterminism on 90% of traffic that already works. B is the specification trap - novel means not enumerable in advance. D doubles cost on every request to obtain a signal that a sampled comparison would give far more cheaply."},{"id":"pro3-6","scenario":"Three-second SLA, twelve-second worst case","stem":"A contractual SLA requires 99% of quote requests to receive a response within 3 seconds; the contract accepts an acknowledged pending response as a response, but not a wrong answer. The agentic design meets the deadline at p50 (1.4s), but its worst cases reach 12 seconds when three tool calls are needed, each call's arguments derived from the previous call's result. What design satisfies the SLA?","domain":"SOL-ARCH","difficulty":5,"choices":[{"label":"A","text":"Reduce the tool set and switch to the fastest model so the worst case fits inside 3 seconds, accepting the accuracy loss because the SLA is contractual and accuracy is not."},{"label":"B","text":"Bound the synchronous path with a deadline; on breach, return an acknowledged pending response and deliver the completed answer asynchronously through a callback."},{"label":"C","text":"Keep the current design and negotiate the SLA to p50 rather than p99, since a percentile target measured at the tail is unusual in commercial agreements and rarely survives scrutiny."},{"label":"D","text":"Run the three tool calls speculatively in parallel at request start and discard the results the agent does not need, trading token spend for the elimination of sequential tool latency."}],"correct":"B","explanation":"When a hard latency ceiling meets a variable-depth reasoning path, the resolution is a two-tier response contract: a bounded synchronous answer plus asynchronous completion, which honours the deadline without lying about the result. A sacrifices the quality the business explicitly refused to trade. C is worth raising but is a renegotiation, not a design. D helps only when the calls are independent - here each call's arguments come from the previous result, so there is nothing to prefetch, and speculating across branches multiplies cost without moving the worst case."},{"id":"pro3-7","scenario":"Six agents, one transcript","stem":"A six-agent research system appends every agent's full output to one shared conversation history that all six receive on each turn. Token spend grows quadratically with turn count and the agents increasingly repeat each other. What is the correct structural fix?","domain":"SOL-ARCH","difficulty":5,"choices":[{"label":"A","text":"Give each agent its own isolated context and let them exchange only compact structured artifacts through the orchestrator."},{"label":"B","text":"Keep the shared transcript but summarize it every three turns with a cheap model, which bounds growth while preserving the shared awareness that lets agents avoid duplicating each other's work."},{"label":"C","text":"Enable prompt caching on the shared history so the repeated prefix is charged at the cache-read rate, which removes most of the cost penalty without changing the collaboration model at all."},{"label":"D","text":"Reduce to two agents, since the duplication indicates the task was over-decomposed and six specialists cannot coordinate without a shared record of what has already been tried."}],"correct":"A","explanation":"Broadcast context is the defect: every agent pays for every other agent's tokens and gets distracted by them. Context isolation with structured message passing is the standard multi-agent shape. Summarization (B) slows the growth curve while keeping the coupling, and now loses detail too. Caching (C) genuinely works - an append-only transcript caches incrementally and cache reads bill at roughly a tenth of input - but it only makes the waste cheaper: cached tokens still occupy the window and still compete for attention, so the duplication and distraction the stem describes are untouched. D may be right for some tasks but is a guess; nothing here says the decomposition was wrong, only that the wiring is."},{"id":"pro3-8","scenario":"When splitting makes it worse","stem":"A team wants to split a single-prompt document assessment into a multi-agent system. Which TWO properties of the current task indicate that splitting it would make the system worse rather than better? (Select TWO.)","domain":"SOL-ARCH","difficulty":5,"choices":[{"label":"A","text":"The judgement requires weighing all sections against each other simultaneously, so no sub-agent can reach a correct partial verdict from its slice alone."},{"label":"B","text":"The sub-tasks would each need most of the same 30k-token reference material, so no sub-agent gets a narrower problem than the original - the split buys the duplication without the focus."},{"label":"C","text":"The current prompt is 900 tokens long, which is well below the point at which context length starts to degrade instruction adherence in practice."},{"label":"D","text":"The team has no experience operating multi-agent systems and would need to build tracing, retry, and merge infrastructure before the first version could ship safely."},{"label":"E","text":"Assessment volume is only 400 documents a month, so the total spend either way stays small enough that cost cannot be the deciding architectural factor."}],"correct":["A","B"],"explanation":"Two task properties argue against decomposition: holistic judgement that cannot be partitioned (A), and shared context every sub-agent still needs (B), which turns one 30k call into several while narrowing nobody's problem. C is about prompt size, which is not an argument either way. D is a real operational cost but a capability gap, not a property of the task. E argues cost is irrelevant, which is not the same as splitting being harmful."},{"id":"pro3-9","scenario":"The feedback loop that measures nothing","stem":"A content generation system shows a thumbs up/down control. After a year, 97% of outputs receive no rating, ratings correlate weakly with editorial quality, and no prompt change has ever been driven by them. The team asks how to get better feedback. What should the architect propose?","domain":"SOL-ARCH","difficulty":4,"choices":[{"label":"A","text":"Make rating mandatory before the user can copy the output, which lifts coverage from 3% to near 100% and makes the signal statistically usable for the first time."},{"label":"B","text":"Replace thumbs with a five-star scale plus a free-text box, then have Claude cluster the comments monthly into themes the team can prioritize against."},{"label":"C","text":"Add an LLM judge that scores every output continuously, since a complete automated signal is more actionable than a sparse human one and removes the dependence on user goodwill."},{"label":"D","text":"Instrument the work the user already does - what they edited before publishing - and treat edit distance and edit category as the primary signal."},{"label":"E","text":"Sample 200 outputs a month for blind expert review and treat that panel as the authoritative quality measure, accepting the sparsity in exchange for reliability."}],"correct":"D","explanation":"The best feedback is a by-product of work the user is already motivated to do: the edits they make before publishing reveal both that something was wrong and what kind of wrong. Forcing ratings (A) buys coverage with coerced, noisy clicks. B refines an instrument that has already failed to correlate with quality. C is a useful complement, but a judge needs ground truth to be calibrated against. E is exactly that ground truth - and the prerequisite for C - yet 200 samples a month cannot attribute a regression to a cause or drive weekly iteration, and it still leaves the free per-edit signal on the floor. Stand E up alongside D, not instead of it."},{"id":"pro3-10","scenario":"Twenty million items, one six-hour window","stem":"Twenty million catalogue items must be enriched nightly between 23:00 and 05:00 so a 07:00 merchandising report is accurate; assume the enrichment itself reliably completes inside that window. Roughly 3% need human review before publication, and the review team works 09:00-17:00. What does the architecture need beyond batch processing and caching?","domain":"SOL-ARCH","difficulty":5,"choices":[{"label":"A","text":"A second nightly pass that re-runs low-confidence items with a larger model, which converts most of the 3% into publishable output before the report and shrinks the review backlog to a trickle."},{"label":"B","text":"Confidence thresholds tuned until the review rate falls under 1%, since 600,000 items a night is beyond any realistic human review capacity and the queue is therefore the binding constraint."},{"label":"C","text":"A publication policy for unreviewed items - held back, published with a provisional marker, or last-known-good - plus a review queue ordered by business impact."},{"label":"D","text":"A streaming architecture that processes items continuously through the day instead of in a nightly batch, so review and enrichment proceed in parallel and the window disappears."}],"correct":"C","explanation":"The report lands two hours before reviewers arrive, so the real design question is what the system publishes for items that have not been reviewed yet - that policy is a business decision the architecture must express. A and B both try to shrink the queue, which helps but never reaches zero and leaves the 07:00 gap unanswered; B does not even reach a reviewable volume, since 1% of 20 million is still 200,000 items a night. D discards the batch economics that make 20 million items affordable and still does not resolve what happens to items whose review has not completed."},{"id":"pro3-11","scenario":"An agent with write access to the ERP","stem":"An inventory agent must adjust stock levels in the ERP. Finance requires that every change be attributable and reversible, and operations refuses a design where a human confirms each of the roughly 4,000 daily adjustments. What architecture satisfies both?","domain":"SOL-ARCH","difficulty":5,"choices":[{"label":"A","text":"Grant the agent scoped write credentials and rely on the ERP's native audit log for attribution, since the ERP already records who changed what and when for every transaction."},{"label":"B","text":"Have the agent emit a proposed change set that a deterministic applier validates, applies idempotently, and records with a reversible inverse."},{"label":"C","text":"Let the agent write directly but snapshot the inventory tables hourly, so any bad batch can be rolled back wholesale to the previous snapshot within an hour of detection."},{"label":"D","text":"Keep human confirmation but batch it: present operations with an hourly digest of all proposed adjustments and a single approve-all control, which reduces 4,000 decisions to eight."}],"correct":"B","explanation":"Separating the decision (model) from the mutation (deterministic applier) gives you validation, idempotency, attribution, and a stored inverse for reversal without a human in every loop. A gets attribution but no validation gate and no defined reversal path. C reverses in bulk, which also reverses correct changes made in the same hour and cannot express a per-item inverse. D is rubber-stamping with extra steps: an approve-all control over 500 unreviewed items is not human oversight."},{"id":"pro3-12","scenario":"Budgeting a 200k window that still misses","stem":"By turn 30 a support agent's request carries 18k tokens of tool definitions, 60k of conversation history, 40k of retrieved documents and 6k of policy. It fits the 200k window, but p95 latency has drifted to 6.2s against a 3.5s target and answer quality drops in long sessions. What should the architect do?","domain":"MODEL-CTX","difficulty":5,"choices":[{"label":"A","text":"Set an explicit token budget per region - progressive tool discovery, entity-anchored history compaction, retrieval capped by budget rather than by k - and track tokens per turn as an SLI."},{"label":"B","text":"Move to a model with a one-million-token window so the growth is comfortably absorbed, then revisit compaction later once sessions routinely exceed that ceiling too."},{"label":"C","text":"Truncate the conversation to the last ten turns on every request, which caps history growth at a predictable size and restores the latency budget immediately."},{"label":"D","text":"Cache the whole request prefix so repeated content is charged and processed at cache-read rates, which addresses both the latency drift and the cost growth in one change."}],"correct":"A","explanation":"Fitting in the window is not the same as being within budget: latency and relevance both degrade with input size, so each region needs an explicit allocation and a measured SLI. A bigger window (B) removes the only forcing function you had. Blind truncation (C) drops the entity state a support conversation depends on - it will lose the case number and the earlier commitment. Caching (D) is worth doing and does cut prefill latency on the stable regions, but it is not a budget: cached tokens still consume the window and dilute attention, and nothing bounds growth once the retrieved-document region is re-selected every turn."},{"id":"pro3-13","scenario":"Procedure that changes every Tuesday","stem":"Five product teams share one 14k-token system prompt. Most of it is claims-handling procedure that Compliance revises weekly; the rest is an invariant contract about tone, refusal behaviour and output format. Every weekly revision currently forces a full re-validation of all five products. How should this be restructured?","domain":"MODEL-CTX","difficulty":5,"choices":[{"label":"A","text":"Split the prompt into five team-specific copies so each team validates only its own version, and accept the duplication as the price of independent release cadences."},{"label":"B","text":"Keep the invariant contract in the system prompt and move the volatile procedure into versioned, loaded-on-demand Skill artifacts with their own release and eval gate."},{"label":"C","text":"Move the entire prompt into a retrieval corpus so the model fetches whichever procedure section is relevant per request, which removes the weekly redeploy entirely."},{"label":"D","text":"Have Compliance edit the prompt directly in a shared console with change notifications to all five teams, keeping one source of truth and removing engineering from the weekly path."}],"correct":"B","explanation":"Separate things that change at different rates: an invariant behavioural contract belongs in the system prompt, weekly procedure belongs in a versioned artifact with its own gate, so a Compliance change does not re-open the safety surface of five products. A forks the invariant contract five ways and guarantees drift in exactly the part that must not drift. C swaps a versioned artifact for a similarity search: there is no release, no eval gate, and no way to state which procedure version governed a decision, so a miss is both silent and unauditable. D removes review from the path that most needs it."},{"id":"pro3-14","scenario":"The cascade that beats the big model","stem":"The quality bar is 94% on a 500-case domain eval. The large model scores 96.5% at $0.042 per case. The small model scores 91% alone, but routing its low-confidence 18% to the large model yields 96.1% overall at $0.013 per case. Volume is 900,000 cases a month. What should the architect recommend, and what is the main risk to manage?","domain":"MODEL-CTX","difficulty":5,"choices":[{"label":"A","text":"The large model everywhere: at a 0.4-point quality difference, a cascade adds routing complexity, a second failure mode and unpredictable spend, with vendor price changes as the only variable left to watch."},{"label":"B","text":"The small model everywhere, since 91% is within three points of the bar, with the remaining gap to the bar as the risk to monitor as the model family is updated."},{"label":"C","text":"The cascade - it clears the bar at roughly a third of the cost - with the confidence signal's calibration as the risk to monitor and re-verify."},{"label":"D","text":"Run both models on every case and take the large model's answer whenever the two disagree, which reaches the highest achievable accuracy, with double inference cost as the risk to manage."}],"correct":"C","explanation":"The cascade clears the bar (96.1% vs 94%) at about $11.7k a month against $37.8k - a real difference at 900k cases - and the thing that can quietly break it is the confidence estimate: if the small model becomes overconfident on a new input distribution, escalation stops firing and quality falls without any latency or cost alarm. A ignores a $26k monthly delta. B misses the bar. D pays for both models on every case, which is more expensive than the large model alone."},{"id":"pro3-15","scenario":"The clause in the middle","stem":"A due-diligence assistant is given all 60 documents of a data room (about 180k tokens) plus the question. It answers well when the governing clause sits near the start or end of the payload but misses it when it falls in the middle. The team argues that since the payload fits the context window, this must be a prompting problem. What is the correct response?","domain":"MODEL-CTX","difficulty":5,"choices":[{"label":"A","text":"Rewrite the prompt to instruct the model to read every document completely and quote the specific clause it relies on before answering, which forces full-payload attention."},{"label":"B","text":"Retrieve the candidate passages first and put only those in context, adjacent to the question."},{"label":"C","text":"Split the payload into six 30k-token calls and have a final call reconcile the six partial answers into one, so no single call carries a middle region at all."},{"label":"D","text":"Order the documents by upload date and add a table of contents at the top of the payload, giving the model a navigational map of where each agreement type can be found."}],"correct":"B","explanation":"Fitting in the window is not the same as being attended to uniformly; positional degradation in long payloads is a known property, so the architectural answer is retrieve-then-read with the decisive material placed next to the question. A asks the model to overcome the limitation by instruction. C is a legitimate fallback when retrieval is impossible, but it re-pays the question and instruction overhead on every shard, forfeits cross-document comparison, and adds a reconciliation step that can drop the winning clause. D helps a human reader and does nothing about attention distribution."},{"id":"pro3-16","scenario":"Thinking about a closed list","stem":"A ticket router assigns one of 14 fixed queues. The team enabled extended thinking to improve accuracy; accuracy rose 1.1 points, median latency went from 600ms to 4.1s, and cost tripled. Which analysis is correct?","domain":"MODEL-CTX","difficulty":5,"choices":[{"label":"A","text":"The gain is real and the latency is the price of reasoning; keep thinking enabled and recover the budget by shrinking the retrieved examples and the tool definitions instead."},{"label":"B","text":"Thinking is misapplied to closed-set classification; stratified few-shot examples and a constrained output are the right instruments."},{"label":"C","text":"The reasoning effort is simply set too high; step it down until latency returns under a second, which preserves most of the accuracy gain at a fraction of the token cost."},{"label":"D","text":"The comparison is invalid because thinking output was not excluded from the evaluated answer, so the 1.1-point gain is measurement contamination rather than a genuine improvement."}],"correct":"B","explanation":"Extended thinking pays off on multi-step problems with a large solution space; picking one of 14 labels is pattern matching, where examples that cover the confusable boundaries do the work far more cheaply and predictably. A accepts a 7x latency regression on a routing hop and then degrades the inputs that were working. C tunes the depth of a mechanism that should not be in this hop at all. D invents a measurement flaw the scenario does not support."},{"id":"pro3-17","scenario":"Prompt-level or code-level","stem":"A regulated assistant needs five controls: refuse out-of-scope financial advice, never emit a customer's full account number, always return parseable JSON, cap spend per session, and stay in the brand voice. Which THREE of these must be enforced outside the prompt to be a control at all? (Select THREE.)","domain":"MODEL-CTX","difficulty":5,"choices":[{"label":"A","text":"Refusing out-of-scope financial advice, because a determined user can reframe a request until the instruction no longer matches the framing."},{"label":"B","text":"Never emitting a full account number, because a probabilistic generator cannot offer a non-occurrence guarantee - an output filter must be able to block the response."},{"label":"C","text":"Capping spend per session, because the model has no visibility into cumulative token cost and cannot enforce a budget it cannot observe."},{"label":"D","text":"Returning parseable JSON, because free-form generation will eventually emit a stray prose preamble that breaks the downstream parser on some fraction of requests."},{"label":"E","text":"Staying in the brand voice, because tone drifts over long sessions as the conversation context comes to dominate the original styling instruction."}],"correct":["B","C","D"],"explanation":"Three of these are categorically outside the model's reach: a hard non-disclosure guarantee needs a deterministic output filter (B), a spend cap needs an accounting layer the model cannot observe (C), and a parseable-JSON guarantee needs a constrained output format enforced by the serving layer rather than an instruction the model may drift from (D). A is the one item whose boundary is a judgement rather than a mechanical check - no deterministic filter can define out-of-scope advice, so a classifier raises recall without ever guaranteeing the control. E is a quality property, not a control: drift is measured and corrected, not blocked."},{"id":"pro3-18","scenario":"Six examples, one shape","stem":"An extraction prompt carries six few-shot examples. Production accuracy is 93% on tickets under 200 words and 61% above 800 words. Inspection shows all six examples are short, single-issue tickets - the shortest in the training pool, chosen because they kept the prompt small. What is the fix?","domain":"MODEL-CTX","difficulty":5,"choices":[{"label":"A","text":"Add a written instruction that long, multi-issue tickets must be handled with the same care as short ones, and list the extraction fields again at the end of the prompt as a reminder."},{"label":"B","text":"Route long tickets to a separate call with extended thinking enabled, since length correlates with reasoning difficulty and short tickets do not need the extra budget."},{"label":"C","text":"Re-select examples stratified along the dimension that varies - length and issue count - even at the cost of a larger cached prefix."},{"label":"D","text":"Increase the example count from six to twenty by sampling randomly from the pool, on the basis that a larger sample will naturally include the longer cases in proportion to their frequency."}],"correct":"C","explanation":"Few-shot examples teach the shape of the task, so an unstratified sample teaches the wrong shape: the model learned that inputs are short and single-issue. Stratifying across the axis of variance is the direct fix, and the prefix is cached anyway. A tries to instruct around missing demonstrations. B may help but treats a demonstration-coverage defect as a reasoning-budget defect. D samples in proportion to production frequency rather than in proportion to where the errors are, so the failing region stays under-represented relative to its error weight and the fix is left to chance."},{"id":"pro3-19","scenario":"The schema that forbids 'unknown'","stem":"An invoice extractor uses a strict schema in which every field is a required string. Auditors find that when a field is genuinely absent from the document, the model supplies a plausible value - a nearby date, a similar amount - rather than failing. The team is proud that no output has ever failed schema validation. What is the actual defect?","domain":"MODEL-CTX","difficulty":5,"choices":[{"label":"A","text":"The prompt does not tell the model that guessing is worse than leaving a field blank, so it optimizes for producing a complete-looking record."},{"label":"B","text":"Extraction should be verified by a second pass that re-reads the document to confirm each extracted value appears in the source text, catching fabricated fields before they reach the auditors. A verification pass also produces an audit record showing that each extracted value was checked against the source, which is what the auditors ultimately asked for."},{"label":"C","text":"The schema gives abstention no first-class encoding: absence and low confidence are indistinguishable from a real extracted value, so nothing downstream can validate them - nullable fields plus a required evidence span make abstention typed and checkable."},{"label":"D","text":"Strict schemas are the wrong tool for documents with variable layouts; the extractor should emit free-form key-value pairs and let a downstream mapper reconcile them against the target record."}],"correct":"C","explanation":"If the output format has no typed way to say 'not present', the model must produce something that looks like a value to comply - and 100% schema-valid output is then measuring the wrong thing. Nullable fields plus an explicit evidence or confidence requirement make abstention expressible and checkable. A can only produce an untyped sentinel string that validation cannot distinguish from a real value. B adds a check while leaving the cause in place. D discards a valuable constraint instead of correcting it."},{"id":"pro3-20","scenario":"MCP for a nightly batch job","stem":"A nightly Airflow DAG must call Claude to classify 400,000 records, with no user present, a fixed set of two internal services to read from, and a hard 90-minute window. A platform team mandates that all Claude integrations go through MCP servers 'for consistency'. How should the architect respond?","domain":"INTEG","difficulty":5,"choices":[{"label":"A","text":"Comply, and run a long-lived MCP server per DAG worker so the batch job benefits from the same tool surface, discovery semantics, and audit hooks as every interactive integration in the estate. One server per worker also isolates failures, so a hung MCP process affects a single record rather than the whole nightly run."},{"label":"B","text":"Push back with the deciding property: MCP's overhead buys client-agnostic reuse and runtime tool negotiation, and this job is one fixed consumer of two known services - direct API calls inside the DAG are simpler and cheaper here."},{"label":"C","text":"Comply by registering the two services as MCP tools but run one shared server for the whole DAG rather than one per worker, satisfying the mandate at minimum cost."},{"label":"D","text":"Escalate the mandate as a governance conflict, since integration protocol choice belongs to the application team and a platform-wide standard cannot account for workload-specific constraints."}],"correct":"B","explanation":"Protocol selection follows the integration shape. MCP earns its overhead where a client must discover and negotiate tools it did not know about at build time, and where one server is reused by many clients. A batch job with two known services and a fixed schedule wants the plainest possible call path. A adds a server lifecycle and an extra failure mode in exchange for discovery and reuse benefits this job cannot use. C satisfies the mandate more cheaply but still buys discovery machinery for a tool set that is fixed at build time. D is a political move that skips the technical argument the architect is there to make."},{"id":"pro3-21","scenario":"Their agent wants to talk to ours","stem":"A logistics partner's agent needs to negotiate delivery slots with your fulfilment agent, several times a minute, across an organizational trust boundary. Your fulfilment tools include inventory adjustment and refund issuance. What integration design is appropriate?","domain":"INTEG","difficulty":5,"choices":[{"label":"A","text":"Expose your existing MCP server to the partner over the internet with an API key per partner plus per-partner rate limits and audit logging, so their agent can use the same tools your internal agents already use."},{"label":"B","text":"Have both agents read and write a shared queue of slot proposals, letting each poll for the other's messages and converge without a synchronous protocol between the two companies."},{"label":"C","text":"Publish a narrow agent-to-agent interface for slot negotiation under its own authorization scope; internal tools stay unreachable from outside."},{"label":"D","text":"Put a human coordinator between the two agents to approve each negotiated slot, since cross-organizational automation of commercial commitments carries too much liability to run unattended."}],"correct":"C","explanation":"Across a trust boundary you publish a purpose-built, minimally-scoped interface - the negotiation capability only - and you never expose the internal tool surface, however well instrumented it is. A hands a partner's agent a path to refunds and inventory writes with one credential; rate limits and logs constrain volume and provide evidence after the fact, not authority. B is a transport choice that ducks the authorization question entirely. D would work for a few slots a day but not several a minute, and the scenario's volume rules it out."},{"id":"pro3-22","scenario":"Three hundred tools, forty of them plausible","stem":"An operations agent must reach 300 internal tools. Loading all definitions costs 90k tokens and tool-selection accuracy sits at 71%; for any given request, 40 or so tools look superficially applicable. The team proposes prefixing tool names with team namespaces to reduce confusion. Evaluate.","domain":"INTEG","difficulty":5,"choices":[{"label":"A","text":"Namespacing helps disambiguate similarly named tools but does not address either problem: introduce a discovery step that searches a tool catalogue and loads only the matching definitions."},{"label":"B","text":"Namespacing is sufficient once combined with sharper one-line descriptions, because selection errors at this scale are overwhelmingly caused by ambiguous naming rather than by the number of candidates."},{"label":"C","text":"Split the agent into eight domain agents of roughly 40 tools each and add a router in front, since no single agent should ever be given a surface this wide regardless of how it is described."},{"label":"D","text":"Keep all 300 definitions loaded but cache the prefix so the 90k tokens are charged at cache-read rates, then improve accuracy separately with few-shot examples of correct tool choices."}],"correct":"A","explanation":"Two-stage progressive discovery - search the catalogue, then load the handful of relevant definitions - attacks both the token cost and the selection accuracy, because a smaller candidate set is an easier decision. Namespacing, conceded in A and relied on in B, fixes name collisions rather than a decision among 40 genuinely plausible candidates, and it adds tokens rather than removing them. C can work but replaces one selection problem with a routing problem and duplicates cross-domain tools; it is a heavier answer than the problem requires. D makes the waste cheaper and leaves accuracy at 71%."},{"id":"pro3-23","scenario":"The re-ranker and the 1.5-second budget","stem":"End-to-end budget is 1500ms. At p50, generation takes 900ms, embedding the query 40ms, vector search 120ms and prompt assembly 30ms, and the generator currently receives the top 5 passages. A cross-encoder re-ranker over the top 50 candidates adds 340ms and improves answer accuracy by 6 points. Sequentially that totals 1430ms - inside budget at the median, with almost no headroom for variance. What is the best configuration decision?","domain":"INTEG","difficulty":5,"choices":[{"label":"A","text":"Ship the sequential 1430ms path: it is inside the stated budget, the accuracy gain is large, and adding engineering complexity to reclaim 70ms is premature optimization."},{"label":"B","text":"Drop the re-ranker and raise k from 5 to 15 passages instead, recovering most of the accuracy benefit by giving the model more candidates rather than better-ordered ones."},{"label":"C","text":"Re-rank a smaller candidate set and cap it with a deadline that falls back to vector order, so tail variance cannot breach the budget."},{"label":"D","text":"Re-rank asynchronously after the answer streams and correct the response if the re-ranked evidence contradicts what was already sent to the user."}],"correct":"C","explanation":"A p50 of 1430ms against a 1500ms ceiling means the tail is already over: the design needs a bounded re-rank with a deadline and a defined degraded path, which keeps most of the accuracy and makes the budget survivable. A treats a median as if it were the distribution. B trades better ordering for more tokens, which raises generation latency and dilutes the context - often a net loss. D shows the user an answer and then retracts it, which is worse than a slightly slower correct answer."},{"id":"pro3-24","scenario":"Chunking a balance sheet","stem":"The corpus is 12,000 annual reports. Queries ask for specific line items ('2023 lease liability for entity X'), and the decisive qualifier is often in a footnote 40 pages away from the table. The current pipeline uses 800-token chunks with 100-token overlap. What indexing strategy fits this data shape?","domain":"INTEG","difficulty":5,"choices":[{"label":"A","text":"Increase chunk size to 4,000 tokens with 800-token overlap so a table and its surrounding narrative stay together, and rely on the larger window to keep context intact."},{"label":"B","text":"Parse the structure and index one record per line item, carrying entity, period, value and the resolved footnote text as fields, so the retrieval unit matches the question."},{"label":"C","text":"Keep the current chunking but add a second embedding pass over document-level summaries, then retrieve the summary first and drill into chunks from the matching document afterwards."},{"label":"D","text":"Chunk by page and add the page's header and footer to every chunk as metadata, so retrieval can reconstruct where in the report each fragment came from and reassemble neighbours on demand."}],"correct":"B","explanation":"Structured source data should be indexed as structured records: the retrieval unit is the line item, and the far-away footnote must be resolved at index time because no overlap window will ever span 40 pages. A grows the chunk without ever reaching the footnote and dilutes the embedding. C helps find the right document but leaves the same intra-document problem. D preserves provenance, which is useful, but the retrieval unit is still a page of prose that may not contain the qualifier."},{"id":"pro3-25","scenario":"How many contracts expire in Q3","stem":"A contract assistant built on vector retrieval handles 'what does the termination clause say' well. It fails on 'how many of our contracts auto-renew before September' - answering with a confident number drawn from the handful of retrieved chunks. Users report the counts are always wrong. What is the correct fix?","domain":"INTEG","difficulty":5,"choices":[{"label":"A","text":"Raise top-k substantially for counting questions and instruct the model to enumerate every match it finds before reporting a total, so the count reflects a larger evidence set."},{"label":"B","text":"Add a re-ranker so the retrieved chunks are the most relevant available, which makes the sample the model counts over far more representative of the corpus."},{"label":"C","text":"Classify query intent and route aggregate questions to a query over extracted contract metadata, because a count needs completeness rather than the best-matching sample."},{"label":"D","text":"Include the total corpus size and a per-document metadata block in the prompt so the model can reason about what proportion of the corpus its retrieved sample represents and extrapolate accordingly."}],"correct":"C","explanation":"Top-k similarity retrieval samples; aggregation requires completeness. No amount of ranking quality makes a sample a census, so aggregate intents must be routed to a structured query over extracted fields. A pushes k toward the whole corpus and still cannot guarantee recall of every matching contract. B improves relevance, not completeness. D asks the model to extrapolate a count from a biased sample, which produces a confidently wrong number with arithmetic attached."},{"id":"pro3-26","scenario":"The policy that was true last month","stem":"An insurance assistant must answer according to the policy version in force on the claim's date of loss, not today's version. The index currently holds the latest text of each policy document and is refreshed nightly. Auditors found answers citing current wording for historical claims. What must the retrieval design provide?","domain":"INTEG","difficulty":5,"choices":[{"label":"A","text":"A nightly snapshot of the whole index kept for seven years, so any historical answer can be reproduced by pointing the assistant at the snapshot for the relevant date."},{"label":"B","text":"Effective-dated versions as first-class index records, with the claim's date of loss applied as a hard retrieval filter and superseded text retained rather than overwritten, so a retroactive correction adds a version instead of replacing one."},{"label":"C","text":"A prompt instruction that the assistant must state the policy version and effective date it is relying on, so a reviewer can detect and correct any answer based on the wrong version. Requiring the assistant to name its source also gives adjusters something to check against the claim file, which is the review step auditors asked for."},{"label":"D","text":"A more frequent refresh cycle - streaming updates rather than nightly - so the index is never more than minutes behind the authoritative policy repository."}],"correct":"B","explanation":"Temporal correctness has to be modelled in the data: version records with effective dates, a filter driven by the business date, and no destructive overwrite. A can reproduce answers but is coarse and expensive, and it ties correctness to when the index happened to be captured rather than to when the policy text was in force. C makes the error visible after the fact instead of impossible. D solves freshness, which is the opposite problem - the assistant is too current, not too stale."},{"id":"pro3-27","scenario":"One index, many entitlements","stem":"An enterprise search assistant authenticates the user with OAuth and passes their identity to the model. The vector index was built from all of SharePoint with no per-document permissions. A pilot user retrieved a passage from an HR investigation file they cannot open in SharePoint itself. What is the required correction?","domain":"INTEG","difficulty":5,"choices":[{"label":"A","text":"Add a post-generation check that removes any sentence traceable to a document the user cannot access, so restricted content never reaches the response body."},{"label":"B","text":"Instruct the model in the system prompt to decline to use any document whose classification header indicates restricted access, and index that header with every chunk."},{"label":"C","text":"Carry the source ACL on every chunk and filter by the caller's entitlements inside the retrieval query, so unauthorized content is never a candidate in the first place."},{"label":"D","text":"Exclude the sensitive document libraries from indexing altogether, which removes the exposure and keeps the retrieval layer free of per-user authorization logic."}],"correct":"C","explanation":"Authorization must be enforced at retrieval, before content enters the context: an ACL-aware filter in the query is the only point where 'this user cannot see this' is a hard property. A is post-hoc redaction of data that has already been read by the model and logged. B delegates an access-control decision to a probabilistic instruction. D reduces the corpus to the lowest common denominator and destroys the assistant's value for privileged users, and the next sensitive library will be indexed by someone who did not know the rule."},{"id":"pro3-28","scenario":"Two hundred agents, one bad Tuesday","stem":"Roughly 200 agent instances run daily across 14 workflows. On Tuesday, an unknown subset began producing subtly wrong outputs; nobody can tell which workflows, which step, or when it started. Which THREE observability capabilities would have localized this? (Select THREE.)","domain":"INTEG","difficulty":5,"choices":[{"label":"A","text":"Per-run traces linking each step to its inputs, tool calls and outputs, so a bad output can be walked backwards to the step that introduced the error."},{"label":"B","text":"Version stamps on every run recording prompt, model, tool schema and retrieval corpus versions, so a behaviour change can be correlated to a specific deployment."},{"label":"C","text":"Continuous quality scoring segmented by workflow and input type, alerting on per-segment thresholds rather than on a global average."},{"label":"D","text":"Total token consumption and API spend per hour, charted against the trailing two-week baseline to reveal anomalous processing volumes."},{"label":"E","text":"End-user thumbs-down counts aggregated daily across all 14 workflows, with a weekly review of the free-text comments attached to negative ratings."},{"label":"F","text":"Infrastructure metrics for the agent hosts - CPU, memory, request concurrency and container restart counts - with alerting on saturation."}],"correct":["A","B","C"],"explanation":"Localizing a subtle quality regression needs causal structure (A), change attribution (B), and a segmented quality signal that can actually fire (C). Spend (D) moves with volume, not correctness. Aggregated thumbs-down (E) is sparse, lagging, and averaged across the very dimension you need to separate. Infrastructure health (F) will look perfect throughout - the system is behaving, just wrongly."},{"id":"pro3-29","scenario":"The email that cannot be unsent","stem":"A returns agent performs four steps: issue a refund, adjust stock, email the customer, and cancel the shipment with the carrier. Step four failed with a partner timeout after the refund had already gone through and the email had been sent. The team asks for a transaction. What should the architect design?","domain":"INTEG","difficulty":5,"choices":[{"label":"A","text":"Wrap all four steps in a distributed transaction with a two-phase commit coordinator, so a failure in any step rolls the whole set back and the customer sees a consistent outcome. A single coordinator also gives the team one place to inspect whenever an order ends up in a half-completed state."},{"label":"B","text":"Reorder the steps so all reversible operations run first and the irreversible email is sent last, then retry the failed step until it succeeds."},{"label":"C","text":"Sequence by reversibility and define an explicit compensating action per step, with irreversible effects gated behind the last recoverable checkpoint and a durable saga log driving retry or compensation."},{"label":"D","text":"Make every step idempotent and retry the whole sequence from the beginning on any failure, since idempotency means repeated refunds and repeated emails have no additional effect."}],"correct":"C","explanation":"External side effects cannot be rolled back, so the pattern is a saga: order steps by reversibility, define a compensating action for each, put irreversible effects behind the final recoverable checkpoint, and drive it from a durable log. A assumes partner APIs support two-phase commit, which they do not, and no coordinator can un-send an email. B has the right instinct on ordering but the email is the irreversible step and it already ran before the failure, and 'retry until it succeeds' has no bound and no compensation path when the partner stays down. D confuses idempotency at the API level with semantic harmlessness - a second customer email is a real effect even if the underlying record is unchanged."},{"id":"pro3-30","scenario":"Forty calls to answer one question","stem":"Asked 'what did we spend with vendor X last quarter', the agent calls a paginated transactions tool 40 times at 100 records a page, accumulating 220k tokens of raw rows, then sums them - slowly, and sometimes incorrectly. The transactions service is owned by your team and can expose new endpoints. What is the right integration change?","domain":"INTEG","difficulty":4,"choices":[{"label":"A","text":"Raise the page size to 2,000 records so the same data arrives in two calls instead of 40, cutting round trips and latency dramatically."},{"label":"B","text":"Expose a tool that performs the aggregation server-side and returns the computed figure with its filter parameters, so the model receives a result rather than the rows behind it."},{"label":"C","text":"Keep pagination but have the agent maintain a running total across pages and discard each page from context after adding it, bounding context growth to a single page at a time."},{"label":"D","text":"Give the agent a code execution tool and let it fetch the pages programmatically and compute the sum in code, keeping the raw rows out of the model's context entirely."}],"correct":"B","explanation":"Push the computation to where the data lives: a tool that answers the question returns tens of tokens instead of 220k and removes model arithmetic from the critical path. A still ships every row into context. C bounds context but keeps the model doing running arithmetic across 40 turns, which is exactly the error-prone part. D removes both the context and the arithmetic problems and is the right answer when you cannot change the API - but it still pulls a quarter of transaction history over the wire on every question, and since the service is yours to extend, the aggregation belongs behind its API rather than in a client-side script."},{"id":"pro3-31","scenario":"English queries, German manuals","stem":"Support engineers query in English. 60% of the service manuals are German, 25% Japanese, 15% English. Recall on non-English content is poor. The team proposes translating each incoming query to German and Japanese and running three searches. What is the better approach?","domain":"INTEG","difficulty":4,"choices":[{"label":"A","text":"Index with a multilingual embedding model so semantically equivalent text lands in one shared space, and verify recall per language on a labelled set."},{"label":"B","text":"Translate the whole corpus into English at index time and serve retrieval from the translated text, keeping a pointer back to the source document for display and citation."},{"label":"C","text":"Proceed with query-time fan-out translation, then fuse the three result sets by reciprocal rank before passing passages to the model."},{"label":"D","text":"Keep the monolingual index and instruct the model to answer from whatever it retrieves, noting when relevant material may exist in a language the search did not cover."}],"correct":"A","explanation":"The defect is an embedding space that does not place equivalent meanings together across languages, so the fix belongs at index time with a multilingual model, measured per language. B is a legitimate second-best - it works, but translation loss is baked into the index permanently, retrieved passages no longer match the wording of the source document they cite, and re-translation is needed whenever the corpus or translator changes. C triples query cost on every request and inherits machine-translation errors at query time, where they cannot be inspected or corrected. D documents the failure rather than fixing it."},{"id":"pro3-32","scenario":"Eight hundred cases, two weeks, one analyst","stem":"A discharge-summary generator must be evaluated before a go/no-go in two weeks. 800 historical cases are available. One clinician can review at most 60. Required properties: correct medication list, no invented findings, required sections present, readable tone. How should the evaluation be constructed?","domain":"EVAL-OPT","difficulty":5,"choices":[{"label":"A","text":"Have the clinician review a random 60 and, if the pass rate exceeds the threshold, treat it as a representative sample of the full 800 by standard sampling logic."},{"label":"B","text":"Tier the methods to the properties: programmatic checks on medication lists and section presence, an LLM judge validated against clinician labels for invented findings and tone, and the clinician's 60 spent on the highest-risk cases."},{"label":"C","text":"Run an LLM judge over all 800 against a written rubric covering all four properties, and give the clinician the 60 the judge scored lowest so expert time is spent where quality is worst."},{"label":"D","text":"Score all four properties with programmatic heuristics, using a medication dictionary, section regexes, a claim-matching check against the source chart and a readability index, so the whole 800 is measured consistently. A single programmatic suite also re-runs on every future release at no additional expert cost."}],"correct":"B","explanation":"Different properties demand different instruments: medication lists and section presence are decidable in code, invented findings and tone need a judge that has first been calibrated against expert labels, and scarce clinical time belongs on the cases where being wrong costs most. A wastes the strongest instrument on cases code could clear and gives no coverage of the other 740. C uses an unvalidated judge as the primary measure and then samples only its low scores, so judge false-negatives are never discovered. D never spends the clinician at all: claim-matching against the chart and a readability index are plausible instruments, but nothing in the design establishes that either agrees with expert judgement, so all four scores stay unvalidated."},{"id":"pro3-33","scenario":"The 2.1-point win","stem":"An A/B test of a new prompt reports 84.3% vs 82.2% task success over 180 conversations attributed to each arm after the fact, and the team wants to ship. Investigation shows the split is assigned per request, so a single multi-turn conversation can traverse both arms. What is the first thing to fix?","domain":"EVAL-OPT","difficulty":5,"choices":[{"label":"A","text":"Run the test longer to reach a few thousand conversations per arm, since at n=180 a two-point difference is well inside the range that sampling noise produces on its own."},{"label":"B","text":"Correct the unit of assignment to the conversation before drawing any conclusion - with requests randomised inside conversations, neither arm's number cleanly measures either prompt."},{"label":"C","text":"Add a paired offline comparison on a frozen eval set to corroborate the online result, since offline and online agreement is the standard evidence bar for a prompt change."},{"label":"D","text":"Define the success metric more tightly and re-score both arms retrospectively using the stored transcripts, which removes metric ambiguity without spending more traffic."}],"correct":"B","explanation":"Assignment contamination invalidates the measurement: with arms mixed inside a conversation, the interference is unbounded and most conversations cannot be attributed at all, so no amount of statistics on the current data recovers a conclusion. Fix the unit of assignment first, then worry about power. A is true and secondary - at this sample size a two-point difference is well inside noise, but more traffic through a leaking split just gives a tighter estimate of a meaningless quantity. C and D are both good practices applied to data that cannot support them."},{"id":"pro3-34","scenario":"Fabricated citations, but only sometimes","stem":"A research assistant invents plausible source citations in about 4% of answers. Correlating with logs shows every fabricated citation occurs on a request where retrieval returned zero passages above the similarity floor. What is the correct diagnosis and fix?","domain":"EVAL-OPT","difficulty":5,"choices":[{"label":"A","text":"The similarity floor is set too high, so legitimate passages are being discarded; lower the threshold and the model will have real sources to cite in those 4% of requests."},{"label":"B","text":"The model is under-instructed about citation format; require a verbatim quotation and a document identifier with every claim so that fabricating a citation becomes materially harder."},{"label":"C","text":"The system has no defined behaviour for the no-evidence case; make abstention explicit and enforce it with a grounding check that rejects unsupported citations."},{"label":"D","text":"This is inherent hallucination risk at a tolerable rate; add a disclaimer that citations should be independently verified and monitor the rate for regression."}],"correct":"C","explanation":"The failure is fully explained by an unhandled state: asked to answer with sources and given none, the model produces the shape of an answer. Making 'I have no evidence for this' a first-class, instructed, and verified outcome removes the 4% entirely. A may be worth tuning but there will always be queries with genuinely no coverage. B makes fabrications more convincing, not rarer. D accepts fabricated citations in a research product with a footnote."},{"id":"pro3-35","scenario":"Cheaper per call, worse per outcome","stem":"Spend is $61k a month. A team proposes switching to a smaller model to cut it. Profiling shows 70% of input tokens are a 30k-token static instruction block re-sent on every call with no caching, and 22% of tasks require a user retry because the first answer was unusable. What should be done first, and how should the result be measured?","domain":"EVAL-OPT","difficulty":5,"choices":[{"label":"A","text":"Switch models first because it is a one-line change with an immediate and predictable saving, then address caching and retries as follow-up work in the next iteration."},{"label":"B","text":"Cache the static prefix and drive down the retry rate before touching the model, and measure cost per successfully completed task rather than cost per call."},{"label":"C","text":"Do both at once so the saving compounds, using the eval suite to confirm that the combined change holds quality within tolerance before the rollout completes."},{"label":"D","text":"Reduce the instruction block itself by rewriting it far more concisely, since a 30k-token static prompt is oversized by any standard and shrinking it lowers both cost and latency."}],"correct":"B","explanation":"Two structural inefficiencies dominate: uncached repetition and a 22% retry rate, where each retry multiplies the true cost of a task. Fix those and measure per successful outcome, otherwise a smaller model can look cheaper per call while raising the retry rate and total spend. A attacks unit price while leaving both structural wastes intact - it still pays for 30k uncached input tokens on every call - and a weaker model plausibly raises the retry rate, so spend per completed task can rise as cost per call falls. C changes two variables simultaneously and forfeits attribution. D is worth doing, but a caching change is cheaper, safer, and larger than a rewrite of instructions that presumably earn their length."},{"id":"pro3-36","scenario":"The grader moved","stem":"A quality dashboard driven by an LLM judge dropped four points overnight. No prompt, corpus or model change was deployed on the graded system; the judge was configured to use a rolling model alias that had been updated. Which response is correct?","domain":"EVAL-OPT","difficulty":5,"choices":[{"label":"A","text":"Re-baseline the dashboard to the new judge's scale and continue, since the new judge is presumably more capable and its scores are the better estimate going forward."},{"label":"B","text":"Pin the judge to an explicit version, treat judge changes as their own release, and keep a fixed calibration set with known scores to detect judge movement."},{"label":"C","text":"Average the two judges' scores during a transition period so the historical trend line remains continuous and the team can still see quality movement week over week."},{"label":"D","text":"Replace the LLM judge with programmatic assertions, since any measurement instrument that can silently change beneath you is unsuitable for a production quality dashboard."}],"correct":"B","explanation":"A measuring instrument that changes without a release is the defect: pin the version, gate judge upgrades like any other change, and run a calibration set whose expected scores make drift visible. A discards comparability and the ability to detect the next drift. C blends two scales and hides the discontinuity rather than resolving it. D throws out judge-based evaluation for rubric properties that assertions cannot express."},{"id":"pro3-37","scenario":"Fine at p50, terrible at p99","stem":"p50 latency is 1.1s; p99 is 47s. Traces show the p99 requests all call a third-party tool, owned outside the team, that intermittently times out, after which the agent retries it up to five times with exponential backoff inside the request. Which action addresses the SLO breach?","domain":"EVAL-OPT","difficulty":5,"choices":[{"label":"A","text":"Stream tokens to the client so the user sees output immediately, which substantially improves perceived latency without changing the underlying retry behaviour."},{"label":"B","text":"Bound retries within a request deadline and break the circuit on the failing dependency, with a defined degraded answer when it is unavailable."},{"label":"C","text":"Fix the flaky tool - the retries are a symptom, and any latency work done before the dependency is stabilized is treating the wrong system."},{"label":"D","text":"Remove the backoff so the five retries complete quickly, cutting the worst case to roughly the sum of five timeouts rather than the sum plus the backoff intervals."}],"correct":"B","explanation":"The architect's obligation is to make the caller's latency independent of a dependency's bad day: a request-level deadline, bounded retries, a circuit breaker, and a defined degraded response. A hides completion time behind streaming while the answer still takes 47 seconds. C is correct in the long run but does not discharge the caller's obligation - the tool belongs to another team, and even a stabilized dependency fails sometimes, so until this request bounds its own retry budget the p99 is owned by someone else's uptime. D hammers a struggling dependency harder and still blows the budget."},{"id":"pro3-38","scenario":"What does safe look like as a number","stem":"An agent can issue credits and update customer records. Leadership asks for 'safety and security metrics' alongside accuracy, cost and latency. Which set is actually measurable and diagnostic for this system?","domain":"EVAL-OPT","difficulty":4,"choices":[{"label":"A","text":"Refusal rate, toxicity score on generated text, and the count of user complaints mentioning inappropriate responses, reported weekly with trend lines."},{"label":"B","text":"Attempted out-of-policy action rate, injection-resistance pass rate on a red-team suite, and value at risk per unreviewed action."},{"label":"C","text":"Number of guardrails deployed, percentage of requests passing the input filter, and time since the last security incident involving the agent."},{"label":"D","text":"Human approval coverage as a percentage of actions taken, plus average reviewer time per approval, as the primary indicators that oversight is functioning."}],"correct":"B","explanation":"For an acting agent, safety is about actions and exposure: how often it tries something out of policy, whether it can be talked into it, and how much money a single unreviewed action can move. A measures a conversational system's concerns, not an acting one's. C counts controls and elapsed time - activity metrics that go up while risk does too. D measures the oversight process rather than the outcome, and coverage says nothing about whether reviewers catch anything."},{"id":"pro3-39","scenario":"Making the suite predictive","stem":"An offline suite reports 94% while production sits near 78%. Which TWO changes would most improve the suite's ability to predict production behaviour? (Select TWO.)","domain":"EVAL-OPT","difficulty":5,"choices":[{"label":"A","text":"Sample cases from the production distribution including the tail slices - malformed inputs, unusual document types, adversarial phrasings - rather than from curated clean examples."},{"label":"B","text":"Version and freeze everything the score depends on - prompt, model, tool schemas, retrieval corpus - so a suite result maps to one identifiable system state."},{"label":"C","text":"Expand the suite from 300 to 3,000 cases drawn from the same source as the current ones, which tightens the confidence interval around the reported figure considerably."},{"label":"D","text":"Grade with a panel of three judge models and take the majority verdict, reducing the variance and single-model bias in the scoring step."},{"label":"E","text":"Raise the temperature during evaluation to match production sampling variability, so the suite experiences the same output diversity real users see."}],"correct":["A","B"],"explanation":"A 16-point gap is a representativeness problem: the suite must draw from production's actual distribution, tail included (A), and be reproducible against a pinned system state (B) or its number describes nothing in particular. C measures the wrong population more precisely. D changes only how outputs are scored, and the gap is not a scoring-variance problem; B is different in kind - with prompt, model, tool schemas and corpus unpinned, the 94% may not describe the system actually in production, so the suite cannot predict it even when the inputs are representative. E adds noise to the measuring instrument; production variance is what the suite should predict, not imitate."},{"id":"pro3-40","scenario":"Green suite, unchanged users","stem":"Every time the regression suite catches a failure, the team adds that exact case to the prompt's few-shot examples. The suite now passes at 99%; production complaint rates are unchanged over six months. What has happened and what is the remedy?","domain":"EVAL-OPT","difficulty":5,"choices":[{"label":"A","text":"The suite is too small to represent production, and it should be expanded with fresh cases until its size is proportionate to the diversity of real traffic."},{"label":"B","text":"The examples have accumulated into a bloated prefix whose contradictory instructions cancel out, so the prompt needs consolidating and rewriting as coherent rules."},{"label":"C","text":"The test cases have been absorbed into the system under test as few-shot examples, so the suite now measures memorization; move the fixed cases to a held-out set and fix failures with generalizing changes."},{"label":"D","text":"Complaint rate is too lagging and noisy to reflect prompt improvements, and the team should adopt a direct online quality measure before concluding the suite is misleading. Complaint volume also depends on how easy the product makes complaining, which changed twice during the same six months."}],"correct":"C","explanation":"Putting the failing case into the prompt guarantees that case passes and teaches nothing about the class it represents - the suite has been contaminated into a memorization check. The remedy is a holdout the prompt never sees, plus fixes aimed at the underlying pattern. A adds cases to a process that will absorb them the same way. B might be true as well but is a secondary effect. D questions the production signal when the offline signal is the one that has been compromised."},{"id":"pro3-41","scenario":"One invoice, nine teams","stem":"Monthly spend has grown to $180k on a single organizational account. Nine teams share it. Finance wants accountability; the platform team's instinct is to rate-limit whoever is consuming most. What should the architect put in place?","domain":"EVAL-OPT","difficulty":4,"choices":[{"label":"A","text":"Per-team rate limits sized to last quarter's consumption, which caps runaway growth immediately and forces any team needing more to justify an increase."},{"label":"B","text":"Request-level attribution metadata feeding per-team dashboards of spend a
