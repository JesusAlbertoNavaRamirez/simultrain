,"text":"The instruction conflicts with the catalogs' content; deduplicate the catalogs so the rule is the only pricing-related text."},{"label":"D","text":"Temperature is too high for compliance tasks; lower it so the model samples the rule-following completion more often."}],"correct":"A","explanation":"This is the lost-in-the-middle effect: retrieval of instructions degrades when they're buried mid-context among bulky, similar material — the same rule works in short prompts, which rules out capability. Position and separation (directives in the system prompt or near the task) is the fix. B misdiagnoses a positional effect as a size limit; C invents a conflict; D treats an attention problem as a sampling problem."},{"id":"pro2-14","scenario":"Determinism, allegedly","stem":"An extraction service runs at temperature 1.0 and loops until output passes schema validation — sometimes five attempts. An engineer proposes setting temperature to 0, asserting outputs will then be identical and always valid, so the retry loop can be deleted. What is the accurate assessment?","domain":"MODEL-CTX","difficulty":4,"choices":[{"label":"A","text":"Low temperature reduces variance and retries substantially, but guarantees neither bit-identical outputs nor validity — keep the validation."},{"label":"B","text":"The engineer is right: temperature 0 is greedy decoding, which is fully deterministic, so validation becomes redundant. Greedy decoding is also what every determinism argument in the literature rests on, so the validation layer is guarding against a failure that cannot occur."},{"label":"C","text":"Temperature should stay at 1.0 — lowering it reduces the model's accuracy on structured tasks even as it reduces variance."},{"label":"D","text":"Temperature is irrelevant to validity; only few-shot examples change the rate of schema-invalid outputs."}],"correct":"A","explanation":"Directionally the engineer is right — extraction should run at low temperature — but the two absolute claims are wrong: floating-point and serving nondeterminism mean temperature 0 is not bit-reproducible, and deterministic sampling of a wrong completion is still wrong. Validation stays. B swallows the false guarantee whole; C keeps a bad setting; D ignores that sampling variance is a real source of malformed outputs."},{"id":"pro2-15","scenario":"Five glowing examples","stem":"A ticket-sentiment classifier uses five few-shot examples — all of them positive-sentiment tickets, added over time because those were handy. In production it labels 22% of clearly frustrated tickets as positive. Test prompts without examples do better. What went wrong?","domain":"MODEL-CTX","difficulty":3,"choices":[{"label":"A","text":"The example set taught an unintended prior: uniformly positive exemplars bias predictions positive. Rebuild it to cover all classes in realistic proportion."},{"label":"B","text":"Five examples is too few for classification; expand to at least twenty-five examples regardless of their class mix. Classification accuracy is known to improve with example count, and twenty-five examples still fits comfortably inside a cacheable prefix."},{"label":"C","text":"Few-shot prompting is inappropriate for classification; remove the examples permanently since zero-shot outperformed."},{"label":"D","text":"The examples consumed context budget needed for the ticket text; shorten each example to one line."}],"correct":"A","explanation":"Few-shot examples teach a distribution, not just a format — an all-positive set is a positive prior, which is why zero-shot beat it. Class-balanced examples with hard cases fix it. More examples of the same skew (B) amplifies the bias. Abandoning few-shot (C) discards a technique that outperforms zero-shot when done right — the comparison condemned these examples, not examples. Length (D) is not the failure observed."},{"id":"pro2-16","scenario":"Answering from the ghost document","stem":"During a long contract-negotiation session, a user uploads revision 3 of a draft; twenty turns later they upload revision 4 and ask questions \"about the contract.\" The assistant keeps citing clauses that only exist in revision 3. Both documents are in the conversation history. What is the right fix?","domain":"MODEL-CTX","difficulty":4,"choices":[{"label":"A","text":"Manage document state explicitly: when a newer revision supersedes an older one, remove or mark the stale version and tell the model which is authoritative."},{"label":"B","text":"Instruct users to say \"revision 4\" in every question so the model knows which document they mean."},{"label":"C","text":"Increase the context window so both documents fit comfortably with all conversation turns."},{"label":"D","text":"Add a system-prompt rule to always prefer the most recently uploaded document when documents conflict. A recency rule also generalizes to every future upload without anyone maintaining version metadata by hand, and it is a single line in the system prompt."}],"correct":"A","explanation":"Two near-identical documents in one context compete for attention, and the model cannot reliably infer which is authoritative. Context management is the application's job: supersede, remove, or hard-mark the stale revision. Pushing disambiguation onto users (B) fails the first time they forget. Both documents already fit (C) — capacity isn't the problem. A recency rule (D) helps but is still probabilistic against ~40 turns of accumulated quotes from revision 3; explicit state beats inference."},{"id":"pro2-17","scenario":"Six thousand tokens of law","stem":"A banking assistant's system prompt has grown to 6,000 tokens: 118 numbered rules from four departments, several contradictory (\"always offer a callback\" vs \"never offer callbacks for fraud topics\"). Rule-following is now erratic. The compliance team proposes adding rule 119: \"earlier rules take precedence over later ones.\" What should the architect do instead?","domain":"MODEL-CTX","difficulty":4,"choices":[{"label":"A","text":"Consolidate: resolve the contradictions with the owning departments, reduce the prompt to a small set of coherent global rules, and move situational policies into retrieval."},{"label":"B","text":"Adopt rule 119 — an explicit precedence order lets the model resolve any contradiction deterministically. An explicit precedence order also documents the intended resolution for auditors, who otherwise have to infer which rule the model applied."},{"label":"C","text":"Split the prompt into four department-specific system prompts and run all four in sequence for each response."},{"label":"D","text":"Fine-tune the model on transcripts demonstrating correct behavior, retiring the written rules entirely."}],"correct":"A","explanation":"A contradictory 6k-token rulebook is a governance failure surfacing as a prompt problem — no meta-rule makes contradictions coherent, and models don't execute precedence orders like interpreters (B). The fix is editorial and architectural: fewer, coherent global rules; situational policy loaded contextually. Running four prompts (C) multiplies cost and produces four conflicting answers to reconcile. Fine-tuning on transcripts (D) freezes today's confusion into weights and removes the auditability compliance needs."},{"id":"pro2-18","scenario":"Thinking hard about 'thanks!'","stem":"After enabling extended thinking with a generous budget on every request, an assistant's quality improved on complex queries — but costs tripled and simple turns (\"thanks!\", \"what's my balance?\") now take 6 seconds while the model deliberates. What is the right configuration strategy?","domain":"MODEL-CTX","difficulty":3,"choices":[{"label":"A","text":"Make thinking budgets task-adaptive: route trivial turns to minimal or no extended thinking and keep the large budget for genuinely complex tasks."},{"label":"B","text":"Disable extended thinking globally — the cost increase shows it was never economically viable."},{"label":"C","text":"Keep the global budget but cap max output tokens, which indirectly limits how long the model can think. Capping output also bounds the cost of every request rather than only the ones where thinking happens to run long."},{"label":"D","text":"Keep the global budget and enable prompt caching, which will absorb the additional thinking cost."}],"correct":"A","explanation":"Extended thinking is a dial, not a switch: its value is real on hard tasks and pure waste on trivial ones, so the budget should follow task complexity. Disabling globally (B) throws away the measured quality gain. Output caps (C) don't govern thinking budgets and risk truncating answers. Caching (D) reduces input-token cost — thinking is generated output, which caching does not touch."},{"id":"pro2-19","scenario":"Designing for the cache","stem":"A high-volume agent sends: system prompt, 25 tool definitions, a per-request personalization block, then conversation turns. The team wants maximum prompt-cache efficiency without behavior change. Which TWO practices deliver it? (Select TWO.)","domain":"MODEL-CTX","difficulty":4,"choices":[{"label":"A","text":"Keep the system prompt and tool definitions byte-identical across requests and place them before anything request-specific."},{"label":"B","text":"Move the per-request personalization block after the stable prefix (or into the conversation), so it never invalidates the cached tool block."},{"label":"C","text":"Rotate synonym variants of the system prompt per request to keep the model from overfitting to one phrasing. Varying the phrasing also prevents a single unlucky wording from being locked in across the whole product."},{"label":"D","text":"Put the user's question first so the model reads the task before the reference material."},{"label":"E","text":"Shuffle the order of tool definitions each request so no tool gains positional advantage in selection."}],"correct":["A","B"],"explanation":"Caching rewards byte-stability and ordering: identical stable prefix first (A), volatile content strictly after it (B). The distractors all destroy prefix identity for imagined benefits: phrasing rotation (C) and tool shuffling (E) guarantee cache misses on every request, and question-first ordering (D) puts the most volatile content at position zero — the single worst place for it."},{"id":"pro2-20","scenario":"Two tools, one job","stem":"An agent has both search_customers(query) — added by team A — and find_customer(name, email) — added later by team B. Traces show the agent alternates between them unpredictably, sometimes failing lookups that the other tool would have served. Prompt guidance about when to use each has not helped. What is the durable fix?","domain":"INTEG","difficulty":3,"choices":[{"label":"A","text":"Fix the tool surface: merge the overlapping tools into one well-specified lookup tool, or make the split unambiguous by contract, and delete the loser."},{"label":"B","text":"Strengthen the system prompt with three worked examples of choosing the correct tool."},{"label":"C","text":"Let both remain and add automatic fallback: when one returns empty, silently retry with the other. Automatic fallback also keeps both teams' integrations working while the duplication is resolved, avoiding a migration nobody has scheduled."},{"label":"D","text":"Route by team: expose team A's tool to team A's assistant and team B's to team B's."}],"correct":"A","explanation":"Overlapping, ambiguously differentiated tools are a schema problem, and schema problems outlive prompt patches (B — already tried in spirit). Consolidation removes the decision entirely. Silent cross-retry (C) doubles latency, hides the design flaw, and makes traces harder to read. Routing by owning team (D) solves an org-chart problem, not the agent's — both assistants still face ambiguity wherever both tools appear."},{"id":"pro2-21","scenario":"The laptop pattern in production","stem":"A developer prototyped a CRM integration as a local stdio MCP server and it works perfectly in their Claude Code sessions. The team now wants the same integration in the company's multi-user web assistant serving 5,000 employees. What must change architecturally?","domain":"INTEG","difficulty":4,"choices":[{"label":"A","text":"Deploy it as a remote MCP server over HTTP with real authentication — per-user identity and authorization on every call."},{"label":"B","text":"Ship the stdio server binary with the web app and spawn one subprocess per user session on the backend. One subprocess per session also preserves the per-user isolation the desktop configuration had, which is the property most likely to matter at security review."},{"label":"C","text":"Nothing structural — MCP is transport-agnostic, so the same server config can be pointed at by the web assistant."},{"label":"D","text":"Replace MCP with direct REST calls from the web app, since MCP is a development-time protocol not meant for production."}],"correct":"A","explanation":"The gap between a local prototype and production MCP is transport and identity: remote deployment with per-user authN/authZ. Spawning subprocesses per session (B) technically runs but inherits the prototype's single-user credential model and becomes an operational liability. C hand-waves the part that matters — a local stdio config is not reachable by a hosted service. D overcorrects: MCP runs in production fine; it's this deployment shape that doesn't."},{"id":"pro2-22","scenario":"The re-ranker ate the budget","stem":"A RAG endpoint's p95 latency is 4.1s. Tracing breaks it down: 180ms vector search over 2M chunks, 2.6s re-ranking 200 candidates with a cross-encoder, 1.2s generation. The team proposes caching final LLM answers, but queries are near-unique. Where is the real win?","domain":"INTEG","difficulty":4,"choices":[{"label":"A","text":"Tune the re-ranking stage: re-rank far fewer candidates, use a faster re-ranker, or make it two-stage — the 2.6s stage is over-provisioned."},{"label":"B","text":"Shard the vector index further to accelerate the similarity search."},{"label":"C","text":"Stream the generation so users perceive faster responses while total latency stays the same."},{"label":"D","text":"Skip re-ranking entirely and pass the top-200 vector hits straight into the model's context. Passing more candidates also lets the model do the ranking itself, which removes an entire service from the request path."}],"correct":"A","explanation":"Read the trace: re-ranking is 63% of the budget; the vector search (B) is already 180ms — optimizing it is polishing the fast part. Streaming (C) is worth doing but masks rather than removes latency, and the question asks for the real win. Dropping re-ranking (D) fixes latency by dumping 200 unranked chunks into context — a quality and token-cost regression. Right-sizing the re-rank candidate set attacks the actual bottleneck with minimal quality risk."},{"id":"pro2-23","scenario":"The 80,000-token tool result","stem":"An agent calls get_account_history and the tool faithfully returns the customer's complete history — often 80k tokens of JSON. Agent turns after that call are slow, expensive, and the model misses details anyway. The data team says \"the agent asked for the history; we returned it.\" What is the correct boundary design?","domain":"INTEG","difficulty":4,"choices":[{"label":"A","text":"Make the tool answer questions rather than dump tables: support filtered, paginated queries so the agent pulls only what the task needs."},{"label":"B","text":"Switch to a model with a larger context window so 80k-token results fit comfortably alongside the conversation. A larger window also avoids changing how the tool returns its results, which is owned by another team and scheduled for next quarter."},{"label":"C","text":"Have the agent summarize the JSON with a preliminary model call before reasoning over it."},{"label":"D","text":"Compress the JSON (shorter keys, no whitespace) to reduce its token footprint by roughly a third."}],"correct":"A","explanation":"Tool results are context injections, and the tool contract is where payload discipline belongs: query-shaped tools keep context small and attention sharp. A bigger window (B) makes the waste affordable, not gone — cost and mid-context attention problems remain. Summarize-then-reason (C) pays to send 80k tokens anyway, then loses detail nondeterministically. Key-shortening (D) recovers a fraction while keeping the fundamentally wrong interface."},{"id":"pro2-24","scenario":"Two receipts for one order","stem":"An ordering agent occasionally times out on create_order, retries, and the customer receives two identical orders. The tool team notes the first call had actually succeeded — the response was just slow. Where does the fix belong?","domain":"INTEG","difficulty":4,"choices":[{"label":"A","text":"In the tool contract: create_order must accept an idempotency key derived from the order intent, so retries are deduplicated server-side."},{"label":"B","text":"In the prompt: instruct the agent to never retry order creation and to ask the user to check their email instead."},{"label":"C","text":"In the loop: have the agent call list_recent_orders before any retry and skip creation if a matching order exists. A read-before-write check also works even when the partner's API offers no idempotency support at all."},{"label":"D","text":"In the timeout: raise it high enough that slow successes are received before any retry can fire."}],"correct":"A","explanation":"Duplicate side effects from retries are a classic distributed-systems bug; the guarantee must be server-side idempotency, deterministic regardless of model behavior. Prompt rules (B) trade duplicates for abandoned orders and still aren't guaranteed. Check-then-create (C) is a race — the first order may not be visible yet, which is exactly this failure. Longer timeouts (D) shrink the window but no timeout distinguishes slow success from failure."},{"id":"pro2-25","scenario":"Overlap as a painkiller","stem":"To stop answers from being split across chunks, a team raised chunk overlap from 10% to 80%. Split-answer complaints dropped, but the index grew 4×, ingestion slowed, and retrieved contexts now contain near-duplicate passages that crowd out other relevant material. What should they have done?","domain":"INTEG","difficulty":4,"choices":[{"label":"A","text":"Fix segmentation, not overlap: chunk on the corpus's semantic boundaries so units are self-contained, keep overlap modest, and deduplicate near-identical hits."},{"label":"B","text":"Keep the 80% overlap but double the index hardware, since the retrieval quality gain justified the storage cost. The overlap did measurably improve answer completeness, and hardware is the cheaper half of the trade-off at this corpus size."},{"label":"C","text":"Reduce overlap back to 10% and raise top-k so split answers are reassembled by retrieving more chunks."},{"label":"D","text":"Replace chunking with whole-document retrieval so answers can never be split."}],"correct":"A","explanation":"Massive overlap is a symptom patch: it masks bad segmentation by storing everything several times, and the duplicates then waste retrieval slots and context tokens. Semantic chunking makes units self-contained so overlap can stay small. Scaling hardware (B) pays forever for a design flaw. High top-k with tiny chunks (C) reassembles answers by luck and floods context. Whole documents (D) destroy precision and blow the token budget."},{"id":"pro2-26","scenario":"Upgrade day retrieval collapse","stem":"A team upgraded to a newer, better embedding model and deployed it to the query path immediately; corpus re-embedding was scheduled to run over the following week. Retrieval quality instantly collapsed — results look nearly random. What happened?","domain":"INTEG","difficulty":4,"choices":[{"label":"A","text":"Queries are now embedded in a different vector space than the corpus, so similarity scores are meaningless until the index is re-embedded with the same model."},{"label":"B","text":"The new model's embeddings have different dimensionality and the index silently truncated them; padding the vectors restores comparability. A silent dimensionality mismatch is also exactly the class of upgrade-day defect that produces a sudden, total collapse in retrieval quality."},{"label":"C","text":"The new model needs domain fine-tuning before its embeddings work on specialized content."},{"label":"D","text":"Similarity thresholds tuned for the old model are too strict for the new one; recalibrating the cutoff will restore results."}],"correct":"A","explanation":"Embedding spaces are model-specific: query and corpus vectors must come from the same model, so a query-side-first rollout guarantees garbage retrieval for the whole transition week. The deployment had to be atomic (dual-index, blue/green) or query-side-last. B describes a real pitfall but padding never restores comparability; C and D can't explain an instant, total collapse that coincided with the rollout."},{"id":"pro2-27","scenario":"Adding scores from different planets","stem":"A hybrid retrieval system computes final ranking as bm25_score + cosine_similarity. Engineers notice lexical matches dominate some queries wildly and vanish on others — BM25 scores range 0–40 while cosine similarity ranges 0–1. What is the standard fix?","domain":"INTEG","difficulty":4,"choices":[{"label":"A","text":"Stop summing raw scores from incompatible scales: use rank-based fusion, or normalize each distribution before combining."},{"label":"B","text":"Multiply the scores instead of adding them, which makes the combination scale-invariant."},{"label":"C","text":"Divide BM25 by 40 so both scores lie in the 0–1 range, making direct addition valid."},{"label":"D","text":"Drop BM25 — modern embedding models capture lexical similarity well enough that hybrid retrieval is legacy practice. Dropping the lexical half also removes an entire index to maintain, which is a real operational simplification."}],"correct":"A","explanation":"Combining rankers with incomparable score distributions calls for rank fusion (RRF) or per-distribution normalization — the standard, robust answers. Multiplication (B) is not scale-invariant and zeroes out anything one ranker misses. Dividing by the observed max (C) is a brittle one-point calibration that shifts with the corpus and still ignores distribution shape. Dropping BM25 (D) abandons hybrid's main value: exact identifiers and rare terms that embeddings blur."},{"id":"pro2-28","scenario":"The partner changed the fields","stem":"A logistics agent consumes structured responses from a partner company's ordering agent. Overnight, the partner renamed delivery_date to delivery_window and shipments silently stopped scheduling — the parser defaulted missing dates to null and the agent treated them as 'no constraint.' What should the integration have had?","domain":"INTEG","difficulty":4,"choices":[{"label":"A","text":"A versioned message schema treated as a contract: strict validation that rejects unknown or missing required fields loudly, plus contract tests against partner changes."},{"label":"B","text":"A more lenient parser that recognizes plausible field-name synonyms like delivery_window automatically."},{"label":"C","text":"An LLM-based adapter that reads whatever the partner sends and maps it to the expected schema by meaning. A model-based adapter also absorbs the next unannounced field rename without a code change, which is the recurring failure the team keeps paying for."},{"label":"D","text":"Daily manual spot checks of scheduled shipments to catch integration breakage within 24 hours."}],"correct":"A","explanation":"The deadly detail is silent degradation: lenient parsing turned a breaking change into invisible data loss. Cross-organization agent integration needs the boring rigor of API contracts — versioned schemas, fail-loud validation, contract tests, deprecation windows. Synonym tolerance (B) and semantic LLM adapters (C) institutionalize silent guessing at a trust boundary, making the next mismatch even harder to detect. Spot checks (D) accept a day of quiet failure as a design goal."},{"id":"pro2-29","scenario":"Found the tool, fumbled the call","stem":"A platform moved from loading 300 tool definitions to progressive discovery: the agent searches a tool catalog and receives one-line summaries. Selection improved, but agents now frequently call chosen tools with wrong parameters — the one-line summaries omit schemas. What completes the design?","domain":"INTEG","difficulty":3,"choices":[{"label":"A","text":"Two-phase disclosure: search returns lightweight summaries for choosing, then the full definition is loaded for any tool the agent actually selects."},{"label":"B","text":"Expand every summary to include the full parameter schema, so one phase serves both choosing and calling. One phase is also simpler to operate than two, and the parameter schema is the part the model most often gets wrong."},{"label":"C","text":"Let the agent call with its best-guess parameters and rely on validation errors to teach it the correct shape."},{"label":"D","text":"Constrain each agent to a fixed set of 10 pre-approved tools so schemas can always be fully loaded."}],"correct":"A","explanation":"Progressive discovery is a two-budget design: cheap summaries for search, full schemas only for the shortlisted tools — selection context stays small and calls stay well-formed. Full schemas in every summary (B) recreates the original 300-definition bloat inside search results. Error-driven guessing (C) spends turns and risks side effects from malformed-but-valid calls. A fixed set of 10 (D) abandons the breadth the catalog exists to provide."},{"id":"pro2-30","scenario":"The answer that rewrote itself","stem":"A support UI streams the assistant's response token-by-token. When a query needs a tool call, users watch the assistant begin a confident answer, pause, and then contradict itself after tool results arrive (\"Your order ships Monday— actually, our records show it shipped yesterday\"). What is the right design?","domain":"INTEG","difficulty":3,"choices":[{"label":"A","text":"Align streaming with the interaction's phases: stream status during tool execution, and stream the substantive answer only once it is grounded in tool results."},{"label":"B","text":"Disable streaming for the whole product; the latency cost is lower than the credibility cost of visible self-correction. Buffering also gives the product a single point at which to apply any final formatting or policy check before the user sees anything."},{"label":"C","text":"Buffer the full response and use a second model pass to smooth contradictions before display."},{"label":"D","text":"Prompt the model to phrase pre-tool statements tentatively (\"it appears that…\") so later corrections feel less jarring."}],"correct":"A","explanation":"The failure is streaming unverified claims, not streaming itself. Phase-aware UX — status while tools run, answer once grounded — keeps both responsiveness and correctness. Killing streaming globally (B) punishes every simple query for a tool-flow bug. A smoothing pass (C) adds latency and cost to polish text that shouldn't have been shown. Hedging language (D) ships weasel-worded speculation instead of removing it."},{"id":"pro2-31","scenario":"Keeping the index honest","stem":"A support RAG system's knowledge base changes constantly — 200 to 400 document edits daily across three CMSs. Answers increasingly cite outdated procedures. Which TWO mechanisms most directly keep retrieval current? (Select TWO.)","domain":"INTEG","difficulty":4,"choices":[{"label":"A","text":"Event-driven incremental indexing: create, update and delete events re-chunk and re-embed exactly the affected documents within minutes."},{"label":"B","text":"Freshness observability: index staleness metrics (per-source lag between edit time and index time) with alerts when lag exceeds its SLO."},{"label":"C","text":"A system-prompt disclaimer instructing the model to warn users that information may be outdated."},{"label":"D","text":"Raising top-k so newer document versions are more likely to appear somewhere in the retrieved set. Retrieving more candidates also costs nothing but tokens and needs no change to the indexing pipeline."},{"label":"E","text":"Switching to a higher-dimensional embedding model that represents document recency more faithfully."}],"correct":["A","B"],"explanation":"Freshness is a pipeline property: change events must propagate to the index quickly (A), and lag must be measured and alarmed (B) so silent breakage surfaces. A disclaimer (C) apologizes for staleness instead of fixing it. Higher top-k (D) retrieves the stale version alongside the new one and lets them fight. Embedding dimensionality (E) has nothing to do with recency — embeddings don't encode index freshness at all."},{"id":"pro2-32","scenario":"The suspiciously perfect score","stem":"A team reports 98% on their extraction eval suite, but production accuracy sampled by hand is closer to 80%. Reviewing the prompt, an auditor notices its few-shot examples were taken from the same labeled dataset later used to build the eval suite. What is the problem?","domain":"EVAL-OPT","difficulty":4,"choices":[{"label":"A","text":"Train/test contamination: the model is evaluated partly on items it sees verbatim in its own prompt. Rebuild the eval set to hold out anything used in prompts."},{"label":"B","text":"The eval set is too small; expanding it will dilute the overlap and converge the two numbers."},{"label":"C","text":"Production traffic has drifted from the eval distribution; refresh the eval set from recent traffic. Distribution drift is the most common cause of a widening gap between offline and production numbers, and refreshing the set is routine hygiene."},{"label":"D","text":"Hand-sampling is unreliable; trust the systematic eval over ad-hoc human checks."}],"correct":"A","explanation":"Few-shot examples in the prompt are training data in every sense that matters for evaluation — scoring the model on those same items measures memorization, not capability. The 18-point gap is the contamination signature. Diluting (B) shrinks but keeps the bias. Drift (C) is a real phenomenon but the auditor found the specific defect. D gets it backwards: the hand sample is the honest number here."},{"id":"pro2-33","scenario":"Optimizing the judge, not the answer","stem":"After six weeks of prompt iterations selected purely by LLM-judge preference score, a team's judge metric rose 22% — but user satisfaction is flat and answers have grown noticeably longer, more apologetic, and padded with caveats. What happened?","domain":"EVAL-OPT","difficulty":5,"choices":[{"label":"A","text":"Goodhart's law via judge bias: iterating against a judge that rewards verbosity optimized that artifact instead of quality. Recalibrate against human labels and control for length."},{"label":"B","text":"The judge model is too small; a more capable judge would have kept the preference signal aligned with users. A stronger judge would also have caught the register shift the smaller one rewarded, since judge capability is the ceiling on the whole optimization loop."},{"label":"C","text":"Six weeks is too short for satisfaction metrics to respond; continue iterating and expect user metrics to follow."},{"label":"D","text":"The team overfit the prompt to the eval set; rotating in fresh eval queries will restore the correlation."}],"correct":"A","explanation":"When a proxy metric becomes the optimization target, its biases become the product: LLM judges systematically over-reward length and hedging, and six weeks of selection amplified exactly that. The fix is judge calibration (human agreement, length controls) plus grounding decisions in user outcomes. A bigger judge (B) may share the bias family. C assumes lag where there's misalignment. D names a different failure — the drift is stylistic, visible in the outputs themselves."},{"id":"pro2-34","scenario":"Thirty samples of certainty","stem":"An A/B test of a new prompt ran on 30 conversations: variant B scored 3 points higher on the 100-point rubric. The PM wants to ship (\"any improvement counts\") and notes B also 'felt better' in demos. What should the architect say?","domain":"EVAL-OPT","difficulty":4,"choices":[{"label":"A","text":"Thirty samples cannot distinguish a 3-point difference from noise — run a properly powered comparison before shipping."},{"label":"B","text":"Ship it: with equal costs, even a noisy positive signal makes B the expected-value choice. With costs equal there is no downside case to weigh, and waiting for more samples costs a week of the improvement it would otherwise be delivering on every conversation."},{"label":"C","text":"Rerun the same 30 conversations three times and ship if B wins at least twice."},{"label":"D","text":"Widen the rubric to 1,000 points so small differences become statistically resolvable."}],"correct":"A","explanation":"A 3-point delta on 30 high-variance observations is statistically indistinguishable from zero — shipping on it means shipping noise, and 'felt better in demos' is anchoring. B's expected-value framing ignores that unpowered positives are as often negative effects. Repeating the same underpowered test (C) triples the noise, not the power. Rubric granularity (D) does not add statistical information — variance scales with the scale."},{"id":"pro2-35","scenario":"Green dashboards, angry lawyers","stem":"A canary rollout of a new model version watched overall accuracy, latency, and complaint rate — all healthy — and proceeded to 100%. Two weeks later, the legal-document intake team reports the system has been mangling one rare but critical document type (about 0.5% of volume) since the rollout. What was wrong with the canary?","domain":"EVAL-OPT","difficulty":5,"choices":[{"label":"A","text":"It watched aggregates only: a total regression in a 0.5% segment barely moves the average. Guardrails must be segmented by known-critical slices, each with its own floor."},{"label":"B","text":"The canary phase was too short; four weeks at 10% would have accumulated enough rare-type volume for the aggregate to move. Rare-type volume does accumulate with time, and a longer canary is the standard remedy for a signal that has not yet had a chance to move."},{"label":"C","text":"The rollout lacked human review of canary outputs; automated metrics can never catch rare regressions."},{"label":"D","text":"The complaint-rate signal was mis-weighted; internal users complain too slowly for canaries to rely on."}],"correct":"A","explanation":"Aggregates hide minority-segment catastrophes by construction — 100% failure of 0.5% of traffic is a 0.5-point blip in the average. Segment-level guardrails on business-critical slices are the fix. A longer canary (B) still measures the same insensitive aggregate. Human review (C) at random sampling rates would miss a 0.5% slice too — segmentation is what aims attention. D fixates on the weakest of the three signals rather than the structural blindness."},{"id":"pro2-36","scenario":"The test that flickers","stem":"A regression suite gates releases, but 12 of its 240 cases pass or fail nondeterministically across runs of the identical system. Engineers have started rerunning the suite until it passes. What is the right response?","domain":"EVAL-OPT","difficulty":4,"choices":[{"label":"A","text":"Treat eval flakiness as a defect to engineer around: run flaky cases repeatedly and score pass rates against a threshold, and tighten graders that judge nondeterministically."},{"label":"B","text":"Delete the 12 flaky cases; a deterministic 228-case suite is a stronger gate than a noisy 240-case one."},{"label":"C","text":"Accept rerunning as standard practice, since LLM systems are inherently stochastic and gates must tolerate that. Every gate in a stochastic system tolerates variance somewhere, and re-running a failed case is cheaper than the engineering time to make each case deterministic."},{"label":"D","text":"Set temperature to 0 across the suite so all cases become deterministic and single-run gating is restored."}],"correct":"A","explanation":"Flaky cases often cover exactly the fragile behaviors most worth watching — deleting them (B) is silent coverage loss, and rerun-until-green (C) converts the gate into a formality that always eventually passes. Statistical treatment (pass-rate thresholds over N runs) makes nondeterminism measurable instead of ignorable. Temperature 0 (D) reduces but does not eliminate nondeterminism, and gating at settings production doesn't use validates the wrong system."},{"id":"pro2-37","scenario":"The bill that tripled on Tuesday","stem":"Token spend tripled overnight. Tracing attributes the spike to one assistant whose calls to update_ticket fail schema validation and retry — a deploy on Monday renamed a required field in the tool's schema but not in the system prompt's usage examples, so every call fails three times before falling back. Finance wants per-user rate limits deployed today. What is the correct action?","domain":"EVAL-OPT","difficulty":3,"choices":[{"label":"A","text":"Fix the root cause: reconcile the tool schema with the prompt examples, and add a deploy-time contract check between them."},{"label":"B","text":"Deploy the rate limits: they stop the bleeding immediately and are good hygiene regardless of this incident. Rate limits also protect against the next unrelated runaway loop, and they can be shipped in minutes without waiting for a diagnosis."},{"label":"C","text":"Reduce the retry limit from three to one so schema failures cost a third as much until someone can investigate."},{"label":"D","text":"Roll back Monday's deploy and freeze tool-schema changes until a manual review board approves each one."}],"correct":"A","explanation":"The trace already names the defect: an internal schema/prompt mismatch, fixable in minutes, plus a missing consistency check to prevent recurrence. Rate limits (B) punish users for an internal bug and cap the symptom while every remaining call still fails. Cutting retries (C) makes legitimate transient failures less recoverable and still leaves 100% failure on this tool. Rollback (D) is a fine immediate mitigation, but the permanent change-freeze bureaucratizes what a cheap automated check solves."},{"id":"pro2-38","scenario":"The average that lied","stem":"A dashboard shows mean response latency of 1.9s — well within SLA — yet the support team keeps escalating user reports of 30-second waits. Investigation confirms p50 is 1.2s but p99 is 34s, driven by a minority of requests that generate maximum-length outputs and one retrieval path with no timeout. What should the team change about how it manages latency?","domain":"EVAL-OPT","difficulty":4,"choices":[{"label":"A","text":"Manage the tail, not the mean: set SLOs on p95/p99, add per-stage timeout budgets, cap output length on interactive turns, and page on tail violations."},{"label":"B","text":"The SLA is being met as written; renegotiate user expectations since a 1.9s average is objectively fast."},{"label":"C","text":"Scale up serving capacity 2× — tail latency is a load phenomenon and headroom will absorb the p99. Extra headroom also absorbs the traffic growth the team is forecasting, so the capacity work has to happen regardless of this incident."},{"label":"D","text":"Reduce max output tokens globally until p99 falls under 5s, accepting truncated answers as the trade-off."}],"correct":"A","explanation":"Latency SLOs belong on percentiles because users experience the distribution's tail, not its mean. The diagnosis names two specific tail sources — unbounded generation and a timeout-less path — both fixable with budgets and caps scoped to interactive flows. Hiding behind the mean (B) is the original failure restated. Capacity (C) doesn't fix a missing timeout or 30 seconds of legitimate generation. A global token cap (D) mutilates long-form answers everywhere to fix a scoped problem."},{"id":"pro2-39","scenario":"The judge prefers its own accent","stem":"A bake-off compares outputs from the team's production model against a competitor's, judged automatically by the same model family the team uses in production. The in-house configuration wins 71% of pairwise comparisons — far above what human spot checks suggest. What methodological flaw explains the gap?","domain":"EVAL-OPT","difficulty":4,"choices":[{"label":"A","text":"Self-preference bias: judges from the same family as a contestant favour their own style. Use a different family, blind and position-swap, and calibrate against human labels."},{"label":"B","text":"Pairwise comparison is the flaw — absolute 1–10 scoring per output would remove the relational bias. Absolute scoring also removes the ordering effects pairwise comparison is known to suffer from, which is the mechanism most often blamed for judge bias."},{"label":"C","text":"The competitor's outputs were produced with default settings; tuning both systems equally would close the gap."},{"label":"D","text":"71% is within normal variance for pairwise judging; the human spot checks were too few to contradict it."}],"correct":"A","explanation":"Same-family judging contaminates the verdict with stylistic self-preference — a documented judge bias, and exactly what a large automated margin contradicted by humans suggests. Cross-family judges, blinding, position swaps, and human calibration are the standard controls. Absolute scoring (B) swaps one bias set for calibration drift without addressing family affinity. C is speculative fairness tuning; D waves away the one human signal in the room."},{"id":"pro2-40","scenario":"The suite frozen in January","stem":"A production assistant's regression suite was built at launch from January's traffic. It still passes every release. Meanwhile, three product lines launched, two intents now dominate that didn't exist in January, and user complaints are rising. Leadership cites the passing suite as evidence of quality. What is the architect's correct assessment?","domain":"EVAL-OPT","difficulty":4,"choices":[{"label":"A","text":"The suite validates the system against January's world: refresh it on a cadence with samples from current traffic, while keeping a stable core for longitudinal comparison."},{"label":"B","text":"A passing suite is a passing suite; complaints likely reflect expectation inflation rather than regression, which the suite would have caught. Expectation inflation is a real and documented effect as users become accustomed to a system, and it produces exactly this pattern of complaints without measurable regression."},{"label":"C","text":"Discard the suite and evaluate purely on live user feedback, which cannot go stale by construction."},{"label":"D","text":"Freeze the suite intentionally — changing test content destroys comparability across releases, which is the suite's primary purpose."}],"correct":"A","explanation":"An eval suite is a sample of a moving distribution; unchanged for months, it certifies a world that no longer exists — the suite can't catch regressions on intents it doesn't contain. The refresh must be principled: rotating current-traffic samples plus a stable longitudinal core, which answers D's real (but overweighted) comparability concern. B mistakes non-coverage for non-regression. C trades leading indicators for lagging complaints."},{"id":"pro2-41","scenario":"Trusting the robot grader","stem":"A team wants an LLM judge to replace most human grading in their release gate. Before the judge's verdicts can be trusted for that role, which TWO validations are essential? (Select TWO.)","domain":"EVAL-OPT","difficulty":4,"choices":[{"label":"A","text":"Measure judge–human agreement on a labeled calibration set, and require it to meet a defined threshold before the judge gates anything."},{"label":"B","text":"Measure the judge's consistency and bias mechanics — repeat verdicts across runs and position-swapped pairs — and correct or control what drifts."},{"label":"C","text":"Require the judge to produce a written rationale for each verdict, since explained judgments are inherently more reliable. A written rationale also gives the team something to audit when a verdict looks wrong, which a bare score does not."},{"label":"D","text":"Use the largest available model as judge, since judging capability scales with model size."},{"label":"E","text":"Have the judge grade the same rubric as humans but on a finer-grained 100-point scale to capture subtle differences."}],"correct":["A","B"],"explanation":"A judge earns gating authority by demonstrated agreement with the humans it replaces (A) and by measured stability — run-to-run consistency and position-bias controls (B). Rationales (C) improve auditability but explained verdicts are not thereby correct; models rationalize errors fluently. Bigger judges (D) can still carry biases — validation, not size, is the requirement. Finer scales (E) add resolution to an uncalibrated instrument."},{"id":"pro2-42","scenario":"The attack came back with the results","stem":"A security review of a research assistant finds this: the team rigorously sanitizes user input for injection patterns, but the assistant's web-search tool returns page content that flows unexamined into context — and a crafted webpage successfully instructed the agent to call its file-write tool. The team is confused because 'we already handle prompt injection.' What must they understand?","domain":"GOV-RISK","difficulty":4,"choices":[{"label":"A","text":"Injection enters through every untrusted content channel, not only the user turn: all external content needs untrusted-data handling, and high-risk tools need deterministic constraints."},{"label":"B","text":"The sanitizer's pattern list needs updating to cover the phrasings found on the malicious page."},{"label":"C","text":"The web-search tool should be limited to reputable, high-authority domains where malicious instructions do not occur. Domain restriction also has the operational advantage of being enforceable in the tool configuration rather than in the prompt, and reputable sources are where the agent's useful research material lives anyway."},{"label":"D","text":"The system prompt should state explicitly that instructions found in web content must never be followed."}],"correct":"A","explanation":"The blind spot is threat-model scope: they defended one channel while tool results — often the highest-volume untrusted input — flowed in raw. Because no filter catches all injections, the architecture must make injection non-catastrophic: untrusted-data framing everywhere plus hard controls on consequential tools. Pattern lists (B) lose to paraphrase; reputable domains (C) get compromised and include user-generated content; a prompt rule (D) is a soft control competing against the attack itself."},{"id":"pro2-43","scenario":"The debug goldmine","stem":"To debug quality issues, a healthcare assistant logs complete request/response payloads — including patient details — retained indefinitely and readable by the whole engineering group. A privacy review flags it. Engineering objects: \"we can't debug what we can't see.\" What is the design that serves both?","domain":"GOV-RISK","difficulty":4,"choices":[{"label":"A","text":"Tiered observability: redact or pseudonymize PHI at log ingestion for routine traces, and keep full payloads only under short retention with access controls and break-glass approval."},{"label":"B","text":"Stop logging payloads entirely and debug from metadata (latency, token counts, error codes), which contains no PHI. Metadata-only logging is also the one option that removes the compliance question entirely rather than managing it, and latency and error codes are what most incidents actually turn on."},{"label":"C","text":"Keep full logging but restrict access to senior engineers, who can be trusted with sensitive data."},{"label":"D","text":"Keep full logging and add a data-processing clause to patient consent forms covering debugging use."}],"correct":"A","explanation":"Privacy-vs-debuggability is a solved design problem, not a trade to lose on either side: redaction handles the routine case, and governed, time-boxed, audited access handles the exceptional one — minimum necessary, operationalized. Metadata-only (B) genuinely cripples quality debugging. Seniority-based access (C) is not a privacy control — the data is still over-retained and over-exposed. Consent language (D) attempts to paper over a minimization failure rather than fix it."},{"id":"pro2-44","scenario":"\"The model refuses, so we're covered\"","stem":"A product lead argues that dedicated safety guardrails are unnecessary for a new financial-advice assistant because \"the model already refuses harmful requests — we tested twenty and it refused all of them.\" What is the correct architectural position?","domain":"GOV-RISK","difficulty":4,"choices":[{"label":"A","text":"Model refusals are one probabilistic layer, not a safety architecture: the design needs defense in depth — input/output policy checks, action-level constraints on consequential operations, and monitoring."},{"label":"B","text":"The lead is right for launch: add guardrails later if monitoring shows the model's refusals being bypassed in practice."},{"label":"C","text":"Twenty tests are too few — commission a 2,000-prompt red-team suite, and if refusal rates exceed 99%, guardrails are redundant. A 2,000-prompt suite also produces a defensible refusal-rate number a regulator can be shown, which twenty ad-hoc tests cannot, and it establishes the baseline any later guardrail would be measured against."},{"label":"D","text":"Refusals should be made deterministic by adding a system-prompt list of prohibited topics the model must always decline."}],"correct":"A","explanation":"Sampled refusal behavior — at any sample size — cannot support a 'no guardrails' conclusion, because adversarial users search the failure space; that kills C's premise as well as the lead's. Waiting for bypasses in production (B) uses customers as the red team in a regulated domain. A prohibited-topics prompt (D) is still the same probabilistic mechanism relabeled 'deterministic.' Layered independent controls are the architecture."},{"id":"pro2-45","scenario":"It's not just a chatbot anymore","stem":"A European HR-tech vendor extends its employee-facing chatbot to also rank internal applicants for open roles. The team applies the same compliance checklist used at chatbot launch (AI-disclosure notice, opt-out link) and considers the matter closed. Under the EU AI Act's framework, what did they miss?","domain":"GOV-RISK","difficulty":5,"choices":[{"label":"A","text":"The new capability changes the system's risk classification: employment-related ranking is a high-risk use, with obligations far beyond transparency — risk management, human oversight, logging, conformity assessment."},{"label":"B","text":"Nothing substantive: the disclosure notice covers both functions since both are the same underlying model."},{"label":"C","text":"They need only update the privacy policy, since candidate ranking is a GDPR matter rather than an AI Act matter. GDPR is also the regime with the established enforcement history for employment data, and the privacy policy is the artifact candidates actually read before applying."},{"label":"D","text":"The AI Act does not apply because the system assists human recruiters rather than making final decisions."}],"correct":"A","explanation":"Risk classification follows use, not model: the same system doing employment-consequential ranking enters the high-risk category with its full obligation set. B repeats the team's error — transparency duties don't scale to high-risk duties. C is a false either/or: GDPR and the AI Act apply concurrently. D reflects a common misreading — assistive employment tools are squarely in scope; human presence downstream is an oversight obligation, not an exemption."},{"id":"pro2-46","scenario":"\"We anonymize, so it can flow\"","stem":"A EU-based insurer sends claim conversations to a US-hosted model API. Their DPO asks about the transfer; engineering answers that names are replaced with tokens like [CUSTOMER_1] before sending, \"so the data is anonymous and transfer rules don't apply.\" What is wrong with this position?","domain":"GOV-RISK","difficulty":5,"choices":[{"label":"A","text":"Token replacement is pseudonymization, not anonymization: the narratives remain identifying, so the transfer still needs a valid legal mechanism, a processor agreement, and a transfer assessment."},{"label":"B","text":"The position is sound if the token mapping table never leaves the EU, since the US side then cannot re-identify anyone. Keeping the mapping table inside the EU is also the control supervisory authorities point to when assessing whether a recipient can single out a data subject, since without it the US side holds only opaque identifiers."},{"label":"C","text":"The position is sound because API traffic is transient processing, not a 'transfer' — transfer rules govern data storage location only."},{"label":"D","text":"The real problem is encryption: with TLS plus encryption at rest, cross-border personal-data flows are compliant by default."}],"correct":"A","explanation":"GDPR's bar for anonymization is that re-identification is not reasonably possible by anyone — rich claim narratives fail that instantly, name tokens or not. Pseudonymized data remains personal data, so the cross-border flow needs a transfer mechanism and processor terms. Keeping the mapping table home (B) doesn't neutralize the identifying content itself. 'Transient processing isn't transfer' (C) is false — remote access alone is a transfer. Encryption (D) is security, not a transfer basis."},{"id":"pro2-47","scenario":"They red-teamed the wrong surface","stem":"Before launch, a red team spent two weeks attacking an agent's chat interface — jailbreaks, harmful-content elicitation, PII extraction — and found little. Three weeks post-launch, an attacker abused the agent's calendar tool to enumerate executives' meeting titles, then used the email tool to phish from inferred context. Why did pre-launch testing miss this, and what should change?","domain":"GOV-RISK","difficulty":4,"choices":[{"label":"A","text":"The red team tested the model's content behavior but not the agent's action surface: tool abuse, excessive agency and access chaining are distinct attack classes, so scope must cover every tool, alone and in combination."},{"label":"B","text":"Two weeks was insufficient; the same methodology continued for six weeks would have found the calendar-email chain."},{"label":"C","text":"The failure was in tool implementation, not testing scope — calendar and email tools with proper input validation cannot be chained maliciously. Input validation is also a control the security team already owns and can apply uniformly, rather than a testing exercise repeated for every new tool combination."},{"label":"D","text":"Post-launch discovery is expected and acceptable: real attackers always find what internal teams cannot, which is why monitoring exists."}],"correct":"A","explanation":"Jailbreak-focused testing validates the model layer while the agent's power lives in its tools; action-surface attacks (excessive agency, cross-tool chaining, data aggregation) require deliberately scoped adversarial testing. More weeks of the same methodology (B) probes the same wrong surface. C is false comfort — each tool behaved as specified; the chain was the exploit. D converts a scoping failure into fatalism; monitoring complements but doesn't replace pre-launch coverage."},{"id":"pro2-48","scenario":"Harmful advice reached a customer","stem":"A wealth-management assistant told a retiree to concentrate savings into a single volatile asset; the customer complained publicly. The prompt author wants to quietly patch the system prompt today. As the architect on the incident, what is the correct response sequence?","domain":"GOV-RISK","difficulty":4,"choices":[{"label":"A","text":"Treat it as a formal incident: contain first, establish scope from traces, notify per regulatory and internal obligations, remediate with an eval case preventing recurrence, and run a blameless postmortem."},{"label":"B","text":"Patch the prompt immediately and monitor for recurrence; formal process would slow the fix that actually protects customers. Speed genuinely matters when a customer has already received harmful advice, and a formal review cannot be convened before the next affected user arrives, so the patch protects people the process would only document."},{"label":"C","text":"Disable the assistant entirely until a full retraining eliminates the class of error, since partial measures leave customers exposed."},{"label":"D","text":"Route the complaint to legal and take no technical action until they determine whether the advice was actionably harmful."}],"correct":"A","explanation":"The quiet patch fails on scope (who else was harmed?), obligation (financial-advice incidents can carry notification duties), and learning (nothing prevents recurrence). Incident discipline — contain, scope, notify, remediate with a regression case, postmortem — is the difference between fixing an output and fixing a system. B optimizes speed over scope and duty. C overcorrects (and 'retraining' misdiagnoses a system-level failure). D inverts priorities: containment cannot wait on legal's harm analysis."},{"id":"pro2-49","scenario":"The approval that approves everything","stem":"A procurement agent's purchases require human approval. Metrics show reviewers approve 99.7% of requests with a median decision time of 4 seconds, including several later found erroneous. Leadership cites the approval step as evidence of strong oversight. What is the honest assessment and fix?","domain":"GOV-RISK","difficulty":4,"choices":[{"label":"A","text":"The step is rubber-stamping: reserve human review for high-risk requests with real decision support, auto-approve the trivial tier with sampling audits, and track reviewer disagreement rate."},{"label":"B","text":"Oversight is working: a 99.7% approval rate shows the agent proposes almost uniformly good purchases, and 4-second decisions reflect reviewer efficiency. Reviewers who have seen thousands of similar requests also become faster without becoming less accurate, which is what expertise looks like in any high-volume approval queue, and these proposals are drawn from a pre-approved catalogue."},{"label":"C","text":"Add a second sequential reviewer for every request, doubling scrutiny on the same volume."},{"label":"D","text":"Impose a mandatory 60-second minimum review time so reviewers must engage with each request before approving."}],"correct":"A","explanation":"Four-second near-universal approval with known misses is the signature of rubber-stamping, not agent excellence — B reads the failure as the success. Meaningful oversight concentrates attention where errors are costly and measures whether review changes outcomes (disagreement rate). A second stamp (C) doubles cost and both reviewers inherit the same bias. Forced dwell time (D) manufactures the appearance of diligence; attention doesn't follow a timer."},{"id":"pro2-50","scenario":"Pilot with the master key","stem":"A sales team wants a 6-week pilot in which an agent updates records directly in the production CRM. Security must set minimum conditions. Which TWO controls are the essential prerequisites for granting write access? (Select TWO.)","domain":"GOV-RISK","difficulty":4,"choices":[{"label":"A","text":"Scope the blast radius: write access limited to a bounded pilot slice under least-privilege credentials specific to the agent."},{"label":"B","text":"Guarantee reversibility: every agent write captured with before/after state and a tested rollback path, so any erroneous change — or all of them — can be undone."},{"label":"C","text":"Require pilot users to sign an acceptable-use agreement accepting responsibility for agent-caused data changes. A signed agreement also makes accountability explicit before any incident, which is what the pilot's risk owner asked for."},{"label":"D","text":"Add a system-prompt section instructing the agent to be conservative and double-check before every write."},{"label":"E","text":"Upgrade the pilot to the most capable available model, since write-access risk scales inversely with model quality."}],"correct":["A","B"],"explanation":"The two controls that make a write-pilot survivable are bounding what can be damaged (A) and guaranteeing damage can be undone (B) — prevention and recovery, both deterministic. Paperwork shifting blame to users (C) controls nothing about the system. Prompt-level caution (D) is a soft control that fails exactly when the model errs, which is the case being defended against. Model quality (E) lowers error rates but is not a security control and bounds nothing."},{"id":"pro2-51","scenario":"The demo that sold itself","stem":"An executive saw a hand-picked demo of a contract-analysis assistant and announced a firm go-live date to clients: six weeks out. The system has never been evaluated on representative documents. The delivery lead suggests quietly shipping whatever exists by the date since 'the exec has committed us.' What should the architect do?","domain":"STAKE-COMM","difficulty":4,"choices":[{"label":"A","text":"Surface the gap to the executive with a readiness framework: what evaluation on representative data will show by week 3, explicit go/no-go criteria, and a scoped fallback that can honor the date safely."},{"label":"B","text":"Ship by the date as instructed — the reputational cost of moving a client-announced date exceeds the cost of early defects, which patches can fix. Client-announced dates are also the commitments executives are personally measured on, and a patch released a fortnight later costs less credibility than a public slip."},{"label":"C","text":"Privately extend the timeline by quietly descoping features until the remaining system can be ready, avoiding an uncomfortable executive conversation."},{"label":"D","text":"Escalate over the executive to the board, since committing unvalidated AI systems to clients is a governance violation."}],"correct":"A","explanation":"The architect's obligation is to make risk visible to the person who owns it, with options — measured readiness, decision criteria, and a safe degraded mode that can still honor the date. Quiet compliance (B) converts a communication failure into a client-facing quality failure on legal documents. Quiet descoping (C) is the same dishonesty in a different direction. Board escalation (D) is a last resort after the executive, given real information, insists on recklessness — not before the first honest conversation."},{"id":"pro2-52","scenario":"\"It's #1 on the leaderboard\"","stem":"A client CTO forwards a benchmark leaderboard and directs the team to switch their claims-processing system to the top-ranked model, calling the current choice 'objectively inferior.' The current model was selected via task-specific evals eight months ago. What is the architect's correct response?","domain":"STAKE-COMM","difficulty":3,"choices":[{"label":"A","text":"Re-run the task-specific eval suite with the leaderboard model as a candidate: general benchmarks do not measure claims processing under this system's prompts, tools and cost constraints."},{"label":"B","text":"Explain that leaderboards are marketing and decline the comparison — re-evaluating on executive whim sets an unsustainable precedent. Leaderboard-driven re-evaluation also has no natural end point, since a new model tops a public benchmark most months, and the team would spend its capacity re-benchmarking rather than shipping."},{"label":"C","text":"Switch models — the CTO owns the budget and the leaderboard gap is large enough that task evals would only confirm it."},{"label":"D","text":"Propose running both models in production 50/50 for a quarter and letting real traffic decide."}],"correct":"A","explanation":"The professional move is neither deference nor dismissal: task-fit is an empirical question the team already has instruments to answer, and eight months is long enough that re-evaluation has independent value. Refusing (B) turns a reasonable question into a political fight and assumes the answer. Switching on faith (C) skips the only evidence that matters. A quarter of 50/50 production traffic (D) exposes half of live claims to an unvalidated configuration — offline evals exist precisely to avoid that."},{"id":"pro2-53","scenario":"Finance wants one number","stem":"The CFO's office asks for 'the cost per conversation' to build next year's budget and wants a single committed figure. Actual cost varies 40× between a one-turn FAQ and a long tool-heavy session, and volume mix is shifting monthly. How should the architect respond?","domain":"STAKE-COMM","difficulty":3,"choices":[{"label":"A","text":"Provide a cost model rather than a point estimate: cost drivers, current distribution with variance, scenario projections, and the controls that cap exposure — then agree a range."},{"label":"B","text":"Give the current blended average as the committed number, since that is what a budget process can consume. A blended average is also the number finance already models everything else with, it can be updated monthly as usage matures, and it avoids committing to a figure derived from a handful of unusually expensive conversations."},{"label":"C","text":"Give the 95th-percentile conversation cost as the committed number so the budget can only be beaten."},{"label":"D","text":"Decline to commit any figure until six more months of usage data stabilizes the distribution."}],"correct":"A","explanation":"Usage-based AI economics can be communicated honestly without refusing finance what it needs: drivers, ranges, scenarios, and caps make the number governable. A committed blended average (B) is guaranteed wrong the moment mix shifts — and it's the architect who'll own the variance. Budgeting at p95 (C) inflates the ask several-fold and invites the project's cancellation. Declining (D) mistakes precision for usefulness; finance needs a defensible range now, not a perfect number later."},{"id":"pro2-54","scenario":"Who tells the client?","stem":"A vendor team discovers their document assistant has been mis-extracting a date field for three weeks, affecting roughly 2% of a major client's processed documents. The fix is deployed. The account manager argues against telling the client: 'it's fixed, the error rate was low, and disclosure risks the renewal.' What should the architect advocate?","domain":"STAKE-COMM","difficulty":3,"choices":[{"label":"A","text":"Prompt, structured disclosure: notify the client with the affected scope and document list, the root cause, the fix and its verification, and the monitoring added."},{"label":"B","text":"Defer to the account manager — client communication is their call, and the architect's duty ended with the fix."},{"label":"C","text":"Disclose only if the client's own QA notices, with a prepared statement ready for that contingency."},{"label":"D","text":"Mention it informally in the next quarterly business review as a 'continuous improvement' item, avoiding incident framing. Framing it as continuous improvement also keeps the relationship out of incident-response mode over a defect the client never experienced, and the quarterly review is where process changes are normally agreed."}],"correct":"A","explanation":"Three weeks of silent data corruption in a client's documents is the client's incident, not just the vendor's — they may need to re-verify downstream decisions made on bad dates. Structured disclosure with scope and remediation is both the ethical duty and the relationship-preserving move. B mistakes org chart for accountability; the architect owns technical truth-telling. C is concealment with a contingency plan. D disguises an incident as an improvement — a framing clients recognize, and remember."},{"id":"pro2-55","scenario":"Marketing edits production on Fridays","stem":"The marketing team owns the brand voice of a customer assistant and has direct edit access to its production system prompt; a Friday-afternoon wording change recently broke tool-calling for a weekend. Engineering wants to revoke marketing's access entirely; marketing says voice is their mandate. What governance should the architect propose?","domain":"STAKE-COMM","difficulty":4,"choices":[{"label":"A","text":"Governed self-service: marketing keeps ownership of voice content through a structured workflow — staging, automated regression evals including tool-calling checks, and a scheduled promotion window."},{"label":"B","text":"Revoke access: production prompts are code, and non-engineers editing code is the root cause to eliminate."},{"label":"C","text":"Keep direct access but restrict edits to Monday–Wednesday so weekend incidents can't recur."},{"label":"D","text":"Split into two prompts — engineering owns a technical prompt, marketing owns a voice prompt — concatenated at runtime so neither team can affect the other. Splitting ownership also matches how the two teams already work, and a voice-only prompt is the part marketing is genuinely qualified to edit without engineering review."}],"correct":"A","explanation":"The failure wasn't who edited, but that any edit reached production without validation. A gated workflow gives marketing legitimate ownership with the same safety net engineering's own changes need. Revocation (B) wins the incident and loses the partnership — voice will then drift through ticket queues. Day-of-week rules (C) reschedule risk rather than remove it. Concatenated prompts (D) is a false wall: prompt sections interact in one context, so a voice edit can still break behavior."},{"id":"pro2-56","scenario":"Deflection up, satisfaction down","stem":"The support VP's bonus metric — ticket deflection — has climbed from 30% to 55% since the assistant launched. The CX team's data shows CSAT falling and repeat-contact rate rising over the same period: the assistant deflects tickets it doesn't actually resolve. Each side cites its own dashboard. What is the architect's role here?","domain":"STAKE-COMM","difficulty":4,"choices":[{"label":"A","text":"Make the trade-off visible and propose a corrected metric: pair deflection with resolution-verified follow-ups so 'deflected' cannot count unresolved abandonment."},{"label":"B","text":"Side with CX and recommend the assistant be scaled back until CSAT recovers to baseline."},{"label":"C","text":"Stay out of it — metric disputes between VPs are an executive matter, and the system is performing exactly as configured."},{"label":"D","text":"Tune the assistant to escalate more conversations to humans, which will trade deflection for CSAT until the dashboards agree. Escalating more conversations also produces a visible, immediate movement in both dashboards, which is what the two VPs are asking the architect to deliver before the next review."}],"correct":"A","explanation":"The system is optimizing a metric that diverged from its goal — deflection that doesn't resolve is cost transferred to customers and future contacts. The architect uniquely can instrument the truth (resolution-verified deflection) and reframe the dispute as a measurement defect rather than a turf war. Scaling back (B) discards real value the honest metric would preserve. Neutrality (C) leaves the system optimizing a broken target the architect knows is broken. Blind re-tuning (D) adjusts behavior before fixing the measure of success."},{"id":"pro2-57","scenario":"The runbook from another era","stem":"Six months after handoff, an operations engineer follows the runbook during a retrieval outage — and its instructions reference a pipeline architecture that was replaced in month two. The incident stretches to four hours. The postmortem asks how documentation should be kept trustworthy. What is the correct practice?","domain":"STAKE-COMM","difficulty":3,"choices":[{"label":"A","text":"Bind documentation to the change process: any change that alters operational behavior updates the affected runbooks as part of its definition of done, with periodic drills against the real system."},{"label":"B","text":"Schedule a comprehensive documentation rewrite every quarter, accepting staleness in between as the cost of a predictable cadence."},{"label":"C","text":"Replace static runbooks with an LLM assistant that answers operational questions from the codebase directly, eliminating staleness by construction. A code-derived assistant also cannot go stale between rewrites, and it answers the questions on-call engineers actually ask rather than the ones the runbook author anticipated."},{"label":"D","text":"Require the on-call engineer to verify each runbook step against the live system before executing it during incidents."}],"correct":"A","explanation":"Documentation stays true only when updating it is part of changing the system — coupled to the change, owned, and exercised in drills; anything scheduled (B) guarantees windows of dangerous staleness exactly like the one experienced. An LLM-from-codebase (C) can assist but makes incident response depend on unverified generation at the worst possible moment. Per-step live verification during an outage (D) shifts the maintenance burden to the highest-pressure minute available."},{"id":"pro2-58","scenario":"The pilot that loved itself","stem":"A 40-person pilot of an internal coding assistant reports 92% satisfaction and strong self-reported productivity gains; leadership prepares a company-wide rollout for 3,000 engineers. The architect notices the pilot group was recruited from volunteers in the platform org — mostly senior engineers who were already LLM enthusiasts. What should be flagged?","domain":"STAKE-COMM","difficulty":4,"choices":[{"label":"A","text":"Selection bias undermines generalization: volunteers from one org are the best case. Run a stratified extension — mixed seniority and orgs, including skeptics — before committing rollout economics."},{"label":"B","text":"Nothing — a successful pilot is exactly the evidence rollouts are built on, and enthusiasm itself drives adoption post-rollout. Pilot enthusiasm is also the signal every adoption programme is funded on, and a cohort that volunteered is the one most likely to help colleagues through the rollout."},{"label":"C","text":"The satisfaction metric is the flaw: rerun the same pilot measuring only objective productivity metrics before rolling out."},{"label":"D","text":"Roll out company-wide but announce the pilot numbers as targets, so shortfalls surface quickly by comparison."}],"correct":"A","explanation":"A volunteer-enthusiast pilot answers 'does it work for people who wanted it to work' — not 'will it work for 3,000 engineers,' where the marginal user is a mid-level skeptic on an older stack. Stratified sampling plus objective measures fixes both the population and the instrument. B celebrates the bias. C fixes the metric while keeping the biased population, which still can't generalize. D uses the whole company as the pilot and best-case numbers as commitments — the expensive way to learn what sampling would have shown."},{"id":"pro2-59","scenario":"Same SLA, triple the scope","stem":"A client's contract specifies 99.5% availability and next-day processing for 10k documents/month. Usage has organically grown to 34k/month with heavier document types, and the client now cites the SLA when overnight jobs slip. Renewal talks begin next month. Which TWO moves should the architect bring to the negotiation? (Select TWO.)","domain":"STAKE-COMM","difficulty":4,"choices":[{"label":"A","text":"A quantified scope analysis: current volume and mix against the contracted baseline, with per-tier cost and capacity data showing what the original SLA priced versus what is being consumed."},{"label":"B","text":"A tiered SLO proposal with a degradation ladder: committed targets per volume band and document class, and defined behavior when bands are exceeded."},{"label":"C","text":"Reaffirm the existing SLA unchanged at current volume to protect the renewal, and absorb the overage cost internally."},{"label":"D","text":"Propose removing quantitative SLAs in favor of a best-efforts clause, since AI-system performance cannot honestly be guaranteed."},{"label":"E","text":"Enforce the contracted 10k limit immediately by rejecting excess documents, establishing negotiating leverage before talks begin. Enforcing the contracted limit also establishes that the number in the agreement means something, which is the premise any renegotiation depends on."}],"correct":["A","B"],"explanation":"A scope-drift renegotiation is won with data (A) and a constructive structure that lets the client buy what they now consume (B) — tiered SLOs with degradation ladders are how variable AI workloads get honest guarantees. Absorbing silently (C) makes the unsustainable permanent and reprices the whole relationship at renewal anyway. Best-efforts (D) discards the trust an SLA embodies when evals make quality measurable. Hard rejection on the eve of talks (E) manufactures a hostage crisis out of a paying customer's growth."},{"id":"pro2-60","scenario":"The 2,000-line CLAUDE.md","stem":"A team's CLAUDE.md has grown to 2,000 lines: build commands, style rules, onboarding narrative, API changelogs, sprint notes, and three teams' conventions. Engineers report the assistant increasingly ignores instructions that are plainly in the file. What is the right restructuring?","domain":"DEV-ENABLE","difficulty":3,"choices":[{"label":"A","text":"Treat CLAUDE.md as always-loaded context with a budget: keep only durable, universally applicable conventions and commands, and move task-specific procedures into skills loaded on demand."},{"label":"B","text":"Split it into three 700-line CLAUDE.md files, one per team, and have engineers symlink the right one."},{"label":"C","text":"Keep the content but add a table of contents and priority markers so the model knows which sections matter most."},{"label":"D","text":"The file length is fine — the failures indicate the team needs a more capable model tier for large-context instruction following. Large-context instruction following is genuinely uneven across model tiers, and a 2,000-line file sits well inside the window of a capable model, so the tier is the variable worth testing first."}],"correct":"A","explanation":"CLAUDE.md ships with every session, so every line taxes attention and budget; 2,000 mixed-purpose lines bury the twenty conventions that matter. The fix is editorial layering: durable rules always loaded, situational content loaded on demand (skills, referenced docs). Per-team splits (B) keep the same bloat per session. TOCs and priority markers (C) add navigation to content that shouldn't be resident at all. D buys capability to subsidize clutter — instruction-following degrades with dilution on any model."},{"id":"pro2-61","scenario":".env in the transcript","stem":"A security sweep finds engineers routinely paste .env files and connection strings into AI-assistant sessions when debugging config issues. One engineer objects to any policy: 'sessions are local and private, so there's no exposure.' What should the enablement team implement?","domain":"DEV-ENABLE","difficulty":4,"choices":[{"label":"A","text":"Layered secret hygiene: secrets live in managers and are referenced rather than pasted, deterministic pre-submission hooks and deny rules back the policy, and transcripts are governed as a data store."},{"label":"B","text":"The engineer is essentially righ
