tem":"During a long fintech investigation, the context window is filling with verbose tool output. An engineer considers running /compact but the case hinges on exact dollar amounts and dates. What is the key risk to weigh?","domain":"CODE-CONFIG","difficulty":2,"choices":[{"label":"A","text":"/compact summarizes history and can lose exact numeric values, dates, and specific details; preserve critical facts separately before compacting."},{"label":"B","text":"/compact wipes the entire conversation history irrecoverably, so it should never be run during any active investigation at all."},{"label":"C","text":"/compact actually increases token cost because re-summarizing is expensive, so the only real consideration here is the billing impact."},{"label":"D","text":"/compact only condenses tool and schema definitions, never the factual content, so exact dollar amounts and dates are never at risk."}],"correct":"A","explanation":"Correct: /compact compresses prior history to free the window but risks losing exact numbers, dates, and specifics, so critical facts should be preserved first. B it summarizes, it does not delete everything. C its purpose is freeing context, not raising cost. D it can affect any summarized content, including the facts that matter here."},{"id":"mockD-34","scenario":"Insurance rules for scattered tests","stem":"An insurance codebase has test files scattered across dozens of directories, and the team wants a testing convention to load only when Claude edits a *.test.ts file, regardless of location, to save context. What mechanism fits best?","domain":"CODE-CONFIG","difficulty":2,"choices":[{"label":"A","text":"A directory-level CLAUDE.md placed in every folder containing tests"},{"label":"B","text":"A .claude/rules/ file with paths: [\"**/*.test.ts\"] in its YAML frontmatter"},{"label":"C","text":"An @path import added to the root CLAUDE.md pulling the convention in"},{"label":"D","text":"Putting the testing convention into the user-level ~/.claude/CLAUDE.md"}],"correct":"B","explanation":"A .claude/rules file with a paths glob loads only when Claude edits a matching file, ideal for conventions spread across many directories (tests, migrations). Per-directory CLAUDE.md is impractical for scattered files and always loads when in that dir; an @path import loads unconditionally; user-level config isn't path-scoped or shared."},{"id":"mockD-35","scenario":"Insurance skill tool restriction","stem":"An insurance team's 'audit-policy-docs' skill should only ever read and search files — never edit or delete them — even if the model decides editing would help. Which SKILL.md frontmatter parameter enforces this?","domain":"CODE-CONFIG","difficulty":2,"choices":[{"label":"A","text":"allowed-tools restricting the skill to read-only tools like Read, Grep, Glob"},{"label":"B","text":"context: fork, which isolates the skill's run and so prevents any file edits"},{"label":"C","text":"argument-hint, which validates the arguments and rejects destructive ones"},{"label":"D","text":"A higher max_tokens budget, which keeps the skill cautious and read-only"}],"correct":"A","explanation":"allowed-tools restricts which tools a skill may use (a security control — e.g., it cannot delete files if those tools aren't allowed). context: fork only isolates output, argument-hint only prompts for arguments, and max_tokens has nothing to do with tool permissions."},{"id":"mockD-36","scenario":"A new backend hire keeps getting code reviews rejected for ignoring the team's mandatory error-wrapper pattern. The new hire insists Claude never mentioned it. The tech lead, who set up the convention months ago, sees it working fine on their own machine. The convention currently lives in the tech lead's `~/.claude/CLAUDE.md`.","stem":"What is the diagnosis and fix?","domain":"CODE-CONFIG","difficulty":3,"choices":[{"label":"A","text":"The rule is user-level (not shared via VCS), so it never reaches teammates; move it to the project's `.claude/CLAUDE.md` (or root CLAUDE.md) so all contributors get it"},{"label":"B","text":"The new hire's directory-level CLAUDE.md is silently overriding the shared convention; delete that subdirectory CLAUDE.md so the original rule takes effect for them again"},{"label":"C","text":"The convention is missing `paths` frontmatter, so it never auto-loads; move it into a `.claude/rules/` file with a matching glob so it reaches the new hire on the right edits"},{"label":"D","text":"Shared conventions only propagate through user CLAUDE.md, so the new hire must run `/memory` and paste the convention into their own ~/.claude/CLAUDE.md to receive it"}],"correct":"A","explanation":"Correct: A. This is the classic hierarchy bug: rules in `~/.claude/CLAUDE.md` apply only to that one user and are not shared via VCS, so teammates never receive them; moving the convention to project-level fixes it for everyone. B invents an override that isn't described and wouldn't explain why only the lead's machine has the rule. C could scope loading but still misses the real cause — the rule simply isn't in the shared repo at all; the right move is to commit it project-level. D makes the convention a per-developer manual chore instead of a VCS-shared project standard, repeating the original mistake."},{"id":"mockD-37","scenario":"While planning a multi-phase refactor, an architect needs to first understand an unfamiliar 200-file authentication subsystem. Early attempts had Claude reading files inline, and by the time discovery finished the context was so full of file contents that the actual planning degraded.","stem":"Which approach best preserves context for the later planning phases?","domain":"CODE-CONFIG","difficulty":3,"choices":[{"label":"A","text":"Delegate the discovery to the Explore subagent, which isolates the verbose exploration output and returns only a summary, preventing context-window exhaustion in the multi-phase task"},{"label":"B","text":"Read all 200 files directly in the main session, but run `/compact` after every batch of 20 files to keep the context window clear for the later planning phases"},{"label":"C","text":"Switch to direct execution right away so the discovery scan and the editing happen together in one efficient pass, avoiding any separate exploration overhead entirely"},{"label":"D","text":"Put the subsystem's full file list into a `.claude/rules/` file with a `paths` glob, so Claude already knows the structure and can skip exploring it during the task"}],"correct":"A","explanation":"Correct: A. The Explore subagent is purpose-built to isolate verbose discovery output and return only a summary, preventing context exhaustion across multi-phase work. B keeps all the verbose reads in the main session and leans on repeated compaction, which both wastes context and risks losing precise details. C abandons safe exploration on an unfamiliar subsystem — the opposite of what's needed before a large refactor. D's path rules carry conventions for editing matching files; they don't perform or summarize codebase discovery."},{"id":"mockD-38","scenario":"An e-commerce monorepo's root CLAUDE.md has ballooned to 900 lines mixing universal rules (commit message format, security baseline) with package-specific standards (a React style guide, a Go API guide). The team wants the universal rules always loaded but the package guides pulled in only where relevant — without a giant file.","stem":"Which modularization approach matches this intent?","domain":"CODE-CONFIG","difficulty":4,"choices":[{"label":"A","text":"Keep the universal rules inline in the root CLAUDE.md, and in each package's CLAUDE.md use `@./standards/<guide>.md` imports to include only that package's relevant standards"},{"label":"B","text":"Move everything, including the universal rules, into the user-level `~/.claude/CLAUDE.md`, so the per-package files stay small and every developer shares one source"},{"label":"C","text":"Split all standards into separate `.claude/rules/` files but deliberately omit `paths` frontmatter from each, so every rule loads on every edit across all packages"},{"label":"D","text":"Replace the root CLAUDE.md with a single skill that takes an `argument-hint` for the package name and loads that package's relevant guide on demand at invocation time"}],"correct":"A","explanation":"Correct: A. `@path` imports modularize CLAUDE.md without duplication: universal rules stay always-on in the root file, while each package's CLAUDE.md imports only its relevant standards. B moves shared project rules to user-level, so they are not shared via VCS and new teammates miss them. C drops the `paths` mechanism, so every rule loads on every edit — defeating the goal of pulling guides in only where relevant. D turns always-needed universal rules into an on-demand skill invocation, so the universal rules would no longer be reliably always-loaded."},{"id":"mockD-39","scenario":"A platform team has a strong, stable project CLAUDE.md. A teammate proposes adding the instruction 'Always assume we are mid-migration from REST to gRPC and prefer gRPC stubs' to the always-loaded root CLAUDE.md, because the current sprint is doing exactly that migration in two services.","stem":"Why is putting this in the always-on root CLAUDE.md the wrong choice?","domain":"CODE-CONFIG","difficulty":4,"choices":[{"label":"A","text":"The instruction is task/sprint-specific, not a universal standard; always-on CLAUDE.md should hold enduring conventions, so a transient migration assumption belongs in a path-scoped rule, a per-task instruction, or the directory CLAUDE.md of the affected services"},{"label":"B","text":"The root CLAUDE.md is structurally not allowed to contain any migration-related guidance whatsoever; such transient instructions are permitted only inside `.claude/rules/` files, never in always-on memory, so placing it there would be rejected outright by the loader"},{"label":"C","text":"Always-on rules placed in the root CLAUDE.md are silently ignored at runtime unless the very same text is also duplicated in the user-level `~/.claude/CLAUDE.md`, so the migration instruction would simply have no effect on Claude's behavior across the affected services"},{"label":"D","text":"Putting it in the root CLAUDE.md would actually be fine, but only if the migration instruction is wrapped in `@path` imports, because it is the `@path` import mechanism that makes a rule load as always-on rather than as a transient per-task instruction"}],"correct":"A","explanation":"Correct: A. Always-loaded CLAUDE.md is for enduring, universal standards; a transient 'assume we're mid-migration, prefer gRPC' assumption is task-specific and will mislead every unrelated edit once the sprint ends. It belongs in narrower scope (path-scoped rule, the affected services' directory CLAUDE.md, or a per-task instruction). B invents a content restriction that doesn't exist — root CLAUDE.md can hold any guidance; the issue is scope, not topic. C is false; root rules are loaded regardless of the user file. D misstates `@path`, which is an import mechanism for modularization, not what determines always-on behavior — and it doesn't make a task-specific rule appropriate."},{"id":"mockD-40","scenario":"Few-shot count","stem":"You're improving a legal-clause classifier prompt. A colleague suggests pasting 30 examples to be safe. According to the guide's few-shot guidance, what is the recommended number of examples to include?","domain":"PROMPT-ENG","difficulty":1,"choices":[{"label":"A","text":"Exactly one canonical example, since a single clean case anchors the format best."},{"label":"B","text":"Around 2-4 diverse input/output examples that demonstrate the expected behavior."},{"label":"C","text":"At least 20 examples, to maximize coverage of the clause variations the model sees."},{"label":"D","text":"Zero examples; rely on a precise textual description of the classification rules instead."}],"correct":"B","explanation":"Correct: few-shot prompting means including 2-4 input/output examples to demonstrate expected behavior (Ch6.1). B matches. A is too few to convey decision logic, C bloats context unnecessarily, and D is the vague-description approach few-shot is meant to improve upon."},{"id":"mockD-41","scenario":"Explicit criteria","stem":"A comment-accuracy checker for a healthcare codebase produces noisy, inconsistent findings under the instruction \"check comments for accuracy; be conservative.\" What rewrite best improves reliability?","domain":"PROMPT-ENG","difficulty":2,"choices":[{"label":"A","text":"Replace the vague instruction with explicit flag/do-not-flag criteria (e.g., flag only if the comment contradicts the code or references a non-existent symbol; do not flag stylistic wording)."},{"label":"B","text":"Keep the instruction but repeat 'be more conservative' twice so the added emphasis pushes the checker to flag only the cases it is most certain about each run."},{"label":"C","text":"Raise max_tokens so the checker has room to write a longer explanation for each finding, which makes the noisy, inconsistent findings clearer and more reliable."},{"label":"D","text":"Switch to tool_choice any to force the checker to emit structured findings, since forcing a tool call eliminates the inconsistency in what gets flagged each run."}],"correct":"A","explanation":"Correct: vague instructions are interpreted many ways; explicit flag/do-not-flag criteria with examples make behavior reliable. B repeating a vague phrase does not add precision. C more tokens does not improve decision criteria. D forcing structured output does not fix what the model decides to flag."},{"id":"mockD-42","scenario":"Chaining vs single pass","stem":"A reviewer feeds a 14-file pull request to Claude in one prompt and gets deep analysis of a few files and shallow commentary on the rest, with one pattern flagged in file A but ignored in file B. What technique resolves this?","domain":"PROMPT-ENG","difficulty":2,"choices":[{"label":"A","text":"Prompt chaining / multi-pass review: analyze each file in its own focused step, then a final integration pass for cross-file issues."},{"label":"B","text":"Keep the single combined pass over all 14 files but raise max_tokens substantially, so the model has enough output budget to cover every file at equal depth."},{"label":"C","text":"Send all 14 files together in one prompt but add an explicit instruction telling the model to 'analyze each file equally' so coverage is balanced across them."},{"label":"D","text":"Use dynamic adaptive decomposition, letting the model decide the review steps on the fly because the relevant subtasks for a 14-file PR cannot be known up front."}],"correct":"A","explanation":"Correct: a single pass over many files causes attention dilution and inconsistency; chaining per-file plus an integration pass fixes it. B more tokens does not cure attention dilution. C an instruction does not overcome the dilution effect. D the review template is predictable, so fixed chaining fits better than dynamic decomposition."},{"id":"mockD-43","scenario":"Streaming negative examples","stem":"A streaming code-review prompt over-flags loose equality checks even where the team considers them acceptable. To teach the boundary, the engineer adds paired examples showing acceptable code that must NOT be flagged alongside problematic code that should be. What technique is this?","domain":"PROMPT-ENG","difficulty":2,"choices":[{"label":"A","text":"Negative (contrastive) examples that separate acceptable from problematic cases"},{"label":"B","text":"Prompt chaining, splitting the loose-equality review into sequential passes"},{"label":"C","text":"The interview pattern, eliciting the team's loose-equality rules in advance"},{"label":"D","text":"Retry-with-feedback, re-running every over-flagged equality check with notes"}],"correct":"A","explanation":"Showing acceptable (do-not-flag) versus problematic (flag) examples is the negative-example technique that draws a clear boundary. Prompt chaining splits a task into steps, the interview pattern asks clarifying questions, and retry-with-feedback re-prompts after validation failure."},{"id":"mockD-44","scenario":"Manufacturing retry won't help","stem":"An industrial-spec extractor must pull a torque-tolerance value, but for some documents that value simply isn't present in the source. The team keeps retrying these with feedback and they keep failing. Why won't retry help here?","domain":"PROMPT-ENG","difficulty":2,"choices":[{"label":"A","text":"The model needs a forced tool_choice to commit to extracting the torque value"},{"label":"B","text":"Retry doesn't help when the information is absent from the source (or requires external context not provided)"},{"label":"C","text":"Retry-with-feedback only works on source documents shorter than about 1,000 tokens"},{"label":"D","text":"Retry-with-feedback requires routing the requests through the Message Batches API"}],"correct":"B","explanation":"Retry-with-feedback helps with format, structural, and arithmetic errors, but not when the information is simply absent from the source or lives in external context — no amount of re-prompting conjures missing data. Forcing a tool, a token-size rule, and the Batch API are all irrelevant to the missing-data root cause."},{"id":"mockD-45","scenario":"Gaming normalization rules","stem":"A gaming purchase-log extractor produces syntactically valid JSON, but currency and date values are inconsistent ('five bucks' vs '$5', 'yesterday' vs an absolute date), breaking downstream analytics. What prompt addition prevents these semantic inconsistencies?","domain":"PROMPT-ENG","difficulty":2,"choices":[{"label":"A","text":"Explicit normalization rules in the prompt (dates to ISO 8601, currency to numeric amount + code, 'half' to 0.5, etc.)"},{"label":"B","text":"Mark every extracted field as required, so the model is forced to supply a concrete value for currency and date rather than leaving them loosely formatted."},{"label":"C","text":"Switch tool_choice to any to force a structured tool call, since guaranteeing a tool emission also normalizes the currency and date values consistently."},{"label":"D","text":"Lower max_tokens so the model produces tighter output, leaving it less room to emit verbose inconsistent currency and date phrasings in the extracted JSON."}],"correct":"A","explanation":"Adding explicit normalization rules (ISO 8601 dates, numeric amount + currency code, decimal fractions for percentages) prevents semantic inconsistency even when the JSON is structurally valid. Marking fields required can force fabrication, and neither tool_choice nor max_tokens normalizes values."},{"id":"mockD-46","scenario":"Travel explicit severity criteria","stem":"A travel-app code reviewer assigns severity inconsistently — labeling a null-pointer crash in checkout and a minor duplication both as 'high'. To make severity consistent, what should the prompt include?","domain":"PROMPT-ENG","difficulty":2,"choices":[{"label":"A","text":"Explicit severity definitions with concrete examples (e.g., CRITICAL = runtime failure for users; LOW = code-quality issues like duplication)"},{"label":"B","text":"Add an instruction telling the reviewer to 'use good judgment when assigning severity levels' so it weighs each issue appropriately"},{"label":"C","text":"Apply a forced tool_choice so every finding is emitted as a structured tool call with a severity field attached to it consistently"},{"label":"D","text":"Grant a larger max_tokens budget so the reviewer has room to justify each severity rating and thereby assign them more consistently"}],"correct":"A","explanation":"Defining severity levels with explicit criteria and examples (CRITICAL runtime failure, HIGH security, MEDIUM logic bug, LOW code quality) produces consistent grading. 'Use good judgment' is the vague guidance that causes inconsistency, and tool_choice/max_tokens don't define severity semantics."},{"id":"mockD-47","scenario":"Diverse edge-case examples","stem":"An edtech extraction prompt pulls measurements from informal student lab reports like \"about two handfuls of soil\" and \"a pinch of fertilizer\". Rule-based instructions keep failing on the variety. What prompting approach handles these best?","domain":"PROMPT-ENG","difficulty":2,"choices":[{"label":"A","text":"Few-shot examples covering diverse informal measurements, each mapping the original text to a normalized amount."},{"label":"B","text":"A single rigid regular expression, fully described in prose, that the model applies to every informal measurement phrase it encounters."},{"label":"C","text":"Raise max_tokens so the model has room to list many candidate guesses for each vague measurement and then pick the most plausible one."},{"label":"D","text":"Force tool_choice to \"any\" with no examples, relying on the forced structured tool call to normalize the informal measurements correctly."}],"correct":"A","explanation":"Correct: few-shot is especially effective for extracting informal/non-standard measurements that are too diverse for rule-based instructions, mapping original text to normalized values with precision flags (Ch6.1). A matches. B can't capture the diversity, C just produces more output, and D forces a tool without teaching the mapping."},{"id":"mockD-48","scenario":"Retry will not help","stem":"A logistics document extractor returns null for a required carrier_reference because that field simply is not present anywhere in the source document. An engineer plans to retry with feedback. Will it help, and why?","domain":"PROMPT-ENG","difficulty":3,"choices":[{"label":"A","text":"No, retry will not help when the information is absent from the source; the data must come from elsewhere or the field should be allowed to be null."},{"label":"B","text":"Yes, retrying with feedback will eventually surface the missing carrier_reference, because repeated attempts reliably coax out fields the first pass skipped."},{"label":"C","text":"Yes, if you raise the sampling temperature on the retry the model explores more of the document and will locate the carrier_reference it initially missed."},{"label":"D","text":"Yes, forcing tool_choice to any on the retry compels the model to populate the carrier_reference field, so the value will appear after the forced tool call."}],"correct":"A","explanation":"Correct: retry-with-feedback helps with format, structural, and arithmetic errors, but not when the information is absent from the source. B retrying cannot invent data that is not present. C higher temperature only increases the chance of hallucination. D forcing a tool call does not create missing source data."},{"id":"mockD-49","scenario":"Gaming structural vs semantic validation","stem":"A game-config extractor uses tool_use with a strict JSON schema. Engineers find the JSON is always well-formed, but occasionally a player's level cap (claimed 50) doesn't equal the highest unlocked tier (which sums to 47). What kind of check catches this, and where does it run?","domain":"PROMPT-ENG","difficulty":3,"choices":[{"label":"A","text":"The strict JSON schema already catches this discrepancy at parse time, since it validates that the declared level cap matches the unlocked tiers"},{"label":"B","text":"A semantic/business-rule validator in code (e.g., a custom validator verifying the totals match), separate from structural schema checks"},{"label":"C","text":"Setting tool_choice to any catches the mismatch, because forcing a structured tool call also enforces that the numeric fields are mutually consistent"},{"label":"D","text":"Increasing max_tokens catches it, giving the model enough room to re-derive the tier totals and correct the level cap before emitting the final value"}],"correct":"B","explanation":"Structural validation (types, requiredness, enums) is enforced by the schema, but cross-field consistency is a semantic error caught by custom business-rule validators in code. The schema can't verify totals, and tool_choice/max_tokens don't perform value validation."},{"id":"mockD-50","scenario":"Incident-log root-cause investigation","stem":"You are building an agent that investigates production incidents from raw logs. Each incident is different: sometimes the trail leads into a database, sometimes a third-party API, sometimes a deploy. A fixed three-step pipeline (parse logs -> check DB -> check deploy) keeps doing irrelevant steps and missing the actual culprit because the relevant subtasks only become clear partway through. Which approach fits?","domain":"PROMPT-ENG","difficulty":3,"choices":[{"label":"A","text":"Keep the fixed three-step pipeline but extend it with many more predefined branches and steps so it can cover every possible incident type in advance."},{"label":"B","text":"Use dynamic adaptive decomposition, where the agent determines the next subtask based on what it discovers during the investigation, since the subtasks become clear only during execution."},{"label":"C","text":"Use prompt chaining that runs the exact same fixed sequence of steps for every incident, which guarantees consistent and repeatable investigation results."},{"label":"D","text":"Send all the raw logs in a single prompt and ask the model for the root cause directly, skipping decomposition since the model can reason over it at once."}],"correct":"B","explanation":"Correct: B. The guide distinguishes prompt chaining (predictable, repeatable tasks) from dynamic decomposition (open-ended investigations where subtasks become clear only during execution). Incident root-cause analysis is open-ended and path-dependent, so the agent should choose the next subtask from what it has discovered. A still bakes in a fixed order and runs irrelevant steps. C is the wrong tool: a fixed chain cannot adapt to the branch the evidence dictates. D loses the structured investigation and reintroduces attention/quality problems on large logs."},{"id":"mockD-51","scenario":"Invoice self-correction for discrepancies","stem":"Finance wants the extractor to surface invoices where the printed total disagrees with the line items, instead of silently 'fixing' one of them. Today the model sometimes overwrites the printed total with its own computed sum, hiding genuine vendor errors. Which output design best meets the requirement?","domain":"PROMPT-ENG","difficulty":3,"choices":[{"label":"A","text":"Have the model emit both the stated_total (as printed) AND a calculated_total (summed from line items) plus a conflict_detected flag, so discrepancies are surfaced rather than silently reconciled."},{"label":"B","text":"Have the model return only the single total value it judges most likely to be correct, resolving the discrepancy internally so downstream gets one clean figure."},{"label":"C","text":"Have the model return only the computed sum of the line items, since arithmetic over line items is inherently more reliable than reading the printed total figure."},{"label":"D","text":"Add one required 'total' field and instruct the model to adjust the line items so they add up to the printed total, ensuring the invoice is internally consistent."}],"correct":"A","explanation":"Correct: A. This is the self-correction pattern in the guide: emit the stated value AND a computed value, and set conflict_detected when they differ so the discrepancy can be handled by a human/process. B and C both collapse the two values into one, which is exactly the silent-reconciliation behavior the business wants to eliminate — a genuine vendor error would be hidden. D forces the model to alter the data to remove the conflict, the worst outcome when the whole point is to detect conflicts."},{"id":"mockD-52","scenario":"Case-facts block","stem":"A multi-turn fintech support session relies on conversation history, but after summarization the agent loses the customer ID, order amount, and status. What durable technique keeps these facts intact?","domain":"CONTEXT-REL","difficulty":2,"choices":[{"label":"A","text":"Maintain a structured CASE FACTS block (IDs, amounts, dates, status) and include it in every prompt regardless of how history is summarized."},{"label":"B","text":"Rely on /compact to automatically detect and preserve the customer ID, order amount, and status when it summarizes the conversation history each time."},{"label":"C","text":"Ask the customer to re-state their ID, order amount, and status on every turn, so the agent always has the current facts regardless of how history is summarized."},{"label":"D","text":"Increase max_tokens so the entire raw conversation history always fits in context and never needs the summarization step that loses the key case facts."}],"correct":"A","explanation":"Correct: extracting key facts into a structured block included in every prompt survives history summarization. B /compact is the very summarization that can lose exact values. C re-asking the customer is poor UX and unreliable. D a larger budget delays but does not solve degradation, and exact values can still be summarized away."},{"id":"mockD-53","scenario":"Attribution loss","stem":"A research agent synthesizes market figures for a logistics report, but the summary says \"the cold-chain market is $4.1B\" with no source or year, and stakeholders cannot verify it. What practice prevents this?","domain":"CONTEXT-REL","difficulty":2,"choices":[{"label":"A","text":"Preserve provenance by attaching claim, source_url, source_name, publication_date, and confidence to each figure."},{"label":"B","text":"Add a blanket disclaimer stating that all figures in the report are approximate and should be independently verified before being relied upon."},{"label":"C","text":"Average every source's value into one consolidated number per figure to avoid cluttering the summary with multiple competing data points."},{"label":"D","text":"Drop any figure that lacks a citable source so that only confidently-known round numbers remain in the final logistics market report."}],"correct":"A","explanation":"Correct: provenance preservation keeps the claim-to-source link (source, date, confidence) so claims are verifiable. B a blanket disclaimer does not restore traceability. C averaging discards attribution and may distort. D dropping unsourced figures loses information rather than attributing it."},{"id":"mockD-54","scenario":"Streaming Batch API tradeoff","stem":"A streaming company must classify 50,000 archived support transcripts for a quarterly analytics report due in three days. Cost matters; latency does not. Which API choice is best and what is the key constraint to remember?","domain":"CONTEXT-REL","difficulty":2,"choices":[{"label":"A","text":"Synchronous API, because it returns each transcript's classification immediately and the report is due in only three days"},{"label":"B","text":"Message Batches API: ~50% cost savings and up to a 24-hour processing window, but no multi-turn tool calling and use custom_id to correlate and re-submit failures"},{"label":"C","text":"Batch API for the cost savings, but remember it guarantees sub-minute latency so all 50,000 transcripts return almost instantly"},{"label":"D","text":"Synchronous API paired with tool_choice any to force structured classification output for every one of the archived transcripts"}],"correct":"B","explanation":"Bulk, non-urgent jobs suit the Message Batches API: about 50% savings with up to a 24-hour window, no mid-request multi-turn tool calling, and custom_id to correlate results and re-submit only failures. Synchronous is unnecessarily costly here, and the Batch API explicitly does not guarantee low latency."},{"id":"mockD-55","scenario":"Insurance scratchpad investigation","stem":"An insurance fraud investigation spans many sessions and the agent keeps re-running the same expensive discovery (mapping which adjusters touched a claim, external API rate limits) each time context degrades. What lightweight practice avoids the rework?","domain":"CONTEXT-REL","difficulty":2,"choices":[{"label":"A","text":"Write key findings to a scratchpad file the agent can consult instead of re-running discovery when context degrades or in a new session"},{"label":"B","text":"Increase max_tokens so nothing from the expensive discovery is ever dropped from context, letting the agent retain the full mapping across sessions"},{"label":"C","text":"Force tool_choice any whenever discovery runs, so the agent commits to tool calls faster and rediscovers the adjuster mapping more quickly each time"},{"label":"D","text":"Run /compact more aggressively to keep the context window small, so the discovery results stay compact enough to survive into the next session intact"}],"correct":"A","explanation":"In long investigations the agent can persist key findings to a scratchpad file and consult it instead of re-running discovery when context degrades or in a new session. max_tokens doesn't preserve findings across degradation, tool_choice doesn't store knowledge, and /compact risks losing the very details you'd want to keep."},{"id":"mockD-56","scenario":"Streaming conflicting values preserve both","stem":"A streaming-analytics agent finds two sources reporting the share of AI-generated tracks: 12% (platform report, automated classification) and 8% (industry survey of 500 labels). They differ. What should the agent record?","domain":"CONTEXT-REL","difficulty":2,"choices":[{"label":"A","text":"Both values with their sources, dates, and methodologies, flag conflict_detected, and let the coordinator decide — do not arbitrarily pick one"},{"label":"B","text":"Record only the 12% figure, since automated classification over the full catalog sounds more rigorous than a self-reported survey of just 500 labels"},{"label":"C","text":"Average the two figures into a single 10% value, presenting one clean number so the coordinator and stakeholders are not distracted by the conflict"},{"label":"D","text":"Discard both figures entirely because they conflict, recording no share value rather than risking propagation of a number that may be inaccurate"}],"correct":"A","explanation":"When sources conflict, preserve both values with attribution (source, date, methodology), flag the conflict, and let the coordinator decide rather than arbitrarily choosing. Picking one, averaging, or discarding all destroy information and hide the methodological/temporal reasons for the difference."},{"id":"mockD-57","scenario":"Trimming verbose tool results","stem":"In a property-management agent, lookup_unit returns 40+ fields but the current task needs only unit_id, status, rent, tenant, and lease_end. The context fills with noise. What is the recommended way to reduce this?","domain":"CONTEXT-REL","difficulty":2,"choices":[{"label":"A","text":"A PostToolUse hook that keeps only the five relevant fields before the result enters context."},{"label":"B","text":"Increase the context-window allocation so the full 40-field blob fits comfortably."},{"label":"C","text":"Instruct the model to read all 40 fields but then ignore the ones it does not need."},{"label":"D","text":"Call lookup_unit fewer times overall by caching the full 40-field result blob to reuse."}],"correct":"A","explanation":"Correct: a PostToolUse hook can trim a tool result to only the relevant fields, conserving context and reducing noise (Ch11.2). A matches. B doesn't reduce the noise (the 40 fields still load), C still pays the context cost since the model reads everything, and D caches the bloat rather than trimming it."},{"id":"mockD-58","scenario":"Manufacturing confidence routing","stem":"An IoT warranty-document extraction system processes thousands of forms. The team wants automation where safe but human review where risky. Which routing design fits, and what audit caveat matters?","domain":"CONTEXT-REL","difficulty":3,"choices":[{"label":"A","text":"Route high-confidence stable-accuracy extractions to automation and low-confidence/ambiguous ones to human review; still audit samples since an aggregate 97% can hide 40% errors for one document type"},{"label":"B","text":"Automate every extraction whose confidence sits above an arbitrary fixed threshold and skip auditing entirely, trusting that the high-confidence bucket is reliable enough on its own"},{"label":"C","text":"Send every single warranty document to human review regardless of confidence, since manual review of all forms is the only way to be completely safe against extraction errors"},{"label":"D","text":"Route documents purely on the model's own self-rated 1-10 confidence score with no calibration, automating the high self-ratings and reviewing the low ones it reports for itself"}],"correct":"A","explanation":"Confidence-based routing sends high-confidence/stable-accuracy items to automation and low-confidence/ambiguous ones to humans, but stratified sampling is still needed because an aggregate accuracy can hide high error rates for a specific document type. Never auditing is risky, all-human review defeats the purpose, and uncalibrated self-rated confidence is unreliable."},{"id":"mockD-59","scenario":"Insurance batch SLA window","stem":"An insurance team must produce a bulk risk-scoring run whose results are needed in exactly 30 hours, and they want the Batch API's savings. Given the Batch API can take up to 24 hours, what is the latest they can submit?","domain":"CONTEXT-REL","difficulty":3,"choices":[{"label":"A","text":"At least 24 hours before the deadline — i.e., within the first 6 hours of the 30-hour window"},{"label":"B","text":"Any time within the last hour before the deadline, since batches in practice almost always finish within a few minutes of submission"},{"label":"C","text":"Exactly at the 30-hour mark, submitting right at the deadline because the batch will still complete in time for the results to be used"},{"label":"D","text":"Do not use the Batch API at all; switch to the synchronous API instead, because a batch run can never reliably meet a fixed deadline"}],"correct":"A","explanation":"With a 24-hour batch window and a 30-hour deadline, the submission window is 30 - 24 = 6 hours, so batches must be submitted no later than 24 hours before the deadline. Batches don't reliably finish in minutes, submitting at the deadline misses it, and the synchronous API isn't required just because there's a deadline."},{"id":"mockD-60","scenario":"Research synthesis agent losing source attribution","stem":"A market-research agent collects findings from many subagents and a final synthesis pass merges them into a polished prose report. Reviewers complain that key claims (e.g., a market-size figure) appear with no traceable origin, making them unauditable. The synthesis step is where attribution disappears. What should change?","domain":"CONTEXT-REL","difficulty":3,"choices":[{"label":"A","text":"After synthesis, run a second model pass that inspects each unattributed claim and guesses the single most likely source for it, restoring the missing attributions retroactively."},{"label":"B","text":"Carry each claim as a structured object with source_name, source_url, and publication_date through synthesis, preserving the claim-to-source mapping rather than flattening into unattributed prose."},{"label":"C","text":"Use a larger, higher-capacity model for the synthesis step so it can hold and recall where each individual fact originated while merging everything into the final prose report."},{"label":"D","text":"During synthesis, drop any claim whose originating source can no longer be remembered, keeping only the fully-attributable facts so the finished report stays clean and auditable."}],"correct":"B","explanation":"Correct: B — provenance must be preserved structurally (claim plus source name, URL, date) all the way through synthesis so the claim-to-source link survives (Ch12.1). A fabricates attribution by guessing, which is worse than no source. C is the bigger-model fallacy: attribution loss is an information-flow design flaw, not a recall capability the model can be scaled into. D silently discards valid findings and degrades coverage rather than fixing the broken mapping."}]},{"id":"mock-e","title":"Mock Exam E","code":"CLAUDE-ARCH-MOCK-E","certification":"Claude Certified Architect - Foundations","tag":"Judgment mock · Set E","sheet":"SHEET E","description":"The judgment-focused paper, built from the “You Cannot Memorize Your Way Through the CCA-F” guide. Scenario reasoning over recall — the toughest set.","durationMinutes":120,"passingScore":72,"totalQuestions":60,"sampling":null,"domains":{"AGENT-ARCH":{"name":"Agentic Architecture & Orchestration","color":"#3B5FC0"},"TOOL-MCP":{"name":"Tool Design & MCP Integration","color":"#0F7A6C"},"CODE-CONFIG":{"name":"Claude Code Configuration & Workflows","color":"#7B52C9"},"PROMPT-ENG":{"name":"Prompt Engineering & Structured Output","color":"#9E5509"},"CONTEXT-REL":{"name":"Context Management & Reliability","color":"#B4426B"}},"questions":[{"id":"mockE-1","scenario":"Long-running research tool","stem":"Your research agent calls a tool that Anthropic runs server-side and that can take a long time. On the latest API response stop_reason is \"pause_turn\" and the response contains the model's in-progress work. A junior engineer's loop treats anything that is not tool_use as completion, so it returns the partial content to the user. What should the loop actually do?","domain":"AGENT-ARCH","difficulty":4,"choices":[{"label":"A","text":"Return the in-progress content to the user, since pause_turn marks the model's own checkpoint that it has produced everything it can without further server-side tool output."},{"label":"B","text":"Pass the current response back to the API to continue the same turn, because pause_turn signals a paused long-running turn that must be resumed, not a completed one."},{"label":"C","text":"Restart the conversation from the original user message so the long-running tool re-runs cleanly from scratch, since a paused turn cannot be safely resumed mid-flight."},{"label":"D","text":"Treat pause_turn as a server-side timeout error, discard the model's partial work, and escalate the whole task to a human operator to complete the long-running step manually."}],"correct":"B","explanation":"pause_turn is a continuation signal: the model paused a long-running turn and expects the loop to send the response back so it can resume. Treating it as completion truncates the work; restarting discards progress; escalating wastes a recoverable, normal control signal."},{"id":"mockE-2","scenario":"Content agent refusal","stem":"A content-generation agent runs in a loop. On one request stop_reason comes back as \"refusal\" and the response carries a short message that the model declined to continue. The current loop returns any non-tool_use response straight to the downstream formatting agent as the task result. What is the correct handling?","domain":"AGENT-ARCH","difficulty":4,"choices":[{"label":"A","text":"Forward the refusal text downstream as the answer, because a refusal stop_reason still represents a complete, final assistant turn the formatter can render."},{"label":"B","text":"Immediately retry the identical request several times in a tight loop, since refusals are usually transient and the model will eventually comply and continue."},{"label":"C","text":"Recognize refusal as a safety stop: do not treat the content as a valid result; surface it for review or take the defined fallback path instead of feeding it downstream."},{"label":"D","text":"Lower the temperature and resend the same prompt unchanged, since refusals are simply an artifact of sampling randomness that a more deterministic decode will reliably remove."}],"correct":"C","explanation":"A refusal stop_reason means the model declined to continue for safety reasons; the output is not a valid task result and must not be passed downstream as if it were. Blindly retrying or re-rolling temperature ignores the signal and can loop on disallowed work."},{"id":"mockE-3","scenario":"Truncated structured output","stem":"An orchestration agent asks Claude for a large structured plan. The response comes back with stop_reason \"max_tokens\" and the JSON is cut off mid-array. The loop hands the string to json.loads, which throws, and the agent reports a hard failure. What is the right design?","domain":"AGENT-ARCH","difficulty":3,"choices":[{"label":"A","text":"Wrap json.loads in a try/except and silently drop the task on a parse error, since a malformed object means the model had nothing useful to return anyway."},{"label":"B","text":"Detect stop_reason == max_tokens, then continue the generation (or raise the token budget) and reassemble the full output before parsing."},{"label":"C","text":"Switch tool_choice to {\"type\":\"any\"} on a resend so the model is forced through a tool schema that guarantees the JSON comes back complete and valid."},{"label":"D","text":"Add a 'always return complete, well-formed JSON' rule to the system prompt and resend the request once, trusting the instruction to prevent truncation."}],"correct":"B","explanation":"max_tokens means the response was cut off by the output budget, not finished. The loop must detect it and continue/raise the budget, not parse a truncated payload. tool_choice and prompt wording do not change the token ceiling that caused the truncation."},{"id":"mockE-4","scenario":"Tool call never executed","stem":"A support agent's loop returns to the user as soon as the response contains any assistant text. Logs show requests where stop_reason is \"tool_use\" and the model asked to call lookup_order, yet the agent answered the customer with a generic apology and never ran the tool. What is the fix?","domain":"AGENT-ARCH","difficulty":2,"choices":[{"label":"A","text":"Tell the model in the system prompt to never mix assistant text with tool calls, so a tool_use turn is unambiguous and the loop can act on it correctly."},{"label":"B","text":"Branch on stop_reason: when it is tool_use, execute the requested tool(s), append the results, and call the model again; only stop on end_turn."},{"label":"C","text":"Set a maximum of three loop iterations so the agent cannot get stuck repeatedly apologizing and is forced to resolve the customer's request faster."},{"label":"D","text":"Parse the assistant text for the apology phrasing and suppress it before responding, so the customer never sees the generic message the loop produced."}],"correct":"B","explanation":"The completion decision must be driven by stop_reason, not by the presence of text. tool_use means the model wants results back, so the loop must run the tool and continue. The other options patch symptoms while leaving the loop's exit condition wrong."},{"id":"mockE-5","scenario":"Coordinator over-shares with status checker","stem":"A coordinator spawns an order-status subagent whose only job is to look up a shipping state from an order ID. To 'give it context,' the coordinator injects the entire customer conversation -- including the customer's full name, address, and payment notes -- into the subagent's prompt. Security review flags this. What is the right design?","domain":"AGENT-ARCH","difficulty":3,"choices":[{"label":"A","text":"Keep passing the full conversation but instruct the subagent in its prompt to ignore the name, address, and payment fields it does not need for the lookup."},{"label":"B","text":"Pass the subagent only the order ID and the question it must answer, following least-context: it needs nothing more to do its job."},{"label":"C","text":"Encrypt the conversation before passing it so the subagent receives the data but cannot read the sensitive parts unless it holds the decryption key."},{"label":"D","text":"Move the subagent to a larger-context model so the full customer record fits comfortably and the lookup has all surrounding detail available."}],"correct":"B","explanation":"Least context: each subagent should receive only what its task requires -- here, an order ID. Dumping the full conversation leaks PII and inflates cost. Telling the model to 'ignore' data it can see is not a guarantee, and encryption it must decrypt to use solves nothing."},{"id":"mockE-6","scenario":"Cost spike from full-history fan-out","stem":"After adding three subagents to a workflow, token spend triples with no quality gain. Tracing shows the coordinator packs the complete running transcript into every subagent it spawns, even for narrow tasks. What most directly fixes the cost?","domain":"AGENT-ARCH","difficulty":3,"choices":[{"label":"A","text":"Scope each subagent's input to just the data and instructions its task needs, instead of forwarding the whole transcript."},{"label":"B","text":"Enable prompt caching so the repeated transcript packed into each spawn is billed at the discounted cached-token rate, not full price."},{"label":"C","text":"Reduce the number of subagents from three down to one, cutting the duplicated transcript copies and most redundant spend."},{"label":"D","text":"Summarize the running transcript with an extra model call before each spawn, so each subagent gets a shorter version."}],"correct":"A","explanation":"The root cause is over-sharing context (least-context violation). Sending only task-relevant input removes the waste at its source. Caching only discounts the repeated tokens; cutting subagents abandons useful parallelism; an extra summarization call adds latency and still forwards more than the task needs."},{"id":"mockE-7","scenario":"Every subagent succeeds, report is incomplete","stem":"A research system produces a final report that omits entire requested sub-areas, yet every subagent returned successfully and its individual output was correct. The coordinator log shows it split the topic into only two of the five sub-areas the user asked about. Where is the root cause?","domain":"AGENT-ARCH","difficulty":3,"choices":[{"label":"A","text":"The synthesis agent is silently dropping finished sections during the merge step and needs stricter output rules to force every sub-area into the report."},{"label":"B","text":"The subagents are filtering their findings too aggressively against the relevance bar and should loosen their criteria so the missing areas surface."},{"label":"C","text":"The coordinator's task decomposition is too narrow -- it never assigned the missing sub-areas, so no subagent could cover them."},{"label":"D","text":"The web-search tool is returning too few results for the missing topics, and its queries should be broadened so every requested sub-area gets coverage."}],"correct":"C","explanation":"When each subagent succeeds but whole areas are missing, the gap was created before delegation: the coordinator's decomposition did not assign those areas. Fixing synthesis, relevance filters, or search breadth cannot recover work that was never delegated."},{"id":"mockE-8","scenario":"Transient vs permanent subagent failure","stem":"A document-analysis subagent fails for mixed reasons: some PDFs time out intermittently, others are password-protected and will never open. Currently any failure terminates the subagent and dumps a bare exception to the coordinator. You want efficient, informative recovery. What is the best design?","domain":"AGENT-ARCH","difficulty":3,"choices":[{"label":"A","text":"Retry every failure the same way, including the password-protected files, with exponential backoff and unlimited attempts until each document eventually opens and the extraction succeeds."},{"label":"B","text":"Catch all failures uniformly and return a success status with empty content, so the workflow never stops and the coordinator always sees a clean result regardless of which documents actually failed."},{"label":"C","text":"Handle recoverable failures locally with a bounded retry, and escalate unrecoverable ones to the coordinator with the failure type, attempted steps, and any partial results."},{"label":"D","text":"Have the coordinator pre-validate every document before dispatch so the subagent never encounters a timeout or a locked file and therefore never needs any local failure handling of its own."}],"correct":"C","explanation":"Handle errors at the lowest capable level, then escalate with context: retry transient timeouts locally (bounded), and escalate permanent failures (e.g., password-protected files) with enough detail for the coordinator to decide. Infinite retries hang on permanent errors; faking success hides data loss; pre-validating everything is impractical and still cannot open locked files."},{"id":"mockE-9","scenario":"Retry that never ends","stem":"A subagent calls a billing API that is returning a permanent 403 (the credential was revoked). The subagent retries on every failure with no cap, so the task spins indefinitely and the coordinator never hears about it. What is the correct change?","domain":"AGENT-ARCH","difficulty":2,"choices":[{"label":"A","text":"Increase the per-call timeout so each retry against the billing API has more time to push past the 403 and eventually complete the request successfully."},{"label":"B","text":"Cap the retries, classify the 403 as non-retryable, and escalate to the coordinator with the error context instead of looping."},{"label":"C","text":"Switch the subagent to a faster model so the unbounded retries against the 403 cycle complete sooner and the task stops spinning as long."},{"label":"D","text":"Add a 'do not give up, keep trying the billing call' instruction to the subagent's prompt so it stays persistent until the credential starts working."}],"correct":"B","explanation":"A 403 from a revoked credential is non-retryable; retrying forever cannot fix it and starves the system. Cap retries, distinguish retryable from non-retryable, and escalate with context. Timeouts, faster models, and persistence prompts all miss that the failure is permanent."},{"id":"mockE-10","scenario":"Handing off a large artifact","stem":"A research subagent extracts a 60-page structured dataset that the synthesis subagent needs in full. The team currently pastes the entire dataset into the synthesis subagent's spawning prompt, which is brittle and expensive. What is the most appropriate state-handoff mechanism?","domain":"AGENT-ARCH","difficulty":3,"choices":[{"label":"A","text":"Keep embedding the entire 60-page dataset directly in the spawning prompt but gzip-compress it first, so the otherwise oversized payload fits within the prompt size limits and travels inline as before."},{"label":"B","text":"Write the dataset to a shared file (or store) and pass the synthesis subagent a reference to it, since large or persistent artifacts travel by shared file, not inline prompt."},{"label":"C","text":"Have the synthesis subagent re-extract the full 60-page dataset itself from the original sources, avoiding any handoff of the already-extracted data even though it repeats all of the research work."},{"label":"D","text":"Stream the dataset through the coordinator's conversation history so both the research and synthesis subagents can read the full 60 pages from the shared turn record without any separate handoff."}],"correct":"B","explanation":"State should travel between agents on purpose, matched to the data: large or persistent artifacts belong in a shared file passed by reference. Inlining a 60-page dataset bloats the prompt; re-extraction wastes work; routing it through conversation history is the over-sharing anti-pattern."},{"id":"mockE-11","scenario":"Machine-readable handoff","stem":"An order-research subagent must return a result that the coordinator will consume programmatically -- an order ID, a status enum, and a refund-eligible boolean -- to drive a deterministic branch. Right now it returns a prose paragraph the coordinator has to parse with regex, which breaks often. What is the best handoff design?","domain":"AGENT-ARCH","difficulty":3,"choices":[{"label":"A","text":"Have the subagent return a structured tool-call result (JSON) with the fields the coordinator needs, so the handoff is machine-readable."},{"label":"B","text":"Keep returning the prose paragraph but standardize its wording and field order so the coordinator's regex parser matches it far more reliably each time."},{"label":"C","text":"Write the order ID, status, and refund flag to a shared file and have the coordinator scrape the values back out of the file when it needs them."},{"label":"D","text":"Put the result text into the coordinator's conversation history so the next turn can read the order ID, status, and refund flag from prior context."}],"correct":"A","explanation":"Machine-readable results that drive control flow should travel as structured tool-call JSON, not prose parsed by regex. Standardizing wording is still fragile; a shared file is for large artifacts, not a three-field result; and scraping conversation history is unreliable and leaks context."},{"id":"mockE-12","scenario":"Small immediate input handoff","stem":"A coordinator needs to spawn a refund-checker subagent and give it just two things: the order ID and the instruction 'determine whether this order qualifies for a refund under policy.' Which handoff mechanism fits this small, immediate input?","domain":"AGENT-ARCH","difficulty":2,"choices":[{"label":"A","text":"Write the order ID and instruction to a shared file and pass the subagent the file path, so the launch prompt stays small and the inputs load on demand."},{"label":"B","text":"Pass them directly in the subagent's spawning prompt, since small immediate inputs belong in the prompt that launches the agent."},{"label":"C","text":"Return the order ID and instruction as a structured tool-call result from a prior coordinator step, so the refund-checker reads them from that output."},{"label":"D","text":"Append the order ID and refund instruction to the coordinator's own system prompt for the whole session so every spawned subagent inherits them."}],"correct":"B","explanation":"Small, immediate inputs that a subagent needs at launch belong in its spawning prompt. Shared files are for large artifacts; tool-call JSON is for machine-readable results flowing back; and bloating the system prompt mixes durable instructions with per-task data."},{"id":"mockE-13","scenario":"Bypassing the coordinator","stem":"An engineer proposes letting subagents call each other directly to cut a hop, instead of returning to the coordinator between steps. What is the strongest reason to keep the coordinator as the central hub?","domain":"AGENT-ARCH","difficulty":2,"choices":[{"label":"A","text":"Direct subagent-to-subagent calls are technically impossible, because subagents cannot serialize messages to each other without the coordinator relaying them."},{"label":"B","text":"The coordinator can observe all interactions, apply uniform error handling, and control exactly what context each subagent receives."},{"label":"C","text":"Routing every step through the coordinator is always lower latency than direct calls, because the central hub keeps warm connections the subagents lack."},{"label":"D","text":"Only the coordinator is permitted to hold a valid API key, so any subagent that called another directly would have no way to authenticate the request."}],"correct":"B","explanation":"A central coordinator gives observability, uniform error handling, and least-context control over each handoff -- the core benefits of the hub topology. The other options are false: direct calls are technically possible, the hub is not automatically faster, and key access is a deployment detail, not the architectural reason."},{"id":"mockE-14","scenario":"Over-privileged summarizer","stem":"A read-only summarization subagent is, for convenience, given the same toolset as the coordinator -- including delete_record and issue_refund. It has started occasionally calling issue_refund when a customer's message mentions money. What is the right structural fix?","domain":"AGENT-ARCH","difficulty":2,"choices":[{"label":"A","text":"Add a strong instruction to the summarizer's prompt telling it never to call issue_refund or delete_record again."},{"label":"B","text":"Give the summarizer only the read tools its job needs, removing the write/destructive tools entirely (least privilege)."},{"label":"C","text":"Keep the full toolset but lower the summarizer's temperature so its tool selection is more predictable and stable."},{"label":"D","text":"Force tool_choice to the summarize tool every turn so the model is steered to the read path and writes are never chosen."}],"correct":"B","explanation":"Least privilege: a summarizer should not hold refund or delete tools at all, so misuse becomes impossible rather than merely discouraged. A prompt instruction is probabilistic; temperature does not remove capability; and forcing tool_choice does not address why dangerous tools were available."},{"id":"mockE-15","scenario":"Iteration cap mistaken for completion","stem":"A new agent loop's only stopping condition is a hard cap of 10 iterations; it ignores stop_reason entirely. Sometimes it stops mid-task at iteration 10 with work unfinished, and other times it keeps calling tools after the model already signaled it was done. What is the correct primary stop condition?","domain":"AGENT-ARCH","difficulty":2,"choices":[{"label":"A","text":"Keep the iteration cap as the main stop control but raise it from 10 to 50, giving longer tasks enough loop budget to reach completion before cutoff."},{"label":"B","text":"Use stop_reason as the primary control (tool_use -> continue, end_turn -> stop) and keep a high iteration cap only as a runaway-loop backstop."},{"label":"C","text":"Stop as soon as the model emits any assistant text, regardless of stop_reason, since produced text reliably signals the agent has finished its work."},{"label":"D","text":"Stop the loop once cumulative token usage crosses a fixed threshold, using spend as the primary signal that the task has run long enough to be done."}],"correct":"B","explanation":"stop_reason is the model's explicit completion signal and should drive the loop; an iteration cap is only a safety backstop against runaway loops. Raising the cap, stopping on any text, or stopping on token thresholds all substitute proxies for the real completion signal."},{"id":"mockE-16","scenario":"Independent tasks run sequentially","stem":"A coordinator needs three independent results for a report: a market-size search, a competitor search, and analysis of an uploaded filing. None depends on another. It currently issues one Task per turn and waits for each before starting the next, so the report is slow. What most reduces latency?","domain":"AGENT-ARCH","difficulty":2,"choices":[{"label":"A","text":"Raise max_tokens so the coordinator can plan and run all three searches in one longer response."},{"label":"B","text":"Emit all three Task calls in a single response so the subagents run concurrently."},{"label":"C","text":"Add a parallel: true flag to the coordinator's definition to run its Task calls concurrently."},{"label":"D","text":"Fork the session three times so each search runs in its own branch, then merge them."}],"correct":"B","explanation":"Including multiple Task calls in one response runs the independent subagents concurrently, removing the sequential round trips. max_tokens is about output length, the parallel flag is invented, and forking sessions is for comparing alternatives, not parallelizing independent work."},{"id":"mockE-17","scenario":"Pipeline must always return JSON","stem":"A document-ingestion pipeline must always produce a structured object by calling one of three extraction tools (extract_invoice, extract_contract, extract_receipt). It keeps breaking because the model sometimes replies with a prose summary and calls no tool. You still want the model to choose which schema fits. Which configuration guarantees a tool is called?","domain":"TOOL-MCP","difficulty":3,"choices":[{"label":"A","text":"Set tool_choice to {\"type\":\"auto\"} and add an 'always use one of the extraction tools' rule to the prompt, which reliably steers the model into a call."},{"label":"B","text":"Set tool_choice to {\"type\":\"any\"}, which forces the model to call one of the tools while still letting it pick the best-fitting schema."},{"label":"C","text":"Set tool_choice to {\"type\":\"tool\",\"name\":\"extract_invoice\"} so a tool always runs, and let the schema's optional fields absorb contracts and receipts."},{"label":"D","text":"Merge the three extractors into one mega-tool with every invoice, contract, and receipt field optional, so a single guaranteed call covers all document types."}],"correct":"B","explanation":"{\"type\":\"any\"} deterministically requires a tool call while preserving the model's choice among the three schemas -- a guarantee. auto plus a prompt request is the current, non-deterministic setup; forcing a single named tool locks every document into the invoice schema; merging schemas discards the typed contracts."},{"id":"mockE-18","scenario":"Tool fires on every greeting","stem":"A support assistant has one tool, lookup_order. Many turns are greetings or policy questions answerable from instructions, yet the model calls lookup_order on almost every turn, including 'thanks, that's all.' Which tool_choice setting is the appropriate fix?","domain":"TOOL-MCP","difficulty":2,"choices":[{"label":"A","text":"{\"type\":\"any\"} so the model always emits a structured lookup_order call, keeping every turn consistent."},{"label":"B","text":"{\"type\":\"auto\"} so the model decides per turn whether the tool is needed or it can answer in text."},{"label":"C","text":"{\"type\":\"tool\",\"name\":\"lookup_order\"} to standardize behavior, forcing the same call on every turn."},{"label":"D","text":"Remove the lookup_order tool and describe the order data inline in the prompt so the model answers from text."}],"correct":"B","explanation":"auto lets the model call the tool only when a turn needs it and answer directly otherwise -- exactly the requirement. any and forced tool_choice both compel a call on every turn (the cause of the problem), and removing the tool breaks legitimate lookups."},{"id":"mockE-19","scenario":"Guaranteeing the first step","stem":"A data-enrichment agent must always run validate_input before charge_card, or it occasionally charges on malformed input. Business rules require validation first, every time. Which approach guarantees the ordering on the first action?","domain":"TOOL-MCP","difficulty":3,"choices":[{"label":"A","text":"Add a reminder to charge_card's tool description telling the model to call validate_input first, so the ordering is enforced wherever the charge is selected."},{"label":"B","text":"Set tool_choice to {\"type\":\"any\"} so at least one tool always runs first, which makes validation occur before any charge_card call can be issued."},{"label":"C","text":"Force tool_choice to {\"type\":\"tool\",\"name\":\"validate_input\"} on the first turn so validation must occur before any charge is possible."},{"label":"D","text":"Lower the temperature so the model follows the documented validate-then-charge ordering far more reliably and stops charging on malformed input."}],"correct":"C","explanation":"Forcing the specific tool on the first turn is the deterministic way to guarantee execution order. any only guarantees some tool runs (it could still pick charge_card), a description reminder is probabilistic guidance, and temperature affects randomness, not which tool is permitted."},{"id":"mockE-20","scenario":"Flight-availability call fails","stem":"A travel-booking agent queries an MCP partner tool, check_flight_availability. During a partner API degradation the tool responds with {\"isError\": true}. A teammate says this clearly means there are no seats and the agent should tell the traveler 'this flight is sold out.' How should the agent treat isError: true here?","domain":"TOOL-MCP","difficulty":2,"choices":[{"label":"A","text":"As confirmation that no seats exist, so the agent should tell the traveler the flight is sold out, since isError: true is simply how this availability tool signals an empty result set."},{"label":"B","text":"As a signal the tool call itself failed -- inspect the error and recover (retry, try an alternate source, or escalate) rather than treat it as a valid empty result."},{"label":"C","text":"As proof the partner integration is permanently broken, so the agent should abort the entire booking session rather than attempt any further lookups."},{"label":"D","text":"As informational logging the agent can safely ignore, continuing the booking flow as if availability had been checked and seats were confirmed present."}],"correct":"B","explanation":"isError: true means the call failed and is semantically different from a valid empty result (genuinely zero seats). The agent must inspect the error and recover. Reading a failed call as 'sold out' confuses a transient failure with a real absence; aborting or ignoring are an overreaction and an underreaction respectively."},{"id":"mockE-21","scenario":"Designing a useful error payload","stem":"Your MCP server's tools return {\"isError\": true, \"content\": \"Operation failed\"} for every failure. Consuming agents cannot tell a transient timeout from an invalid-input rejection, so they either retry forever or give up instantly. What is the best redesign?","domain":"TOOL-MCP","difficulty":3,"choices":[{"label":"A","text":"Keep the generic 'Operation failed' string but note in the tool's description that failures can be transient or permanent, so agents learn to react well."},{"label":"B","text":"Return a structured error with errorCategory, isRetryable, a human-readable message, the attempted query, and any partial results."},{"label":"C","text":"Always set isRetryable: true on every error so consuming agents never give up prematurely on what might be a recoverable, transient failure condition."},{"label":"D","text":"Throw an exception that crashes the agent loop on any failure, forcing a clean restart instead of letting agents misclassify the error and mishandle it."}],"correct":"B","explanation":"A structured error carrying category, retryability, message, attempted query, and partial results lets the agent decide intelligently. The generic string is the anti-pattern; hardcoding isRetryable: true causes infinite retries on permanent errors; crashing the loop removes recovery entirely."},{"id":"mockE-22","scenario":"Schema validates but times disagree","stem":"A meeting-scheduling tool returns events through a strict JSON schema with start_time, end_time, and duration_minutes (all correctly typed). The schema validates on every call, yet QA keeps finding events where end_time minus start_time does not equal duration_minutes. The team is puzzled 'because the schema is strict.' What is the accurate explanation and fix?","domain":"TOOL-MCP","difficulty":3,"choices":[{"label":"A","text":"The schema is subtly malformed; tighten the datetime field types and add stricter format constraints, and once the types are exact the start, end, and duration_minutes values will reconcile on their own."},{"label":"B","text":"A schema guarantees syntactic validity, not semantic correctness; add a validation step that checks end_time - start_time against duration_minutes and retries on mismatch."},{"label":"C","text":"Switch tool_choice to {\"type\":\"any\"} so the model is forced through the tool, where the start_time, end_time, and duration_minutes fields get reconciled automatically as part of the selection step."},{"label":"D","text":"Add minimum and maximum constraints on duration_minutes so impossible values are rejected by validation, which keeps the reported duration consistent with the gap between start_time and end_time."}],"correct":"B","explanation":"JSON schema enforces that fields exist and types are correct, not that values are mutually consistent. A cross-field relationship like end - start == duration needs a semantic check plus retry-with-feedback. Tightening types or bounding a single field cannot express the relationship, and tool_choice governs whether a tool runs, not value correctness."},{"id":"mockE-23","scenario":"Required field gets fabricated","stem":"A resume-parsing tool defines phone_number as {\"type\":\"string\"} and lists it under required. When a resume has no phone number, the model invents a plausible-looking one rather than omitting it. How do you let the model honestly signal absence?","domain":"TOOL-MCP","difficulty":2,"choices":[{"label":"A","text":"Keep phone_number required but add a 'do not invent a number if none is present' note to its description."},{"label":"B","text":"Define phone_number as {\"type\":[\"string\",\"null\"]} and drop it from required so the model can return null."},{"label":"C","text":"Add a strict regex pattern so any fabricated number is rejected by schema validation and the model stops making them up."},{"label":"D","text":"Set a schema default of 'N/A' for phone_number so missing values fall back to the placeholder, not an invented one."}],"correct":"B","explanation":"Making the field nullable and non-required lets the model return null instead of hallucinating; a required field actively pressures it to fabricate a value. A description note is non-deterministic, a regex still accepts well-formed fakes, and a default does not stop the model from emitting an invented value."},{"id":"mockE-24","scenario":"Wasting turns probing endpoints","stem":"An integration agent connects to an MCP server fronting a large internal REST service. It burns many turns making trial calls just to discover which endpoints, paths, and parameters exist before it can compose a real request. As the server author, how should you expose the endpoint/parameter catalog (the API reference)?","domain":"TOOL-MCP","difficulty":3,"choices":[{"label":"A","text":"Add a list_endpoints action tool the agent must call at the start of every task, returning the catalog dynamically so the reference is always current."},{"label":"B","text":"Expose the API reference as an MCP Resource (read-only reference context) so the agent gets an immediate map without trial-and-error calls."},{"label":"C","text":"Wrap the endpoint and parameter reference in an MCP Prompt template the agent invokes first, so the catalog is injected before it composes a request."},{"label":"D","text":"Paste the entire API specification into the system prompt for every request, so the full endpoint and parameter map is always present in the context."}],"correct":"B","explanation":"Read-only reference data like an API catalog belongs as an MCP Resource the agent can read directly, eliminating discovery round trips. A discovery action tool reintroduces the round trips, an MCP Prompt is a templated prompt (not readable reference data), and embedding the full spec every request is wasteful and static."},{"id":"mockE-25","scenario":"Agent prefers the built-in over MCP","stem":"You built an MCP tool, query_metrics_db, that reaches a live observability database holding real-time production metrics the agent's built-in file-reading tools cannot access. In practice the agent keeps reading stale local log files with its built-in Read tool and ignores query_metrics_db, whose description currently reads 'Returns metrics.' What should you do?","domain":"TOOL-MCP","difficulty":3,"choices":[{"label":"A","text":"Disable the built-in file-reading tool entirely so that only query_metrics_db remains available, which forces the agent onto the live observability database for any metrics lookup it has to perform."},{"label":"B","text":"Strengthen the MCP tool's description to spell out its unique advantage -- it returns live production metrics from the observability DB that local file reads cannot provide."},{"label":"C","text":"Rename query_metrics_db to read_metrics so the model treats it like the familiar built-in Read tool and reaches for it over the stale local log files it currently prefers out of habit."},{"label":"D","text":"Force tool_choice to query_metrics_db on every turn so the built-in file-reading tool is never selectable and the agent always hits the live observability database instead of the stale logs."}],"correct":"B","explanation":"Agents tend to favor built-in tools over similar MCP tools; the fix is to differentiate the MCP tool by describing the unique, live data it reaches. Disabling the built-in tool cripples legitimate file reads, mimicking its name worsens the overlap, and forcing the MCP tool every turn misroutes ordinary file access."},{"id":"mockE-26","scenario":"Database password in MCP config","stem":"Adding a Postgres MCP server to the project .mcp.json, an engineer pastes the full connection string -- including the live database password -- directly into the config and commits it so teammates can connect. A reviewer objects. What is the correct handling?","domain":"TOOL-MCP","difficulty":2,"choices":[{"label":"A","text":"Keep the literal password in the connection string inside .mcp.json but add the file to .gitignore, so the secret is present locally yet never committed."},{"label":"B","text":"Reference the secret via environment-variable substitution, e.g. \"PGPASSWORD\": \"${PGPASSWORD}\", and never commit the literal password."},{"label":"C","text":"Move the full connection string into CLAUDE.md, which the team already reads each session, instead of .mcp.json, so the password lives in shared docs."},{"label":"D","text":"Base64-encode the connection string inside .mcp.json so the password is not human-readable at a glance, while teammates can still decode and connect."}],"correct":"B","explanation":"Environment-variable substitution keeps the credential out of version control while the shared .mcp.json stays committed. Gitignoring .mcp.json defeats team sharing, moving it to CLAUDE.md still commits plaintext, and base64 is encoding, not protection."},{"id":"mockE-27","scenario":"Moderation labels miss novel abuse","stem":"A content-moderation tool labels posts via an enum [\"spam\",\"harassment\",\"explicit\"]. Genuinely new abuse types (e.g., coordinated scam links) get crammed into 'spam' or 'harassment,' silently distorting the safety dashboards. You want to capture these without losing meaning. Best schema change?","domain":"TOOL-MCP","difficulty":2,"choices":[{"label":"A","text":"Remove the enum constraint so the model can write any free-form label, naming new abuse types directly without a list."},{"label":"B","text":"Add an 'other' value to the enum plus a nullable label_detail string describing what 'other' means for that post."},{"label":"C","text":"Keep adding specific enum values such as scam, self-harm, and impersonation as new abuse types appear, until all fit."},{"label":"D","text":"Force tool_choice to the moderation tool so it always runs on every post and no item slips through unlabeled."}],"correct":"B","explanation":"Adding 'other' plus a detail field captures out-of-category cases without losing data, while keeping the enum analyzable on the dashboards. Removing the enum sacrifices structure, endlessly enumerating cannot anticipate every future abuse type, and forcing the tool to run does not address how novel labels are represented."},{"id":"mockE-28","scenario":"Refund threshold slipped through the prompt","stem":"Policy requires that any refund over $500 receive human approval. The team added 'always require approval for refunds over $500' to the agent's system prompt, but an $1,800 refund was issued automatically last week. Leadership wants this to be impossible, not merely instructed. What is the correct enforcement?","domain":"CODE-CONFIG","difficulty":4,"choices":[{"label":"A","text":"Reword the system-prompt rule far more forcefully and add a few-shot example of the agent refusing a large refund, so the model reliably enforces the cap."},{"label":"B","text":"Implement a PreToolUse hook that inspects the issue_refund call and blocks or e
