l variants under different names so they don't affect (or collide with) team skills. Renaming the personal one resolves the same-name conflict and restores access to the team checklist. B asserts a precedence rule the guide does not state and dismisses a real, documented conflict. C confuses an always-loaded convention file with an on-demand invokable command — a checklist you run is a skill, not a CLAUDE.md standard. D misuses `context: fork`, which controls context isolation, not name-resolution precedence."},{"id":"mockB-40","scenario":"Few-shot example count","stem":"A team is adding few-shot examples to a clinical-coding classifier prompt and asks how many examples to include and of what kind for best generalization. What is the guidance?","domain":"PROMPT-ENG","difficulty":1,"choices":[{"label":"A","text":"Include 2-4 diverse input/output examples covering edge cases, so the model generalizes the pattern rather than memorizing."},{"label":"B","text":"Include 15-20 near-identical examples so the model is thoroughly trained on the exact pattern and rarely deviates from it."},{"label":"C","text":"Include exactly one canonical example, since adding more would only confuse the model and dilute the pattern it should learn."},{"label":"D","text":"Skip examples entirely and instead write \"be accurate\" in the system prompt, letting the model infer the pattern on its own."}],"correct":"A","explanation":"Correct: few-shot means 2-4 diverse examples (including edge cases) so the model generalizes. B many near-identical examples encourage memorization and bloat the prompt. C a single example under-specifies the pattern. D a vague instruction like \"be accurate\" can be interpreted many ways and is what few-shot is meant to replace."},{"id":"mockB-41","scenario":"Negative examples","stem":"A code-review prompt for a payments repo keeps flagging acceptable patterns. The team wants to show the model what NOT to flag as well as what to flag. Which few-shot technique addresses this?","domain":"PROMPT-ENG","difficulty":2,"choices":[{"label":"A","text":"Include negative examples that explicitly mark acceptable code as \"do not flag\" alongside positive \"flag this\" examples."},{"label":"B","text":"Only show examples of genuine bugs so the model thoroughly learns the bad patterns it is supposed to flag in review."},{"label":"C","text":"Remove all the examples and lower the temperature so the model becomes more conservative and stops flagging good code."},{"label":"D","text":"Add a single instruction to 'be conservative' with no examples at all, trusting the model to infer on its own which patterns are acceptable and should not be flagged."}],"correct":"A","explanation":"Correct: negative examples (acceptable code marked \"do not flag\" vs problematic code marked \"flag\") teach the boundary and reduce false positives. B positive-only examples do not teach what to accept. C removing examples loses the demonstration entirely. D \"be conservative\" is the vague instruction the explicit examples are meant to replace."},{"id":"mockB-42","scenario":"Retry-with-feedback content","stem":"An invoice extractor produced JSON where total = 150 but the line items sum to 145. You will retry. What should the retry prompt contain to be effective?","domain":"PROMPT-ENG","difficulty":2,"choices":[{"label":"A","text":"The original document, the previous incorrect extraction, and the specific error (\"total=150 but sum(line_items)=145; re-check\")."},{"label":"B","text":"Only the instruction 'try again and be more careful this time', trusting the model to recheck its own arithmetic without being shown the prior error at all."},{"label":"C","text":"A fresh request with just the original document and no mention of the prior failure, so the model isn't biased."},{"label":"D","text":"A different, longer invoice document to give the model more context and examples of correctly summed line items."}],"correct":"A","explanation":"Correct: effective retry-with-feedback supplies the original input, the prior output, and the specific error so the model can correct the arithmetic. B \"be more careful\" lacks the specific diagnosis. C omitting the prior failure repeats the same mistake. D an unrelated document does not address the error."},{"id":"mockB-43","scenario":"Dynamic adaptive decomposition","stem":"A task says \"add tests to this legacy logistics service.\" The structure, coverage gaps, and external dependencies are unknown until you start exploring. Which decomposition strategy fits?","domain":"PROMPT-ENG","difficulty":2,"choices":[{"label":"A","text":"Dynamic adaptive decomposition, generating subtasks from intermediate findings (map structure, prioritize untested modules, adapt when a dependency is discovered)."},{"label":"B","text":"A fixed pipeline with every step defined up front, since the order of exploring an unfamiliar legacy service is predictable enough to fully plan before any code is read."},{"label":"C","text":"A single forced tool call that writes all the tests at once after one read of the legacy logistics service."},{"label":"D","text":"Batch API processing that ingests the whole repository overnight and emits the full test suite in one pass."}],"correct":"A","explanation":"Correct: open-ended tasks where scope emerges during execution call for dynamic adaptive decomposition. B fixed pipelines suit predictable, fully-known tasks. C one tool call cannot handle an exploratory, multi-step job. D the Batch API addresses cost/latency tradeoffs, not decomposition of an investigative task."},{"id":"mockB-44","scenario":"Insurance vague criteria","stem":"An insurance comment-audit prompt says: 'Check code comments for accuracy. Be conservative; report only high-confidence findings.' Results are inconsistent across runs. What rewrite would most improve reliability?","domain":"PROMPT-ENG","difficulty":2,"choices":[{"label":"A","text":"Add the phrase 'be very conservative' twice for emphasis so the model weights caution more heavily on each run"},{"label":"B","text":"Replace vague guidance with explicit flag/do-not-flag criteria (e.g., flag only when a comment contradicts code or references a non-existent symbol)"},{"label":"C","text":"Lower max_tokens to force concise findings, which constrains the model to report only its highest-confidence items and automatically drops the borderline false positives."},{"label":"D","text":"Switch the model to tool_choice any so it is forced to call the audit tool and commit to a definite finding"}],"correct":"B","explanation":"Vague instructions like 'be conservative' are interpreted many ways; explicit criteria spelling out exactly what to flag and what not to flag produce consistent results. Repetition of vague wording doesn't add precision, and neither max_tokens nor tool_choice addresses criteria ambiguity."},{"id":"mockB-45","scenario":"Streaming self-correction","stem":"A streaming-revenue extractor sometimes reports a stated_total that disagrees with the sum of its line items, and downstream systems silently accept the wrong number. The team wants the model itself to surface the discrepancy in its output. Which pattern applies?","domain":"PROMPT-ENG","difficulty":2,"choices":[{"label":"A","text":"Self-correction: have the model emit both the stated value and a calculated value plus a conflict_detected flag"},{"label":"B","text":"The interview pattern, where the model asks the user to confirm the stated_total before it finalizes the output"},{"label":"C","text":"Prompt chaining across files, passing each extraction to a later step that recomputes and overwrites the total"},{"label":"D","text":"Forcing tool_choice any so the model must call a validation tool that compares the total against the line items"}],"correct":"A","explanation":"Self-correction has the model extract both the stated value and a computed value and set conflict_detected when they differ, so the discrepancy is visible for handling. The interview pattern asks clarifying questions, prompt chaining splits steps, and tool_choice any only forces a tool call."},{"id":"mockB-46","scenario":"Insurance informal measurements few-shot","stem":"An insurance bodily-injury extractor must capture informal severity phrasings from adjuster notes ('a couple of stitches', 'mild whiplash', 'a few days off work') into normalized fields. Rule-based instructions keep missing variants. Which technique is especially effective here?","domain":"PROMPT-ENG","difficulty":2,"choices":[{"label":"A","text":"Few-shot examples mapping informal phrasings to normalized outputs (with original_text and a precision marker)"},{"label":"B","text":"A single vague instruction telling the model to 'normalize all informal severity terms' into the standard fields"},{"label":"C","text":"Forcing tool_choice any so the model is required to call the extraction tool on every adjuster note it receives"},{"label":"D","text":"Increasing max_tokens so the model has more room to reason through each informal phrasing before normalizing it"}],"correct":"A","explanation":"Few-shot is especially effective for extracting informal/non-standard measurements that are too diverse for purely rule-based instructions, mapping the phrase to a normalized value plus original text and precision. A vague instruction is exactly what fails, and tool_choice/max_tokens don't teach the mapping."},{"id":"mockB-47","scenario":"Streaming extraction format examples","stem":"A streaming research tool must extract statistics from documents that use BOTH inline citations ('the rate is 42% (Smith, 2023)') and bracketed bibliography references ('the rate is 42%. [1]'). It keeps mislabeling the source type. Which technique best teaches both formats?","domain":"PROMPT-ENG","difficulty":2,"choices":[{"label":"A","text":"Few-shot examples showing each document format mapped to the correct structured output (value, source, type)"},{"label":"B","text":"A single rule instructing the model to 'always extract the source' regardless of which citation format it sees"},{"label":"C","text":"Forcing tool_choice any so the model is required to call the extraction tool for every statistic in the document"},{"label":"D","text":"Increasing max_tokens so the model has more room to read both citation styles before labeling each source type"}],"correct":"A","explanation":"Few-shot examples that map each document format (inline citation vs bibliography reference) to the correct structured output teach the model to distinguish source types. A single vague rule won't capture the format differences, and tool_choice/max_tokens don't teach the mapping."},{"id":"mockB-48","scenario":"Normalization rules with schema","stem":"A fintech extractor uses a strict JSON schema, yet currency and date values come out inconsistent (\"five bucks\", \"yesterday\"). The JSON is always valid but the values vary. What addition prevents these semantic inconsistencies?","domain":"PROMPT-ENG","difficulty":3,"choices":[{"label":"A","text":"Add explicit normalization rules in the prompt (dates to ISO 8601, currency to amount+code, percentages to decimals) alongside the strict schema."},{"label":"B","text":"Mark every field required so the model cannot leave anything vague, which in turn forces it to emit fully normalized values for the date and currency fields too."},{"label":"C","text":"Switch the extractor to free-text output and normalize the currency and date values by hand in a later step."},{"label":"D","text":"Add more enum values to the schema to cover each possible currency phrasing the model might produce in output."}],"correct":"A","explanation":"Correct: a strict schema guarantees structure but not value consistency; explicit normalization rules in the prompt fix the semantic variance. B requiredness does not standardize formats. C free text abandons the structural guarantees. D enumerating phrasings of currency is impractical and does not normalize dates/percentages."},{"id":"mockB-49","scenario":"Invoice extraction with tool_use schema","stem":"Your invoice pipeline uses tool_use with a strict JSON schema (typed fields, required keys, enums). JSON is always well-formed and the right fields are present, yet auditors find invoices where the extracted 'total' does not equal the sum of the line items. Why does the schema not catch this, and what is the appropriate mitigation?","domain":"PROMPT-ENG","difficulty":3,"choices":[{"label":"A","text":"The schema is misconfigured; tightening the field types and explicitly marking 'total' as required will force the model to compute the value as the exact sum of the line items on every extraction, so no separate arithmetic check is ever needed."},{"label":"B","text":"tool_use guarantees structure (valid JSON, present fields, correct types) but not semantic correctness of values; add a business-rule validation that sum(line_items) == total and retry with the specific error if it fails."},{"label":"C","text":"Increase the context window so the model can attend to every line item at once; the mismatch happens only because long invoices exceed what it can hold while it computes the total."},{"label":"D","text":"Switch from tool_use to free-text output and parse the total with a regex, since the structured schema is what prevents the model from re-checking its own arithmetic against the items."}],"correct":"B","explanation":"Correct: B. A JSON schema enforces syntax and structure (well-formed JSON, required keys, types, enums) but cannot enforce a relationship between values like sum(items)==total — that is semantic correctness. The guide pairs this with semantic/business-rule validation plus retry-with-feedback. A is wrong: types and requiredness are already satisfied; no schema setting can express the arithmetic relationship. C confuses a value-relationship bug with attention; the data is already being read. D removes the structural guarantee and makes things worse, not better."},{"id":"mockB-50","scenario":"Contract clause classifier","stem":"You classify lease-contract clauses into termination, indemnity, renewal, or assignment. The model handles textbook clauses well, but on ambiguously phrased clauses (e.g., a sentence that mixes early-exit language with damage-recovery language) different runs label the same clause differently. You already give a clear definition of each category. What most reliably reduces the inconsistency on these borderline clauses?","domain":"PROMPT-ENG","difficulty":4,"choices":[{"label":"A","text":"Add a few-shot example for each borderline clause type that pairs the input clause with the correct label AND a short rationale explaining which feature drove the decision, so the model generalizes the disambiguation logic."},{"label":"B","text":"Append the instruction 'classify carefully and stay consistent across runs' and lower the temperature toward 0 so the same borderline clause resolves to the same label every time."},{"label":"C","text":"Fine-tune a separate model on the full historical corpus of lease contracts so it internalizes the borderline cases and no longer varies its labels between runs on ambiguous text."},{"label":"D","text":"Provide twenty more textbook examples of clearly-typed clauses to strengthen each category definition, so the sharper boundaries carry over and stabilize the ambiguous borderline clauses without needing any rationale of their own."}],"correct":"A","explanation":"Correct: A. The root cause is that the model lacks a demonstrated decision rule for ambiguous cases. Few-shot examples that pair a borderline input with its label AND a rationale show the model which feature should drive the decision, and it generalizes that logic to new borderline cases — the guide stresses examples-with-rationale for ambiguous scenarios. B is a vague instruction ('be consistent') which the guide explicitly calls ineffective because it can be interpreted many ways; lowering temperature reduces run-to-run variance but does not teach the right boundary. C is disproportionate, slow, and unnecessary when the issue is decision guidance, not capability. D adds more easy examples that the model already handles — it does not address the ambiguous boundary that is actually failing."},{"id":"mockB-51","scenario":"Clinical note medication extraction retry","stem":"A clinical-note extractor must output each medication's dosage. Validation flags a note where 'dosage' is null. Your retry step re-sends the note, the prior output, and the message 'You missed the dosage, please extract it.' The note genuinely never states a dosage. What is the correct design?","domain":"PROMPT-ENG","difficulty":4,"choices":[{"label":"A","text":"Keep retrying with progressively stronger wording until the model finally supplies a dosage value for the flagged note, escalating the firmness of the instruction on each attempt until the field is populated and validation passes."},{"label":"B","text":"Make 'dosage' a required field so the model is forced to populate it on the retry instead of returning a null value."},{"label":"C","text":"Retry is ineffective when the information is absent from the source; design the schema so 'dosage' is nullable, let the model return null, and route the record to human review rather than re-prompting."},{"label":"D","text":"Lower the validation threshold so that a null dosage no longer triggers a retry or any downstream follow-up at all."}],"correct":"C","explanation":"Correct: C. The guide states retry-with-feedback helps for format, structural, and arithmetic errors but NOT when the information is simply absent from the source — re-prompting cannot conjure data that isn't there. The correct pattern is a nullable field returning null plus human review. A wastes calls and pressures the model to fabricate. B is the opposite of guidance: required fields push the model to hallucinate values when data is missing. D silently drops a clinically important gap instead of surfacing it for review."},{"id":"mockB-52","scenario":"Lost in the middle","stem":"A long shipping-dispute prompt buries the single most important fact (the SLA deadline) in the middle of a large block of vendor history, and the model keeps overlooking it. How should the input be arranged?","domain":"CONTEXT-REL","difficulty":1,"choices":[{"label":"A","text":"Move critical information (the SLA deadline) to the beginning or end of the input, since models reliably process the start and end but miss the middle."},{"label":"B","text":"Repeat the entire vendor history twice so the buried SLA deadline appears more than once and is statistically much harder for the model to overlook in the middle."},{"label":"C","text":"Lower max_tokens to shorten the prompt overall, forcing the model's attention onto the SLA deadline buried in the middle."},{"label":"D","text":"Convert the whole prompt to uppercase so every line, including the SLA deadline, is emphasized and stands out to the model."}],"correct":"A","explanation":"Correct: the lost-in-the-middle effect means key facts should sit at the start or end. B duplicating the bulky history adds noise without guaranteeing the deadline lands at a strong position. C reducing max_tokens limits the response, not input attention. D uppercasing everything emphasizes nothing."},{"id":"mockB-53","scenario":"Trimming verbose tool results","stem":"A retail agent's lookup_order tool returns 40+ fields but the current return-eligibility task needs only 5, and the extra fields are crowding the context. What is the cleanest mitigation?","domain":"CONTEXT-REL","difficulty":2,"choices":[{"label":"A","text":"Add a PostToolUse hook that keeps only the 5 relevant fields before the result enters context."},{"label":"B","text":"Ask the model in the prompt to ignore the 35 irrelevant fields so it focuses only on the 5 the task needs."},{"label":"C","text":"Run /compact after every lookup_order call so the 40+ fields are compressed out before the next step runs."},{"label":"D","text":"Increase max_tokens so there is enough room to hold all 40 fields without crowding the rest of the context."}],"correct":"A","explanation":"Correct: a PostToolUse hook that trims to the relevant fields conserves context and reduces noise deterministically. B the fields still consume context even if the model is told to ignore them. C /compact summarizes after the fact and risks losing detail. D a bigger budget keeps the waste rather than removing it."},{"id":"mockB-54","scenario":"Hospitality case-facts block","stem":"A hotel-support agent handling a long multi-turn complaint keeps forgetting the confirmed room number and refund amount after the history gets summarized. What technique keeps these facts reliably available?","domain":"CONTEXT-REL","difficulty":2,"choices":[{"label":"A","text":"Maintain a structured CASE FACTS block (room number, refund amount, status) and include it in every prompt regardless of summarization"},{"label":"B","text":"Rely on the full untrimmed conversation history and never summarize it at all, so the confirmed room number and refund amount always stay present in the context."},{"label":"C","text":"Store the confirmed room number and refund amount only in the first line of the system prompt so they are always read"},{"label":"D","text":"Force tool_choice any on every turn so the model must call a tool that re-fetches the room number and refund amount"}],"correct":"A","explanation":"Extracting key facts into a structured CASE FACTS block included in every prompt keeps them available even as history degrades during summarization. Never summarizing isn't sustainable for long sessions, a single system-prompt line isn't the recommended updatable fact block, and tool_choice is unrelated."},{"id":"mockB-55","scenario":"Insurance provenance attribution","stem":"An insurance research agent synthesizes market-loss figures from several reports. Its summary states 'The flood-loss rate is 12%' with no source or year. Underwriters can't verify it. What provenance practice should the agent follow?","domain":"CONTEXT-REL","difficulty":2,"choices":[{"label":"A","text":"Attach the claim to its source: claim, source_name/url, publication_date, and a confidence value"},{"label":"B","text":"Drop the 12% figure entirely from the summary, since a number that cannot be cited should never reach underwriters"},{"label":"C","text":"Average all the source reports into one blended flood-loss number so underwriters see a single clean figure to act on"},{"label":"D","text":"Keep the bare 12% claim without provenance, since attaching sources and dates only adds unnecessary length to the report"}],"correct":"A","explanation":"To prevent attribution loss, each claim should be linked to its source with source name/url, publication date, and a confidence value. Dropping verifiable data is wasteful, blindly averaging hides conflicts and methodology differences, and a bare claim is the very anti-pattern being corrected."},{"id":"mockB-56","scenario":"Gaming coverage annotations","stem":"A game-research coordinator's final report has full data for two regions but one region's search subagent timed out, returning only partial data. How should the final synthesis represent this rather than silently presenting it as complete?","domain":"CONTEXT-REL","difficulty":2,"choices":[{"label":"A","text":"Annotate that region as PARTIAL COVERAGE with a note explaining the search-agent timeout"},{"label":"B","text":"Omit the timed-out region entirely so the final report looks uniform and the partial gap is not visible to readers"},{"label":"C","text":"Present all three regions as full coverage so the report reads cleanly and does not alarm the leadership audience"},{"label":"D","text":"Abort the synthesis and produce no report at all, since one region's search subagent failed to return complete data"}],"correct":"A","explanation":"The synthesis should carry coverage annotations — marking the affected region PARTIAL COVERAGE with a note about the timeout — so gaps are transparent. Omitting the region hides a known gap, claiming full coverage is misleading, and aborting discards valid partial results that should be continued-with-and-annotated."},{"id":"mockB-57","scenario":"Lost-in-the-middle ordering","stem":"A legal due-diligence prompt buries the single most important instruction (\"reject any contract lacking a liability cap\") in the middle of a very long input, and the model keeps missing it. Per the guide, how should critical information be positioned?","domain":"CONTEXT-REL","difficulty":2,"choices":[{"label":"A","text":"Place critical information near the beginning or end of the input, since models reliably process the start and end but can miss the middle."},{"label":"B","text":"Keep the liability-cap instruction in the middle of the input but bold it so the model gives it extra weight."},{"label":"C","text":"Repeat the liability-cap instruction about 10 times throughout the document so the model cannot overlook it."},{"label":"D","text":"Move the liability-cap instruction out of the input entirely and into a separate tool description for the model to read before it begins processing the contract."}],"correct":"A","explanation":"Correct: the lost-in-the-middle effect means models reliably handle the start and end but miss the middle; mitigation is to place key info near the beginning or end (Ch1.5, Ch11.3). A matches. B keeps it in the weak position, C bloats context, and D misplaces an instruction into an unrelated mechanism."},{"id":"mockB-58","scenario":"Gaming transient backoff bounded retries","stem":"A game-leaderboard agent calls an external stats service that intermittently returns 503 timeouts but sometimes returns a hard 403 'access denied'. How should the agent handle each, and what bounds the transient case?","domain":"CONTEXT-REL","difficulty":3,"choices":[{"label":"A","text":"Retry the 503 with exponential backoff up to a bounded number of attempts, then escalate; do not retry the 403 (permission) — escalate it"},{"label":"B","text":"Retry both the 503 and the 403 indefinitely until each one eventually succeeds, on the assumption that transient timeouts and access errors will both clear on their own."},{"label":"C","text":"Treat both the 503 and the 403 as permanent failures and immediately abort the whole leaderboard workflow on either one"},{"label":"D","text":"Retry the 403 with exponential backoff up to a bound, since access may be restored, and ignore the 503 as non-critical"}],"correct":"A","explanation":"Transient errors (timeouts, 503) are retryable with exponential backoff but only for a bounded number of attempts before escalating; permission errors (403) are not retryable and should be escalated. Infinite retries waste resources, aborting on the first transient error loses progress, and retrying a permission error never succeeds."},{"id":"mockB-59","scenario":"Mortgage underwriting assistant, long multi-turn sessions","stem":"A mortgage-underwriting assistant runs sessions spanning 60+ turns. As history grows it is summarized to fit the window. After several summarization passes the agent starts citing the wrong loan amount ($340,000 instead of $343,500) and an approximate close date, even though those exact values appeared verbatim early in the conversation. Which approach best prevents these precise values from degrading?","domain":"CONTEXT-REL","difficulty":3,"choices":[{"label":"A","text":"Raise the summarization threshold so the agent keeps far more raw conversation history before it ever compresses, preserving the exact loan figures intact much deeper into the session."},{"label":"B","text":"Switch to a larger, more capable model so its summaries retain the precise loan amount and close date with much higher numeric fidelity"},{"label":"C","text":"Maintain a structured CASE FACTS block holding the exact loan amount, property address, and dates, and inject it into every prompt regardless of how history is summarized."},{"label":"D","text":"Instruct the summarizer to compress more aggressively and to re-summarize prior summaries, keeping the window small and the key numbers stable"}],"correct":"C","explanation":"Correct: C — exact, load-bearing values must live in a dedicated case-facts block that is re-injected verbatim every turn, so summarization cannot erode them (Ch11.1). A only delays the problem: once the threshold is eventually hit, summarization still lossily compresses the numbers, and you pay more tokens meanwhile. B is the 'bigger model' trap — any lossy summarization can drop or round digits regardless of model size; this is a structural issue, not a capability one. D makes it strictly worse: more aggressive and recursive summarization accelerates the loss of precise values."},{"id":"mockB-60","scenario":"Logistics agent calling a verbose shipment-tracking tool","stem":"A logistics triage agent calls a track_shipment tool that returns 60+ fields (full carrier event history, customs metadata, geocoordinates) on every call. The agent only needs status, ETA, current location, and exception flag, but after a dozen calls the context is bloated and the agent gets distracted by irrelevant carrier codes. What is the most appropriate fix?","domain":"CONTEXT-REL","difficulty":3,"choices":[{"label":"A","text":"Add a PostToolUse hook that trims the track_shipment result down to the few fields the task needs before it enters context."},{"label":"B","text":"Increase max_tokens substantially so the model has room to process all 60+ track_shipment fields cleanly on every single call."},{"label":"C","text":"Add a system-prompt instruction telling the model to ignore the carrier codes and other fields it does not need for triage."},{"label":"D","text":"Reduce how often the agent calls track_shipment so fewer of the large 60-field payloads accumulate in the context window."}],"correct":"A","explanation":"Correct: A — a PostToolUse hook deterministically trims verbose tool output to the needed fields, conserving context and cutting noise (Ch11.2). B confuses output budget with input bloat: max_tokens governs generation length, not the size of tool results consumed, so it worsens cost without helping. C is unreliable — the irrelevant fields still occupy the window and still distract the model even if told to ignore them; the fix must remove them, not ask the model to overlook them. D sacrifices needed tracking calls to mask the symptom rather than addressing the per-call payload size."}]},{"id":"mock-c","title":"Mock Exam C","code":"CLAUDE-ARCH-MOCK-C","certification":"Claude Certified Architect - Foundations","tag":"Fixed mock · Set C","sheet":"SHEET C","description":"A fixed, curated 60-question paper — a second full-weight set to broaden your coverage beyond Set B.","durationMinutes":120,"passingScore":72,"totalQuestions":60,"sampling":null,"domains":{"AGENT-ARCH":{"name":"Agentic Architecture & Orchestration","color":"#3B5FC0"},"TOOL-MCP":{"name":"Tool Design & MCP Integration","color":"#0F7A6C"},"CODE-CONFIG":{"name":"Claude Code Configuration & Workflows","color":"#7B52C9"},"PROMPT-ENG":{"name":"Prompt Engineering & Structured Output","color":"#9E5509"},"CONTEXT-REL":{"name":"Context Management & Reliability","color":"#B4426B"}},"questions":[{"id":"mockC-1","scenario":"Gaming matchmaking agent loop","stem":"You are a backend engineer on an online multiplayer game. Your matchmaking agent calls a tool to query player skill ratings, then assembles balanced lobbies. After the model emits a tool call, your loop receives the API response. Which value of stop_reason in that response means your code must execute the requested tool and append the result to history before calling the model again?","domain":"AGENT-ARCH","difficulty":1,"choices":[{"label":"A","text":"\"end_turn\""},{"label":"B","text":"\"tool_use\""},{"label":"C","text":"\"max_tokens\""},{"label":"D","text":"\"stop_sequence\""}],"correct":"B","explanation":"\"tool_use\" signals the model wants to call a tool, so you execute it and return the result to continue the loop. \"end_turn\" means the response is complete (show the user); \"max_tokens\" means truncation; \"stop_sequence\" means a stop sequence was hit. Only \"tool_use\" drives the next tool execution."},{"id":"mockC-2","scenario":"Gaming multiple customer matches","stem":"A game-support agent searches for a player account by display name and gets three different accounts matching 'ShadowWolf'. What should it do?","domain":"AGENT-ARCH","difficulty":1,"choices":[{"label":"A","text":"Ask for additional identifiers to disambiguate; do not guess which account is correct"},{"label":"B","text":"Pick the account with the highest total playtime, since the most active player is the most likely owner"},{"label":"C","text":"Proceed with whichever account the search returned first, treating result ordering as a relevance ranking"},{"label":"D","text":"Merge all three matching accounts into one so the agent can act on a single combined player profile"}],"correct":"A","explanation":"Multiple matches when searching for a customer is an escalation/clarification trigger: ask for more identifiers rather than guessing. Choosing by playtime, taking the first match, or auto-merging all risk acting on the wrong account."},{"id":"mockC-3","scenario":"Shipping research coordinator","stem":"A logistics research coordinator must analyze carrier performance across three independent regions (EU, APAC, Americas), each requiring its own web search and data pull. The three are unrelated to each other. How should the coordinator dispatch the work most efficiently?","domain":"AGENT-ARCH","difficulty":2,"choices":[{"label":"A","text":"Issue three Task tool calls in a single coordinator response so the three subagents run in parallel."},{"label":"B","text":"Run them strictly in sequence, feeding each region's findings into the next subagent's prompt for shared context."},{"label":"C","text":"Spawn a single subagent and have it iterate over all three regions internally to avoid coordination overhead."},{"label":"D","text":"Use fork_session to branch one investigation into three regional lines, then reconcile the diverging branches."}],"correct":"A","explanation":"Correct: a coordinator can emit multiple Task calls in one response and the subagents run concurrently, ideal for independent subtasks. B serializes independent work needlessly. C collapses isolated work into one overloaded agent, losing parallelism and context isolation. D fork_session is for comparing approaches over shared context, not partitioning independent regions."},{"id":"mockC-4","scenario":"CI date normalization","stem":"A developer-tools agent aggregates results from three MCP servers that each return timestamps differently (Unix epoch, \"Mar 5, 2025\", and ISO 8601). Downstream comparison logic keeps breaking. Where should the normalization be applied so the model always sees a consistent format?","domain":"AGENT-ARCH","difficulty":2,"choices":[{"label":"A","text":"In a PostToolUse hook that rewrites each tool result into ISO 8601 before the model sees it."},{"label":"B","text":"In a PreToolUse hook that inspects arguments and blocks any tool call likely to return a non-ISO date format."},{"label":"C","text":"By instructing the model in the system prompt to mentally convert every incoming timestamp to ISO 8601 itself."},{"label":"D","text":"By forcing tool_choice to a dedicated date-parsing tool on every turn so all timestamps pass through it first."}],"correct":"A","explanation":"Correct: PostToolUse intercepts a tool result before the model sees it, the right place to normalize formats deterministically. B PreToolUse fires before execution and cannot reshape results. C relies on probabilistic model behavior for a deterministic transform. D misuses forced tool_choice and does not normalize existing results."},{"id":"mockC-5","scenario":"Search subagent failure","stem":"A logistics research subagent's web search times out after partially gathering results. To let the coordinator decide intelligently, what should the subagent return?","domain":"AGENT-ARCH","difficulty":2,"choices":[{"label":"A","text":"A structured error with failure_type, attempted_query, partial_results, alternative_approaches, and coverage_impact."},{"label":"B","text":"A generic \"search unavailable\" message with no detail, so the coordinator simply retries the entire region from scratch."},{"label":"C","text":"An empty result set with no error flag, so the coordinator interprets the timeout as a legitimate \"no matches found\" outcome."},{"label":"D","text":"Nothing at all, and instead retry the failing query internally an unlimited number of times until it eventually succeeds."}],"correct":"A","explanation":"Correct: a structured error gives the coordinator the type, query, partial results, alternatives, and coverage gap needed to recover. B is the generic-status anti-pattern. C silently conflates failure with no results. D unbounded internal retries waste resources; do 1-2 then propagate."},{"id":"mockC-6","scenario":"Bundling tool calls","stem":"A shipping agent needs three independent lookups (rate card, transit time, customs code) that have no dependency on one another, all available as tools. To reduce loop round-trips, what is the best practice?","domain":"AGENT-ARCH","difficulty":2,"choices":[{"label":"A","text":"Request all three tool calls in a single assistant turn so they can be executed together rather than across three separate loop iterations."},{"label":"B","text":"Force exactly one tool call per turn so that each result can be fully validated before the next lookup is even requested, ensuring strict ordering."},{"label":"C","text":"Combine all three into one mega-tool that returns a fixed 40-field response on every call, regardless of which fields the task needs."},{"label":"D","text":"Spawn three full subagents, one per lookup, since dedicated subagents isolate each trivial read and run them faster in parallel."}],"correct":"A","explanation":"Correct: independent tool calls can be bundled into one turn, cutting loop round-trips. B serializing independent calls adds latency with no benefit. C a 40-field mega-tool wastes context with irrelevant fields. D spawning subagents for trivial lookups is over-engineering with extra coordination cost."},{"id":"mockC-7","scenario":"Manufacturing refund-style payout guardrail","stem":"An IoT industrial-equipment vendor runs an agent that can issue warranty credit to customers via an issue_credit tool. Compliance mandates that any credit above $1,000 must route to a human approver — with zero exceptions. The team currently relies on a system-prompt instruction 'try not to issue credits over $1,000 without approval'. Audits show occasional violations. What is the correct fix?","domain":"AGENT-ARCH","difficulty":2,"choices":[{"label":"A","text":"Reword the system prompt to state the $1,000 limit far more emphatically and with stronger wording"},{"label":"B","text":"Add several few-shot examples showing the model correctly declining to issue large warranty credits"},{"label":"C","text":"Implement a PreToolUse hook that blocks issue_credit calls over $1,000 and redirects them to escalation"},{"label":"D","text":"Lower the model's temperature so it adheres to the stated $1,000 instruction far more deterministically"}],"correct":"C","explanation":"Prompt instructions are probabilistic (>90%, not 100%); for financial/compliance rules with zero tolerance you need a deterministic PreToolUse hook that intercepts and redirects the call. Rewording, more examples, and temperature changes all remain probabilistic and cannot guarantee the rule."},{"id":"mockC-8","scenario":"Hospitality least-privilege subagent","stem":"A hotel chain builds a 'review-summarizer' subagent whose only job is to read guest reviews and produce a sentiment digest. The team's AgentDefinition currently lists allowed_tools including process_refund, modify_reservation, and send_email alongside the read tools. From a least-privilege standpoint, what should the allowed_tools be?","domain":"AGENT-ARCH","difficulty":2,"choices":[{"label":"A","text":"Keep every tool so the subagent can act autonomously if its review surfaces an issue worth fixing"},{"label":"B","text":"Restrict allowed_tools to only the read/lookup tools the summarizer actually needs"},{"label":"C","text":"Remove allowed_tools entirely so the subagent simply inherits the coordinator's complete toolset"},{"label":"D","text":"Add the Task tool so the summarizer can delegate any needed refunds to a separate downstream subagent"}],"correct":"B","explanation":"The principle of least privilege means a subagent should only have the tools its task requires; a read-only summarizer needs only read/lookup tools. Keeping write/financial tools, inheriting a full toolset, or adding Task all widen the blast radius unnecessarily and add distracting tools."},{"id":"mockC-9","scenario":"Travel research duplicate work","stem":"A travel coordinator spawns four research subagents to compile a destination guide. Two of them independently research 'best beaches' because the coordinator gave them overlapping prompts, wasting tokens and producing redundant sections. What coordinator responsibility was neglected?","domain":"AGENT-ARCH","difficulty":2,"choices":[{"label":"A","text":"Aggregating the four subagents' results into one coherent destination guide"},{"label":"B","text":"Cleanly partitioning the work into non-overlapping subtasks before delegating"},{"label":"C","text":"Raising each spawned subagent's max_tokens budget to cover the extra sections"},{"label":"D","text":"Running the four research subagents strictly in sequence rather than in parallel"}],"correct":"B","explanation":"The coordinator must decompose the task into distinct, non-overlapping subtasks so subagents don't duplicate work. Aggregation happens after; max_tokens doesn't address overlap; and sequential execution doesn't prevent two agents from being given the same subtask."},{"id":"mockC-10","scenario":"Travel fork to compare approaches","stem":"A travel-platform engineer has investigated a booking-engine bug up to a shared understanding and now wants to explore two independent fixes (a queue-based redesign vs a caching layer) that both start from that same context, then compare them. Which session feature fits?","domain":"AGENT-ARCH","difficulty":2,"choices":[{"label":"A","text":"fork_session, which branches independent lines from the shared context up to the branch point"},{"label":"B","text":"--resume, which reloads one prior session by name and continues it as a single line"},{"label":"C","text":"/compact, used to compress the shared context first and then branch the work from there"},{"label":"D","text":"-p headless mode, for running each of the two fixes as a non-interactive scripted single-shot job"}],"correct":"A","explanation":"fork_session creates independent branches that both inherit context up to the branch point and then diverge — ideal for comparing approaches. --resume continues one session, /compact compresses history, and -p is non-interactive CLI mode."},{"id":"mockC-11","scenario":"Gaming support empty-results vs failure","stem":"A game-studio support agent looks up a player's purchase history before granting a refund. For one ticket the lookup subagent returns an empty array; the coordinator concludes 'no purchases, deny refund.' The player then proves they bought the item—the lookup had actually timed out against a sharded store. How should the lookup subagent have reported this so the coordinator behaves correctly?","domain":"AGENT-ARCH","difficulty":3,"choices":[{"label":"A","text":"Return the same empty array but respond faster, so the coordinator can detect the gap on its own and retry the purchase-history lookup before deciding"},{"label":"B","text":"Return a structured error distinguishing a search failure (with failure_type, attempted query, partial results) from a genuine zero-match result"},{"label":"C","text":"Escalate every empty-result lookup to a human reviewer for manual purchase confirmation, regardless of whether the sharded store actually timed out"},{"label":"D","text":"Retry the sharded purchase store internally an unbounded number of times until a shard finally responds, returning only once a result is obtained"}],"correct":"B","explanation":"Correct: the failure is the silent-suppression anti-pattern, where empty=success hides a real failure. The fix is a structured error that lets the coordinator tell 'no results' apart from 'search failed,' including failure_type and partial results so it can retry or reroute. A doesn't help: a fast empty array is still indistinguishable from a real zero-match. C over-escalates legitimate zero-match cases and adds human load for normal traffic. D is the infinite-local-retry anti-pattern, adding latency while still not surfacing the failure type to the coordinator if the shard stays down."},{"id":"mockC-12","scenario":"EdTech grading subagent over-privilege","stem":"An automated grading agent calls a subagent that should only read student submissions from a bucket. To do this it is currently given a general `storage_admin` tool that can read, write, and delete any object. A bug once caused it to delete a submission. You want to make that class of misbehavior impossible, not just unlikely. What is the best change?","domain":"AGENT-ARCH","difficulty":3,"choices":[{"label":"A","text":"Add a strict system-prompt rule instructing the subagent to never delete or modify any object under any circumstances, relying on the instruction to prevent it"},{"label":"B","text":"Replace the general storage_admin tool with a capability-narrowed read-only tool (e.g., get_submission) so destructive operations are not in its allowed_tools at all"},{"label":"C","text":"Add a PostToolUse hook that detects deletions and automatically restores from backup any submission object the subagent removes from the bucket after the fact"},{"label":"D","text":"Keep the broad storage_admin tool in place but log every single invocation so that any erroneous deletion can later be audited, traced, and manually reversed afterward"}],"correct":"B","explanation":"Correct: least privilege says scope tools so misbehavior is structurally impossible. Replacing the broad admin tool with a read-only capability means delete/write simply aren't callable, regardless of model behavior. A is a probabilistic prompt instruction, not a guarantee, and the tool still exposes deletion. C reacts after destruction has already occurred and PostToolUse processes results rather than blocking the action; restoration may not even be possible. D provides auditing but does nothing to prevent the deletion, leaving the dangerous capability in scope."},{"id":"mockC-13","scenario":"Retail returns nuanced escalation","stem":"A retail support agent receives: 'This is the third defective blender you've sent me, this is absolutely unacceptable!' The agent's policy fully covers replacements and refunds for defects. An overzealous rule escalates to a human on any angry message, flooding the human queue. What should the agent do here?","domain":"AGENT-ARCH","difficulty":3,"choices":[{"label":"A","text":"Escalate to a human immediately, since the strongly negative sentiment about a third defective blender is a reliable signal that the case is complex and out of policy"},{"label":"B","text":"Acknowledge the frustration, then offer a concrete in-policy resolution (replacement or refund), and escalate only if the customer reiterates that they want a human"},{"label":"C","text":"Ask the customer to rate their anger on a 1-10 scale, then escalate to a human only when that self-reported number reaches 8 or higher and otherwise keep handling it"},{"label":"D","text":"Process the refund silently without acknowledging the complaint at all, on the theory that any reply to an already angry customer only prolongs the painful interaction"}],"correct":"B","explanation":"Correct: the nuanced pattern is acknowledge emotion, propose a concrete solution, and escalate only on reiteration of wanting a human; expressing dissatisfaction is not the same as requesting a manager, and the case is squarely in policy. A treats sentiment as a complexity signal, which the guide explicitly says does not correlate with case complexity, and it overloads the human queue. C is a sentiment/confidence-score gimmick that is an unreliable trigger. D resolves the transaction but skips the acknowledgment the pattern requires and risks the customer feeling unheard, undermining the de-escalation."},{"id":"mockC-14","scenario":"Devtools resume vs fresh session","stem":"A developer resumes yesterday's debugging session with `claude --resume payments-timeout` to keep the saved context. Overnight a teammate rebased and rewrote large parts of the payments module. The agent immediately reasons over file contents from its old tool results and proposes edits to functions that no longer exist. What went wrong and what is the better approach?","domain":"AGENT-ARCH","difficulty":3,"choices":[{"label":"A","text":"fork_session should have been used instead of --resume, so the old code state and the teammate's rebased code state could be explored side by side in two parallel branches"},{"label":"B","text":"Because files changed since the prior session, the resumed tool results are stale; it's better to start fresh with a short summary of what was found rather than resume with old tool data"},{"label":"C","text":"The resume failed only because the session name payments-timeout was mistyped on the command line; re-running --resume with the exact correct session name will resolve the stale tool-result problem"},{"label":"D","text":"The agent simply needed a PreToolUse hook configured to force a fresh re-read of every referenced source file from disk before acting, which would have caught the rewritten code"}],"correct":"B","explanation":"Correct: --resume restores prior context including potentially stale tool results; when files have changed the saved file contents no longer reflect reality. The guide's guidance is to start a new session seeded with a short summary rather than resume stale tool data. A misuses fork_session, which branches shared context to compare approaches, not to refresh stale file state; both forks would inherit the same outdated results. C is a red herring; the resume worked, the data is simply stale. D is an awkward workaround that doesn't address why resuming with degraded context is the wrong call here."},{"id":"mockC-15","scenario":"Insurance claims coordinator dedup","stem":"An insurance triage coordinator delegates research to subagents by topic. Lately the final report contains duplicated findings and one peril category is entirely missing. Logs show the coordinator handed three subagents overlapping, vaguely-worded tasks like 'look into the claim' and post-hoc tried to merge their outputs. What is the better coordinator strategy?","domain":"AGENT-ARCH","difficulty":4,"choices":[{"label":"A","text":"Add a final de-duplication pass after delegation that detects and merges the identical findings produced by the three overlapping subagents before the synthesis step runs"},{"label":"B","text":"Run the three subagents strictly in sequence so each one can read what the previous subagent already covered and thereby avoid repeating that same research work itself"},{"label":"C","text":"Partition the work into non-overlapping subtasks up front with explicit scope per subagent, rather than assigning overlapping tasks and de-duplicating afterward"},{"label":"D","text":"Increase the max_tokens budget on the final synthesis step so the currently missing peril category has enough room to fit alongside everything else in the report output"}],"correct":"C","explanation":"Correct (C): the coordinator's job is to decompose into clear subtasks; partitioning work up front with explicit, non-overlapping scope prevents both the duplication (overlap) and the gap (no one owned that peril). A only treats the duplication symptom and does nothing for the missing category caused by under-specified scope. B serializes independent work, hurting latency, and still relies on vague tasks; coverage gaps come from poor decomposition, not ordering. D misreads a decomposition/coverage gap as an output-length problem; the category is missing because no subagent was scoped to it, not because the synthesis was truncated."},{"id":"mockC-16","scenario":"Telecom agent loop efficiency","stem":"A telecom support agent resolves a billing dispute. For each customer it makes a separate turn to fetch the account, then another turn to fetch the latest invoice, then another to fetch the payment history—three independent reads that don't depend on each other. The agentic loop is making three round-trips and the system feels sluggish under load. What is the cleanest improvement?","domain":"AGENT-ARCH","difficulty":4,"choices":[{"label":"A","text":"Cap the agentic loop at three iterations so that it physically cannot exceed the three reads the billing dispute actually requires for each customer it handles"},{"label":"B","text":"Merge the three independent reads into one general tool that returns the entire customer object with all 40+ fields, so that a single call always covers every case"},{"label":"C","text":"Spawn three separate subagents to fetch each of the three pieces concurrently, on the basis that parallel subagents are always faster than a single agentic loop here"},{"label":"D","text":"Have the model request all three independent tool calls in a single turn so they are handled together, reducing the number of loop iterations"}],"correct":"D","explanation":"Correct (D): when tool calls are independent, bundling them into a single turn cuts the number of agent-loop round-trips and the associated latency. A uses an arbitrary iteration cap as a control mechanism, an anti-pattern, and does nothing about per-turn round-trips. B reduces turns but bloats context by returning 40+ fields when only a few matter, the wasted-context problem; it also abandons least-privilege scoping. C adds the overhead of spawning isolated subagents and explicit context passing for three trivial reads; subagents aren't automatically warranted and 'always faster' is false given their coordination cost."},{"id":"mockC-17","scenario":"Personal experimental server","stem":"A developer wants to try an experimental personal MCP server on their own machine without affecting teammates or committing anything. Where should it go?","domain":"TOOL-MCP","difficulty":1,"choices":[{"label":"A","text":"In the user-level ~/.claude.json, which is not shared via version control."},{"label":"B","text":"In the project's checked-in .mcp.json, so the server is committed and available to everyone."},{"label":"C","text":"In a directory-level CLAUDE.md inside the repo so the server entry loads automatically."},{"label":"D","text":"In a .claude/rules/ file scoped with a paths glob pointing at the project directory."}],"correct":"A","explanation":"Correct: ~/.claude.json is the user-level config for personal/experimental servers, not shared via VCS. B .mcp.json is the team-shared, committed config. C and D are CLAUDE.md/rules mechanisms that do not define MCP servers."},{"id":"mockC-18","scenario":"Insurance auto tool choice","stem":"An insurance Q&A assistant answers many simple policy questions directly from its knowledge but occasionally needs to call lookup_policy for specifics. The team wants the model to decide per request whether a tool is needed. Which tool_choice is appropriate?","domain":"TOOL-MCP","difficulty":1,"choices":[{"label":"A","text":"{\"type\": \"auto\"} — the model decides whether to call a tool or answer in text"},{"label":"B","text":"{\"type\": \"any\"}, which forces the model to call some tool on every incoming question"},{"label":"C","text":"{\"type\": \"tool\", \"name\": \"lookup_policy\"} pinned so it runs on every single request"},{"label":"D","text":"Disabling tools entirely so the model can only ever answer from its own knowledge"}],"correct":"A","explanation":"tool_choice auto lets the model decide whether to call a tool or answer in text — the default and correct fit when only some requests need a tool. \"any\" would force unnecessary tool calls on simple questions, forcing a specific tool every time is wasteful, and disabling tools removes lookups when genuinely needed."},{"id":"mockC-19","scenario":"Guaranteed structured extraction","stem":"A clinical intake service must always return a structured JSON object (never free text) describing a patient symptom report, and you have several extraction tools defined. You want Claude to pick the most appropriate extractor but never reply in prose. Which tool_choice setting fits?","domain":"TOOL-MCP","difficulty":2,"choices":[{"label":"A","text":"tool_choice: any, so the model must call some tool but still selects the best extractor."},{"label":"B","text":"tool_choice: auto, which lets the model decide on its own whether to reply in plain text."},{"label":"C","text":"tool_choice forced to one fixed extractor on every call, regardless of the report's shape."},{"label":"D","text":"No tool_choice at all, then post-process the model's prose into JSON with a regex parser."}],"correct":"A","explanation":"Correct: any guarantees a tool call (structured output) while letting the model choose among extractors. B auto permits a text answer, breaking the always-structured requirement. C forced locks one extractor even when another fits better. D regex over prose reintroduces the syntax errors tool_use eliminates."},{"id":"mockC-20","scenario":"Schema guarantees","stem":"An invoice-extraction tool uses a strict JSON schema. The output is always valid JSON with all required fields present, yet the line-item totals sometimes do not add up. Which statement is accurate?","domain":"TOOL-MCP","difficulty":2,"choices":[{"label":"A","text":"JSON schema via tool_use guarantees syntactic validity and structure but not semantic correctness; arithmetic errors need validation, retry-with-feedback, or self-correction."},{"label":"B","text":"A correctly authored JSON schema also constrains the numeric field values themselves, so when validation passes the line-item totals are guaranteed to add up arithmetically."},{"label":"C","text":"The root problem is an undetected JSON syntax error in the tool_use output; declaring additional required fields in the schema will tighten it and force the totals to reconcile."},{"label":"D","text":"Switching away from tool_use to plain free-text output and parsing the numbers downstream would sidestep the schema and eliminate the arithmetic mismatches in the totals entirely."}],"correct":"A","explanation":"Correct: schemas eliminate syntax errors and enforce structure but cannot ensure values are right; semantic errors need validation/retry/self-correction. B overstates schema guarantees. C the issue is semantic, not syntactic. D free text removes the structural guarantees and does not fix semantics."},{"id":"mockC-21","scenario":"Structured MCP error fields","stem":"Designing an MCP tool for a payments lookup, you want failures to give the calling agent enough to act on. Which error payload is best?","domain":"TOOL-MCP","difficulty":2,"choices":[{"label":"A","text":"{ isError: true, content: { errorCategory: \"transient\", isRetryable: true, message: \"...timeout...\", attempted_query: \"order_id=12345\", partial_results: null } }"},{"label":"B","text":"{ isError: true, content: \"Operation failed\" }, a short opaque message so the calling agent at least knows that something went wrong on this particular payments lookup call"},{"label":"C","text":"{ isError: false, content: [] } returned as a clean empty success so the calling agent simply keeps moving forward and treats the failed lookup as a legitimate zero-match result"},{"label":"D","text":"Throw an uncaught server-side exception on failure and let the calling agent infer the underlying cause and the right recovery action on its own from the broken, malformed response"}],"correct":"A","explanation":"Correct: a structured error with category, retryability, message, attempted query, and partial results lets the agent decide how to recover. B the generic string gives no decision information. C masking a failure as success is the silent-suppression anti-pattern. D an uncaught exception provides no structured signal to the agent."},{"id":"mockC-22","scenario":"Streaming overlapping tool descriptions","stem":"A streaming backend exposes two tools: analyze_video and analyze_clip, both with the description 'Analyzes media content and returns insights.' The model frequently calls the wrong one. What is the correct fix?","domain":"TOOL-MCP","difficulty":2,"choices":[{"label":"A","text":"Set tool_choice to any so the model is forced to pick whichever of the two media tools it judges best for the request on each call"},{"label":"B","text":"Rewrite the descriptions to clearly differentiate what each does, its inputs, and when to use it versus the other"},{"label":"C","text":"Rename the two tools with much longer, more distinct names but leave their identical 'Analyzes media content' descriptions unchanged"},{"label":"D","text":"Merge analyze_video and analyze_clip into a single tool that keeps one generic description covering all media inputs and clip types"}],"correct":"B","explanation":"Descriptions are the primary tool-selection mechanism; near-identical descriptions cause confusion, so differentiate them by function, inputs, and when-to-use guidance. tool_choice any still can't disambiguate two indistinguishable tools, renaming alone doesn't help, and merging may lose needed distinctions."},{"id":"mockC-23","scenario":"Insurance enum with other","stem":"An insurance triage tool classifies claims into an enum: [auto, home, health, life]. The team finds that pet-insurance and travel-insurance claims get force-fit into wrong categories, silently losing data. What enum design fixes this?","domain":"TOOL-MCP","difficulty":2,"choices":[{"label":"A","text":"Drop the enum constraint completely and accept any free-text category string the model produces for a claim, including pet and travel"},{"label":"B","text":"Add an \"other\" value plus a nullable category_detail field to capture out-of-enum cases"},{"label":"C","text":"Enumerate every conceivable insurance product type up front so the fixed enum can also cover pet, travel, and any future claim types"},{"label":"D","text":"Make the category field not required so the model may simply omit it whenever none of the listed enum values fits the claim type"}],"correct":"B","explanation":"Adding an \"other\" value plus a detail string captures data that falls outside predefined categories instead of mis-binning it. Dropping the enum loses structure, enumerating every type is impractical and brittle, and omitting category loses the classification entirely."},{"id":"mockC-24","scenario":"An internal MCP server for a logistics team exposes a tool list_warehouse_zones() that the agent calls repeatedly at the start of nearly every task just to learn which zones and SKUs exist. The zone/SKU catalog is read-only reference data that changes a few times a year.","stem":"How should this reference data be modeled to cut the exploratory calls?","domain":"TOOL-MCP","difficulty":3,"choices":[{"label":"A","text":"Expose the catalog as an MCP Resource the agent can read for context instead of an action Tool"},{"label":"B","text":"Keep it as an action Tool but cache the result on the client and force tool_choice to call it first each session"},{"label":"C","text":"Convert the catalog into an MCP Prompt template whose body enumerates all of the available warehouse zones"},{"label":"D","text":"Merge list_warehouse_zones into the main query tool so the zone list is returned alongside every other call"}],"correct":"A","explanation":"Correct: A. Read-only reference data is exactly what MCP Resources are for, they give the agent an immediate map of what data exists without spending exploratory tool calls. B keeps it an action tool and adds machinery (cache + forced call) that still treats reference lookup as an action and burdens every task. C misuses Prompts, which are reusable prompt templates, not data catalogs. D bloats the query tool's contract and couples unrelated concerns, returning the catalog on every operation regardless of need."},{"id":"mockC-25","scenario":"An MCP search tool queries an audit-log store. When a query matches no records it returns {\"isError\": true, \"content\": \"no results\"}. The compliance agent, seeing isError, escalates these as failed lookups and pages an on-call engineer, even though the empty result is a perfectly valid answer.","stem":"What is the correct fix?","domain":"TOOL-MCP","difficulty":3,"choices":[{"label":"A","text":"Keep isError:true but tag it errorCategory:\"transient\" with isRetryable:true so the agent retries the zero-match query instead of escalating it"},{"label":"B","text":"Return isError:false with an empty results array; a zero-match query is a successful call, not a failed one"},{"label":"C","text":"Suppress the empty responses entirely and return nothing at all on a zero-match query, so the calling agent simply moves on to the next step"},{"label":"D","text":"Set isError:true with isRetryable:false on the zero-match query so the calling agent records it as a permanent, non-recoverable failure"}],"correct":"B","explanation":"Correct: B. isError:true means the CALL itself failed; a query that legitimately matched zero records is a successful call with an empty result and must be distinguished from an access/lookup failure. A still mislabels a valid empty result as an error and now causes pointless retries. C breaks the protocol by returning no content, leaving the agent unable to tell success from failure. D still treats a valid empty result as a failure (just a permanent one), so escalation logic keyed on isError continues to misfire."},{"id":"mockC-26","scenario":"A repo-automation agent has both the built-in Grep tool and a custom MCP tool code_index_search that searches a precomputed semantic index covering closed-source vendor SDKs not present on disk. The agent almost always reaches for built-in Grep, missing the vendor results only the MCP tool can surface.","stem":"What is the recommended way to get the agent to choose the MCP tool when appropriate?","domain":"TOOL-MCP","difficulty":3,"choices":[{"label":"A","text":"Delete or disable the built-in Grep tool entirely so that only code_index_search remains available for the agent to choose from on every query"},{"label":"B","text":"Strengthen the MCP tool's description to highlight its unique data (vendor SDKs not on disk) and when to prefer it over Grep"},{"label":"C","text":"Force tool_choice to code_index_search for the whole session so the agent always routes through the MCP tool rather than ever reaching for Grep"},{"label":"D","text":"Rename code_index_search to grep_plus so that it sorts adjacent to the built-in Grep tool in the listing and the agent is nudged to notice it"}],"correct":"B","explanation":"Correct: B. Agents tend to prefer built-in tools over similar MCP tools; the prescribed remedy is to strengthen the MCP description by highlighting concrete advantages and unique data the built-in cannot provide, plus when to choose it. A throws away a genuinely useful general tool the agent still needs for on-disk searches. C is too blunt, it forces the MCP tool even when local Grep is the right choice, hurting other tasks. D is cosmetic; tool selection is driven by description content, not alphabetical proximity."},{"id":"mockC-27","scenario":"An MCP payments tool returns {\"isError\": true, \"content\": \"Operation failed\"} on every failure: expired card, rate-limit timeout, and disallowed refund over policy all look identical. The orchestrating agent retries everything uniformly, hammering the API on permanent failures and giving up too fast on transient ones.","stem":"What change to the error response best enables correct recovery decisions?","domain":"TOOL-MCP","difficulty":4,"choices":[{"label":"A","text":"Return isError:false and place the failure text inside content, so the agent treats the failure as a normal successful result, stops retrying it, and just moves on"},{"label":"B","text":"Return structured fields such as errorCategory (transient/validation/permission), isRetryable, a human-readable message, and any partial_results"},{"label":"C","text":"Always set isRetryable:true on every error and apply exponential backoff, so that any failure whatever its underlying cause is eventually retried safely a few times later"},{"label":"D","text":"Raise the failure as a thrown exception inside the MCP server so the calling agent never actually receives an isError payload to reason about or recover from at all here"}],"correct":"B","explanation":"Correct: B. Structured error metadata (errorCategory, isRetryable, message, partial_results) gives the agent what it needs to decide whether to retry, change the query, or escalate, which the generic string cannot. A is wrong and dangerous: isError:false signals a successful call with a valid result, which would mask real failures as legitimate empty/normal output. C is wrong because a policy-violating refund is a business error that should be isRetryable:false; blindly retrying it wastes calls and never succeeds. D removes the protocol's failure signal entirely, leaving the agent with even less structured information."},{"id":"mockC-28","scenario":"Gaming CLAUDE.md team miss","stem":"A game studio's lead put all the project's coding and testing standards in ~/.claude/CLAUDE.md on her own laptop. New hires cloning the repo never see these standards and keep violating conventions. What is the correct placement?","domain":"CODE-CONFIG","difficulty":1,"choices":[{"label":"A","text":"Keep it in ~/.claude/CLAUDE.md on the lead's laptop, since user-level config is synced out to all teammates automatically"},{"label":"B","text":"Move it to a project-level .claude/CLAUDE.md (or root CLAUDE.md) committed to version control"},{"label":"C","text":"Email the standards file to each new hire and ask them to drop it into their own ~/.claude folder after cloning the repo"},{"label":"D","text":"Put it in a directory-level CLAUDE.md placed inside the repo's node_modules tree so it loads whenever deps are present"}],"correct":"B","explanation":"User-level ~/.claude/CLAUDE.md applies only to that user and is not shared via VCS; project standards belong in a project-level .claude/CLAUDE.md (or root CLAUDE.md) that all contributors get. User-level files don't sync, emailing isn't a maintainable mechanism, and node_modules is not a sensible location."},{"id":"mockC-29","scenario":"Manufacturing memory persistence","stem":"An industrial-automation developer keeps re-typing the same build commands and project conventions at the start of every Claude Code session. Which built-in command lets them save these once so they persist and auto-load in future sessions?","domain":"CODE-CONFIG","difficulty":1,"choices":[{"label":"A","text":"/compact (compresses the context and saves the build commands so they reload later)"},{"label":"B","text":"/memory (opens CLAUDE.md for editing so notes persist across sessions)"},{"label":"C","text":"-p (runs headless and writes the conventions to disk so they auto-load next time)"},{"label":"D","text":"--resume (reopens the prior session, carrying the saved commands into future runs)"}],"correct":"B","explanation":"/memory opens CLAUDE.md for editing so conventions, commands, and context persist across sessions and auto-load on startup. /compact compresses context, -p is headless mode, and --resume reopens a specific prior session rather than storing reusable notes."},{"id":"mockC-30","scenario":"argument-hint prompting","stem":"Engineers on your energy team keep invoking the /analyze-substation skill with no argument and get confused output. You want Claude Code to prompt for the substation path when the skill is called bare. Which frontmatter parameter provides this?","domain":"CODE-CONFIG","difficulty":1,"choices":[{"label":"A","text":"allowed-tools"},{"label":"B","text":"context: fork"},{"label":"C","text":"argument-hint"},{"label":"D","text":"paths glob"}],"correct":"C","explanation":"Correct: argument-hint provides a hint that asks for an argument when the skill is invoked without parameters (Ch5.5). C matches. allowed-tools restricts tools, context: fork isolates execution, and paths is a rules-loading glob unrelated to argument prompting."},{"id":"mockC-31","scenario":"Modular CLAUDE.md imports","stem":"A large e-commerce monorepo has bloated its root CLAUDE.md by inlining coding-style and testing-requirement text. The team wants to keep one source of truth per standard and reference them. Which mechanism is intended for this?","domain":"CODE-CONFIG","difficulty":2,"choices":[{"label":"A","text":"Use @path imports, e.g. @./standards/coding-style.md and @./standards/testing-requirements.md, to keep configuration modular."},{"label":"B","text":"Paste each standard's full text into every package's own CLAUDE.md so that every package stays fully self-contained and never depends on a shared file."},{"label":"C","text":"Define a skill with context: fork whose job is to load and inline all of the coding-style and testing standards on demand into the session context."},{"label":"D","text":"Symlink the standards files from the root into each package directory and rely on Claude to follow the symlinks back to the single source file."}],"correct":"A","explanation":"Correct: @path imports let CLAUDE.md reference external files (relative/absolute, up to depth 5), avoiding duplication. B copying everywhere reintroduces duplication and drift. C a forked skill is on-demand, not the always-loaded import mechanism. D symlinks are not the documented import mechanism (@path is)."},{"id":"mockC-32","scenario":"Skill context fork","stem":"A logistics team's codebase-analysis skill produces very verbose output (reading many files) that pollutes the main session context. Which SKILL.md frontmatter setting isolates that output?","domain":"CODE-CONFIG","difficulty":2,"choices":[{"label":"A","text":"context: fork, which runs the skill in an isolated subagent so its verbose output does not pollute the main session."},{"label":"B","text":"allowed-tools, which restricts the set of tools the codebase-analysis skill is permitted to call while it runs."},{"label":"C","text":"argument-hint, which prompts the caller to supply the missing path argument when the analysis skill is invoked bare."},{"label":"D","text":"context: compact, which auto-summarizes the skill's verbose file-reading output inline within the main session."}],"correct":"A","explanation":"Correct: context: fork runs the skill in an isolated subagent, keeping verbose output out of the main session. B allowed-tools restricts the toolset, not context isolation. C argument-hint only solicits arguments. D context: compact is not a documented frontmatter value."},{"id":"mockC-33","scenario":"CI headless review","stem":"A CI pipeline must run Claude Code non-interactively to review each PR and emit machine-parseable output so a script can post inline comments. Which invocation is correct?","domain":"CODE-CONFIG","difficulty":2,"choices":[{"label":"A","text":"claude -p \"Review this PR\" --output-format json --json-schema '{...}' so it runs non-interactively and emits schema-validated JSON."},{"label":"B","text":"Launch the interactive REPL inside the runner, type the review prompt by hand, then copy the printed review output into the CI script for posting."},{"label":"C","text":"Run claude --resume ci-review so that each PR review reuses and continues the previous PR's saved session state across all of the pipeline runs."},{"label":"D","text":"Run claude -p \"Review this PR\" and parse the free-text stdout with a regex to pull out the file paths, line numbers, and review findings to post."}],"correct":"A","explanation":"Correct: -p is the non-interactive mode for CI, and --output-format json with --json-schema yields parseable, validated output. B interactive mode cannot run unattended in CI. C resuming a prior session carries stale/irrelevant context across PRs. D free-text parsing reintroduces fragility that the JSON schema avoids."},{"id":"mockC-34","scenario":"Independent reviewer","stem":"A CI workflow uses the same Claude Code session to both generate code and then review it, and the review rarely finds real problems. What practice does the guide recommend?","domain":"CODE-CONFIG","difficulty":2,"choices":[{"label":"A","text":"Use an independent Claude instance for review, since the session that wrote the code retains its reasoning and is less likely to challenge its own decisions."},{"label":"B","text":"Raise the reviewing step's max_tokens budget so that the same code-writing session has enough room to inspect its own generated code far more thoroughly and catch the problems."},{"label":"C","text":"Instruct the same session in the review prompt to \"be extra critical of your own work\" so it challenges its earlier decisions and surfaces the issues it would otherwise defend."},{"label":"D","text":"Run /compact between the generation and the review phases so the session's prior authoring reasoning is summarized away and effectively reset before it reviews the code again."}],"correct":"A","explanation":"Correct: the same session that generated code is less effective at reviewing it; use an independent instance for unbiased review. B more tokens does not remove the self-bias. C a prompt instruction does not overcome retained reasoning context. D /compact summarizes but the same instance still carries its own decisions."},{"id":"mockC-35","scenario":"Gaming skill context fork","stem":"A game studio's 'analyze-shader-perf' skill produces very verbose output that pollutes the main session and crowds out other context. The team wants the skill to run in isolation and return only a summary. Which SKILL.md frontmatter setting achieves this?","domain":"CODE-CONFIG","difficulty":2,"choices":[{"label":"A","text":"argument-hint: \"shader path\""},{"label":"B","text":"context: fork"},{"label":"C","text":"allowed-tools: [\"Read\"]"},{"label":"D","text":"paths: [\"**/*.glsl\"]"}],"correct":"B","explanation":"context: fork runs the skill in an isolated subagent so its verbose output does not pollute the main session. argument-hint prompts for an argument, allowed-tools restricts the toolset, and paths is a .claude/rules mechanism, not skill isolation."},{"id":"mockC-36","scenario":"A logistics company must split its 1,400-line monolithic shipment monolith into bounded services. The lead is unsure where to draw service boundaries, several decompositions look viable, and the change will eventually touch ~60 files. The lead wants a safe path that ends in actual implementation.","stem":"Which workflow best fits this situation?","domain":"CODE-CONFIG","difficulty":3,"choices":[{"label":"A","text":"Use planning mode to investigate and design the boundaries with no side effects, get the plan approved, then switch to direct execution to implement the approved plan"},{"label":"B","text":"Use direct execution from the very start, since the engineer already knows the domain well, and simply course-correct file by file as problems surface during the edits themselves"},{"label":"C","text":"Stay in planning mode for the entire effort so that no risky edits are ever applied at all and the model only ever produces plans, never once touching the actual code in the repo"},{"label":"D","text":"Run the whole task inside a context: fork skill so that all of the architectural reasoning and the exploration stays fully is
