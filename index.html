olated from the main session's working context window"}],"correct":"A","explanation":"Correct: A. Ambiguous boundaries, multiple viable approaches, and a large blast radius are textbook planning-mode triggers; the combined approach (plan -> approve -> direct execute) safely investigates first then implements. B skips safe exploration on a high-ambiguity, high-blast-radius change — exactly what planning mode exists to prevent. C never implements anything; planning mode makes no changes, so staying in it forever leaves the work undone. D conflates context isolation (forking) with the plan-vs-execute decision; a fork does not provide plan approval or the no-side-effect investigation phase."},{"id":"mockC-37","scenario":"In a long debugging session, the same Claude instance wrote a complex retry-backoff module and 'confirmed' it was correct. A senior engineer is uneasy: the review keeps endorsing the original design choices and never flags the off-by-one in the backoff cap. The team wants the review to actually challenge the implementation.","stem":"What is the root cause and the correct remedy?","domain":"CODE-CONFIG","difficulty":3,"choices":[{"label":"A","text":"The reviewing session retains its own authoring reasoning and resists challenging its decisions; run the review in an independent fresh instance so it evaluates the code without that bias"},{"label":"B","text":"The context window is saturated with authoring detail and noise; run /compact to clear it out first, then ask the very same session to review the same code again now that it has room to think clearly"},{"label":"C","text":"The review prompt simply lacks demonstrations of what good looks like; add two or three few-shot examples of strong reviews to that same authoring session and then re-run the review for far better results"},{"label":"D","text":"The CLAUDE.md is missing the team's documented review standards; add those standards to the file and then let the same session that originally wrote the code re-review it against the newly documented rules"}],"correct":"A","explanation":"Correct: A. The guide states the session that generated code is less effective at reviewing it because it retains its reasoning context and is less likely to challenge its own decisions; the fix is an independent instance for review. B (compact) frees context but the same session keeps its authoring bias — and risks losing precise detail like the exact cap value. C improves review format but not the structural confirmation bias of the authoring session. D adds standards but still routes the review through the biased authoring session, which is the actual root cause."},{"id":"mockC-38","scenario":"During a marathon incident investigation, the context is filling with verbose log dumps. An engineer has just nailed down three load-bearing facts: the failing build SHA is a1b9f3c, the exact threshold is 4096 ms, and the regression landed 2026-06-09. They want to run `/compact` to keep going but worry about what compaction does.","stem":"What is the correct precaution before running `/compact`?","domain":"CODE-CONFIG","difficulty":3,"choices":[{"label":"A","text":"Persist the exact SHA, threshold, and date into CLAUDE.md (via /memory) or a scratchpad first, because summarization can drop precise numbers, dates, and specifics"},{"label":"B","text":"Nothing special is needed here, because /compact preserves all numeric values and dates losslessly during summarization, so the exact SHA, threshold, and date all remain perfectly safe"},{"label":"C","text":"Switch the relevant skill to context: fork before compacting, so that the precise SHA and threshold are isolated inside a subagent's context and are therefore never touched by the summarization"},{"label":"D","text":"Add a .claude/rules/ file with a paths glob pointing at the facts so that the exact SHA, threshold, and date all reload themselves automatically back into context right after the compaction runs"}],"correct":"A","explanation":"Correct: A. `/compact` summarizes prior history and risks losing exact numeric values, dates, and specific details — so durable facts should be persisted (via /memory into CLAUDE.md, or a scratchpad) before compacting. B is false; the guide explicitly warns compaction can lose precise details. C misapplies `context: fork`, which isolates a skill's verbose output and does not protect facts through a compaction summary. D's path-scoped rules load conventions when editing matching files; they are not a mechanism for re-injecting investigation facts after compaction."},{"id":"mockC-39","scenario":"A DevOps team wants their GitHub Actions pipeline to run Claude Code on each PR and post structured inline comments at specific file/line locations. The pipeline must never hang waiting for input, and a downstream step parses the result to create the review comments programmatically.","stem":"Which invocation meets all of these CI requirements?","domain":"CODE-CONFIG","difficulty":3,"choices":[{"label":"A","text":"`claude -p \"Review this PR\" --output-format json --json-schema '{...}'` so it runs non-interactively and emits schema-validated JSON the next step can parse into inline comments"},{"label":"B","text":"`claude \"Review this PR\" --output-format json` run inside the CI runner, relying on the default interactive session to print out the JSON that the next pipeline step then parses into comments"},{"label":"C","text":"`claude -p \"Review this PR\"` and then screen-scrape the free-text stdout with a carefully written regex to extract the file paths and line numbers needed for posting the inline review comments"},{"label":"D","text":"`claude --json-schema '{...}'` without the `-p` flag at all, on the basis that supplying the json-schema flag by itself is already enough to force non-interactive, schema-validated structured output"}],"correct":"A","explanation":"Correct: A. `-p` gives non-interactive mode (no hanging), and `--output-format json` with `--json-schema` produces schema-validated structured output that a downstream step can reliably parse into inline PR comments. B omits `-p`, so the interactive session can wait for input and hang the pipeline. C uses `-p` correctly but parses free-text, which is brittle and not the structured-output path the guide prescribes. D omits `-p`; `--json-schema` shapes output but does not by itself put the CLI in non-interactive print mode, so it can still hang."},{"id":"mockC-40","scenario":"Gaming few-shot count","stem":"A game-support team wants to teach Claude how to handle ambiguous player requests using few-shot examples in the prompt. Roughly how many examples does the guide recommend, and what should they look like?","domain":"PROMPT-ENG","difficulty":1,"choices":[{"label":"A","text":"10-15 near-identical examples, packed in to maximize raw coverage of cases"},{"label":"B","text":"2-4 diverse examples covering different/edge scenarios, ideally with rationale"},{"label":"C","text":"Exactly one canonical example, repeated verbatim several times for emphasis"},{"label":"D","text":"No examples at all, since a precise textual description always beats using examples"}],"correct":"B","explanation":"Few-shot prompting uses 2-4 input/output examples, and they are most effective when diverse (covering edge cases) and include rationale so the model generalizes. Ten-plus near-identical examples add little, a single repeated example doesn't show range, and examples are specifically more effective than vague descriptions."},{"id":"mockC-41","scenario":"Rationale in examples","stem":"A support-routing prompt shows examples mapping requests to actions, but the model still mishandles novel ambiguous cases. Adding what to each example most improves generalization to unseen cases?","domain":"PROMPT-ENG","difficulty":2,"choices":[{"label":"A","text":"A short rationale explaining why each example maps to its action (e.g., why \"broken\" requires order lookup), so the model learns the decision logic."},{"label":"B","text":"Add more columns of structured metadata to each example, even when that extra metadata is unrelated to the actual routing decision the example is meant to teach the model."},{"label":"C","text":"Enumerate the exact phrasing of every possible incoming support request so that no case the model encounters at runtime is ever truly novel and unmapped to a known action."},{"label":"D","text":"Append a note saying \"use your best judgment here\" after each example, so the model feels free to improvise on the new ambiguous cases it has not seen mapped before."}],"correct":"A","explanation":"Correct: including the rationale in examples shows the decision logic, which the model generalizes to new ambiguous cases. B irrelevant metadata adds noise. C enumerating every phrasing is infeasible and brittle. D \"use your best judgment\" is vague and does not convey the reasoning pattern."},{"id":"mockC-42","scenario":"Self-correction conflict","stem":"An e-commerce receipt parser must catch internal contradictions where a printed total disagrees with the sum of items. Which output design lets downstream code detect this automatically?","domain":"PROMPT-ENG","difficulty":2,"choices":[{"label":"A","text":"Have the model output both stated_total and calculated_total plus a conflict_detected boolean when they differ."},{"label":"B","text":"Have the model output only the single stated_total it reads directly off the printed receipt and simply trust that figure as authoritative."},{"label":"C","text":"Have the model silently choose whichever of the two competing totals it judges more likely to be the correct one and emit only that value."},{"label":"D","text":"Have the model output the arithmetic average of the stated total and the summed line-item total as a single reconciled total figure instead."}],"correct":"A","explanation":"Correct: the self-correction pattern emits both the stated and computed values with a conflict flag so discrepancies are detectable. B a single value hides the contradiction. C silently choosing one loses the signal and may be wrong. D averaging fabricates a value that matches neither source."},{"id":"mockC-43","scenario":"Interview pattern","stem":"An engineer asks Claude to implement caching for a healthcare API. The right choice depends on invalidation strategy, staleness tolerance, and scope, none of which were stated. What should Claude do before implementing?","domain":"PROMPT-ENG","difficulty":2,"choices":[{"label":"A","text":"Use the interview pattern: ask clarifying questions (TTL vs event-based, stale-data tolerance, per-user vs global, data volume) before implementing."},{"label":"B","text":"Pick the single most common caching approach and implement it immediately without surfacing the open questions."},{"label":"C","text":"Implement every plausible caching strategy at once and let the user simply delete whichever ones they dislike."},{"label":"D","text":"Refuse to take on the task outright, on the grounds that the key caching requirements were never specified."}],"correct":"A","explanation":"Correct: for unfamiliar domains and non-obvious implications with multiple viable approaches, the interview pattern (ask first) is appropriate. B guessing risks the wrong design in a sensitive domain. C building everything is wasteful over-engineering. D refusing is unhelpful when clarification would unblock the work."},{"id":"mockC-44","scenario":"Travel retry with feedback content","stem":"A travel-invoice extractor fails validation because total=480 but the sum of line items is 455. The team wants to retry effectively. What should the retry prompt include?","domain":"PROMPT-ENG","difficulty":2,"choices":[{"label":"A","text":"Only the bare instruction to 'try again and please be more careful this time' with no other context"},{"label":"B","text":"The original document, the previous incorrect extraction, and the specific error ('total=480 but sum(line_items)=455; re-check values')"},{"label":"C","text":"A fresh clean copy of the original document, with no mention at all of the prior incorrect extraction"},{"label":"D","text":"A higher required confidence threshold so the model only commits when it is more sure of the totals"}],"correct":"B","explanation":"Effective retry-with-feedback supplies the original document, the previous (incorrect) extraction, and the specific error message so the model can correct the arithmetic. A vague 'be careful', a context-free re-run, or a threshold change don't give the model the concrete discrepancy to fix."},{"id":"mockC-45","scenario":"Travel interview pattern","stem":"A travel-app team asks Claude to 'implement caching for the search API' in an unfamiliar domain with several viable strategies (TTL vs event-based, per-user vs global). Before coding, what is the recommended approach?","domain":"PROMPT-ENG","difficulty":2,"choices":[{"label":"A","text":"Pick the single most common caching strategy right away and implement it without asking anything first"},{"label":"B","text":"Use the interview pattern: ask clarifying questions about invalidation strategy, stale-data tolerance, scope, and data volume before implementing"},{"label":"C","text":"Use the Batch API to implement and try all of the candidate caching strategies overnight, then compare"},{"label":"D","text":"Force tool_choice to any so the model is pushed to start writing the caching code as quickly as possible"}],"correct":"B","explanation":"The interview pattern is recommended for unfamiliar domains and tasks with non-obvious implications and multiple viable approaches — ask clarifying questions first. Implementing immediately risks the wrong design, the Batch API is for bulk async work, and forcing a tool doesn't resolve the design ambiguity."},{"id":"mockC-46","scenario":"Streaming rationale in examples","stem":"A streaming-support team's few-shot examples show input requests and the resulting tool actions, but the model still misapplies them to new cases. The guide suggests one more element to help the model generalize the decision logic. What is it?","domain":"PROMPT-ENG","difficulty":2,"choices":[{"label":"A","text":"Include a short rationale with each example explaining why that action was chosen"},{"label":"B","text":"Add roughly ten more nearly identical examples so the model sees more coverage"},{"label":"C","text":"Remove the chosen actions from the examples and show the model only the raw inputs"},{"label":"D","text":"Replace the worked examples entirely with a single short, vaguely worded instruction"}],"correct":"A","explanation":"Few-shot examples that include rationale (why the action was chosen) help the model generalize the decision logic to new cases rather than pattern-matching surface features. More near-identical examples add little, removing the actions destroys the demonstration, and a vague instruction is what few-shot is meant to replace."},{"id":"mockC-47","scenario":"Gaming chaining vs dynamic","stem":"A game studio runs the SAME structured code-review template on every PR — predictable steps, identical each time. For this repeatable workflow, which decomposition approach is recommended over dynamic adaptive decomposition?","domain":"PROMPT-ENG","difficulty":2,"choices":[{"label":"A","text":"Prompt chaining / a fixed pipeline, since the steps are predictable and repeatable"},{"label":"B","text":"Dynamic adaptive decomposition that regenerates the review steps fresh on each run"},{"label":"C","text":"The interview pattern, asking the team clarifying questions on every single PR review"},{"label":"D","text":"A single one-shot prompt that dumps all of the changed files in at once for review"}],"correct":"A","explanation":"Predictable, repeatable tasks like a standardized code review suit prompt chaining / a fixed pipeline; dynamic decomposition is for open-ended investigations where subtasks emerge during execution. The interview pattern is for ambiguous requirements, and a one-shot prompt over all files causes attention dilution."},{"id":"mockC-48","scenario":"False-positive trust erosion","stem":"A CI review bot flags a noisy \"missing-comment\" category that is almost always a false positive, and developers have started ignoring all of its comments, including real bugs. What is the recommended action?","domain":"PROMPT-ENG","difficulty":3,"choices":[{"label":"A","text":"Disable or tighten the noisy category so false positives stop eroding trust in the genuinely useful findings."},{"label":"B","text":"Increase the overall volume of comments the bot posts, so that the genuine bugs are never missed."},{"label":"C","text":"Add the same noisy missing-comment check to even more files so the bot behaves consistently."},{"label":"D","text":"Force tool_choice to any so that every review category, including the noisy one, always fires."}],"correct":"A","explanation":"Correct: false positives erode trust so developers ignore even valid findings; disabling or tightening the noisy category restores trust. B more comments worsens the noise. C spreading the noisy check amplifies the problem. D forcing tool use does not address the false-positive root cause."},{"id":"mockC-49","scenario":"Expense-report date and currency normalization","stem":"An expense-report extractor uses a strict JSON schema with typed fields. JSON validates every time, but downstream reconciliation breaks because 'date' arrives as '3/4/25', 'March 4 2025', or '04-03-2025', and 'amount' sometimes embeds the symbol ('$5', 'five dollars'). The structure is fine; the VALUES are inconsistent. What is the most effective fix?","domain":"PROMPT-ENG","difficulty":3,"choices":[{"label":"A","text":"Add normalization rules in the prompt: dates always ISO 8601 (YYYY-MM-DD), amounts as a numeric value plus an explicit currency code (e.g., 'five dollars' -> {amount: 5, currency: 'USD'})."},{"label":"B","text":"Add a regex 'pattern' constraint on the date field in the JSON schema and rely on it to reformat the incoming values into a single canonical shape."},{"label":"C","text":"Mark both 'date' and 'amount' as required fields in the schema so the model is forced to standardize their values before returning the object."},{"label":"D","text":"Instruct the model in the prompt to 'format the dates and the amounts properly and consistently' and trust it to converge on one format."}],"correct":"A","explanation":"Correct: A. The guide explicitly addresses this: when a strict schema still yields inconsistent VALUES, add normalization rules in the prompt (ISO 8601 dates, numeric amount + currency code, decimal fractions for percentages). This prevents semantic errors where JSON is valid but values are inconsistent. B is wrong: a schema 'pattern' can reject a malformed value but cannot reformat or convert it, so non-conforming inputs just fail rather than normalize. C confuses requiredness with formatting; required has no effect on value format. D is the vague instruction the guide warns against — 'properly' is open to interpretation."},{"id":"mockC-50","scenario":"Long contract bundle review","stem":"A reviewer agent receives a 90-page master services agreement plus 12 amendments in a single prompt and is asked to list every risky clause. It reliably surfaces issues in the first and last documents but gives thin, sometimes-missing analysis of the middle amendments. The model is fully capable on any single amendment in isolation. What is the best fix?","domain":"PROMPT-ENG","difficulty":3,"choices":[{"label":"A","text":"Use prompt chaining: a focused step analyzes each amendment on its own, then a final integration step examines cross-document interactions, avoiding attention dilution across the large input."},{"label":"B","text":"Keep everything in one prompt but instruct the model to 'pay equal attention to every document and do not skip any of the middle amendments' so coverage evens out."},{"label":"C","text":"Switch to dynamic adaptive decomposition where the model regenerates its own steps each run, since clause-risk review is inherently open-ended and unpredictable."},{"label":"D","text":"Move to a model with a much larger context window so all 90 pages and 12 amendments fit comfortably, on the assumption that fit alone restores even attention."}],"correct":"A","explanation":"Correct: A. The symptom — strong on first/last, thin in the middle of a large multi-document input — is classic attention dilution, which the guide says prompt chaining fixes by giving each document a focused step and then a dedicated cross-document integration pass. This is a predictable, repeatable task, the exact use case for chaining. B is a vague instruction that does not change the underlying dilution. C is wrong because the work is predictable and repeatable (review each document, then integrate), which the guide assigns to chaining, not dynamic decomposition. D fixes fitting, not attention — fitting was never the problem since each document already fits and is analyzed fine alone."},{"id":"mockC-51","scenario":"Product-review sentiment over-flagging","stem":"A review-moderation prompt flags reviews as 'contains profanity'. It now over-flags: reviews using mild idioms like 'this thing is a beast' or 'killer deal' get flagged even though they are positive. The category definition lists profanity correctly. Which change most directly cuts this specific false-positive pattern?","domain":"PROMPT-ENG","difficulty":4,"choices":[{"label":"A","text":"Add negative examples showing idioms such as 'a beast' and 'killer deal' explicitly labeled as NOT profanity, so the model learns to exclude this specific false-positive pattern."},{"label":"B","text":"Add negative (do-NOT-flag) examples of these specific idiomatic phrases alongside true-positive profanity examples, so the model learns the boundary that excludes this false-positive pattern."},{"label":"C","text":"Instruct the model to 'be conservative and only flag clearly obvious profanity', trusting a softer instruction to shrink the idiom-driven false positives on its own."},{"label":"D","text":"Raise the model's temperature so that its profanity judgments become less rigid and less tied to literal word matching, loosening the idiom over-flagging behavior."}],"correct":"B","explanation":"Correct: B. The guide recommends negative examples (acceptable / do-NOT-flag cases shown next to true problems) to suppress a specific false-positive pattern, mirroring the 'acceptable vs problematic code' technique. Showing the idioms as do-NOT-flag alongside genuine profanity teaches the exact boundary. A describes the same idea but only shows the negatives in isolation without contrasting true positives, so it risks the model now under-flagging real profanity; the paired contrast in B is what defines the boundary. C is the vague 'be conservative' instruction the guide flags as ineffective. D adds randomness, which makes flagging less predictable, not more accurate."},{"id":"mockC-52","scenario":"Gaming lost-in-the-middle","stem":"A game-incident report fed to Claude is very long; the critical root-cause finding sits in the middle of the document and the model keeps overlooking it. Based on position-aware input handling, what is the best mitigation?","domain":"CONTEXT-REL","difficulty":1,"choices":[{"label":"A","text":"Place the critical finding near the start (or end) of the input rather than buried in the middle"},{"label":"B","text":"Increase max_tokens so the model has more budget to read the buried middle section carefully"},{"label":"C","text":"Force tool_choice to any so the model is pushed to engage a tool on the buried middle finding"},{"label":"D","text":"Run /compact to shorten the report so the middle section is no longer buried and is read closely"}],"correct":"A","explanation":"Models reliably process information at the start and end of long inputs but can miss the middle (lost-in-the-middle); the mitigation is to place key information near the beginning or end. max_tokens governs output length, tool_choice is unrelated, and /compact summarizes history rather than repositioning key facts."},{"id":"mockC-53","scenario":"Scratchpad for long investigation","stem":"During a multi-hour investigation of a payments module, an engineer worries the context will degrade before the work is done and key discoveries (inheritance, call sites, rate limits) will be lost. What practice preserves these findings cheaply?","domain":"CONTEXT-REL","difficulty":2,"choices":[{"label":"A","text":"Write key findings to a scratchpad file the agent can consult later or in a new session instead of re-running discovery."},{"label":"B","text":"Keep every discovery in the running conversation and simply rely on the model's memory to retain the findings."},{"label":"C","text":"Re-run all of the discovery commands from scratch each time the context degrades to rebuild the findings."},{"label":"D","text":"Forward the entire raw contents of every investigated file into each subsequent prompt to retain context."}],"correct":"A","explanation":"Correct: a scratchpad file lets the agent record findings and consult them later (or in a new session) rather than re-deriving them. B conversation memory degrades and is lost across sessions. C re-running discovery wastes time and context repeatedly. D forwarding raw files defeats the purpose by reflooding the context."},{"id":"mockC-54","scenario":"Manufacturing trim tool results","stem":"An IoT agent calls get_machine_status, which returns 45 fields, but only status, last_service_date, and fault_code matter for the current task. The bloated results are filling the context window with noise. What is the cleanest fix?","domain":"CONTEXT-REL","difficulty":2,"choices":[{"label":"A","text":"A PostToolUse hook that trims the tool result to the few relevant fields before it reaches the model"},{"label":"B","text":"Instruct the model in the system prompt to simply ignore the irrelevant fields among the 45 returned"},{"label":"C","text":"Increase max_tokens so the full 45-field result comfortably fits within the model's context window"},{"label":"D","text":"Force tool_choice to any so the model engages the status tool and processes the fields more directly"}],"correct":"A","explanation":"A PostToolUse hook can keep only the relevant fields from a tool result before it reaches the model, conserving context and reducing noise. Instructing the model to ignore fields still pays the context cost, raising max_tokens doesn't shrink consumed context, and tool_choice is irrelevant."},{"id":"mockC-55","scenario":"Travel conflicting dated sources","stem":"A travel-research agent finds 'occupancy rate 68% (2022 report)' and 'occupancy rate 74% (2024 report)' and flags a contradiction in its output. Why is calling this a contradiction a mistake?","domain":"CONTEXT-REL","difficulty":2,"choices":[{"label":"A","text":"It is not a mistake; any two differing numeric values for the same metric are always a genuine contradiction"},{"label":"B","text":"Without accounting for the dates, a temporal difference is misread as a contradiction; with dates it likely reflects growth over time"},{"label":"C","text":"The agent should silently keep only the higher occupancy value and discard the lower figure from its output"},{"label":"D","text":"The agent should average the 68% and 74% readings into a single 71% occupancy figure to resolve the gap"}],"correct":"B","explanation":"Including dates prevents misinterpreting a temporal difference as a contradiction — 68% in 2022 and 74% in 2024 likely indicates growth, not conflict. Treating all differences as contradictions, silently choosing one value, or averaging all discard the temporal context that explains the gap."},{"id":"mockC-56","scenario":"Travel delegate to protect context","stem":"A travel coordinator must understand the dependencies of a sprawling pricing module that spans 15 files, but reading them all into the main context would crowd out the rest of the workflow. What is the recommended approach?","domain":"CONTEXT-REL","difficulty":2,"choices":[{"label":"A","text":"Delegate the file-reading to a subagent that returns a one-line dependency summary, keeping the main context lean"},{"label":"B","text":"Read all 15 pricing-module files directly into the main agent and just rely on a higher max_tokens budget"},{"label":"C","text":"Force tool_choice to any so the main agent reads through all 15 dependency files more quickly in one pass"},{"label":"D","text":"Read all 15 files into the main context first, then run /compact afterward to shrink them back down again"}],"correct":"A","explanation":"Delegating verbose exploration to a subagent that returns only a summary keeps the main agent's context lean — it holds one line instead of 15 files. Reading everything into the main context plus more tokens still floods the window, tool_choice doesn't protect context, and /compact after the fact already paid the cost."},{"id":"mockC-57","scenario":"Case-facts block survives summarization","stem":"An energy-billing support agent keeps losing the customer's account number and dispute amount after long conversations get summarized. What technique ensures these key facts persist regardless of how history is compressed?","domain":"CONTEXT-REL","difficulty":2,"choices":[{"label":"A","text":"Maintain a structured CASE FACTS block (account ID, amount, issue, status) and include it in every prompt regardless of summarization."},{"label":"B","text":"Disable conversation summarization entirely and simply let the context window overflow when it fills up."},{"label":"C","text":"Trust /compact to faithfully retain the account number and dispute amount through every summarization."},{"label":"D","text":"Ask the customer to repeat their account number and dispute amount again every few turns to refresh them."}],"correct":"A","explanation":"Correct: extract key facts into a structured CASE FACTS block and include it in every prompt so they survive history summarization (Ch11.1). A matches. B causes overflow, C relies on the very summarization that loses numbers, and D pushes the burden onto the user instead of persisting state."},{"id":"mockC-58","scenario":"Conflicting sources with dates","stem":"Two sources report different adoption rates for an e-commerce technology: one from 2022 and one from 2024. An agent labels them \"a contradiction.\" What is the better handling?","domain":"CONTEXT-REL","difficulty":3,"choices":[{"label":"A","text":"Preserve both values with their sources and dates and note the time difference, since the gap may reflect growth over time rather than a contradiction."},{"label":"B","text":"Pick the higher 2024 number, since adoption of a newer e-commerce technology only ever rises over time."},{"label":"C","text":"Discard both reported figures entirely because the two sources disagree and cannot both be trusted."},{"label":"D","text":"Average the 2022 and 2024 values together and report the result as one single blended adoption figure."}],"correct":"A","explanation":"Correct: including dates prevents misreading temporal differences as contradictions; preserve both with attribution and explanation. B assumes a trend without evidence and discards a data point. C discarding loses valid information. D averaging across different years produces a meaningless figure."},{"id":"mockC-59","scenario":"Manufacturing progressive summarization","stem":"An IoT support session is summarized repeatedly to save space. A later step reports the fault threshold as 'around a couple hundred RPM' when earlier it was the exact value 220 RPM. What is happening and what guards against it?","domain":"CONTEXT-REL","difficulty":3,"choices":[{"label":"A","text":"Progressive summarization degrades exact numbers/dates into vague terms; keep precise facts in a structured facts block included every prompt"},{"label":"B","text":"The model simply hit its max_tokens limit during that step; raising the output token limit restores 220 RPM"},{"label":"C","text":"The tool_choice setting was configured incorrectly, which is what corrupted the exact 220 RPM threshold value"},{"label":"D","text":"The fault threshold was always an approximate figure, so 'a couple hundred RPM' was never actually a regression"}],"correct":"A","explanation":"Progressive summarization tends to lose numeric values, percentages, and dates, turning them vague ('around', 'a couple'); preserving exact facts in a structured CASE FACTS block included in every prompt guards against this. max_tokens and tool_choice are unrelated, and the value was originally precise (220 RPM), not approximate."},{"id":"mockC-60","scenario":"Overnight multi-agent compliance pipeline that crashed","stem":"An overnight compliance pipeline runs three agents in sequence (data-pull, rule-check, report-synthesis). The host crashed after data-pull completed and rule-check was mid-run. On restart, the team wants to resume without redoing finished work. Which design enables clean crash recovery?","domain":"CONTEXT-REL","difficulty":4,"choices":[{"label":"A","text":"Wrap the entire pipeline in an outer retry that simply re-runs all three agents from the very beginning whenever any crash is detected, accepting the redone work."},{"label":"B","text":"Keep the full pipeline state solely in the conversation context, so the model can recall how far each step progressed when it is later prompted to continue from there."},{"label":"C","text":"Run the three agents concurrently rather than in sequence, so that a crash in any one of them does not block or interrupt the progress of the other two agents."},{"label":"D","text":"Have each agent persist its state to a known JSON file and a coordinator manifest tracking each step as not_started / in_progress / completed, so resume reloads the manifest and restarts only the unfinished step."}],"correct":"D","explanation":"Correct: D — structured state persistence (per-agent state JSON + coordinator manifest) lets the coordinator load the manifest on resume and restart only the step that was in_progress, skipping completed work (Ch11.6). A re-runs completed steps, wasting the data-pull work and money. B is fragile: context is exactly what is lost on a crash or new session, so it cannot be the durable record of progress. C ignores the stated sequential dependency (rule-check needs data-pull's output) and does nothing to record what already finished."}]},{"id":"mock-d","title":"Mock Exam D","code":"CLAUDE-ARCH-MOCK-D","certification":"Claude Certified Architect - Foundations","tag":"Fixed mock · Set D","sheet":"SHEET D","description":"A fixed, curated 60-question paper. A third independent set for exam-day stamina and repeated timed practice.","durationMinutes":120,"passingScore":72,"totalQuestions":60,"sampling":null,"domains":{"AGENT-ARCH":{"name":"Agentic Architecture & Orchestration","color":"#3B5FC0"},"TOOL-MCP":{"name":"Tool Design & MCP Integration","color":"#0F7A6C"},"CODE-CONFIG":{"name":"Claude Code Configuration & Workflows","color":"#7B52C9"},"PROMPT-ENG":{"name":"Prompt Engineering & Structured Output","color":"#9E5509"},"CONTEXT-REL":{"name":"Context Management & Reliability","color":"#B4426B"}},"questions":[{"id":"mockD-1","scenario":"Streaming catalog summary truncation","stem":"A media-streaming platform uses Claude to generate episode synopses. QA reports that some synopses end abruptly mid-sentence. You inspect the responses and find stop_reason is \"max_tokens\". What is the correct interpretation and fix?","domain":"AGENT-ARCH","difficulty":1,"choices":[{"label":"A","text":"The model finished normally and chose to end early; the abrupt cutoff is a content-quality issue, so revise the prompt wording instead"},{"label":"B","text":"A configured stop sequence matched the synopsis text mid-stream and halted generation; remove the stop sequences so output can finish cleanly"},{"label":"C","text":"The response was truncated at the token limit; increase max_tokens (or shorten requested output)"},{"label":"D","text":"The model paused to request a tool and is waiting on you; execute the pending tool call and return its result so generation resumes"}],"correct":"C","explanation":"stop_reason \"max_tokens\" means the token limit was reached and the response is truncated, so raise max_tokens or ask for shorter output. It is not normal completion (end_turn), not a stop sequence, and not a tool_use signal."},{"id":"mockD-2","scenario":"Lease summary truncated","stem":"A property-management platform summarizes long lease agreements. For one 40-page lease, the response comes back cut off in the middle of a sentence, and the API response shows stop_reason \"max_tokens\". The legal team insists no content should be silently dropped. What is the most accurate interpretation and immediate fix?","domain":"AGENT-ARCH","difficulty":1,"choices":[{"label":"A","text":"The model judged parts of the lease unimportant and stopped early; rephrase the system prompt to emphasize completeness so it covers everything"},{"label":"B","text":"A stop sequence matched the lease text mid-output and cut it off; remove every stop sequence from the request so nothing is dropped silently"},{"label":"C","text":"The output was truncated because the token limit was reached; increase max_tokens (or chunk the lease)."},{"label":"D","text":"The model finished its turn normally at end_turn; treat the partial summary as the final deliverable and forward it to the legal team as-is"}],"correct":"C","explanation":"Correct: stop_reason \"max_tokens\" means the token limit was reached and the response is truncated; you raise max_tokens or split the input (Ch1.3). C matches the table. A misattributes intent, B confuses it with stop_sequence, and D confuses it with end_turn (a normal finish)."},{"id":"mockD-3","scenario":"E-commerce subagent context","stem":"An e-commerce coordinator delegates \"analyze this return request\" to a subagent via the Task tool. The subagent reports it cannot find the order details that the coordinator already retrieved. What is the root cause?","domain":"AGENT-ARCH","difficulty":2,"choices":[{"label":"A","text":"The subagent has isolated context and does not inherit the coordinator's history; the order details were not explicitly passed in the Task prompt."},{"label":"B","text":"The subagent was granted too few entries in allowed_tools, so it lacks a tool capable of reading the order details the coordinator already retrieved."},{"label":"C","text":"The coordinator should have launched the Task with fork_session so the subagent branches from and inherits the coordinator's prior conversation memory."},{"label":"D","text":"Subagents do share memory across Task calls, but that shared state expired before this run; raise the session timeout so retrieved details persist."}],"correct":"A","explanation":"Correct: subagents have isolated context and do not automatically inherit the coordinator's conversation; all required data must be passed explicitly in the Task prompt. B misattributes a context problem to tool scoping. C fork_session is a CLI session-branching concept, not how Task subagents receive data. D subagents do not share memory across calls."},{"id":"mockD-4","scenario":"Least-privilege claims agent","stem":"A healthcare claims subagent only needs to read patient eligibility and look up claim status; it should never be able to approve payouts. When writing its AgentDefinition, what is the correct way to enforce this?","domain":"AGENT-ARCH","difficulty":2,"choices":[{"label":"A","text":"List only the read tools in allowed_tools (e.g., get_eligibility, lookup_claim) and omit approve_payout, following least privilege."},{"label":"B","text":"Include approve_payout in allowed_tools for completeness, but add a firm system-prompt rule instructing the subagent to never invoke it under any circumstances."},{"label":"C","text":"Grant the subagent the full tool set for flexibility, then register a PostToolUse hook that automatically reverses any approve_payout call after it runs."},{"label":"D","text":"Set tool_choice to auto and let the model self-select which tools are appropriate, so it naturally declines to approve payouts it was not meant to use."}],"correct":"A","explanation":"Correct: allowed_tools enforces least privilege; omitting approve_payout makes the capability unavailable. B leaves the dangerous tool reachable, relying on probabilistic restraint. C is over-engineering and undo may be impossible. D tool_choice governs selection among available tools, not which tools exist for the agent."},{"id":"mockD-5","scenario":"Transient API failure recovery","stem":"Within a fintech subagent, a downstream orders API returns a 503. The error is categorized transient/retryable. What is the recommended behavior inside the subagent before involving the coordinator?","domain":"AGENT-ARCH","difficulty":2,"choices":[{"label":"A","text":"Attempt 1-2 local retries with exponential backoff, then propagate a structured error to the coordinator if still failing."},{"label":"B","text":"Skip local retries entirely and immediately escalate the 503 to a human operator, since a transient API fault still warrants direct human attention."},{"label":"C","text":"Loop retries indefinitely inside the subagent with backoff until the orders API recovers, so the coordinator never has to handle the failure at all."},{"label":"D","text":"Abort the whole workflow on the first 503 and discard every partial result gathered so far, then restart the entire task cleanly from the beginning."}],"correct":"A","explanation":"Correct: transient errors get bounded local recovery (1-2 retries with backoff), then propagation upward. B skips reasonable local recovery for a retryable error. C unbounded retries cause latency and waste. D aborting loses partial results, an anti-pattern."},{"id":"mockD-6","scenario":"Travel coordinator subagent context","stem":"A travel-booking company runs a coordinator agent that handles complex multi-city itineraries by delegating to specialized subagents (flights, hotels, car rentals). A new engineer assumes each subagent can read the coordinator's earlier conversation about the traveler's budget and dates. The hotel subagent keeps booking rooms outside the stated budget. What is the root cause?","domain":"AGENT-ARCH","difficulty":2,"choices":[{"label":"A","text":"Subagents have isolated context and do not inherit the coordinator's history; the budget and dates must be passed explicitly in each subagent prompt"},{"label":"B","text":"The subagents do share the coordinator's memory, but the coordinator accidentally overwrote the budget variable mid-run, so hotels read a stale value"},{"label":"C","text":"Subagents only inherit the coordinator's context when run sequentially; running flights, hotels, and cars in parallel is what severed the budget data"},{"label":"D","text":"The hotel subagent's max_tokens is set too low to load the coordinator's full earlier conversation, so the budget and dates get truncated on read"}],"correct":"A","explanation":"Subagents have isolated context and do not automatically inherit the coordinator's conversation; all required context (budget, dates) must be explicitly passed in the subagent prompt. They do not share memory, sequential execution does not grant inheritance, and max_tokens is unrelated to context inheritance."},{"id":"mockD-7","scenario":"Streaming date normalization across tools","stem":"A media-analytics agent aggregates view counts from three internal MCP tools. One returns Unix timestamps, another returns 'Mar 5, 2025', and a third returns ISO 8601. Downstream the model frequently miscompares release dates. You want every tool result reaching the model to carry a single consistent date format, without editing each upstream tool. Which mechanism fits?","domain":"AGENT-ARCH","difficulty":2,"choices":[{"label":"A","text":"A PostToolUse hook that normalizes all date fields to ISO 8601 before the result reaches the model"},{"label":"B","text":"A PreToolUse hook that inspects each call and rejects any tool whose result would contain non-ISO date strings before they reach the model"},{"label":"C","text":"A system-prompt instruction telling the model to always assume tool results are ISO 8601 and to interpret every date field accordingly"},{"label":"D","text":"Increase max_tokens so the model has enough headroom to reason about and reconcile all three differing date formats on its own each turn"}],"correct":"A","explanation":"PostToolUse intercepts a tool result before it is given to the model — the right place to normalize date formats from heterogeneous tools. PreToolUse acts before execution (it can't normalize the result), a prompt instruction won't fix inconsistent inputs deterministically, and max_tokens is irrelevant."},{"id":"mockD-8","scenario":"Manufacturing subagent error propagation","stem":"In an IoT predictive-maintenance pipeline, a sensor-data subagent times out fetching telemetry. It currently returns the string 'data unavailable' to the coordinator. The coordinator can't decide whether to retry, narrow the query, or proceed without that sensor. What structured information should the subagent return instead?","domain":"AGENT-ARCH","difficulty":2,"choices":[{"label":"A","text":"A failure_type, the attempted_query, any partial_results, suggested alternative_approaches, and the coverage_impact"},{"label":"B","text":"Just a boolean success flag set to false, so the coordinator can branch on the failure without parsing any additional telemetry-specific detail"},{"label":"C","text":"An empty result set, treating the fetch timeout identically to a successful query that legitimately returned 'no telemetry data found' for the sensor"},{"label":"D","text":"A retry counter reporting how many internal retries the subagent already attempted, so the coordinator knows the timeout was not a first attempt"}],"correct":"A","explanation":"A structured subagent error gives the coordinator failure_type, attempted_query, partial_results, alternative_approaches, and coverage_impact so it can decide how to recover. A bare boolean or retry counter lacks recovery information, and returning an empty set conflates 'search failure' with 'no results' — a silent-suppression anti-pattern."},{"id":"mockD-9","scenario":"Streaming pipeline observability","stem":"A streaming company's multi-agent content-moderation system lets subagents call each other directly to speed things up. Operations now struggles to trace which subagent made which decision when a wrongful takedown occurs. Which architectural principle was violated?","domain":"AGENT-ARCH","difficulty":2,"choices":[{"label":"A","text":"All communication should flow through the coordinator (hub-and-spoke) for observability and error control"},{"label":"B","text":"Subagents should always be invoked in parallel; running the moderation subagents one after another is what destroyed the decision trace"},{"label":"C","text":"Subagents should inherit the coordinator's full conversation context so each one can see every prior takedown decision the others made"},{"label":"D","text":"The coordinator should never validate subagent results; letting peers cross-check each other directly is what enables proper traceability"}],"correct":"A","explanation":"In hub-and-spoke topology all communication flows through the coordinator, which provides observability and centralized error control; direct subagent-to-subagent calls undermine that. Parallelism, context inheritance, and skipping validation are not the issue here — the missing trace path is."},{"id":"mockD-10","scenario":"Insurance coordinator aggregate validate","stem":"An insurance coordinator delegates document checks to three subagents and immediately concatenates their raw outputs into the final claim decision without checking them. A subagent that partially failed contributes a misleading 'no issues found'. Which coordinator responsibility was skipped?","domain":"AGENT-ARCH","difficulty":2,"choices":[{"label":"A","text":"Aggregating and validating subagent results before using them"},{"label":"B","text":"Spawning the document-check subagents concurrently in parallel"},{"label":"C","text":"Passing each subagent its own isolated context window"},{"label":"D","text":"Configuring an appropriate allowed_tools list on every subagent"}],"correct":"A","explanation":"The coordinator is responsible for aggregating AND validating subagent results, not blindly concatenating them — validation would catch a partial failure masquerading as success. Parallel spawning, isolated context, and allowed_tools are real responsibilities but none is the skipped validation step here."},{"id":"mockD-11","scenario":"Pharma research synthesis truncation","stem":"A pharmacovigilance agent is generating a long adverse-event summary in one response. The API returns stop_reason=max_tokens mid-sentence and the team's harness, seeing no end_turn, treats the partial text as the final answer and ships it. Clinicians receive truncated summaries. What is the correct handling of stop_reason=max_tokens here?","domain":"AGENT-ARCH","difficulty":3,"choices":[{"label":"A","text":"Recognize the response was truncated and continue generation with a higher token budget; do not treat truncated output as complete"},{"label":"B","text":"Treat stop_reason=max_tokens identically to end_turn, since in both cases the model has stopped producing further output and the turn is over"},{"label":"C","text":"Reconfigure the harness to detect a sentinel closing phrase such as 'End of report' and treat its presence as the true signal of a complete answer"},{"label":"D","text":"Resend the identical request unchanged, assuming the truncation was a transient generation glitch that will resolve on a clean second attempt"}],"correct":"A","explanation":"Correct: stop_reason=max_tokens means the response is truncated due to the token limit; the right action is to continue and/or raise the budget, and never treat truncated output as the finished answer. B conflates two distinct stop reasons; max_tokens is not a completion signal, only end_turn is. C reintroduces the text-parsing anti-pattern for completion detection, which is unreliable, and the model never reached the closing phrase anyway because it was cut off. D retries the same too-small budget, so it will truncate again at the same point; the fix is more budget/continuation, not a blind retry."},{"id":"mockD-12","scenario":"Banking onboarding ambiguous customer","stem":"A bank onboarding agent is asked to update an address. Its customer lookup returns two records that both match the name and partial phone on file. The agent's prompt says 'resolve issues efficiently.' Under pressure to keep handle-times low, what should it do?","domain":"AGENT-ARCH","difficulty":3,"choices":[{"label":"A","text":"Pick the more recently active of the two records, since recent activity makes it the statistically more likely intended customer match here"},{"label":"B","text":"Request an additional identifier to disambiguate rather than guessing; do not act on either record until the match is unique"},{"label":"C","text":"Update the address on both matching records to be safe, ensuring the correct customer is covered regardless of which record is the real one"},{"label":"D","text":"Escalate to a human immediately, because any record ambiguity at all falls entirely outside the agent's permitted scope of autonomous action"}],"correct":"B","explanation":"Correct: multiple matches when searching for a customer is a clear trigger to ask for additional identifiers, not to guess. The agent should disambiguate before acting. A guesses based on recency, exactly the behavior the rule forbids, and risks editing the wrong person's account. C compounds the error by mutating both records, including a non-matching customer's data. D over-escalates: the guide's prescribed action for multiple matches is to request more identifiers; escalation is reserved for cases the agent genuinely cannot resolve, and asking for one more identifier is a normal, resolvable step."},{"id":"mockD-13","scenario":"Travel-tech partial failure synthesis","stem":"A trip-planning coordinator builds an itinerary from three subagents: flights (succeeded), hotels (succeeded), and local-events (timed out after local retries). The current implementation aborts the whole itinerary because one subagent failed, returning nothing to the user. What is the correct behavior?","domain":"AGENT-ARCH","difficulty":3,"choices":[{"label":"A","text":"Abort the build and return an error to the user, because delivering an itinerary missing its events section could mislead the traveler about coverage"},{"label":"B","text":"Continue and deliver the itinerary with flights and hotels, explicitly annotating that the local-events section has partial/no coverage due to a timeout"},{"label":"C","text":"Silently omit the events section from the response so the returned itinerary appears fully complete and the user never notices the timeout occurred"},{"label":"D","text":"Have the coordinator keep retrying the local-events subagent indefinitely until it finally succeeds, returning nothing to the user until then"}],"correct":"B","explanation":"Correct: aborting the whole workflow on one failure is an anti-pattern that throws away usable partial results; the right move is to continue with partial results and annotate the coverage gap (e.g., 'PARTIAL COVERAGE - events subagent timeout'). A is that abort anti-pattern; the successful flights/hotels work is wasted. C is silent suppression, which hides the gap and misleads the user into thinking events were considered. D pushes the infinite-retry problem up to the coordinator, blocking the entire response on one section that already exhausted reasonable local recovery."},{"id":"mockD-14","scenario":"Fintech escalation handoff completeness","stem":"A wealth-management agent escalates a disputed wire to a human after offering and being refused a standard reversal. It hands off only: customer name and 'customer is upset.' The human operator, who has no access to the conversation transcript, has to phone the client back to gather basics. What was the core failure in the handoff?","domain":"AGENT-ARCH","difficulty":3,"choices":[{"label":"A","text":"The agent escalated far too early in the dispute; before involving a human it should have attempted several additional reversal options to resolve the wire itself"},{"label":"B","text":"The structured handoff was incomplete; it must be self-contained, including IDs, issue summary, root cause, actions taken, amounts, and recommended action, because the human sees only the summary"},{"label":"C","text":"The agent escalated on the wrong trigger; instead of acting on the refused reversal it should have computed the customer's sentiment score and escalated on that signal"},{"label":"D","text":"The agent should have invoked fork_session during the handoff so the human operator inherited a fully branched copy of the entire conversation context and transcript"}],"correct":"B","explanation":"Correct: on escalation the human operator does not see the transcript, only the summary, so the handoff must be complete and self-contained: customer/order IDs, issue summary, root cause, actions taken, amounts, escalation reason, and recommended action. The thin handoff forced re-gathering. A misreads timing; offering and being refused the standard reversal is a legitimate escalation point. C reintroduces sentiment as a trigger, which is unreliable and not the issue; the escalation itself was justified. D misapplies fork_session, a session-branching mechanism, to a human-handoff problem; the fix is a structured summary, not a session fork."},{"id":"mockD-15","scenario":"Compliance agent permission vs transient","stem":"A compliance-screening agent calls a sanctions-list subagent. On one request the subagent returns 'access denied' from the upstream provider because the API key lost its entitlement. The coordinator's generic handler retries with exponential backoff several times, all failing, then proceeds without the screening result. Why is this handling wrong?","domain":"AGENT-ARCH","difficulty":3,"choices":[{"label":"A","text":"The handler gave up too soon; it should have retried the access-denied error many more times with progressively longer exponential backoff before proceeding without the screening result"},{"label":"B","text":"A permission/access-denied error is non-retryable and should be escalated, not retried; and proceeding without the screening silently drops a required result instead of surfacing the failure"},{"label":"C","text":"Access denied is really a validation error from a malformed request; the coordinator should reformat the request payload and retry it rather than escalating the failure to a human"},{"label":"D","text":"An access-denied response yields an empty screening result, and an empty screen is equivalent to a clean one, so proceeding without the sanctions check is perfectly acceptable here"}],"correct":"B","explanation":"Correct: access-denied is a permission error, which is non-retryable and the prescribed action is escalation; retrying with backoff wastes time and never fixes an entitlement problem. Compounding this, proceeding without the result silently drops a required screening (suppression). A doubles down on retrying a fundamentally non-retryable category. C miscategorizes it as a validation error; no request reformatting restores a revoked entitlement. D is the empty-result-equals-success fallacy; a failed screen is not a clean screen, and treating it as such is a serious compliance gap."},{"id":"mockD-16","scenario":"Manufacturing PO approval ordering","stem":"A procurement agent must run a budget-availability check before it can submit any purchase order, per finance controls audited by regulators. The team relies on a system-prompt instruction to 'always check budget first.' Occasionally the agent submits the PO before the budget check, and a few over-budget orders slipped through. What is the most reliable way to enforce the ordering?","domain":"AGENT-ARCH","difficulty":4,"choices":[{"label":"A","text":"Add a PreToolUse hook that blocks the submit_po tool unless a successful budget check has already occurred in the workflow"},{"label":"B","text":"Reorder the steps in the system prompt so budget-check is listed first, and add strong emphasis instructing the model to always verify budget before submitting the PO"},{"label":"C","text":"Add a PostToolUse hook on submit_po that detects any submitted order exceeding budget and automatically cancels it shortly after the submission has gone through"},{"label":"D","text":"Lower max_tokens so the model has less room to reason ahead and skip straight to submission, forcing it to perform the budget check before it runs out of budget"}],"correct":"A","explanation":"Correct: enforcing a required ordering for an audited financial control needs a deterministic mechanism. A PreToolUse hook can block submit_po until the prerequisite budget check has succeeded, guaranteeing the policy 100%. B is a probabilistic prompt fix; it is exactly what already failed occasionally. C acts after the over-budget PO is already submitted, and PostToolUse intercepts results rather than blocking actions; cancellation may be too late and still creates an audit event. D is unrelated; token budget doesn't govern action ordering and could truncate legitimate work."},{"id":"mockD-17","scenario":"Hospitality forced extraction tool","stem":"A hotel feedback pipeline must, on every guest comment, return structured fields (rating, topic, urgency) — never a free-text reply. You have a single extract_feedback tool. Which tool_choice guarantees the model emits a tool call rather than prose?","domain":"TOOL-MCP","difficulty":1,"choices":[{"label":"A","text":"{\"type\": \"auto\"}"},{"label":"B","text":"{\"type\": \"any\"}"},{"label":"C","text":"No tool_choice set"},{"label":"D","text":"{\"type\": \"none\"}"}],"correct":"B","explanation":"tool_choice {\"type\": \"any\"} forces the model to call some tool, guaranteeing structured output. \"auto\" lets the model answer in text, omitting it defaults to auto behavior, and there is no described mechanism that both forbids tools and yields structured output here."},{"id":"mockD-18","scenario":"Forced first step in extraction","stem":"A contract-intake pipeline must ALWAYS run extract_metadata (parties, dates, jurisdiction) as the very first tool call before any enrichment tool runs. Which tool_choice setting guarantees that specific first action?","domain":"TOOL-MCP","difficulty":1,"choices":[{"label":"A","text":"{\"type\": \"auto\"}, letting the model pick first"},{"label":"B","text":"{\"type\": \"any\"}, forcing some tool first"},{"label":"C","text":"{\"type\": \"tool\", \"name\": \"extract_metadata\"}"},{"label":"D","text":"Omit tool_choice; rely on prompt ordering"}],"correct":"C","explanation":"Correct: forced tool selection ({\"type\":\"tool\",\"name\":...}) makes the model call that specific tool, used to guarantee a first step / execution order (Ch2.3). C matches. A lets the model choose freely, B forces some tool but not that one, and D is only a probabilistic prompt nudge."},{"id":"mockD-19","scenario":"Forced first step","stem":"An e-commerce enrichment pipeline must always run extract_metadata as the guaranteed first action before any enrichment tool. Which tool_choice configuration achieves a guaranteed first step?","domain":"TOOL-MCP","difficulty":2,"choices":[{"label":"A","text":"tool_choice forced to extract_metadata on the first turn."},{"label":"B","text":"tool_choice set to auto, hoping it begins with metadata first"},{"label":"C","text":"tool_choice set to any, guaranteeing only that some tool runs"},{"label":"D","text":"Remove every other tool from the schema permanently"}],"correct":"A","explanation":"Correct: forced selection of a specific tool guarantees a particular first action / execution order. B auto gives no guarantee. C any guarantees a tool but not which one. D removing other tools would break the rest of the pipeline that needs them later."},{"id":"mockD-20","scenario":"Nullable optional fields","stem":"A retail returns extractor must capture an optional gift_message that is frequently absent. With a strict schema, the model keeps inventing plausible-sounding messages when none exist. What schema design prevents this fabrication?","domain":"TOOL-MCP","difficulty":2,"choices":[{"label":"A","text":"Make gift_message nullable (type [\"string\", \"null\"]) and keep it out of required, so the model returns null when absent."},{"label":"B","text":"Mark gift_message as required so the model always emits a value, which forces it to populate the field reliably on every response."},{"label":"C","text":"Add an enum of the most common gift messages and have the model select the closest matching one whenever a message seems present."},{"label":"D","text":"Remove the gift_message field from the schema entirely and instead ask the model to mention any gift message inline within prose output."}],"correct":"A","explanation":"Correct: nullable, non-required fields let the model honestly return null rather than hallucinate. B required fields push the model to fabricate when data is missing. C an enum of canned messages forces a wrong specific value. D dropping the field loses the data and abandons structured output."},{"id":"mockD-21","scenario":"Resource vs tool for schema","stem":"A developer-tools agent repeatedly issues exploratory calls just to learn the database schema before doing real work, wasting calls and context. The MCP server can expose the schema. What is the cleanest way to provide it?","domain":"TOOL-MCP","difficulty":2,"choices":[{"label":"A","text":"Expose the database schema as an MCP Resource the agent reads for context, eliminating exploratory tool calls."},{"label":"B","text":"Add a get_schema tool and require the agent to call it on every single turn, so the schema is always freshly loaded before any real work begins."},{"label":"C","text":"Hardcode the entire database schema directly into the system prompt for every session permanently, so the agent always has it available up front."},{"label":"D","text":"Leave the exploratory behavior in place; the schema-discovery calls are individually cheap enough that the wasted calls and context can be ignored."}],"correct":"A","explanation":"Correct: Resources are read-only context (like schemas) that give an immediate map and remove the need for exploratory calls. B a per-turn tool call is wasteful and is still an action, not passive context. C hardcoding into the prompt bloats every session and drifts as the schema changes. D ignoring the waste does not solve the problem."},{"id":"mockD-22","scenario":"Gaming JSON schema guarantee","stem":"A game-telemetry team uses tool_use with a strict JSON schema to extract match stats. A reviewer claims this guarantees the extracted numbers are correct. What does the JSON schema actually guarantee?","domain":"TOOL-MCP","difficulty":2,"choices":[{"label":"A","text":"Both syntactic validity and full semantic correctness of every extracted value, since the schema constrains types"},{"label":"B","text":"Syntactically valid JSON with required fields present, but not that the values are semantically correct"},{"label":"C","text":"Only that the serialized response stays shorter than the configured max_tokens limit for the request"},{"label":"D","text":"That the model will never emit null for any field defined anywhere in the strict JSON schema"}],"correct":"B","explanation":"tool_use with a JSON schema guarantees syntactically valid JSON and enforced structure (required fields present) but does NOT guarantee semantic correctness — values can still be wrong. It says nothing about token length, and nullable fields can legitimately return null."},{"id":"mockD-23","scenario":"Manufacturing MCP isError","stem":"An IoT MCP server wraps a legacy maintenance API. When the API is down, the server returns a normal-looking content payload with empty fields and HTTP 200. The agent treats the empty payload as 'no maintenance records found' and skips servicing. How should the MCP tool signal the failure?","domain":"TOOL-MCP","difficulty":2,"choices":[{"label":"A","text":"Return isError: true with a structured error (category, retryable, message, attempted query)"},{"label":"B","text":"Return an empty array as the result, which the agent will correctly interpret as an upstream failure rather than as a genuine absence of records"},{"label":"C","text":"Return isError: true together with a plain content string reading 'Operation failed', which is enough for the agent to know the call did not succeed"},{"label":"D","text":"Log the underlying error only on the server side and still return HTTP 200 to the agent, keeping the failure detail out of the tool result payload"}],"correct":"A","explanation":"MCP failures should set isError: true with a structured error so the agent can distinguish failure from 'no results' and decide how to recover. An empty array is the silent-suppression anti-pattern, a generic 'Operation failed' string gives the agent nothing to act on, and logging-only hides the failure entirely."},{"id":"mockD-24","scenario":"A data-analytics subagent only ever needs to read one curated quarterly report PDF, but it currently holds a general fetch_url tool. Security review flags that fetch_url lets the subagent retrieve arbitrary internet URLs, far beyond its job.","stem":"Which change best applies least-privilege without breaking the subagent's task?","domain":"TOOL-MCP","difficulty":3,"choices":[{"label":"A","text":"Keep the broad fetch_url tool in place but add a system-prompt instruction directing the subagent to only ever fetch the one approved report URL"},{"label":"B","text":"Replace fetch_url with a capability-narrowed tool such as load_document that can only retrieve the approved report"},{"label":"C","text":"Leave fetch_url fully available to the subagent but log every invocation so any out-of-scope fetch can be caught and reviewed during a later audit"},{"label":"D","text":"Add a dozen more specialized fetch tools alongside fetch_url so the subagent has finer-grained choices and naturally gravitates to the right one"}],"correct":"B","explanation":"Correct: B. Least-privilege is achieved by replacing a general tool with a constrained alternative (the guide's fetch_url to load_document example) so the capability itself is narrowed, not just discouraged. A relies on prompt obedience while the dangerous capability remains, an attacker or model error can still reach arbitrary URLs. C only observes misuse after the fact and does not reduce the granted capability. D expands the toolset, worsening selection reliability and still leaving broad fetch ability available."},{"id":"mockD-25","scenario":"Two engineers on a fintech team configure the same community GitHub MCP server differently. One adds it so the whole team gets it on checkout and the token is supplied per-developer without committing secrets; the other is just experimenting privately with an unstable build and does not want to affect teammates.","stem":"Which configuration split is correct?","domain":"TOOL-MCP","difficulty":3,"choices":[{"label":"A","text":"Shared server in project .mcp.json (committed, token via ${GITHUB_TOKEN}); experimental server in user ~/.claude.json"},{"label":"B","text":"Shared server in user ~/.claude.json so each developer controls it individually; experimental server committed in the project's .mcp.json for the whole team"},{"label":"C","text":"Both the shared and experimental servers in the project .mcp.json, with the experimental one disabled via an inline comment so it stays off by default"},{"label":"D","text":"Shared server in .mcp.json with the raw GITHUB_TOKEN value committed directly, so onboarding a new developer takes only a single clone-and-go step"}],"correct":"A","explanation":"Correct: A. Project .mcp.json is version-controlled and meant for team-wide servers, with secrets injected via env-var substitution like ${GITHUB_TOKEN}; personal/experimental servers belong in the user-scoped ~/.claude.json. B inverts the scopes, putting the team server where it is not shared and the unstable experiment where it would be forced on everyone. C still commits the experimental server (and .mcp.json is JSON, which has no comments). D commits a real secret to version control, the exact practice env-var substitution exists to prevent."},{"id":"mockD-26","scenario":"A media-monitoring agent has two tools with near-identical descriptions: analyze_content ('Analyzes content and returns insights') and analyze_document ('Analyzes a document and returns insights'). The model routes randomly between them, and one is actually a web-results extractor while the other parses uploaded PDFs.","stem":"What is the best remedy for the misrouting?","domain":"TOOL-MCP","difficulty":3,"choices":[{"label":"A","text":"Keep both overlapping tool names as they are but set tool_choice:any, so the model is at least forced to commit to one of the two on every turn"},{"label":"B","text":"Rename and rewrite to remove overlap, e.g. extract_web_results (search snippets) vs parse_uploaded_pdf, each with distinct inputs/outputs and when-to-use guidance"},{"label":"C","text":"Merge the two tools into a single analyze tool that takes a source_type flag, letting the model pick web or pdf handling through one parameter instead"},{"label":"D","text":"Lower the sampling temperature so the model stops choosing randomly between the two confusingly similar tools and settles on a consistent pick"}],"correct":"B","explanation":"Correct: B. The description is the primary selection mechanism; overlapping/near-identical descriptions cause confusion, and the prescribed fix is to rename to eliminate functional overlap (analyze_content to extract_web_results) and give each a distinct input/output contract and applicability boundary. A only forces a choice between two still-indistinguishable tools, so random routing continues. C collapses two genuinely different capabilities into one general tool, the opposite of the recommended split into specialized tools. D misdiagnoses the cause: the routing is random because the descriptions are indistinguishable, not because of sampling temperature."},{"id":"mockD-27","scenario":"A customer-ops agent was given 18 tools spanning billing, shipping, identity, and analytics. QA finds it increasingly calls the wrong tool (e.g., using an analytics export tool when asked to issue a refund) and occasionally answers in text when a tool call was required.","stem":"Which combination of changes most directly improves reliability?","domain":"TOOL-MCP","difficulty":4,"choices":[{"label":"A","text":"Keep all 18 tools on the single agent but write much longer, more detailed descriptions for each one so the model can disambiguate them more reliably"},{"label":"B","text":"Split the work across role-scoped subagents (4-5 relevant tools each plus limited shared utilities), and use tool_choice:any where a tool call is mandatory"},{"label":"C","text":"Force tool_choice to a single fixed tool for the entire agent, removing selection ambiguity by never letting the model choose among the others at all"},{"label":"D","text":"Keep all 18 tools on one agent and raise the model size, relying on the larger model's capacity to compensate for the difficult tool-selection problem"}],"correct":"B","explanation":"Correct: B. Too many tools per agent reduces selection reliability and agents with out-of-specialization tools misuse them; scoping each subagent to its role-relevant 4-5 tools (plus a few shared utilities) fixes misrouting, and tool_choice:any guarantees a tool call instead of a text answer where one is required. A leaves the agent overloaded with 18 tools, the root cause, and better prose alone will not overcome the overload. C is too rigid: a single forced tool cannot serve a multi-intent ops workload. D treats symptom with brute force and ignores that the documented cause is toolset size and scope, not raw capability."},{"id":"mockD-28","scenario":"Streaming modular imports","stem":"A streaming platform's root CLAUDE.md has grown huge. The team wants to split out coding-style and API conventions into separate files and reference them so each is maintained independently. Which CLAUDE.md feature does this?","domain":"CODE-CONFIG","difficulty":1,"choices":[{"label":"A","text":"The @path import syntax, e.g. @./standards/coding-style.md"},{"label":"B","text":"The /compact command, which shrinks the oversized file"},{"label":"C","text":"A paths: glob declared in the YAML frontmatter section"},{"label":"D","text":"The -p headless flag, which loads each of the split-up files"}],"correct":"A","explanation":"CLAUDE.md can reference external files with @path (no space after @), making configuration modular and avoiding duplication. /compact compresses context, paths: globs belong to .claude/rules, and -p is the headless CLI flag."},{"id":"mockD-29","scenario":"Travel direct execution fit","stem":"A travel-app engineer has a single-file bug with a clear stack trace pointing to one null-check that's missing in date-parsing logic. Which Claude Code mode is most appropriate?","domain":"CODE-CONFIG","difficulty":1,"choices":[{"label":"A","text":"Direct execution — a single-file, well-understood fix with a clear stack trace"},{"label":"B","text":"Planning mode, since every code change should first go through an approved plan"},{"label":"C","text":"Headless -p mode emitting the fix as structured output against a JSON schema"},{"label":"D","text":"fork_session, to branch the session and try two competing fixes side by side"}],"correct":"A","explanation":"Direct execution suits single-file fixes with a clear stack trace and unambiguous changes — planning mode would be overkill. Headless mode is for CI automation, and fork_session is for comparing approaches, which isn't needed for one obvious fix."},{"id":"mockD-30","scenario":"memory command persistence","stem":"An HR engineer repeatedly re-explains the same project conventions and frequently used commands at the start of every Claude Code session. Which built-in command lets her save these once so they persist and auto-load in future sessions?","domain":"CODE-CONFIG","difficulty":1,"choices":[{"label":"A","text":"/compact, which condenses the session and saves the conventions so they reload automatically next time."},{"label":"B","text":"/memory, which opens CLAUDE.md for editing so notes persist across sessions and load on startup."},{"label":"C","text":"--resume, which reopens the prior session and carries its conventions and commands forward into new ones."},{"label":"D","text":"-p headless mode, which writes the conventions to disk so every later session auto-loads them on startup."}],"correct":"B","explanation":"Correct: /memory opens CLAUDE.md for editing, letting you save conventions/preferences that persist across sessions and load automatically on startup (Ch5.8). B matches. /compact compresses current context, --resume reopens one prior session, and -p is headless mode, none of which persist conventions across all sessions."},{"id":"mockD-31","scenario":"Rules for scattered tests","stem":"A healthcare codebase has test files scattered across dozens of directories. The team wants test-specific conventions applied only when Claude edits a test file, regardless of where it lives, without loading those rules the rest of the time. Which approach fits best?","domain":"CODE-CONFIG","difficulty":2,"choices":[{"label":"A","text":"A .claude/rules/ file with paths: [\"**/*.test.ts\", \"**/*.test.tsx\"] frontmatter so it loads only when a matching test file is edited."},{"label":"B","text":"A directory-level CLAUDE.md placed in every directory that happens to contain test files, so the conventions load whenever those folders are touched."},{"label":"C","text":"Put all the test conventions in the root CLAUDE.md so they are always loaded, guaranteeing they apply whenever Claude edits any test file anywhere."},{"label":"D","text":"Expose the test conventions as an MCP Resource the agent reads, so the rules are available on demand only while it is working on test files."}],"correct":"A","explanation":"Correct: .claude/rules/ with a paths glob applies conventions by file type across many directories and loads only on matching edits, saving context. B per-directory CLAUDE.md is impractical for scattered files. C root CLAUDE.md always loads, wasting context on non-test work. D a Resource is read-only MCP context, not a conditional Claude Code rule."},{"id":"mockD-32","scenario":"Skill tool restriction","stem":"A documentation-generation skill should be able to Read, Grep, and Glob the repo but must never be able to delete or modify files. Which SKILL.md frontmatter parameter enforces this?","domain":"CODE-CONFIG","difficulty":2,"choices":[{"label":"A","text":"allowed-tools: [\"Read\", \"Grep\", \"Glob\"], which restricts the skill to those tools only."},{"label":"B","text":"context: fork, which runs the skill in an isolated branch and by itself blocks any file modification or deletion."},{"label":"C","text":"argument-hint, which validates the skill's arguments and rejects any destructive argument before the skill runs."},{"label":"D","text":"A clearly worded system-prompt sentence instructing the skill to never delete or modify files under any condition."}],"correct":"A","explanation":"Correct: allowed-tools scopes which tools the skill may use, so omitting write/delete tools makes them unavailable. B context: fork isolates context but does not restrict tools. C argument-hint is unrelated to capabilities. D a prompt instruction is probabilistic, not an enforced restriction."},{"id":"mockD-33","scenario":"Compact precision loss","s
