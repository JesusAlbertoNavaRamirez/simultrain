cenario":"Support ticket categorizer","stem":"A ticket-triage tool classifies incoming messages into category with enum [\"bug\",\"feature\",\"docs\"]. Analysts report that genuinely novel requests (e.g., a billing dispute) are being forced into 'bug' or 'feature', silently corrupting the analytics. You want to capture these out-of-category cases without losing the original meaning. What is the best schema change?","domain":"TOOL-MCP","difficulty":2,"choices":[{"label":"A","text":"Remove the enum constraint from category entirely so the model is free to write any descriptive free-form string that fits the ticket."},{"label":"B","text":"Add an 'other' value to the enum plus a nullable category_detail string describing what 'other' means for that ticket."},{"label":"C","text":"Add many more specific enum values such as 'billing', 'legal', and 'security', expanding the list until essentially every conceivable ticket fits."},{"label":"D","text":"Set tool_choice to {\"type\":\"tool\",\"name\":\"classify\"} so the classifier tool always runs and never skips categorizing an incoming ticket."}],"correct":"B","explanation":"Adding an 'other' enum value together with a detail string is the documented way to avoid losing data that falls outside predefined categories while keeping the enum usable. Removing the enum sacrifices the structured, analyzable categories. Endlessly enumerating new categories cannot anticipate every future case and bloats the schema. Forcing the tool to run does not address how unexpected categories are represented."},{"id":"authored-TOOL-7","scenario":"MCP orders tool returns isError","stem":"An internal MCP server exposes a get_order tool. During an outage the agent receives a response with isError: true. A junior engineer argues this means the order does not exist and the agent should tell the user 'no such order.' What does isError: true actually signal, and how should the agent treat it?","domain":"TOOL-MCP","difficulty":2,"choices":[{"label":"A","text":"It confirms the requested order simply was not found in the backend, so the correct behavior is to tell the user 'no such order' and move on without retrying anything."},{"label":"B","text":"It signals that the tool call itself failed; the agent must inspect the error and decide on recovery (retry, change the query, or escalate) rather than treat it as a valid empty result."},{"label":"C","text":"It means the MCP server is fundamentally misconfigured, so the agent should immediately stop the entire session and surface a fatal configuration error to the operator."},{"label":"D","text":"It is purely informational logging emitted by the server, so the agent can safely ignore the flag and proceed as though the get_order call had returned successfully."}],"correct":"B","explanation":"isError: true signals that the call failed, and the agent must decide on recovery based on the error content; it is explicitly different from a valid empty result (no matches). Treating a failed call as 'order not found' confuses an access/transient failure with a genuine empty result. The flag does not imply the whole session must abort, nor that it can be ignored."},{"id":"authored-TOOL-8","scenario":"Designing MCP error payloads","stem":"Your team owns an MCP server whose tools currently return {\"isError\": true, \"content\": \"Operation failed\"} for every failure. A consuming agent cannot tell transient timeouts apart from invalid-input rejections, so it either retries forever or gives up immediately. What is the best redesign of the error response?","domain":"TOOL-MCP","difficulty":3,"choices":[{"label":"A","text":"Keep returning the same generic 'Operation failed' string, but add a line to the tool description noting that failures can happen so the agent is at least aware of the risk."},{"label":"B","text":"Return a structured error with fields like errorCategory, isRetryable, a human-readable message, the attempted_query, and any partial_results so the agent can make an intelligent recovery decision."},{"label":"C","text":"Always set isRetryable: true on every failure so the consuming agent never gives up prematurely on what might still turn out to be a recoverable error condition."},{"label":"D","text":"Drop the isError flag altogether and instead throw a raw exception on any failure, letting it crash the agent loop so the problem is impossible to miss."}],"correct":"B","explanation":"A structured error carrying errorCategory, isRetryable, a message, the attempted query, and partial results gives the agent the information it needs to decide whether to retry, change the query, or escalate. The generic 'Operation failed' string is the named anti-pattern and a description note does not fix the payload. Hardcoding isRetryable: true would cause infinite retries on non-retryable validation or business errors. Crashing the loop removes the agent's ability to recover at all."},{"id":"authored-TOOL-9","scenario":"Exposing a data catalog over MCP","stem":"An analytics agent connects to an MCP server backed by a large data warehouse. The agent wastes many turns making exploratory tool calls just to discover which tables and columns exist before it can write a useful query. You want to give it an immediate 'map' of the available schema. As the MCP server author, what is the most appropriate way to expose the table/column catalog?","domain":"TOOL-MCP","difficulty":3,"choices":[{"label":"A","text":"Add a new action Tool called run_schema_dump that the agent is expected to invoke at the very start of every task to fetch the current table and column catalog."},{"label":"B","text":"Wrap the table and column catalog inside an MCP Prompt template that the agent is required to invoke before it can begin composing any warehouse query."},{"label":"C","text":"Expose the schema catalog as an MCP Resource (read-only reference context); since resources provide an immediate map, the agent no longer needs exploratory discovery tool calls."},{"label":"D","text":"Paste the entire warehouse schema directly into the system prompt for every single request so the table and column map is always present in context."}],"correct":"C","explanation":"Read-only reference context such as a database schema or data catalog belongs as an MCP Resource, which the agent reads to get an immediate map and thereby avoids exploratory tool calls. A discovery action Tool (run_schema_dump) reintroduces the very round-trips you are trying to eliminate. An MCP Prompt is a predefined prompt template, not a mechanism for exposing readable reference data. Embedding the full schema in every system prompt is wasteful and static rather than fetched on demand."},{"id":"authored-TOOL-10","scenario":"Sharing an MCP server with the team","stem":"A developer added a Jira MCP server to ~/.claude.json so Claude Code could create tickets. It works on her machine, but teammates who pull the repo do not get the integration and have to reconfigure it manually. The team wants every contributor to share the same Jira MCP configuration through version control. Where should the server be configured?","domain":"TOOL-MCP","difficulty":2,"choices":[{"label":"A","text":"In the project-level .mcp.json at the repo root, which is checked into version control and available to all contributors."},{"label":"B","text":"In each teammate's personal ~/.claude.json, copied around by hand so that every contributor ends up with a matching Jira server entry."},{"label":"C","text":"In CLAUDE.md, documenting the exact server command so that contributors can read it and paste the configuration in whenever they need the integration."},{"label":"D","text":"In a shared cloud secret manager that Claude Code is configured to read from on startup so the Jira server appears for everyone automatically."}],"correct":"A","explanation":"Project-level .mcp.json lives at the repo root, is managed in version control, and is available to all project contributors, which is exactly the team-sharing requirement. ~/.claude.json is for personal/experimental servers and is not shared. CLAUDE.md is documentation, not an MCP server configuration mechanism. A cloud secret manager handles secrets, not the server definition itself."},{"id":"authored-TOOL-11","scenario":"Handling a GitHub token in MCP config","stem":"While adding a GitHub MCP server to the project .mcp.json, an engineer pastes the literal personal access token into the env block and also notes it in CLAUDE.md 'so the team remembers it.' A reviewer flags this. What is the correct way to handle the token?","domain":"TOOL-MCP","difficulty":2,"choices":[{"label":"A","text":"Reference the secret via environment-variable substitution, e.g. \"GITHUB_TOKEN\": \"${GITHUB_TOKEN}\", and never hardcode the token or place it in CLAUDE.md."},{"label":"B","text":"Keep the literal personal access token inside .mcp.json as-is, but add that file to .gitignore so the credential is never committed to version control."},{"label":"C","text":"Move the literal token out of .mcp.json and instead store it only in CLAUDE.md, since the whole team already reads that file regularly and will find it there."},{"label":"D","text":"Encode the personal access token in base64 before placing it in .mcp.json so that it is not directly human-readable when someone opens the file."}],"correct":"A","explanation":"The documented practice is environment-variable substitution like ${GITHUB_TOKEN} so the token itself is never committed and never hardcoded, while .mcp.json stays in version control. Gitignoring .mcp.json defeats the goal of sharing the config with the team. Moving the secret into CLAUDE.md still commits a plaintext credential. Base64 is encoding, not encryption, and provides no real protection."},{"id":"authored-TOOL-12","scenario":"Overloaded single agent","stem":"A single 'do-everything' support agent has been given 18 tools spanning order lookups, refunds, shipping, CRM updates, knowledge-base search, and internal admin actions. Its tool-selection accuracy has dropped noticeably: it picks the wrong tool, and occasionally fires admin actions during routine questions. What is the most effective structural fix?","domain":"TOOL-MCP","difficulty":2,"choices":[{"label":"A","text":"Add detailed usage examples to all 18 tool descriptions and hope the richer wording is enough to lift selection accuracy back up across the board."},{"label":"B","text":"Split the tools across specialized subagents so each agent holds only the ~4-5 tools relevant to its role, following least privilege."},{"label":"C","text":"Set tool_choice to {\"type\":\"any\"} so the agent is forced to commit to one of the 18 tools faster instead of hesitating between similar options."},{"label":"D","text":"Increase the model size so the larger model can reliably reason over all 18 tools at once and stop firing admin actions during routine questions."}],"correct":"B","explanation":"Too many tools per agent (e.g., 18 vs 4-5) reduces selection reliability, and agents holding tools outside their specialization tend to misuse them; the remedy is to scope each subagent to only its role-relevant tools (least privilege). Better descriptions help at the margin but do not address the overload itself. {\"type\":\"any\"} only forces a tool call, not the right one, and could even worsen misfires. A bigger model does not fix a tool-allocation problem."},{"id":"authored-TOOL-13","scenario":"Agent ignores the MCP search tool","stem":"Your team built an MCP tool, search_internal_kb, that searches a proprietary, access-controlled knowledge base the built-in Grep tool cannot reach. In practice the coding agent keeps using built-in Grep instead, missing the internal KB entirely. The MCP tool's current description simply reads 'Searches for text.' What should you do?","domain":"TOOL-MCP","difficulty":3,"choices":[{"label":"A","text":"Remove the built-in Grep tool from the agent's toolset entirely so that only search_internal_kb remains and the model has no fallback to misuse."},{"label":"B","text":"Rename search_internal_kb to grep_internal so the model mentally groups it with Grep and reaches for it the same way it reaches for the built-in search."},{"label":"C","text":"Strengthen the MCP tool's description to highlight its unique advantage (it searches the proprietary, access-controlled KB that Grep cannot see) rather than removing the built-in tool."},{"label":"D","text":"Force tool_choice to {\"type\":\"tool\",\"name\":\"search_internal_kb\"} on every turn so the built-in Grep tool is never even selectable by the model."}],"correct":"C","explanation":"Agents tend to prefer built-in tools over similar MCP tools, and the documented remedy is to strengthen the MCP tool's description to emphasize the unique data or context built-in tools cannot provide, not to remove the built-in tool. Removing Grep cripples legitimate local-file search. Renaming to mimic Grep increases confusion through overlap instead of distinguishing the tools. Forcing the MCP tool on every turn would misroute ordinary file searches that genuinely belong to Grep."},{"id":"example-Q4","scenario":"Code Generation with Claude Code","stem":"You need a custom `/review` command for standard code review that is available to the whole team when they clone the repository. Where should you create the command file?","domain":"CODE-CONFIG","difficulty":1,"choices":[{"label":"A","text":"`.claude/commands/` in the project repository"},{"label":"B","text":"`~/.claude/commands/` in each dev's home"},{"label":"C","text":"In the root project-level `CLAUDE.md`"},{"label":"D","text":"In a `.claude/config.json` commands list"}],"correct":"A","explanation":"Project commands stored in `.claude/commands/` are version-controlled and automatically available to everyone. B is for personal commands. C is for instructions, not command definitions. D does not exist."},{"id":"example-Q5","scenario":"Code Generation with Claude Code","stem":"You need to restructure a monolith into microservices (dozens of files, service-boundary decisions). What approach should you use?","domain":"CODE-CONFIG","difficulty":1,"choices":[{"label":"A","text":"Planning mode: explore the codebase, understand dependencies, design an approach"},{"label":"B","text":"Direct execution, incrementally file by file"},{"label":"C","text":"Direct execution with detailed up-front specs"},{"label":"D","text":"Direct execution, plan once it gets hard"}],"correct":"A","explanation":"Planning mode is designed for large changes, multiple possible approaches, and architectural decisions. B risks expensive rework. C assumes you already know the structure. D is reactive."},{"id":"example-Q6","scenario":"Code Generation with Claude Code","stem":"A codebase has different conventions across areas (React, API, database). Tests are co-located with code. You want conventions to be applied automatically. What approach should you use?","domain":"CODE-CONFIG","difficulty":2,"choices":[{"label":"A","text":"`.claude/rules/` files with YAML frontmatter and glob patterns"},{"label":"B","text":"Put every area's convention in the root CLAUDE.md"},{"label":"C","text":"Use Skills under `.claude/skills/` for each area"},{"label":"D","text":"Place a CLAUDE.md in every project subdirectory"}],"correct":"A","explanation":"`.claude/rules/` with glob patterns (e.g., `**/*.test.tsx`) enables automatic convention application based on file paths—ideal for tests spread across the codebase. B relies on model inference. C is manual/on-demand. D does not work well when relevant files are in many directories."},{"id":"example-Q10","scenario":"Claude Code for CI","stem":"A pipeline runs `claude \"Analyze this pull request for security issues\"`, but hangs waiting for interactive input. What is the correct approach?","domain":"CODE-CONFIG","difficulty":1,"choices":[{"label":"A","text":"Use the `-p` flag: `claude -p \"Analyze this pull request for security issues\"`"},{"label":"B","text":"Set `CLAUDE_HEADLESS=true` in the environment first"},{"label":"C","text":"Redirect stdin from `/dev/null` to skip the prompt"},{"label":"D","text":"Pass a `--batch` flag to run it non-interactively"}],"correct":"A","explanation":"`-p` (or `--print`) is the documented way to run Claude Code in non-interactive mode. It processes the prompt, prints to stdout, and exits. The other options are either non-existent features or Unix workarounds."},{"id":"practice-Q16","scenario":"Claude Code for Continuous Integration","stem":"Your CI pipeline runs the Claude Code CLI (in `--print` mode) using CLAUDE.md to provide project context for code review, and developers generally find the reviews substantive. However, they report that integrating findings into the workflow is difficult—Claude outputs narrative paragraphs that must be manually copied into PR comments. The team wants to automatically post each finding as a separate inline PR comment at the relevant place in code, which requires structured data with file path, line number, severity level, and suggested fix. Which approach is most effective?","domain":"CODE-CONFIG","difficulty":2,"choices":[{"label":"A","text":"Add an 'Output Format for Review' section to CLAUDE.md with worked examples of structured findings so Claude learns the file/line/severity format from project context."},{"label":"B","text":"Use the CLI flags `--output-format json` and `--json-schema` to enforce structured findings, then parse the output to post inline comments via the GitHub API."},{"label":"C","text":"Put explicit formatting instructions in the review prompt requiring every finding to follow a parseable template such as `[FILE:path] [LINE:n] [SEVERITY:level] ...` for the parser."},{"label":"D","text":"Keep the existing narrative review format but add a second Claude summarization step that converts the prose findings into a structured JSON summary for posting."}],"correct":"B","explanation":"Using `--output-format json` with `--json-schema` enforces structured output at the CLI level, guaranteeing well-formed JSON with the required fields (file path, line number, severity, suggested fix) that can be reliably parsed and posted as inline PR comments via the GitHub API. It leverages built-in CLI capabilities designed specifically for structured output."},{"id":"practice-Q17","scenario":"Claude Code for Continuous Integration","stem":"Your team uses Claude Code for generating code suggestions, but you notice a pattern: non-obvious issues—performance optimizations that break edge cases, cleanups that unexpectedly change behavior—are only caught when another team member reviews the PR. Claude’s reasoning during generation shows it considered these cases but concluded its approach was correct. Which approach directly addresses the root cause of this self-check limitation?","domain":"CODE-CONFIG","difficulty":3,"choices":[{"label":"A","text":"Run a second independent instance of Claude Code to review the changes without access to the generator’s reasoning."},{"label":"B","text":"Enable extended thinking mode during the generation stage so Claude deliberates more thoroughly over the edge cases before it commits to producing its suggestions."},{"label":"C","text":"Add explicit self-review instructions to the generation prompt asking Claude to critique and stress-test its own suggestions for edge cases before finalizing the output."},{"label":"D","text":"Include the full test files and related documentation in the generation prompt so Claude has enough context to understand the expected behavior up front."}],"correct":"A","explanation":"A second independent Claude Code instance without access to the generator’s reasoning directly addresses the root cause by avoiding confirmation bias. This “fresh eyes” perspective mirrors human peer review, where another reviewer catches issues the author rationalized."},{"id":"practice-Q26","scenario":"Claude Code for Continuous Integration","stem":"Your pipeline script runs `claude \"Analyze this pull request for security issues\"`, but the job hangs indefinitely. Logs show Claude Code is waiting for interactive input. What is the correct approach to run Claude Code in an automated pipeline?","domain":"CODE-CONFIG","difficulty":1,"choices":[{"label":"A","text":"Add a `--batch` flag: `claude --batch \"Analyze this pull request for security issues\"`."},{"label":"B","text":"Add the `-p` flag: `claude -p \"Analyze this pull request for security issues\"`."},{"label":"C","text":"Redirect stdin from `/dev/null`: `claude \"Analyze this pull request for security issues\" < /dev/null`."},{"label":"D","text":"Export an environment variable, `CLAUDE_HEADLESS=true`, before invoking the command in the pipeline."}],"correct":"B","explanation":"The `-p` (or `--print`) flag is the documented way to run Claude Code non-interactively. It processes the prompt, prints the result to stdout, and exits without waiting for user input—ideal for CI/CD pipelines."},{"id":"practice-Q32","scenario":"Code Generation with Claude Code","stem":"You need to add Slack as a new notification channel. The existing codebase has clear, established patterns for email, SMS, and push channels. However, Slack’s API offers fundamentally different integration approaches—incoming webhooks (simple, one-way), bot tokens (support delivery confirmation and programmatic control), or Slack Apps (two-way events, requires workspace approval). Your task says “add Slack support” without specifying integration method or requiring advanced features like delivery tracking. How should you approach this task?","domain":"CODE-CONFIG","difficulty":2,"choices":[{"label":"A","text":"Start directly in execution mode using incoming webhooks, matching the existing one-way email, SMS, and push notification pattern already established in the codebase."},{"label":"B","text":"Switch to planning mode to explore integration options and architectural implications, then present a recommendation before implementation."},{"label":"C","text":"Start in direct execution mode by scaffolding a Slack channel class against the existing patterns, deferring the actual integration-method decision until later."},{"label":"D","text":"Start in direct execution mode building on a bot-token approach up front so that delivery-confirmation support is guaranteed to be available if it is needed later."}],"correct":"B","explanation":"Slack integration has multiple valid approaches with significantly different architectural implications, and requirements are ambiguous. Planning mode lets you evaluate trade-offs among webhooks, bot tokens, and Slack Apps and align on an approach before implementation."},{"id":"practice-Q33","scenario":"Code Generation with Claude Code","stem":"Your CLAUDE.md file has grown to 400+ lines containing coding standards, testing conventions, a detailed PR review checklist, deployment instructions, and database migration procedures. You want Claude to always follow coding standards and testing conventions, but apply PR review, deploy, and migration guidance only when doing those tasks. Which restructuring approach is most effective?","domain":"CODE-CONFIG","difficulty":3,"choices":[{"label":"A","text":"Move all guidance out into separate Skills files organized by workflow type, leaving only a short one-paragraph project description behind in CLAUDE.md itself."},{"label":"B","text":"Keep everything inside CLAUDE.md but use `@import` syntax to break it into separately maintained category files that are pulled back in on every load."},{"label":"C","text":"Split CLAUDE.md into files under `.claude/rules/` with path-bound glob patterns so each chunk of guidance loads only for its relevant file types."},{"label":"D","text":"Keep universal standards in CLAUDE.md and create Skills for workflow-specific guidance (PR review, deploy, migrations) with trigger keywords."}],"correct":"D","explanation":"CLAUDE.md content loads in every session, ensuring coding standards and testing conventions always apply, while Skills are invoked on demand when Claude detects trigger keywords—ideal for workflow-specific guidance like PR review, deployment, and migrations."},{"id":"practice-Q34","scenario":"Code Generation with Claude Code","stem":"You’re tasked with restructuring your team’s monolithic application into microservices. This impacts changes across dozens of files and requires decisions about service boundaries and module dependencies. Which approach should you choose?","domain":"CODE-CONFIG","difficulty":1,"choices":[{"label":"A","text":"Switch to planning mode to explore the codebase, understand dependencies, and design the implementation approach before making changes."},{"label":"B","text":"Start in direct execution mode and switch over to planning only after you actually hit unexpected complexity partway through implementing the service split."},{"label":"C","text":"Start in direct execution mode and make small incremental changes, letting the natural service boundaries reveal themselves as the implementation progresses."},{"label":"D","text":"Use direct execution mode driven by detailed upfront instructions that specify the exact structure of each microservice before any code is written."}],"correct":"A","explanation":"Planning mode is the right strategy for complex architectural restructuring like splitting a monolith: it allows safe exploration and informed decisions about boundaries before committing to potentially expensive changes across many files."},{"id":"practice-Q35","scenario":"Code Generation with Claude Code","stem":"Your team created a `/analyze-codebase` skill that performs deep code analysis—dependency scanning, test coverage counts, and code quality metrics. After running the command, team members report Claude becomes less responsive in the session and loses the context of the original task. How do you most effectively fix this while keeping full analysis capabilities?","domain":"CODE-CONFIG","difficulty":2,"choices":[{"label":"A","text":"Add `context: fork` in the skill frontmatter to run the analysis in an isolated subagent context."},{"label":"B","text":"Add `model: haiku` in the skill frontmatter so a faster, cheaper model runs the heavy analysis and frees up the session."},{"label":"C","text":"Split the one skill into three smaller skills, each performing a narrower slice of the analysis so each produces less output."},{"label":"D","text":"Add instructions to the skill telling it to compress all of its analysis results into a short summary before it displays anything."}],"correct":"A","explanation":"`context: fork` runs the analysis in an isolated subagent context so the large output does not pollute the main session’s context window and Claude does not lose track of the original task. It preserves full analysis capability while keeping the main session responsive."},{"id":"practice-Q36","scenario":"Code Generation with Claude Code","stem":"Your team uses a `/commit` skill in `.claude/skills/commit/SKILL.md`. A developer wants to customize it for their personal workflow (different commit message format, extra checks) without affecting teammates. What do you recommend?","domain":"CODE-CONFIG","difficulty":2,"choices":[{"label":"A","text":"Create a personal version under `~/.claude/skills/` with a different name, e.g., `/my-commit`."},{"label":"B","text":"Add conditional logic keyed on the developer's username inside the shared project skill's frontmatter so it behaves differently per person."},{"label":"C","text":"Create a personal copy at `~/.claude/skills/commit/SKILL.md` using the same `/commit` name so it shadows the team version locally."},{"label":"D","text":"Set `override: true` in the personal skill's frontmatter so Claude Code prioritizes it ahead of the shared project version of `/commit`."}],"correct":"A","explanation":"Project skills take precedence over personal skills with the same name. To keep a personalized variant available alongside the team’s skill, the developer should create a differently named skill (e.g., `/my-commit`) in their personal `~/.claude/skills/` directory."},{"id":"practice-Q37","scenario":"Code Generation with Claude Code","stem":"Your team has used Claude Code for months. Recently, three developers report Claude follows the guidance “always include comprehensive error handling,” but a fourth developer who just joined says Claude does not follow it. All four work in the same repo and have up-to-date code. What is the most likely cause and fix?","domain":"CODE-CONFIG","difficulty":2,"choices":[{"label":"A","text":"The guidance lives in the original developers’ user-level `~/.claude/CLAUDE.md` files, not in the project `.claude/CLAUDE.md`. Move the instruction to the project-level file so all team members receive it."},{"label":"B","text":"The new developer's own `~/.claude/CLAUDE.md` contains conflicting instructions that are overriding the project settings for them; they should locate and delete that conflicting section so the rule applies."},{"label":"C","text":"Claude Code gradually learns each user's preferences over the course of working together, so the new developer simply needs to repeat the error-handling requirement until Claude 'remembers' it for them."},{"label":"D","text":"Claude Code caches CLAUDE.md after the first read, so the original developers are silently running an old cached copy; everyone on the team should clear the Claude Code cache to resynchronize the guidance."}],"correct":"A","explanation":"If the guidance was added only to the original developers’ user-level configs and not to the project-level `.claude/CLAUDE.md`, new team members won’t receive it. Moving it to the project-level configuration ensures all current and future team members automatically get the guidance."},{"id":"practice-Q38","scenario":"Code Generation with Claude Code","stem":"You find that including 2–3 full endpoint implementation examples as context significantly improves consistency when generating new API endpoints. However, this context is useful only when creating new endpoints—not when debugging, reviewing code, or other work in the API directory. Which configuration approach is most effective?","domain":"CODE-CONFIG","difficulty":3,"choices":[{"label":"A","text":"Add the endpoint examples and pattern documentation directly to the project CLAUDE.md so the full context is always loaded and available on every task."},{"label":"B","text":"Manually reference the endpoint examples in each generation request by copying the relevant implementation code straight into the prompt every time."},{"label":"C","text":"Configure path-specific rules under `.claude/rules/api/` that embed the endpoint examples and activate automatically whenever you work in the API directory."},{"label":"D","text":"Create a skill that references the endpoint examples and contains pattern-following instructions, invoked on demand via a slash command."}],"correct":"D","explanation":"A skill invoked on demand loads the example context only when generating new endpoints, not during unrelated tasks like debugging or review. This keeps the main context clean while preserving high-quality generation when needed."},{"id":"practice-Q39","scenario":"Code Generation with Claude Code","stem":"Your team created a `/migration` skill that generates database migration files. It takes the migration name via `$ARGUMENTS`. In production you observe three issues: (1) developers often run the skill without arguments, causing poorly named files, (2) the skill sometimes uses database schema details from unrelated prior conversations, and (3) a developer accidentally ran destructive test cleanup when the skill had broad tool access. Which configuration approach fixes all three problems?","domain":"CODE-CONFIG","difficulty":3,"choices":[{"label":"A","text":"Use positional parameters `$1` and `$2` instead of `$ARGUMENTS` to force specific inputs, reference the schema files explicitly with `@` syntax for context control, and warn about destructive ops."},{"label":"B","text":"Add `argument-hint` in frontmatter to request required parameters, use `context: fork` to isolate execution, and restrict `allowed-tools` to file-write operations."},{"label":"C","text":"Split into separate `/migration-create` and `/migration-apply` skills, add validation that requests the migration name when missing, and give each one different `allowed-tools` scopes."},{"label":"D","text":"Add validation in SKILL.md that `$ARGUMENTS` is a well-formed name, prompt the model to ignore prior conversation context, and list the destructive operations it must avoid running."}],"correct":"B","explanation":"This uses three separate configuration features to address each problem: `argument-hint` improves argument entry and reduces missing arguments, `context: fork` prevents context leakage from prior conversations, and `allowed-tools` constrains the skill to safe file-writing operations, preventing destructive actions."},{"id":"practice-Q40","scenario":"Code Generation with Claude Code","stem":"Your codebase contains areas with different coding conventions: React components use functional style with hooks, API handlers use async/await with specific error handling, and database models follow the repository pattern. Test files are distributed across the codebase next to the code under test (e.g., `Button.test.tsx` next to `Button.tsx`), and you want all tests to follow the same conventions regardless of location. What is the most supported way to ensure Claude automatically applies the correct conventions when generating code?","domain":"CODE-CONFIG","difficulty":2,"choices":[{"label":"A","text":"Put all of the conventions in the root CLAUDE.md under separate headings per area and rely on Claude to infer which section applies to the file it is editing."},{"label":"B","text":"Create one skill per code type under `.claude/skills/`, embedding the React, API, and repository-pattern conventions inside each SKILL.md for the model to invoke."},{"label":"C","text":"Place a separate CLAUDE.md file inside each subdirectory holding the conventions specific to the code that lives in that area of the tree."},{"label":"D","text":"Create rule files under `.claude/rules/` with YAML frontmatter specifying glob patterns to conditionally apply conventions based on file paths."}],"correct":"D","explanation":"`.claude/rules/` files with YAML frontmatter and glob patterns (e.g., `**/*.test.tsx`, `src/api/**/*.ts`) enable deterministic, path-based convention application regardless of directory structure. This is the most supported approach for cross-cutting patterns like distributed test files."},{"id":"practice-Q41","scenario":"Code Generation with Claude Code","stem":"You want to create a custom slash command `/review` that runs your team’s standard code review checklist. It should be available to every developer when they clone or update the repository. Where should you create the command file?","domain":"CODE-CONFIG","difficulty":1,"choices":[{"label":"A","text":"In each developer's `~/.claude/commands/` home directory"},{"label":"B","text":"In the project repository under `.claude/commands/`."},{"label":"C","text":"In `.claude/config.json` as a commands array"},{"label":"D","text":"In the root project `CLAUDE.md` file instead"}],"correct":"B","explanation":"Putting custom slash commands under `.claude/commands/` inside the project repository ensures they are version-controlled and automatically available to every developer who clones or updates the repo. This is the intended location for project-level custom commands in Claude Code."},{"id":"practice-Q42","scenario":"Code Generation with Claude Code","stem":"Your team’s CLAUDE.md grew beyond 500 lines mixing TypeScript conventions, testing guidance, API patterns, and deployment procedures. Developers find it hard to locate and update the right sections. What approach does Claude Code support to organize project-level instructions into focused topical modules?","domain":"CODE-CONFIG","difficulty":1,"choices":[{"label":"A","text":"Define a `.claude/config.yaml` that maps file patterns to specific labeled sections kept inside the single large CLAUDE.md."},{"label":"B","text":"Create separate Markdown files in `.claude/rules/`, each covering one topic (e.g., `testing.md`, `api-conventions.md`)."},{"label":"C","text":"Split the instructions into README.md files placed in the relevant subdirectories, which Claude then loads automatically as guidance."},{"label":"D","text":"Create multiple CLAUDE.md files at different levels of the directory tree, each one overriding the instructions inherited from its parent."}],"correct":"B","explanation":"Claude Code supports a `.claude/rules/` directory where you can create separate Markdown files for topical guidance (e.g., `testing.md`, `api-conventions.md`), allowing teams to organize large instruction sets into focused, maintainable modules."},{"id":"practice-Q43","scenario":"Code Generation with Claude Code","stem":"You create a custom skill `/explore-alternatives` that your team uses to brainstorm and evaluate implementation approaches before choosing one. Developers report that after running the skill, subsequent Claude responses are influenced by the alternatives discussion—sometimes referencing rejected approaches or retaining exploration context that interferes with actual implementation. How should you most effectively configure this skill?","domain":"CODE-CONFIG","difficulty":2,"choices":[{"label":"A","text":"Use a `!` bash-subprocess prefix in the skill body"},{"label":"B","text":"Add `context: fork` in the skill frontmatter."},{"label":"C","text":"Split into `/explore-start` and `/explore-end` skills"},{"label":"D","text":"Move the skill into `~/.claude/skills/` instead"}],"correct":"B","explanation":"`context: fork` runs the skill in an isolated subagent context so exploration discussions do not pollute the main conversation history. This prevents rejected approaches and brainstorming context from influencing subsequent implementation work."},{"id":"authored-CODE-1","scenario":"Code Generation with Claude Code","stem":"You are 90 minutes into a large migration in Claude Code. The context window is nearly full of verbose tool output, and you need to keep going. Earlier in the session Claude read several exact values you must not lose: a pinned dependency version, a migration batch size, and a count of affected files. You are about to run /compact to free up context. What should you do to avoid losing these details?","domain":"CODE-CONFIG","difficulty":2,"choices":[{"label":"A","text":"Just run /compact directly without any preparation, since the command is guaranteed to preserve every exact value and only strips out redundant phrasing from the transcript."},{"label":"B","text":"Record the exact values to a persistent note (e.g., via /memory in CLAUDE.md or a scratchpad file) before running /compact, because summarization can drop precise numbers and dates."},{"label":"C","text":"Increase max_tokens on the requests instead of compacting at all, so the larger budget means summarization never has to run and no precise values can be lost."},{"label":"D","text":"Switch mid-session to a model with a much larger context window so that /compact becomes entirely unnecessary and the exact pinned values simply stay in context."}],"correct":"B","explanation":"/compact summarizes prior history to reclaim context, and the known risk is that exact numeric values, dates, and specific details can be lost in summarization—so the right move is to persist those critical facts outside the summarized history first (via /memory/CLAUDE.md or a scratchpad). A is wrong because /compact is lossy for precise values. C and D treat the symptom (context pressure) without protecting the specific values and ignore that long sessions will still need compaction."},{"id":"practice-Q20","scenario":"Claude Code for Continuous Integration","stem":"Your automated reviews find real issues, but developers report the feedback is not actionable. Findings include phrases like “complex ticket routing logic” or “potential null pointer” without specifying what exactly to change. When you add detailed instructions like “always include concrete fix suggestions,” the model still produces inconsistent output—sometimes detailed, sometimes vague. Which prompting technique most reliably produces consistently actionable feedback? Which prompting technique is most reliable?","domain":"PROMPT-ENG","difficulty":2,"choices":[{"label":"A","text":"Further refine the instructions with more explicit requirements spelling out each part of the feedback format: location, issue, severity, and proposed fix."},{"label":"B","text":"Expand the context window to pull in more of the surrounding codebase so the model has enough information to propose concrete, specific fixes."},{"label":"C","text":"Use a two-pass approach where one prompt identifies the issues and a second prompt generates the fixes, letting each stage specialize."},{"label":"D","text":"Add 3–4 few-shot examples showing the exact required format: identified issue, location in code, concrete fix suggestion."}],"correct":"D","explanation":"Few-shot examples are the most effective technique for achieving consistent output format when instructions alone produce variable results. Providing 3–4 examples that show the exact desired structure (issue, location, concrete fix) gives the model a concrete pattern to follow, which is more reliable than abstract instructions."},{"id":"practice-Q22","scenario":"Claude Code for Continuous Integration","stem":"Your automated review analyzes comments and docstrings. The current prompt instructs Claude to “check that comments are accurate and up to date.” Findings often flag acceptable patterns (TODO markers, simple descriptions) while missing comments describing behavior the code no longer implements. What change addresses the root cause of this inconsistent analysis?","domain":"PROMPT-ENG","difficulty":2,"choices":[{"label":"A","text":"Include `git blame` data in the prompt so Claude can spot comments that predate recent code changes and flag those as likely stale."},{"label":"B","text":"Add few-shot examples of misleading comments so the model learns to recognize and flag similar outdated-comment patterns in the codebase."},{"label":"C","text":"Filter out TODO, FIXME, and plain descriptive comment patterns before analysis so the model only sees the comments worth scrutinizing."},{"label":"D","text":"Specify explicit criteria: flag comments only when the behavior they claim contradicts the code’s actual behavior."}],"correct":"D","explanation":"Explicit criteria—flagging comments only when claimed behavior contradicts actual code behavior—directly addresses the root cause by replacing a vague instruction with a precise definition of what constitutes a problem. This reduces false positives on acceptable patterns and misses of truly misleading comments."},{"id":"practice-Q27","scenario":"Claude Code for Continuous Integration","stem":"A pull request changes 14 files in an inventory tracking module. A single-pass review that analyzes all files together produces inconsistent results: detailed feedback on some files but shallow comments on others, missed obvious bugs, and contradictory feedback (a pattern is flagged in one file but identical code is approved in another file in the same PR). How should you restructure the review?","domain":"PROMPT-ENG","difficulty":3,"choices":[{"label":"A","text":"Run three independent full-PR review passes over all 14 files and post only the issues that show up in at least two of the three separate runs."},{"label":"B","text":"Split into focused passes: review each file individually for local issues, then run a separate integration-oriented pass to examine cross-file data flows."},{"label":"C","text":"Require developers to break large PRs into smaller submissions of 3-4 files each before the automated review is allowed to run on them."},{"label":"D","text":"Switch to a larger model with a bigger context window so it can devote sufficient attention to all 14 files within a single combined pass."}],"correct":"B","explanation":"Focused per-file passes address the root cause—attention dilution—by ensuring consistent depth and reliable local issue detection. A separate integration-oriented pass then covers cross-file concerns such as dependency and data-flow interactions."},{"id":"practice-Q31","scenario":"Code Generation with Claude Code","stem":"You asked Claude Code to implement a function that transforms API responses into an internal normalized format. After two iterations, the output structure still doesn’t match expectations—some fields are nested differently and timestamps are formatted incorrectly. You described requirements in prose, but Claude interprets them differently each time. Which approach is most effective for the next iteration?","domain":"PROMPT-ENG","difficulty":2,"choices":[{"label":"A","text":"Write a JSON schema describing the expected output structure and validate Claude's output against it after each iteration to catch mismatches."},{"label":"B","text":"Provide 2–3 concrete input-output examples showing the expected transformation for representative API responses."},{"label":"C","text":"Rewrite the requirements with more technical precision, specifying the exact field mappings, nesting rules, and timestamp format strings to use."},{"label":"D","text":"Ask Claude to first explain its current understanding of the requirements so you can pinpoint where its interpretation keeps diverging."}],"correct":"B","explanation":"Concrete input-output examples remove ambiguity inherent in prose descriptions by showing Claude the exact expected transformation results. This directly addresses the root cause—misinterpretation of textual requirements—by providing unambiguous patterns for field nesting and timestamp formatting."},{"id":"practice-Q47","scenario":"Customer Support Agent","stem":"Your agent handles single-issue requests with 94% accuracy (e.g., “I need a refund for order #1234”). But when customers include multiple issues in one message (e.g., “I need a refund for order #1234 and also want to update the shipping address for order #5678”), tool selection accuracy drops to 58%. The agent usually solves only one issue or mixes parameters across requests. What approach most effectively improves reliability for multi-issue requests? What approach is most effective?","domain":"PROMPT-ENG","difficulty":2,"choices":[{"label":"A","text":"Implement a preprocessing layer that uses a separate model call to split each multi-issue message into independent requests, solve them one at a time, and then merge the results."},{"label":"B","text":"Combine the related tools into fewer, more universal tools so the agent has fewer options to confuse across requests."},{"label":"C","text":"Add few-shot examples to the prompt demonstrating correct reasoning and tool sequencing for multi-issue requests."},{"label":"D","text":"Implement response validation that detects incomplete answers and automatically reprompts the agent to resolve any issues it missed."}],"correct":"C","explanation":"Few-shot examples that demonstrate correct reasoning and tool sequencing for multi-issue requests are most effective because the agent already performs well on single issues—what it needs is guidance on the pattern for decomposing and routing multiple issues and keeping parameters separated."},{"id":"practice-Q52","scenario":"Customer Support Agent","stem":"Production metrics show that when resolving complex billing disputes or multi-order returns, customer satisfaction scores are 15% lower than for simple cases—even when the resolution is technically correct. Root-cause analysis shows the agent provides accurate solutions but inconsistently explains rationale: sometimes omitting relevant policy details, sometimes missing timeline info or next steps. The specific context gaps vary case by case. You want to improve solution quality without adding human oversight. What approach is most effective?","domain":"PROMPT-ENG","difficulty":3,"choices":[{"label":"A","text":"Add a self-critique stage where the agent evaluates a draft response for completeness—ensuring it resolves the customer’s issue, includes relevant context, and anticipates follow-up questions."},{"label":"B","text":"Add a confirmation stage where, before closing, the agent asks 'Does this fully resolve your issue?', giving the customer a chance to request more information if the explanation fell short."},{"label":"C","text":"Upgrade the model from Haiku to Sonnet specifically for complex billing and multi-order cases, routing to it based on a defined complexity metric for richer explanations."},{"label":"D","text":"Implement few-shot examples in the system prompt showing complete explanations for five common complex case types, demonstrating how to weave in policy context, timelines, and next steps."}],"correct":"A","explanation":"A self-critique stage (the evaluator-optimizer pattern) directly addresses inconsistent explanation completeness by forcing the agent to assess its own draft against concrete criteria—such as policy context, timelines, and next steps—before presenting it. This catches case-specific gaps without human oversight."},{"id":"practice-Q56","scenario":"Customer Support Agent","stem":"Production logs show a consistent pattern: when customers include the word “account” in their message (e.g., “I want to check my account for an order I made yesterday”), the agent calls `get_customer` first 78% of the time. When customers phrase similar requests without “account” (e.g., “I want to check an order I made yesterday”), it calls `lookup_order` first 93% of the time. Tool descriptions are clear and unambiguous. What is the most likely root cause of this discrepancy?","domain":"PROMPT-ENG","difficulty":3,"choices":[{"label":"A","text":"The system prompt contains keyword-sensitive instructions that steer behavior based on terms like “account,” creating unintended tool-selection patterns."},{"label":"B","text":"The model's base training has built strong associations between 'account' terminology and customer-record operations, and those priors are overriding the otherwise clear tool descriptions."},{"label":"C","text":"The model lacks training data on messages that mix account and order concepts, so it should be fine-tuned on examples containing both kinds of terminology together."},{"label":"D","text":"The tool descriptions are missing negative examples that specify when NOT to use each tool, which would prevent this keyword-driven confusion between the two."}],"correct":"A","explanation":"The systematic keyword-driven pattern (78% vs 93%) strongly indicates explicit routing logic in the system prompt reacting to the word “account” and steering the agent toward customer-related tools. Since tool descriptions are already clear, the discrepancy points to prompt-level instructions creating unintended behavioral steering."},{"id":"practice-Q60","scenario":"Customer Support Agent","stem":"Production logs show the agent sometimes chooses `get_customer` when `lookup_order` would be more appropriate, especially for ambiguous queries like “I need help with my recent purchase.” You decide to add few-shot examples to the system prompt to improve tool selection. Which approach most effectively addresses the problem? Which approach is most effective?","domain":"PROMPT-ENG","difficulty":3,"choices":[{"label":"A","text":"Add explicit 'use when' and 'don't use when' guidance to each tool's description so the boundaries cover the ambiguous overlapping cases directly."},{"label":"B","text":"Add examples grouped by tool, listing all the `get_customer` scenarios together first and then all of the `lookup_order` scenarios afterward."},{"label":"C","text":"Add 4–6 examples targeted at ambiguous scenarios, each with rationale for why one tool was chosen over plausible alternatives."},{"label":"D","text":"Add 10-15 examples of clear, unambiguous requests that demonstrate the correct tool choice for typical everyday scenarios for each of the two tools."}],"correct":"C","explanation":"Targeting few-shot examples at the specific ambiguous scenarios where errors occur, with explicit rationale for why one tool is preferable to alternatives, teaches the model the comparative decision process needed for edge cases. This is more effective than generic examples or declarative rules."},{"id":"authored-PROMPT-1","scenario":"Few-shot example count","stem":"You are building a support-ticket triage prompt. With no examples, Claude mislabels ambiguous tickets. A teammate proposes pasting 25 worked examples into the prompt to cover every case, but you observe that as the example block grows past a handful, label quality on new tickets actually drops. What is the recommended approach for the number of few-shot examples?","domain":"PROMPT-ENG","difficulty":2,"choices":[{"label":"A","text":"Include 2-4 targeted examples; too few leaves the behavior ambiguous, while too many dilutes the model's attention and degrades generalization."},{"label":"B","text":"Always include at least 20 examples so that every possible ticket category is explicitly represented and the model never encounters an unseen case."},{"label":"C","text":"Use exactly one carefully chosen example, since a single crisp demonstration is all the model needs to reliably infer the underlying labeling pattern."},{"label":"D","text":"Remove all examples entirely and instead write a much longer, more detailed textual description of the desired labeling behavior for the model to follow."}],"correct":"A","explanation":"The guide states few-shot prompting means including 2-4 input/output examples; too few is ambiguous and a large block dilutes attention. B over-stuffs and harms generalization. C is too few to disambiguate. D reverts to a vague description, which the guide says is less effective than examples that unambiguously show decision logic."},{"id":"authored-PROMPT-2","scenario":"Diverse representative examples","stem":"Your measurement-extraction prompt for recipe text uses four few-shot examples, all of them clean cases like '200 grams of flour'. In production it fails on informal phrasings such as 'a pinch of salt' and 'two handfuls of rice'. Keeping the count at four, how should you revise the examples?","domain":"PROMPT-ENG","difficulty":2,"choices":[{"label":"A","text":"Replace the four near-identical clean cases with a diverse set that includes the informal and non-standard edge cases the model actually struggles with."},{"label":"B","text":"Keep the four clean examples exactly as they are but add one sentence telling the model to 'handle informal and non-standard units carefully' when it parses recipes."},{"label":"C","text":"Duplicate the single clearest clean example four times so the model strongly locks onto the canonical 'amount + unit + ingredient' format and reproduces it."},{"label":"D","text":"Drop few-shot prompting altogether and rely on a strict JSON schema to coerce the model into emitting correct values even for informal phrasings like 'a pinch'."}],"correct":"A","explanation":"The guide shows few-shot is especially effective for informal/non-standard measurements and demonstrates exactly such edge-case examples ('a pinch', 'two handfuls'). Examples should be diverse and cover the hard cases. B is a vague instruction, which the guide says examples outperform. C reduces diversity. D mislocates the fix: a schema guarantees structure, not correct values for informal units."},{"id":"authored-PROMPT-3","scenario":"Negative examples","stem":"A code-review prompt for a Python project keeps flagging perfectly idiomatic list comprehensions as 'problems', producing noisy false positives. Your few-shot block currently contains only examples of real defects to flag. What change most directly reduces these false positives?","domain":"PROMPT-ENG","difficulty":2,"choices":[{"label":"A","text":"Add negative examples that show acceptable code which must NOT be flagged, establishing the boundary alongside the positive examples."},{"label":"B","text":"Add more positive examples of genuine defects so the model sees a larger and richer sample of exactly the kinds of problems it is supposed to flag."},{"label":"C","text":"Lower the model's temperature so its decoding is more conservative and it simply produces fewer findings overall, reducing the false-positive count."},{"label":"D","text":"Increase the context window so the model can take in more of the surrounding file before it decides whether a list comprehension is a problem."}],"correct":"A","explanation":"The guide shows examples that separate acceptable code ('do not flag') from problematic code ('flag') — negative examples define boundaries and are as important as positive ones. B only reinforces flagging. C suppresses findings indiscriminately, risking missed real bugs. D addresses input size, not the missing notion of what is acceptable."},{"id":"authored-PROMPT-4","scenario":"Rationale in examples","stem":"You maintain an agent that routes customer requests to tools. On ambiguous requests like 'my order is broken' it sometimes escalates to a human and sometimes tries to self-serve, with no consistent logic. Your few-shot examples show only the request and the chosen action. What addition best helps the model generalize the correct decision logic to new ambiguous requests?","domain":"PROMPT-ENG","difficulty":3,"choices":[{"label":"A","text":"Add a rationale to each example explaining WHY that action was chosen, so the model learns the underlying decision logic rather than memorizing input-action pairs."},{"label":"B","text":"Add a fixed deterministic rule stating that every request containing the word 'broken' must be escalated to a human, removing the ambiguity at its source."},{"label":"C","text":"Remove the ambiguous examples from the prompt and keep only the clearly unambiguous ones, so the model is never confused by borderline cases during routing."},{"label":"D","text":"Switch the output to a strict JSON schema that enumerates the available tools, forcing the model to commit to one of the structured routing options."}],"correct":"A","explanation":"The guide's ambiguous-scenario examples each include a Rationale (e.g., \"'broken' may mean a damaged item; you need order details\"), which teaches the decision logic so the model generalizes. B is a brittle keyword rule that misses the reasoning. C discards exactly the hard cases the model must learn. D enforces structure, not routing logic."},{"id":"authored-PROMPT-5","scenario":"Explicit criteria vs vague","stem":"A documentation-audit prompt instructs Claude to 'check that code comments are accurate and be conservative, reporting only high-confidence issues.' Reviewers complain the findings are inconsistent and unpredictable. What is the most effective revision?","domain":"PROMPT-ENG","difficulty":2,"choices":[{"label":"A","text":"Replace the vague instruction with explicit criteria that define exactly what counts as a problem (e.g., comment contradicts code behavior; references a non-existent function) and what must NOT be flagged."},{"label":"B","text":"Add the words 'be very careful and thorough' to the existing instruction so the conservative directive carries more weight and the model reports more reliably."},{"label":"C","text":"Ask the model to attach a numeric confidence score to each finding while leaving the underlying 'check that comments are accurate' instruction otherwise unchanged."},{"label":"D","text":"Fine-tune a custom model on the team's past documentation reviews so it internalizes what counts as a high-confidence, reportable comment issue."}],"correct":"A","explanation":"The guide contrasts the vague 'check accuracy / be conservative' wording with explicit numbered criteria for what to flag and what not to flag. Explicit criteria fix inconsistency. B and C just restate vagueness or add a number without defining 'accurate'. D is overkill for a problem solved by clearer prompt criteria."},{"id":"authored-PROMPT-6","scenario":"Retry-with-feedback content","stem":"Your invoice-extraction pipeline validates output with Pydantic. When validation fails because the extracted 'total' (150) does not equal the sum of line items (145), your current retry simply re-sends the original document with the note 'try again', and the model often repeats the same mistake. What should the retry prompt contain to be effective?","domain":"PROMPT-ENG","difficulty":2,"choices":[{"label":"A","text":"The original document, the previous incorrect extraction, and the specific validation error (e.g., \"total=150 but sum(line_items)=145; re-check values\")."},{"label":"B","text":"Send only the specific validation error message on retry, deliberately omitting the document and the prior incorrect extraction in order to save tokens."},{"label":"C","text":"Resend the original document along with a softer instruction simply asking the model to 'be more accurate this time' when it redoes the extraction."},{"label":"D","text":"Send a doubled context window that includes the same document twice, on the theory that repetition makes the model pay closer attention to the totals."}],"correct":"A","explanation":"The guide's retry-with-feedback step includes the original document, the previous (incorrect) extraction, and the specific error. B drops the input and prior output the model needs to compare. C is a vague exhortation, not actionable feedback. D does not supply the concrete error and does not address attention in the way the guide prescribes."},{"id":"authored-PROMPT-7","scenario":"Retry ineffective - absent info","stem":"A contract-extraction service must capture each agreement's 'governing_law' jurisdiction. For a batch of contracts, validation fails because the field is empty — and on inspection, those particular contracts genuinely contain no governing-law clause at all. Your pipeline keeps retrying these with feedback, burning tokens with no improvement. What is the correct handling?","domain":"PROMPT-ENG","difficulty":3,"choices":[{"label":"A","text":"Stop retrying: the information is absent from the source, so mark the field null and route the case to a human; retries cannot conjure data that isn't there."},{"label":"B","text":"Increase the retry limit to ten attempts per contract so the model keeps trying and eventually locates the governing-law clause buried somewhere in the document."},{"label":"C","text":"Add more few-shot examples of well-formed governing-law clauses to teach the model how to recognize and extract them from these particular contracts."},{"label":"D","text":"Make the governing_law field required in the schema so the model is forced to produce some value rather than leaving the field empty on these contracts."}],"correct":"A","explanation":"The guide states retry will NOT help when the information is absent from the source document, and that nullable fields let the model return null instead of hallucinating. B wastes tokens on data that isn't present. C teaches extraction but cannot find a missing clause. D makes a required field, which the guide warns pushes the model to fabricate values."},{"id":"authored-PROMPT-8","scenario":"Structural vs semantic validation","stem":"An expense-report extractor already uses tool_use with a strict JSON schema, so every response is syntactically valid JSON with all required fields and valid enum values. Yet some reports slip through where the stated 'grand_total' does not equal the sum of the itemized expenses. Which kind of validation is needed to catch these, and why isn't the schema enough?","domain":"PROMPT-ENG","difficulty":3,"choices":[{"label":"A","text":"Semantic validation of a business rule (sum of items must equal the stated total); the JSON schema enforces structure and types but cannot verify that values reconcile."},{"label":"B","text":"Stricter structural validation is what is needed; tightening the field types and enum values further will eventually force the itemized expenses and grand_total to reconcile."},{"label":"C","text":"No additional validation is needed at all, because using tool_use together with a strict JSON schema already guarantees that the extracted values are correct."},{"label":"D","text":"Syntactic validation is the answer; a mismatch between the grand_total and the item sum indicates malformed JSON that a stricter parser would reject outright."}],"correct":"A","explanation":"The guide distinguishes structural validation (types, required fields, enums) from semantic validation (business rules like sum of line items equals total) and states schemas eliminate syntax errors but not semantic ones. B and D misclassify a reconciliation rule as a structural/syntactic problem. C contradicts the guide's explicit point that schemas do not guarantee semantic correctness."},{"id":"authored-PROMPT-9","scenario":"Self-correction pattern","stem":"A purchase-order parser frequently returns a stated order total that silently disagrees with the underlying line items, and downstream systems don't notice until reconciliation fails days later. You want the extraction itself to surface these internal contradictions immediately. Which prompt design accomplishes this?","domain":"PROMPT-ENG","difficulty":2,"choices":[{"label":"A","text":"Have the model output both the stated total and a separately computed total from the line items, plus a conflict flag set when the two differ."},{"label":"B","text":"Instruct the model to output only the single stated total from the document and trust it completely, since the purchase order is the authoritative source of record."},{"label":"C","text":"Ask the model to silently fix any mismatch by overwriting the document's stated total with its own freshly computed sum of the line items before returning."},{"label":"D","text":"Lower the decoding temperature so the model is statistically less likely to make an arithmetic error when it reports the order total from the line items."}],"correct":"A","explanation":"The guide's self-correction pattern extracts both a stated_total and a calculated_total and sets conflict_detected when they differ, so discrepancies can be handled. B captures no second value to compare against. C hides the discrepancy by silently overwriting, losing the signal that the source is inconsistent. D may reduce errors but does not detect contradictions."},{"id":"authored-PROMPT-10","scenario":"Chaining to avoid attention dilution","stem":"You must extract roughly 30 structured fields from a 60-page commercial lease. Sending the entire document with one mega-prompt asking for all 30 fields yields uneven results: some fields are extracted accurately while others, buried deep in the document, are missed or shallow. What approach best improves reliability?","domain":"PROMPT-ENG","difficulty":2,"choices":[{"label":"A","text":"Chain the extraction into several focused passes (e.g., grouping related fields per section) to avoid attention dilution over the large input."},{"label":"B","text":"Keep the single mega-prompt over the whole document but raise the temperature so the model ranges more widely and explores deeper into the 60 pages."},{"label":"C","text":"Keep the single combined pass but append the instruction 'do not miss any field' so the model is reminded to capture all 30 fields in one go."},{"label":"D","text":"Fine-tune a model specifically on commercial lease documents so that one single pass becomes capable of reliably extracting all 30 fields at once."}],"correct":"A","explanation":"The guide describes prompt chaining as breaking a complex task into focused steps to avoid attention dilution, where too much at once leads to missed details and shallow output. B and C keep the diluted single pass and add no focus. D is heavy machinery for a problem the guide solves with chained focused passes."},{"id":"authored-PROMPT-11","scenario":"Dynamic adaptive decomposition","stem":"An engineer asks the agent to 'add test coverage to this legacy service.' The needed subtasks aren't knowable in advance — only after mapping the code does it emerge that some modules lack tests and one depends on an external API that must be mocked first. Which decomposition strategy fits, and why not a fixed prompt chain?","domain":"PROMPT-ENG","difficulty":3,"choices":[{"label":"A","text":"Dynamic adaptive decomposition, because subtasks emerge from intermediate results during an open-ended investigation; a fixed chain requires all steps known up front."},{"label":"B","text":"A fixed prompt chain is the right fit, because essentially every software task can be reduced ahead of time to a predetermined, fully knowable sequence of steps."},{"label":"C","text":"A single mega-prompt is best, because the entire test-coverage task should be solved within one inference call to maximize internal consistency across the result."},{"label":"D","text":"The Interview pattern fits, because the agent should ask the user every implementation question up front before performing any analysis of the legacy code."}],"correct":"A","explanation":"The guide assigns dynamic adaptive decomposition to open-ended investigations where each step depends on prior results — exactly this legacy-testing example. Fixed chaining (B) needs all steps known up front. C abandons decomposition. D's Interview pattern clarifies requirements but does not address subtasks that only surface during code exploration."},{"id":"authored-PROMPT-12","scenario":"Normalization rules in prompt","stem":"A claims-intake extractor uses a strict JSON schema, so output is always valid JSON with correct types. Still, downstream code breaks because dates arrive in mixed forms ('03/04/2025', 'March 4', 'yesterday') and currency appears as 'five dollars' in some records and '5 USD' in others. The structure is fine; the values are inconsistent. What addition fixes this?","domain":"PROMPT-ENG","difficulty":2,"choices":[{"label":"A","text":"Add explicit normalization rules to the prompt (e.g., dates always ISO 8601 YYYY-MM-DD with relative dates resolved to absolute; currency as a numeric amount plus a currency code)."},{"label":"B","text":"Tighten the JSON schema's type constraints further, since stricter typing on the date and currency fields will canonicalize their inconsistent values automatically."},{"label":"C","text":"Add a retry loop that re-sends every record one additional time, giving the model a fresh second chance to format the dates and currencies consistently."},{"label":"D","text":"Switch away from tool_use to plain text output and parse the mixed dates and currency phrasings yourself with regular expressions downstream of the model."}],"correct":"A","explanation":"The guide says when using strict JSON schemas you should add normalization rules in the prompt (ISO 8601 dates, currency as amount + code, percentages as decimals) to prevent semantically inconsistent values despite valid JSON. B confuses structure with value normalization. C retries without telling the model the canonical form. D discards the reliability of tool_use and pushes brittle parsing downstream."},{"id":"practice-Q13","scenario":"Multi-agent Research System","stem":"Production monitoring shows inconsistent synthesis quality. When aggregated results are ~75K tokens, the synthesis agent reliably cites information from the first 15K tokens (web-search headlines/snippets) and the last 10K tokens (document analysis conclusions), but often misses critical findings in the middle 50K tokens—even when they directly answer the research question. How should you restructure the aggregated input?","domain":"CONTEXT-REL","difficulty":3,"choices":[{"label":"A","text":"Summarize all subagent outputs down to under 20K tokens before aggregation so the entire input fits inside the model's reliably attended processing range."},{"label":"B","text":"Stream the subagent results into the synthesis agent incrementally, feeding the web-search findings first to completion and then appending document analysis after."},{"label":"C","text":"Place a key-findings summary at the start of the aggregated input and organize detailed results with explicit section headings for easier navigation."},{"label":"D","text":"Implement a rotation that alternates which subagent's results appear first across tasks, so both web-search and document analysis get equal top positioning over time."}],"correct":"C","explanation":"Putting a key-findings summary at the start leverages primacy effects so critical information sits in the most reliably processed position. Adding explicit section headings throughout helps the model navigate and attend to mid-input content, directly mitigating the “lost in the middle” phenomenon."},{"id":"practice-Q14","scenario":"Multi-agent Research System","stem":"In testing, the combined output of the web-search agent (85K tokens including page content) and the document analysis agent (70K tokens including chains of thought) totals 155K tokens, but the synthesis agent performs best with inputs under 50K tokens. Which solution is most effective?","domain":"CONTEXT-REL","difficulty":3,"choices":[{"label":"A","text":"Modify upstream agents to return structured data (key facts, quotes, relevance scores) instead of verbose content and reasoning."},{"label":"B","text":"Add an intermediate summarization agent that condenses the combined findings down to size before they are ever passed along to the synthesis agent."},{"label":"C","text":"Have the synthesis agent process the findings in sequential batches, carefully maintaining intermediate state between each successive call it makes."},{"label":"D","text":"Store all of the findings in a vector database and give the synthesis agent search tools so it can query the relevant pieces during its work."}],"correct":"A","explanation":"Modifying upstream agents to return structured data fixes the root cause by reducing token volume at the source while preserving essential information. It avoids passing bulky page content and reasoning traces that inflate tokens without improving the synthesis step."},{"id":"practice-Q18","scenario":"Claude Code for Continuous Integration","stem":"Your code review component is iterative: Claude analyzes the changed file, then may request related files (imports, base classes, tests) via tool calls to understand context before providing final feedback. Your application defines a tool that lets Claude request file contents; Claude calls the tool, gets results, and continues analysis. You’re evaluating batch processing to reduce API cost. What is the primary technical limitation when considering batch processing for this workflow?","domain":"CONTEXT-REL","difficulty":3,"choices":[{"label":"A","text":"Batch processing does not attach correlation IDs to results, so there is no reliable way to map each output back to the input request that produced it."},{"label":"B","text":"The asynchronous model cannot execute tools mid-request and return results for Claude to continue analysis."},{"label":"C","text":"The Batch API does not accept tool definitions in its request parameters, so Claude cannot be given the file-reading tool the review workflow depends on."},{"label":"D","text":"The batch processing latency of up to 24 hours is simply too slow for timely pull-request feedback, though the iterative tool workflow would otherwise function fine."}],"correct":"B","explanation":"A “fire-and-forget” asynchronous Batch API model has no mechanism to intercept a tool call during a request, execute the tool, and return results for Claude to continue analysis. This is fundamentally incompatible with iterative tool-calling workflows that require multiple tool request/response rounds within a single logical interaction."},{"id":"practice-Q19","scenario":"Claude Code for Continuous Integration","stem":"Your CI/CD system runs three Claude-based analyses: (1) fast style checks on every PR that block merging until completion, (2) comprehensive weekly security audits of the entire codebase, and (3) nightly test-case generation for recently changed modules. The Message Batches API offers 50% savings but processing can take up to 24 hours. You want to optimize API cost while maintaining an acceptable developer experience. Which combination correctly matches each task to an API approach? Which combination is correct?","domain":"CONTEXT-REL","difficulty":2,"choices":[{"label":"A","text":"Use the Message Batches API for all three tasks to fully capture the 50% savings, and configure the pipeline to poll for batch completion before blocking merges."},{"label":"B","text":"Use synchronous calls for PR style checks; use the Message Batches API for weekly security audits and nightly test generation."},{"label":"C","text":"Use synchronous calls for all three tasks to keep response times consistent, leaning on prompt caching to bring down the cost across the three workloads."},{"label":"D","text":"Use synchronous calls for both PR style checks and nightly test generation, reserving the Message Batches API only for the weekly security audits."}],"correct":"B","explanation":"PR style checks block developers and require immediate responses via synchronous calls, while weekly security audits and nightly test generation are scheduled tasks with flexible deadlines that can tolerate up to a 24-hour batch window—capturing 50% savings for both."},{"id":"practice-Q21","scenario":"Claude Code for Continuous Integration","stem":"Your CI pipeline includes two Claude-based code review modes: a pre-merge-commit hook that blocks PR merge until completion, and a “deep analysis” that runs overnight, polls for batch completion, and posts detailed suggestions to the PR. You want to reduce API cost using the Message Batches API, which offers 50% savings but requires polling and can take up to 24 hours. Which mode should use batch processing?","domain":"CONTEXT-REL","difficulty":1,"choices":[{"label":"A","text":"Only the pre-merge-commit hook should use it."},{"label":"B","text":"Only the deep analysis."},{"label":"C","text":"Both modes should use batch processing."},{"label":"D","text":"Neither mode should use batch processing."}],"correct":"B","explanation":"Deep analysis is an ideal candidate for batch processing because it already runs overnight, tolerates delay, and uses a polling model before publishing results—matching the asynchronous, polling-based architecture of the Message Batches API while capturing 50% savings."},{"id":"practice-Q24","scenario":"Claude Code for Continuous Integration","stem":"Your automated review generates test-case suggestions for each PR. Reviewing a PR that adds course completion tracking, Claude suggests 10 test cases, but developer feedback shows that 6 duplicate scenarios already covered by the existing test suite. What change most effectively reduces duplicate suggestions? What change is most effective?","domain":"CONTEXT-REL","difficulty":2,"choices":[{"label":"A","text":"Include the existing test file in context so Claude can determine what scenarios are already covered."},{"label":"B","text":"Reduce the requested suggestion count from 10 down to 5, on the assumption that Claude will naturally surface its most valuable, non-duplicate cases first."},{"label":"C","text":"Add instructions directing Claude to focus exclusively on edge cases and error conditions instead of the common success paths the suite already covers."},{"label":"D","text":"Implement post-processing that filters out any suggestion whose description overlaps with an existing test name by keyword before they are shown."}],"correct":"A","explanation":"Including the existing test file fixes the root cause of duplication: Claude can only avoid suggesting already-covered scenarios if it knows what tests already exist. This gives Claude the information needed to pro
